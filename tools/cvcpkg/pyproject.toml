[tool.poetry]
name = "cvcpkg"
version = "1.6.1"
description = "Component package manager for libcvc-deps prebuilt dependency bundles"
authors = ["CyberPC Angel, LLC"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/transfix/libcvc-deps"
repository = "https://github.com/transfix/libcvc-deps"
documentation = "https://transfix.github.io/libcvc-deps/"
keywords = ["package-manager", "cmake", "scientific-computing", "libcvc-deps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
packages = [{ include = "cvcpkg", from = "src" }]
include = [
    { path = "src/cvcpkg/recipes", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
PyYAML = "^6.0"
click = "^8.1"
tqdm = { version = "^4.66", optional = true }
fastapi = { version = ">=0.100", optional = true }
uvicorn = { version = ">=0.20", optional = true }
pydantic = { version = "^2.0", optional = true }
python-multipart = { version = ">=0.0.5", optional = true }
sqlalchemy = "^2.0"
alembic = { version = ">=1.13", optional = true }
asyncpg = { version = ">=0.28", optional = true }
aiosqlite = { version = ">=0.20", optional = true }
aiomysql = { version = ">=0.2", optional = true }
cryptography = ">=41.0"
httpx = ">=0.24"

[tool.poetry.extras]
progress = ["tqdm"]
server = ["fastapi", "uvicorn", "pydantic", "python-multipart"]
db = ["asyncpg", "alembic"]
db-sqlite = ["aiosqlite", "alembic"]
db-mysql = ["aiomysql", "alembic"]
db-all = ["asyncpg", "aiosqlite", "aiomysql", "alembic"]
production = ["fastapi", "uvicorn", "pydantic", "python-multipart", "asyncpg", "alembic"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.10"
black = "^24.0"
httpx = ">=0.24"
pytest-asyncio = ">=0.21"

[tool.poetry.scripts]
cvcpkg = "cvcpkg.cli:cli"
cvcpkg-server = "cvcpkg.server.cli:server_cli"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "backend"
backend-path = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["SIM102", "SIM105", "SIM108", "SIM112", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"src/cvcpkg/server/app.py" = ["B008"]
"src/cvcpkg/server/landing.py" = ["E501"]
"tests/**" = ["E402", "B017", "E501", "B007", "N802"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
