schema_version: 1
recipe:
  name: imagemagick
  upstream_version: "7.1.1"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "ImageMagick — a software suite for creating, editing, composing, and converting images."
  homepage: https://imagemagick.org/
  license: Apache-2.0
  tags: [graphics, io, wasm]

source:
  type: tarball
  url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.1-41.tar.gz
  sha256: "cabf2516dce66da56dd4e3071453b808eefaf4326a93292d2a222a4ea623d601"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: zlib
      version: "^1.3"
    - name: tiff
      version: "^4.6"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
      vcpkg_port: imagemagick
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libMagick*
    - lib/ImageMagick*
    - lib/cmake/ImageMagick/
    - lib/pkgconfig/Magick*
    - lib/pkgconfig/ImageMagick*
    - include/Magick++/
    - include/Magick++.h
    - include/MagickCore/
    - include/MagickWand/
    - include/ImageMagick*/
    - bin/magick*
    - bin/Magick*
    - share/ImageMagick*/
  cmake_packages:
    - { name: ImageMagick, targets: ["ImageMagick::Magick++"] }

abi:
  cxx_std: 17
