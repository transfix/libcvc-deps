# Docker Compose — cvcpkg-server integration test stack
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d postgres
#   docker compose -f docker-compose.test.yml run --rm test
#   docker compose -f docker-compose.test.yml down -v

services:
    postgres:
        image: postgres:16-alpine
        container_name: cvcpkg-test-postgres
        environment:
            POSTGRES_USER: cvcpkg_test
            POSTGRES_PASSWORD: testpass
            POSTGRES_DB: cvcpkg_test
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U cvcpkg_test -d cvcpkg_test"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        networks:
            - cvcpkg-test
        tmpfs:
            - /var/lib/postgresql/data

    backend:
        build:
            context: .
            dockerfile: Dockerfile.production
        container_name: cvcpkg-test-backend
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            CVCPKG_DATABASE_URL: postgresql+asyncpg://cvcpkg_test:testpass@postgres:5432/cvcpkg_test
            CVCPKG_SERVER_STATE_DIR: /app/data
        ports:
            - "127.0.0.1:8421:8420"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8420/healthz"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 15s
        networks:
            - cvcpkg-test

    test:
        build:
            context: .
            dockerfile: Dockerfile.test
        container_name: cvcpkg-test-runner
        depends_on:
            backend:
                condition: service_healthy
        environment:
            CVCPKG_TEST_SERVER_URL: http://backend:8420
            CVCPKG_DATABASE_URL: postgresql+asyncpg://cvcpkg_test:testpass@postgres:5432/cvcpkg_test
        volumes:
            - ../../recipes:/repo/recipes:ro
        networks:
            - cvcpkg-test

networks:
    cvcpkg-test:
        driver: bridge
