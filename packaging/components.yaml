# packaging/components.yaml — component table for libcvc-deps split distribution.
#
# This is the source of truth for the component bundle list described
# in docs/roadmap/split-distribution.md §3.3.  Each entry maps a
# bundle name to the upstream packages it contains, the platforms it
# applies to, and the inter-component dependency edges consumed by the
# resolver and the CI packaging stage.
#
# Schema: packaging/schemas/components-schema.yaml (JSON-Schema in YAML)

schema_version: 1

components:
  # ── standalone / small ──────────────────────────────────────────
  zlib:
    description: "zlib compression library"
    upstream_packages: [zlib]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: ZLIB, targets: ["ZLIB::ZLIB"] }
    dependencies: []

  yaml:
    description: "libyaml C library"
    upstream_packages: [libyaml]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: yaml, targets: ["yaml"] }
    dependencies: []

  gsl:
    description: "GNU Scientific Library"
    upstream_packages: [gsl]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: GSL, targets: ["GSL::gsl", "GSL::gslcblas"] }
    dependencies: []

  log4cplus:
    description: "log4cplus logging framework"
    upstream_packages: [log4cplus]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: log4cplus, targets: ["log4cplus::log4cplus"] }
    dependencies: []

  tiff:
    description: "libtiff + transitive deps (libdeflate, libjpeg)"
    upstream_packages: [libtiff, libdeflate, libjpeg-turbo]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: TIFF, targets: ["TIFF::TIFF"] }
    dependencies:
      - { name: zlib, version: "^1.3" }

  # ── numerics ────────────────────────────────────────────────────
  fftw3:
    description: "FFTW3 single + double precision + threads"
    upstream_packages: [fftw3]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: FFTW3, targets: ["FFTW3::fftw3", "FFTW3::fftw3f"] }
    dependencies: []

  openblas:
    description: "OpenBLAS linear algebra"
    upstream_packages: [openblas]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: OpenBLAS, targets: ["OpenBLAS::OpenBLAS"] }
    dependencies: []

  clapack:
    description: "CLAPACK + f2c (Windows LAPACK provider)"
    upstream_packages: [clapack, f2c]
    platforms: [windows]
    cmake_packages:
      - { name: LAPACK, targets: ["LAPACK::LAPACK"] }
    dependencies: []

  levmar:
    description: "Levenberg-Marquardt nonlinear least-squares (LAPACK-enabled)"
    upstream_packages: [levmar]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: levmar, targets: ["levmar::levmar"] }
    dependencies: []

  # ── I/O / image ────────────────────────────────────────────────
  hdf5:
    description: "HDF5 C + C++ libraries"
    upstream_packages: [hdf5]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: HDF5, targets: ["HDF5::HDF5"] }
    dependencies:
      - { name: zlib, version: "^1.3" }

  imagemagick:
    description: "ImageMagick Q16-HDRI"
    upstream_packages: [imagemagick]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: ImageMagick, targets: ["ImageMagick::Magick++"] }
    dependencies:
      - { name: zlib, version: "^1.3" }
      - { name: tiff, version: "^4.6" }

  libiimod:
    description: "IMOD MRC/TIFF I/O subset"
    upstream_packages: [libiimod]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: libiimod, targets: ["libiimod::libiimod"] }
    dependencies:
      - { name: tiff, version: "^4.6" }

  # ── crypto / network ───────────────────────────────────────────
  openssl:
    description: "OpenSSL TLS library"
    upstream_packages: [openssl]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: OpenSSL, targets: ["OpenSSL::SSL", "OpenSSL::Crypto"] }
    dependencies: []

  c-ares:
    description: "c-ares async DNS resolver"
    upstream_packages: [c-ares]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: c-ares, targets: ["c-ares::cares"] }
    dependencies: []

  re2:
    description: "RE2 regular expression library"
    upstream_packages: [re2]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: re2, targets: ["re2::re2"] }
    dependencies: []

  abseil:
    description: "Abseil C++ common libraries"
    upstream_packages: [abseil-cpp]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: absl, targets: ["absl::base", "absl::strings"] }
    dependencies: []

  protobuf:
    description: "Protocol Buffers C++ runtime + protoc compiler"
    upstream_packages: [protobuf]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: Protobuf, targets: ["protobuf::libprotobuf", "protobuf::libprotoc"] }
    tools: [protoc]
    dependencies:
      - { name: abseil, version: ">=20240722,<20260000" }
      - { name: zlib, version: "^1.3" }

  grpc:
    description: "gRPC C++ runtime + codegen plugins"
    upstream_packages: [grpc]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: gRPC, targets: ["gRPC::grpc", "gRPC::grpc++"] }
    tools: [grpc_cpp_plugin]
    dependencies:
      - { name: protobuf, version: ">=27.0" }
      - { name: abseil, version: ">=20240722,<20260000" }
      - { name: openssl, version: "^3.0" }
      - { name: c-ares, version: ">=1.34.0" }
      - { name: re2, version: ">=2024-07-02" }
      - { name: zlib, version: "^1.3" }

  # ── geometry / math ─────────────────────────────────────────────
  cgal:
    description: "CGAL + GMP + MPFR + MPIR"
    upstream_packages: [cgal, gmp, mpfr, mpir]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: CGAL, targets: ["CGAL::CGAL"] }
    dependencies:
      - { name: boost, version: ">=1.82.0" }

  # ── large frameworks ───────────────────────────────────────────
  boost:
    description: "Boost C++ libraries (all modules shipped)"
    upstream_packages: [boost]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: Boost, targets: ["Boost::boost"] }
    dependencies:
      - { name: zlib, version: "^1.3" }

  qt6:
    description: "Qt 6 Core/Gui/Widgets/OpenGL/OpenGLWidgets"
    upstream_packages: [qt6-base]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: Qt6, targets: ["Qt6::Core", "Qt6::Gui", "Qt6::Widgets", "Qt6::OpenGL", "Qt6::OpenGLWidgets"] }
    dependencies:
      - { name: openssl, version: "^3.0" }
      - { name: zlib, version: "^1.3" }

  vtk:
    description: "VTK 9.5 (Qt6-enabled)"
    upstream_packages: [vtk]
    platforms: [linux, macos, windows]
    cmake_packages:
      - { name: VTK, targets: ["VTK::CommonCore", "VTK::RenderingCore"] }
    dependencies:
      - { name: qt6, version: ">=6.7" }
      - { name: hdf5, version: "^1.14" }
      - { name: tiff, version: "^4.6" }
      - { name: zlib, version: "^1.3" }

  # ── platform-specific ──────────────────────────────────────────
  pthreads4w:
    description: "pthreads4w (POSIX threads for Windows)"
    upstream_packages: [pthreads4w]
    platforms: [windows]
    cmake_packages:
      - { name: Threads, targets: ["Threads::Threads"] }
    dependencies: []

  nfft3:
    description: "NFFT3 (non-equispaced FFT)"
    upstream_packages: [nfft3]
    platforms: [windows]
    cmake_packages:
      - { name: NFFT3, targets: ["NFFT3::nfft3"] }
    dependencies:
      - { name: fftw3, version: ">=3.3" }
