schema_version: 1
recipe:
  name: llvm-cbe
  upstream_version: "0.0.0+git.2c21c57"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/JuliaHubOSS/llvm-cbe
  license: NCSA
  tags: [compiler, llvm, codegen, c-backend]
  description: >-
    llvm-cbe — the LLVM C Backend maintained by JuliaHub.  Translates
    LLVM bitcode (.bc) or IR (.ll) into readable C source, enabling
    portability to platforms with only a C compiler.

    Typical workflow:
      clang++ -std=c++20 -O2 -emit-llvm -c main.cpp -o main.bc
      llvm-cbe main.bc -o main.c

    The generated C is then compilable with any standards-conforming
    C compiler (gcc, tcc, cosmocc, etc.).  Tracks the head of the
    JuliaHubOSS/llvm-cbe repository, which currently requires LLVM 20.1
    — hence the dependency on the `llvm20` recipe rather than `llvm`.

source:
  type: tarball
  url: https://github.com/JuliaHubOSS/llvm-cbe/archive/2c21c57af58bfb999d8437294c046b0ef68eaff6.tar.gz
  sha256: "20e6aad8159e1e8bf0bd6e282f90eaf5fb2738aefa0202e01083be6f14119fc0"
  strip_components: 1

patches: []

depends:
  runtime:
    # llvm-cbe links LLVM's libraries, so LLVM must ship with it: the shipped
    # binary/plugin resolves LLVM symbols at runtime.  Under edge-based
    # placement a `build:`-filed llvm would be stripped from the deliverable.
    #
    # llvm20, not llvm: the pinned source does find_package(LLVM 20.1 REQUIRED
    # CONFIG), and LLVM's config accepts only a matching major, so the main
    # llvm recipe (22.x) is rejected outright:
    #   Could not find a configuration file for package "LLVM" that is
    #   compatible with requested version "20.1"
    # Retarget this at `llvm` once upstream supports a newer major -- see the
    # "LLVM version policy" note below.
    - name: llvm20
      version: "^20"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/llvm-cbe
    - bin/llvm-cbe.exe
  cmake_packages: []

abi:
  cxx_std: 17

notes:
  - title: "LLVM version policy"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      JuliaHubOSS/llvm-cbe has no formal releases and supports exactly one
      LLVM major at a time, moving in a single "upgrade to llvmNN" commit
      that carries real source changes (CBackend.cpp, CTargetMachine.h) —
      it is not just a version bump.  Pinned here to 2c21c57 (upstream
      master), which requires LLVM 20.1; hence the dedicated `llvm20`
      recipe.  Bumping the main `llvm` recipe does NOT make llvm-cbe build
      against it: find_package matches on major, so it fails at configure.
      When upstream adopts a newer major, bump this pin and retarget the
      dependency at `llvm` (dropping llvm20 if nothing else needs it).
  - title: "Usage"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      Compile C++ to LLVM bitcode then convert to C:
        clang++ -std=c++20 -O2 -emit-llvm -c main.cpp -o main.bc
        llvm-cbe main.bc -o main.c
        gcc -O2 -o main main.c
      Use --cbe-* options to control output style; see llvm-cbe --help.
