schema_version: 1
recipe:
  name: packaging
  upstream_version: "24.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/packaging/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    packaging 24.2 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a
    BUILD-TIME backend for cvcpkg from-source Python packages (numpy, h5py).
    Declared as a depends.build edge, so it lands in the build prefix and is
    stripped from the deliverable; never shipped to users.

# Pure-Python noarch wheel (py3-none-any): one platform-independent artifact.
# platform: any + a reference interpreter -> the builder fans it into EVERY
# interpreter's site-packages (PR #390 model), so one bare recipe serves all.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/88/ef/eb23f262cca3c0c4eb7ab1933c3b1f03d021f2c48f54763065b6f0e321be/packaging-24.2-py3-none-any.whl
      sha256: "09abb1bccd265c01f4a3aa3f7a7db064b36514d2cba19a2f694fe6150451a759"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/packaging/
    - lib/python3.*/site-packages/packaging-*.dist-info/
