schema_version: 1
recipe:
  name: google-cloud-storage-cp312
  upstream_version: "3.13.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/google-cloud-storage/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    google-cloud-storage 3.13.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/e3/25/355ed97c1723c787dfaa888808d55db18371f82c38ff862357b1e902cd19/google_cloud_storage-3.13.0.tar.gz
  sha256: "d11d8706ea1520fba0f21043bcb7897caf7015d76ce1ad9a4f60237e4d7a9f6c"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: google-api-core-cp312
    - name: google-auth-cp312
    - name: google-cloud-core-cp312
    - name: google-crc32c-cp312
    - name: google-resumable-media-cp312
    - name: requests-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
    - name: google-api-core-cp312
    - name: google-auth-cp312
    - name: google-cloud-core-cp312
    - name: google-crc32c-cp312
    - name: google-resumable-media-cp312
    - name: requests-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.12/site-packages/google/cloud/storage/
    - lib/python3.12/site-packages/*.dist-info/
    - Lib/site-packages/google/cloud/storage/
    - Lib/site-packages/*.dist-info/
