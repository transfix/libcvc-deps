schema_version: 1
recipe:
  name: protobuf
  upstream_version: "28.3"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "cvcpkg@cyberpcangel.com"
  maintainer_url: "https://cyberpcangel.com"
  description: "Protocol Buffers — Google's language-neutral, platform-neutral extensible mechanism for serializing structured data."
  homepage: https://protobuf.dev/
  license: BSD-3-Clause
  tags: [networking]

source:
  type: tarball
  url: https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protobuf-28.3.tar.gz
  sha256: "7c3ebd7aaedd86fa5dc479a0fda803f602caaf78d8aff7ce83b89e1b8ae7442a"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: abseil
      version: ">=20240722,<20260000"
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
      vcpkg_port: protobuf
      vcpkg_features: ["libprotoc"]

package:
  files:
    - lib/libprotobuf*
    - lib/libprotoc*
    - lib/protobuf*
    - lib/protoc*
    - lib/cmake/protobuf/
    - lib/pkgconfig/protobuf*
    - include/google/protobuf/
    - bin/protoc*
  cmake_packages:
    - { name: Protobuf, targets: ["protobuf::libprotobuf", "protobuf::libprotoc"] }

test:
  script: test.sh

abi:
  cxx_std: 17
