schema_version: 1
recipe:
  name: isodate-cp313t
  upstream_version: "0.7.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/isodate/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    isodate 0.7.2 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/15/aa/0aca39a37d3c7eb941ba736ede56d689e7be91cab5d9ca846bde3999eba6/isodate-0.7.2-py3-none-any.whl
      sha256: "28009937d8031054830160fce6d409ed342816b543597cece116d966c6d99e15"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
  runtime:
    - name: python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/isodate/
    - lib/python3.13t/site-packages/*.dist-info/
