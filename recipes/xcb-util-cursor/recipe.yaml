schema_version: 1
recipe:
  name: xcb-util-cursor
  upstream_version: "0.1.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XCB cursor library (xcb-cursor) — Xcursor-compatible, used by Qt's xcb plugin.

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/xcb/xcb-util-cursor-0.1.6.tar.xz
  sha256: "fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
  runtime:
    - name: libxcb
    - name: xcb-util-image
    - name: xcb-util-renderutil
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
