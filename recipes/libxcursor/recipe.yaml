  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X cursor management library (Xcursor).

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libXcursor-1.2.3.tar.xz
  sha256: "fde9402dd4cfe79da71e2d96bb980afc5e6ff4f8a7d74c159e1966afb2b2c2c0"
