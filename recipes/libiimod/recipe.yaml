schema_version: 1
recipe:
  name: libiimod
  upstream_version: "4.0.6"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "cvcpkg@cyberpcangel.com"
  maintainer_url: "https://cyberpcangel.com"
  description: "IMOD image I/O library — low-level routines for reading and writing MRC, TIFF, and other microscopy image formats."
  homepage: https://github.com/LabShare-Archive/IMOD
  license: GPL-2.0-or-later
  tags: [bio, io, wasm]

source:
  # Vendored in third-party/libiimod/ — curated subset of IMOD's
  # image-file I/O library, built with our own CMakeLists.txt.
  type: vendored
  path: third-party/libiimod

patches: []

depends:
  build:
    - name: xz
    - name: zstd
    - name: libwebp
    - name: lerc
    - name: tiff
      version: "^4.6"
    - name: emsdk
      version: ">=5.0"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/liblibiimod*
    - lib/libiimod*
    - lib/cmake/libiimod/
    - include/libiimod/
  cmake_packages:
    - { name: libiimod, targets: ["libiimod::libiimod"] }

abi:
  cxx_std: 17
