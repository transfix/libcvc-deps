schema_version: 1
recipe:
  name: pyyaml-cp312
  upstream_version: "6.0.3"
  # Bumped 2 -> 3: converted from the prebuilt PyPI wheel to a FROM-SOURCE
  # sdist build. The published PyYAML wheel bundles its own statically linked
  # libyaml, and PyPI ships NO FreeBSD/OpenBSD/NetBSD wheel at all — the whole
  # reason pyyaml was missing on the three BSDs. Building from the sdist links
  # cvcpkg's OWN libyaml (recipes/yaml) by soname out of the merged prefix. The
  # C loader is REQUIRED here, not optional: pyyaml's setup.py silently degrades
  # to pure Python when it cannot find yaml.h, which would drop yaml.CLoader /
  # yaml.CSafeLoader from the shipped package and break importers with no build
  # failure to point at. build.sh sets PYYAML_FORCE_LIBYAML=1 so that path is a
  # hard error. New dep edges: yaml (build+runtime), cython-cp312 (the sdist
  # ships only yaml/_yaml.pyx — there is no pre-generated _yaml.c), and the
  # setuptools-cp312 PEP-517 backend.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pyyaml/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    PyYAML 6.0.3 for CPython 3.12 (cp312) — the cp312 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE against cvcpkg's OWN libyaml
    (recipes/yaml) rather than installed from the PyPI wheel. The Cython-generated
    yaml._yaml extension links libyaml by soname out of the merged prefix instead
    of statically embedding the copy PyPI's wheel builder happened to compile.
    The C loader is mandatory, not best-effort: the build fails loudly rather than
    quietly shipping a pure-Python PyYAML without yaml.CLoader. Building from the
    sdist is also the ONLY option on the BSDs, for which PyPI ships no PyYAML
    wheel. Installed as a proper wheel (real dist-info/RECORD/METADATA) via pip,
    so a user's later `pip install <other>` coexists and pip's resolver sees
    PyYAML as satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the PEP-517 backend
# already present in the build prefix. The sha256 is upstream's own sdist digest
# from the PyPI JSON API, re-derived from the downloaded tarball.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
  sha256: "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.12 and the wheel lands in ITS site-packages. manylinux_min is gone
# with the prebuilt wheel it used to describe — nothing is downloaded any more,
# so there is no wheel tag to floor.
python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python312
    # PEP-517 backend. pyproject's build-backend is the in-tree
    # packaging/_pyyaml_pep517 shim (backend-path), which is just a
    # config-settings bridge over setuptools.build_meta — so setuptools is still
    # the real backend and must be importable under --no-build-isolation.
    - name: setuptools-cp312
    # NOT optional: the PyYAML sdist ships yaml/_yaml.pyx with no pre-generated
    # _yaml.c, so without Cython setup.py rewrites the source list to a .c that
    # does not exist and the libyaml extension cannot be built at all.
    - name: cython-cp312
    # yaml.h + libyaml to compile and link yaml._yaml against.
    - name: yaml
  runtime:
    # At import, yaml._yaml pulls libyaml out of the merged prefix.
    - name: python312
    - name: yaml
  host_tools:
    # Must run on the BUILDER: the interpreter (drives pip, Cython and the
    # compile) and patchelf to stamp the relocatable $ORIGIN RUNPATH into
    # yaml/_yaml*.so on ELF platforms (Linux/BSD).
    - python312
    - patchelf

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and on Windows a Debug extension would want the debug CRT the release
  # interpreter does not have — so build once, optimized.
  build_type_independent: true
  # One build.sh covers Linux, macOS and all three BSDs (each sources its own
  # _common/env-<platform>.sh). The three BSD entries are new and are the point of
  # this revision: they were impossible while the recipe consumed a PyPI wheel,
  # because PyPI publishes none for them — and recipes/yaml already builds on all
  # three. Windows is a real from-source build too, with one delta build.ps1
  # documents: Python 3.8+ dropped PATH from the DLL search path for extension
  # modules, so yaml.dll has to be staged next to _yaml.pyd. wasm/wasi/cosmo stay
  # out: static interpreter, no extension-module ABI to install into.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python312 recipe, and as the yaml (libyaml) it links — an extension built
        # for a different deployment target than the interpreter that loads it is
        # exactly the mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.12/site-packages/yaml/
    - lib/python3.12/site-packages/_yaml/
    - lib/python3.12/site-packages/*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/yaml/
    - Lib/site-packages/_yaml/
    - Lib/site-packages/*.dist-info/
