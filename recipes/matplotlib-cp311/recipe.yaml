schema_version: 1
recipe:
  name: matplotlib-cp311
  upstream_version: "3.10.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/matplotlib/
  license: "PSF-2.0"
  tags: [python, source]
  description: >-
    matplotlib 3.10.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp311 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/68/dd/fa2e1a45fce2d09f4aea3cee169760e672c8262325aa5796c49d543dc7e6/matplotlib-3.10.0.tar.gz
  sha256: "b886d02a581b96704c9d1ffe55709e49b4d2d52709ccebc4be42db856e511278"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: contourpy-cp311
    - name: cycler-cp311
    - name: fonttools-cp311
    - name: kiwisolver-cp311
    - name: packaging-cp311
    - name: pillow-cp311
    - name: pyparsing-cp311
    - name: python-dateutil-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: meson-python-cp311
    - name: pybind11-cp311
    - name: setuptools-scm-cp311
  runtime:
    - name: python311
    - name: contourpy-cp311
    - name: cycler-cp311
    - name: fonttools-cp311
    - name: kiwisolver-cp311
    - name: packaging-cp311
    - name: pillow-cp311
    - name: pyparsing-cp311
    - name: python-dateutil-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/matplotlib/
    - lib/python3.11/site-packages/mpl_toolkits/
    - lib/python3.11/site-packages/pylab.py
    - lib/python3.11/site-packages/matplotlib-*.dist-info/
    - Lib/site-packages/matplotlib/
    - Lib/site-packages/*.dist-info/
