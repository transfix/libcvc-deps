schema_version: 1
recipe:
  name: autoconf
  upstream_version: "2.72"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/autoconf/
  license: GPL-3.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU Autoconf — generates configure scripts for portable builds.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
  # Fallback: ftp.gnu.org is unreachable from some builders (the
  # freebsd/openbsd dev nodes time out on it), which failed builds that
  # had nothing wrong with them. mirrors.kernel.org is
  # a reliable, well-maintained GNU mirror. ftpmirror.gnu.org, GNU's own
  # redirector, was tried first and is not reachable at all (HTTP 000).
  mirror: https://mirrors.kernel.org/gnu/autoconf/autoconf-2.72.tar.xz
  sha256: "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a"
  strip_components: 1

patches: []

depends:
  build:
    - m4
    - perl
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/autoconf*
    - bin/autoheader*
    - bin/autom4te*
    - bin/autoreconf*
    - bin/autoscan*
    - bin/autoupdate*
    - bin/ifnames*
    - share/autoconf/
