schema_version: 1
recipe:
  name: autoconf
  upstream_version: "2.72"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/autoconf/
  license: GPL-3.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU Autoconf — generates configure scripts for portable builds.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
  sha256: "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools:
    - m4
    - perl

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh

package:
  files:
    - bin/autoconf*
    - bin/autoheader*
    - bin/autom4te*
    - bin/autoreconf*
    - bin/autoscan*
    - bin/autoupdate*
    - bin/ifnames*
    - share/autoconf/
