schema_version: 1
recipe:
  name: swig
  upstream_version: "4.4.1"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  homepage: https://swig.org/
  license: GPL-3.0-or-later
  tags: [tools, codegen]
  # SWIG >= 4.1.0 supports JavaScript/Emscripten target for WASM output.
  # Version 4.4.1 has mature WASM support via the -javascript -emscripten flags.

source:
  type: tarball
  url: https://github.com/swig/swig/archive/refs/tags/v4.4.1.tar.gz
  sha256: "8bf32042beb7ee1eeb5c71aa15a62513d964893f84234f2cd77e4a8e2ed41e87"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools:
    - cmake
    - autoconf
    - automake
    - bison

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2"
        CXXFLAGS: "-O2 -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/swig*
    - share/swig/
    - lib/cmake/SWIG/
  cmake_packages:
    - { name: SWIG, targets: [] }
