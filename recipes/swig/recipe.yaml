schema_version: 1
recipe:
  name: swig
  upstream_version: "4.4.1"
  # Bumped 3 -> 4: also stage the swig runtime library at bin/Lib on Windows,
  # where swig.exe's compiled-in -swiglib path points. Without it CMake's
  # module-mode FindSWIG failed against an installed bundle and consumers had
  # to set SWIG_LIB by hand.
  # Bumped 4 -> 5: the same defect on Unix, which rev 4 fixed only for Windows.
  # autotools compiles the configure-time --prefix (the builder's temp dir) in
  # as the swiglib path, so an installed bundle reported a path that no longer
  # exists and every invocation failed with "Unable to find 'swig.swg'". bin/swig
  # is now a wrapper that exports SWIG_LIB relative to its own prefix.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://swig.org/
  license: GPL-3.0-or-later
  tags: [tools, codegen]
  description: >-
    SWIG >= 4.1.0 supports JavaScript/Emscripten target for WASM output.
    Version 4.4.1 has mature WASM support via the -javascript -emscripten flags.

source:
  type: tarball
  url: https://github.com/swig/swig/archive/refs/tags/v4.4.1.tar.gz
  sha256: "8bf32042beb7ee1eeb5c71aa15a62513d964893f84234f2cd77e4a8e2ed41e87"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - autoconf
    - automake
    # bison generates SWIG's parser at build time; nothing in the shipped
    # artifact links or invokes it, so it must not ship.
    - name: bison
      version: ">=3.8"
  runtime:
    - name: pcre2
      version: ">=10.40"
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2"
        CXXFLAGS: "-O2 -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/swig*
    # bin/Lib/ is swig.exe's compiled-in runtime library location on Windows
    # (`swig -swiglib` reports <exedir>\Lib); without it FindSWIG's module
    # mode cannot locate SWIG_DIR. Harmless on POSIX, where no such tree exists.
    - bin/Lib/
    - share/swig/
    - lib/cmake/SWIG/
  cmake_packages:
    - { name: SWIG, targets: [] }

toolchain:
  cc:
    min_version: "any"
    description: "C/C++17 compiler (gcc >= 7, clang >= 5, MSVC >= 2017)"

notes:
  - title: "Requires bison for parser generation"
    platforms: [linux, macos]
    description: >-
      Building SWIG from the git-derived tarball requires bison >= 3.8
      to regenerate the parser.  The bison recipe is listed as a build
      dependency and will be built first automatically.
  - title: "PCRE2 required for pattern matching"
    platforms: [linux, macos, windows]
    description: >-
      SWIG uses PCRE2 for pattern matching in typemap directives.
      The pcre2 recipe is listed as a build dependency.
