schema_version: 1
recipe:
  name: vehicle-humvee
  upstream_version: "1.0.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://cyberpcangel.com
  license: CC-BY-4.0
  tags: [asset, vehicle, glb, cvcgl]
  description: >-
    HMMWV / Humvee (M1097 variant) glTF binary — the shared vehicle model
    the cvcgl nav demos instance per agent. ~600 KB, textured, correct
    real-world dimensions (~4.72 m long). Depends on nothing; installed to
    share/cvc-scenes/shared/Humvee.glb so scene bundles resolve it via the
    sibling <bundle>/../../shared/Humvee.glb path the demos already use.
    Reusable across any scene (grl-snam, city_swarm, austin, ...).

source:
  type: none

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - share/cvc-scenes/shared/Humvee.glb

notes:
  - title: "Consumers"
    platforms: [any]
    description: >-
      The nav_city_swarm / nav_finale demos autodiscover this at
      <bundle>/../../shared/Humvee.glb relative to CVC_NAV_BUNDLE, so
      installing a scene bundle (scene-austin-south, ...) alongside this
      recipe wires up automatically.
