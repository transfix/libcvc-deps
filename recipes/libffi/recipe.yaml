schema_version: 1
recipe:
  name: libffi
  upstream_version: "3.7.1"
  # Bumped upstream 3.4.6 -> 3.7.1 (new version, so cvc_revision resets to 1):
  # 3.4.6's hand-written aarch64 src/sysv.S emits non-local labels between
  # .cfi_startproc/.cfi_endproc, which the clang-17+ integrated assembler rejects
  # on Mach-O ("invalid CFI advance_loc expression") — breaking every macOS build
  # on the Xcode 26.5 / clang 21 runners (and cascading to python ->
  # numpy/pydantic/qt6/vtk...). Upstream fixed this (per-format local-label
  # prefix); see libffi#852. 3.7.1 keeps libtool version-info 12:1:4 -> soname
  # libffi.so.8, identical to 3.4.x, so the ABI is unchanged.
  #
  # rev 2: added wasm and cosmo entries.  3.7.1's configure.host maps
  # wasm32-*-* to the pure-C src/wasm backend upstreamed in 3.4.5, and
  # cosmocc emits plain x86-64 SysV so the existing x86 backend applies.
  # There is deliberately NO wasi entry — see the note at the bottom.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://sourceware.org/libffi/
  license: MIT
  tags: [libraries]
  description: >-
    libffi — a portable foreign function interface library.  Lets code
    call functions whose signatures are only known at runtime.  Required
    by GLib (and therefore GStreamer).

source:
  type: tarball
  url: https://github.com/libffi/libffi/releases/download/v3.7.1/libffi-3.7.1.tar.gz
  sha256: "d5e9a6638ddbd2513ddb54518eb67e4bbe6fa707bcc01c10f6212f0a088d819d"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libffi*
    - lib/pkgconfig/libffi*
    - include/ffi*.h
  pkg_config:
    - libffi

abi:
  cxx_std: 17

notes:
  - title: "No wasi build (and there cannot be one)"
    platforms: [wasi]
    description: >-
      libffi's wasm backend is Emscripten-only, not "wasm" generically.
      A generic FFI has to synthesise a call frame for a signature only
      known at run time; WebAssembly has no such primitive — calls go
      through statically typed table entries.  src/wasm/ffi.c therefore
      implements ffi_call and ffi_closure_alloc with EM_JS, generating
      JavaScript trampolines and patching the wasm table at run time.
      wasm32-wasip1 has no JS engine, so the backend cannot be built or
      used there, and upstream's supported-platform table lists only
      "WASM32 | Emscripten | EMCC".  This matches CPython, whose WASI
      build ships without the _ctypes extension for the same reason.
      Any consumer declaring platform: wasi must mark its libffi
      dependency `platforms:` accordingly rather than expecting a build
      here.
