schema_version: 1
recipe:
  name: setuptools
  upstream_version: "80.9.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/setuptools/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    setuptools 80.9.0 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a
    BUILD-TIME backend for cvcpkg from-source Python packages (numpy, h5py).
    Declared as a depends.build edge, so it lands in the build prefix and is
    stripped from the deliverable; never shipped to users.

# Pure-Python noarch wheel (py3-none-any): one platform-independent artifact.
# platform: any + a reference interpreter -> the builder fans it into EVERY
# interpreter's site-packages (PR #390 model), so one bare recipe serves all.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl
      sha256: "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/setuptools/
    - lib/python3.*/site-packages/pkg_resources/
    - lib/python3.*/site-packages/_distutils_hack/
    - lib/python3.*/site-packages/setuptools-*.dist-info/
