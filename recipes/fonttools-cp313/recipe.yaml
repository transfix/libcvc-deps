schema_version: 1
recipe:
  name: fonttools-cp313
  upstream_version: "4.55.3"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fonttools/
  license: "MIT"
  tags: [python, source]
  description: >-
    fonttools 4.55.3 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/76/61/a300d1574dc381393424047c0396a0e213db212e28361123af9830d71a8d/fonttools-4.55.3.tar.gz
  sha256: "3983313c2a04d6cc1fe9251f8fc647754cf49a61dac6cb1e7249ae67afaafc45"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/fontTools/
    - lib/python3.13/site-packages/fonttools-*.dist-info/
    - Lib/site-packages/fonttools/
    - Lib/site-packages/*.dist-info/
