schema_version: 1
recipe:
  name: cryptography-cp313
  upstream_version: "48.0.0"
  # Bumped 2 -> 3: converted from the prebuilt PyPI wheel to a FROM-SOURCE sdist
  # build. Three things change at once, and they are the same three things:
  #
  #  * OPENSSL. The published cryptography wheel STATICALLY links an OpenSSL that
  #    upstream built, that we neither track nor patch, and that no CVE feed we
  #    watch points at. Building here links cvcpkg's OWN openssl (recipes/openssl,
  #    3.4.1) via OPENSSL_DIR, so a process that also pulls libssl in through curl
  #    or python's ssl module gets one OpenSSL out of the merged prefix, not two.
  #  * THE BSDs. PyPI ships no FreeBSD/NetBSD wheel for cryptography at all, so
  #    from-source was always the only route there. It is reachable now only
  #    because recipes/rust gained freebsd/netbsd in rust+cvc.2 — cryptography's
  #    build backend IS a Rust program (maturin) and its _rust extension IS Rust.
  #  * openbsd is still absent, and not by oversight: Rust publishes no OpenBSD
  #    toolchain, so there is no cargo to build this with anywhere in the graph.
  #
  # Version kept at 48.0.0 deliberately. Its `[build-system] requires` reads
  # `maturin>=1.9.4,<2,!=1.12.0` + `cffi>=2.0.0` + setuptools, all of which the
  # matrix now satisfies (maturin 1.14.1, cffi 2.0.0, setuptools 80.9.0), so
  # there was no reason to chase 50.0.0.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cryptography/
  license: "Apache-2.0 OR BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    cryptography 48.0.0 for CPython 3.13 (cp313) — the cp313 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE against cvcpkg's OWN OpenSSL rather
    than installed from the PyPI wheel. The _rust extension links libssl.so.3 /
    libcrypto.so.3 by soname and resolves them, at runtime, out of the SAME
    activated prefix via an $ORIGIN RUNPATH — no statically vendored OpenSSL, so
    the prefix has exactly one TLS stack to audit and patch. Building from the
    sdist is also the only option on FreeBSD and NetBSD, for which PyPI ships no
    cryptography wheel. The build runs through maturin (a Rust program) and
    compiles a Rust extension, so the whole column rests on recipes/rust.
    Installed as a proper wheel (real dist-info/RECORD/METADATA) via pip, so a
    user's later `pip install <other>` coexists and pip's resolver sees
    cryptography as satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the maturin backend
# already present in the build prefix. The sha256 was recomputed from the
# downloaded tarball and matches upstream's own sdist digest in the PyPI JSON API.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/9f/a9/db8f313fdcd85d767d4973515e1db101f9c71f95fced83233de224673757/cryptography-48.0.0.tar.gz
  sha256: "5c3932f4436d1cccb036cb0eaef46e6e2db91035166f1ad6505c3c9d5a635920"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.13 and the wheel lands in ITS site-packages. abi3 is still right — pyo3
# is configured with the abi3 feature and build.rs defines Py_LIMITED_API for the
# cffi half — but manylinux_min is gone with the prebuilt wheel it used to
# describe: nothing is downloaded any more, so there is no wheel tag to floor.
python:
  interpreter: python313
  abi: abi3

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python313
    # The PEP-517 backend cryptography declares (`build-backend = "maturin"`).
    # Build-only, so build.sh bridges its site-packages onto PYTHONPATH and its
    # bin/ onto PATH — the shim shells out to the maturin EXECUTABLE.
    - name: maturin-cp313
    # cargo + rustc: maturin drives cargo, and src/rust/ is the extension. This is
    # also the edge that decides the platform set — see the matrix comment.
    - name: rust
    # openssl headers + libssl/libcrypto for the openssl-sys crate. build.sh
    # points it here with OPENSSL_DIR rather than letting openssl-sys fall through
    # to its pkg-config/system probe.
    - name: openssl
    # cffi is a genuine BUILD requirement, not only a runtime one:
    # src/rust/cryptography-cffi/build.rs shells out to
    # `$PYO3_PYTHON ../../_cffi_src/build_openssl.py`, which imports cffi to
    # generate _openssl.c before cc compiles it into the crate.
    - name: cffi-cp313
    # That same build_openssl.py imports setuptools (and build.rs asks setuptools
    # for the Python include dirs), which is also why upstream lists setuptools in
    # [build-system] requires.
    - name: setuptools-cp313
  runtime:
    # At import, _rust pulls libssl/libcrypto out of the merged prefix, and the
    # hazmat bindings import cffi.
    - name: python313
    - name: cffi-cp313
    - name: openssl
    # typing-extensions is deliberately NOT here any more. cryptography declares
    # it as `typing-extensions>=4.13.2; python_version < '3.13'` — a marker that
    # is false for every column in this matrix, so the old edge was a dependency
    # this package never actually imports.
  host_tools:
    # Must run on the BUILDER: the interpreter (drives pip, and build.rs re-execs
    # it for the cffi codegen), the Rust toolchain, and patchelf to stamp the
    # relocatable $ORIGIN RUNPATH into _rust*.so on ELF platforms (Linux/BSD).
    - python313
    - rust
    - patchelf

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and cargo builds its own release profile regardless — so build once.
  build_type_independent: true
  # freebsd and netbsd are new and are the point of this revision: they were
  # impossible while the recipe consumed a PyPI wheel (upstream publishes none)
  # and are possible now only because recipes/rust covers them. openbsd is the
  # one native platform still missing, and the reason is upstream Rust, not
  # cryptography: there is no official OpenBSD rustc/cargo to build it with.
  # wasm/wasi/cosmo stay out — the static interpreter has no extension-module ABI.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python313 recipe and as the openssl it links — an
        # extension built for a different deployment target than the interpreter
        # that loads it is exactly the mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  # There is no bundled OpenSSL here: the TLS runtime is the cvcpkg openssl
  # package, resolved out of the merged prefix.
  files:
    - lib/python3.13/site-packages/cryptography/
    - lib/python3.13/site-packages/cryptography-*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/cryptography/
    - Lib/site-packages/cryptography-*.dist-info/

notes:
  - title: "cargo fetches crates from the network during this build"
    platforms: [linux, macos, windows, freebsd, netbsd]
    description: >-
      The cryptography sdist ships Cargo.lock but does NOT vendor its crate
      sources, so cargo resolves every dependency (pyo3, openssl-sys, asn1, ...)
      out of crates.io. The pip layer is fully offline (--no-index,
      --no-build-isolation) and crate versions are lock-pinned, but the cargo
      layer is not air-gapped. Set CVC_CARGO_HOME to a pre-populated registry and
      CVC_CARGO_OFFLINE=1 to force CARGO_NET_OFFLINE=true on a builder that must
      not reach the network; build.sh prints which mode it is in.
