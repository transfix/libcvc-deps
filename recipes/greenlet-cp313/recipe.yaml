schema_version: 1
recipe:
  name: greenlet-cp313
  upstream_version: "3.5.3"
  # Bumped 2 -> 3: converted from the prebuilt PyPI wheel to a FROM-SOURCE
  # sdist build. A published wheel is a binary somebody else compiled, against
  # headers and a libc we did not build — and PyPI ships NO FreeBSD/OpenBSD/NetBSD
  # wheel for greenlet at all, which is the whole reason this package was missing
  # on the three BSDs. greenlet's stack switching is hand-written per-arch
  # assembly (src/greenlet/platform/switch_*.h), so "which toolchain compiled it"
  # is not a detail we want to inherit from PyPI. It links nothing but libc, so
  # the only new dependency edge is the PEP-517 backend (setuptools-cp313) that
  # --no-build-isolation requires to already be in the prefix.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/greenlet/
  license: "MIT AND PSF-2.0"
  tags: [python, wheel]
  description: >-
    greenlet 3.5.3 for CPython 3.13 (cp313) — the cp313 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE rather than installed from the PyPI
    wheel. greenlet._greenlet (C++ plus hand-written per-architecture stack-switch
    assembly) is compiled here by the catalog's own toolchain, and building from
    the sdist is the ONLY option on the BSDs, for which PyPI ships no greenlet
    wheel. Installed as a proper wheel (real dist-info/RECORD/METADATA) via pip,
    so a user's later `pip install <other>` coexists and pip's resolver sees
    greenlet as satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the PEP-517 backend
# already present in the build prefix. The sha256 is upstream's own sdist digest
# from the PyPI JSON API, re-derived from the downloaded tarball.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/e2/f1/fbbfef6af0bad0548f09bc28948ea3c275b4edb19e17fc5ca9900a6a634d/greenlet-3.5.3.tar.gz
  sha256: "a61efc018fd3eb317eeca31aba90ee9e7f26f22884a79b6c6ec715bf71bb62f1"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.13 and the wheel lands in ITS site-packages. manylinux_min is gone
# with the prebuilt wheel it used to describe — nothing is downloaded any more,
# so there is no wheel tag to floor.
python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python313
    # PEP-517 backend. greenlet's pyproject requires setuptools>=77.0.3; the base
    # python313 ships 65.5, so this column is what makes --no-build-isolation
    # work at all. It is a build-only edge, so build.sh bridges it out of
    # CVC_BUILD_PREFIX onto PYTHONPATH (where it also wins over the bundled 65.5).
    - name: setuptools-cp313
  runtime:
    # greenlet._greenlet links nothing but libc and the C++ runtime — the
    # interpreter is the whole runtime closure.
    - name: python313
  host_tools:
    # Must run on the BUILDER: the interpreter drives pip and the compile.
    - python313

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and on Windows a Debug extension would want the debug CRT the release
  # interpreter does not have — so build once, optimized.
  build_type_independent: true
  # One build.sh covers Linux, macOS and all three BSDs (each sources its own
  # _common/env-<platform>.sh). The three BSD entries are new and are the point of
  # this revision: they were impossible while the recipe consumed a PyPI wheel,
  # because PyPI publishes none for them — and greenlet's switch_*.h has had
  # working *BSD stack-switch code for years, it was only ever the wheel that was
  # missing. Windows is a separate script only because `script:` is
  # per-matrix-entry. wasm/wasi/cosmo stay out: static interpreter, no
  # extension-module ABI, and no stack-switch backend for them.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python313 recipe — an extension built
        # for a different deployment target than the interpreter that loads it is
        # exactly the mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.13/site-packages/greenlet/
    - lib/python3.13/site-packages/*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/greenlet/
    - Lib/site-packages/*.dist-info/
