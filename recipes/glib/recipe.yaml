schema_version: 1
recipe:
  name: glib
  upstream_version: "2.80.5"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://gitlab.gnome.org/GNOME/glib
  license: LGPL-2.1-or-later
  tags: [libraries]
  description: >-
    GLib — the low-level core library that forms the basis of the GTK and
    GNOME stacks.  Provides data structures, an object/type system
    (GObject), an I/O abstraction (GIO), and a main loop.  Required by
    GStreamer.

source:
  type: tarball
  url: https://download.gnome.org/sources/glib/2.80/glib-2.80.5.tar.xz
  sha256: "9f23a9de803c695bbfde7e37d6626b18b9a83869689dd79019bf3ae66c3e6771"
  strip_components: 1

patches: []

depends:
  build:
    - ninja
    - meson
    - pkg-config
    - python312
  runtime:
    - name: libffi
      version: "^3.4"
    - name: pcre2
      version: "^10.0"
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libglib-2.0*
    - lib/libgobject-2.0*
    - lib/libgmodule-2.0*
    - lib/libgio-2.0*
    - lib/libgthread-2.0*
    - lib/glib-2.0/
    - lib/gio/
    - lib/pkgconfig/glib-2.0*
    - lib/pkgconfig/gobject-2.0*
    - lib/pkgconfig/gmodule*
    - lib/pkgconfig/gio-2.0*
    - lib/pkgconfig/gthread-2.0*
    - include/glib-2.0/
    - include/gio-unix-2.0/
    - bin/glib-*
    - bin/gio*
    - bin/gobject-*
    - bin/gdbus*
    - bin/gresource*
    - bin/gsettings*
  pkg_config:
    - glib-2.0
    - gobject-2.0
    - gmodule-2.0
    - gio-2.0
    - gthread-2.0

abi:
  cxx_std: 17
