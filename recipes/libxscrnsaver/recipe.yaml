schema_version: 1
recipe:
  name: libxscrnsaver
  upstream_version: "1.2.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X11 Screen Saver extension client library (libXss / Xss).  Lets a client
    query and control the X server's screen-saver state — e.g. inhibit the
    screensaver during video/gameplay.  Consumed by SDL's X11 backend
    (SDL_X11_XSCRNSAVER).

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libXScrnSaver-1.2.5.tar.xz
  sha256: "5057365f847253e0e275871441e10ff7846c8322a5d88e1e187d326de1cd8d00"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
