schema_version: 1
recipe:
  name: triton-cp311
  upstream_version: "3.4.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/triton/
  license: "MIT"
  tags: [python, wheel, cuda, gpu, compiler]
  description: >-
    Triton 3.4.0 (cp311, prebuilt linux x86_64 wheel) — the GPU kernel
    compiler torch.compile / inductor use on CUDA. A runtime dependency of
    torch-cp311-cuda (Linux/x86_64 only). Prebuilt manylinux wheel; not built
    from source.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/7d/39/43325b3b651d50187e591eefa22e236b2981afcebaefd4f2fc0ea99df191/triton-3.4.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      sha256: "7b70f5e6a41e52e48cfc087436c8a28c17ff98db369447bcaff3b887a3ab4467"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_27

patches: []

depends:
  build:
    - name: python311
    - name: setuptools-cp311
  runtime:
    - name: python311
    - name: setuptools-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/triton/
    - lib/python3.11*/site-packages/triton-*.dist-info/
