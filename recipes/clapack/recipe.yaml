schema_version: 1
recipe:
  name: clapack
  upstream_version: "3.2.1"
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "CLAPACK — a C translation of the Fortran LAPACK linear algebra package."
  homepage: https://www.netlib.org/clapack/
  license: BSD-3-Clause
  tags: [math, wasm]

source:
  type: tarball
  url: https://www.netlib.org/clapack/clapack-3.2.1-CMAKE.tgz
  sha256: "0b3f782bc24845d85f36bafbff0f2f1384dc72df730fda4e7924ec1a70baca5a"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  host_tools: []

build:
  matrix:
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/lapack*
    - lib/blas*
    - lib/f2c*
    - lib/liblapack*
    - lib/libblas*
    - lib/libf2c*
    - lib/cmake/clapack/
    - bin/lapack*
    - bin/blas*
    - bin/f2c*
    - include/blaswrap.h
    - include/clapack.h
    - include/f2c.h
  cmake_packages:
    - { name: clapack, targets: ["lapack", "blas", "f2c"] }

abi:
  cxx_std: 17

notes: |
  CLAPACK is used for wasm because:
  - Reference LAPACK and OpenBLAS are written in Fortran; Emscripten has no
    Fortran compiler, so they cannot be cross-compiled to wasm directly.
  - CLAPACK is a complete C translation (via f2c) of Reference LAPACK 3.2.1
    plus the reference BLAS. It compiles cleanly with emcc.
  - discere-os/lapack.wasm on GitHub was investigated but is just a fork of
    Reference-LAPACK with zero actual wasm work (the "wasm" branch only adds
    a FUNDING.yml; sources are still .f files).
  - On native platforms (Linux/macOS) we use OpenBLAS; on Windows and wasm
    this recipe builds CLAPACK from the netlib -CMAKE tarball directly (no
    vcpkg).
  - Provides BLAS + LAPACK symbols needed by levmar, and potentially other
    packages (F2Dock, etc.) in the future.
