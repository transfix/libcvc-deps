schema_version: 1
recipe:
  name: pyproject-metadata
  upstream_version: "0.9.1"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pyproject-metadata/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    pyproject-metadata 0.9.1 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a
    BUILD-TIME backend for cvcpkg from-source Python packages (numpy, h5py).
    Declared as a depends.build edge, so it lands in the build prefix and is
    stripped from the deliverable; never shipped to users.

# Pure-Python noarch wheel (py3-none-any): one platform-independent artifact.
# platform: any + a reference interpreter -> the builder fans it into EVERY
# interpreter's site-packages (PR #390 model), so one bare recipe serves all.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/7e/b1/8e63033b259e0a4e40dd1ec4a9fee17718016845048b43a36ec67d62e6fe/pyproject_metadata-0.9.1-py3-none-any.whl
      sha256: "ee5efde548c3ed9b75a354fc319d5afd25e9585fa918a34f62f904cc731973ad"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/pyproject_metadata/
    - lib/python3.*/site-packages/pyproject_metadata-*.dist-info/
