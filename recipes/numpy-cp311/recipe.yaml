schema_version: 1
recipe:
  name: numpy-cp311
  upstream_version: "2.4.6"
  # Bumped to a FROM-SOURCE build (was: prebuilt PyPI wheel). numpy is now
  # compiled with meson-python against cvcpkg's own OpenBLAS so the extensions
  # link libopenblas.so.0 by soname (no vendored numpy.libs/) and so the package
  # is available on the BSDs, for which PyPI ships no wheel.
  # Bumped 2 -> 3: the from-source build never actually succeeded, so +cvc.1/+cvc.2
  # were stale PyPI wheels whose vendored libscipy_openblas64_*.so isn't found at
  # runtime (broken `import numpy`). build.sh now works around two build-prefix
  # relocation bugs (cython's non-relocatable console-script shebang; python311's
  # stale sysconfig INCLUDEPY) so meson builds from source and links cvcpkg's
  # libopenblas.so.0 via $ORIGIN. This republishes a genuinely importable numpy.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://numpy.org/
  license: BSD-3-Clause
  tags: [math, python]
  description: >-
    NumPy 2.4.6 for CPython 3.11 (cp311), BUILT FROM SOURCE with meson-python
    against cvcpkg's own OpenBLAS (LP64). The compiled extensions link
    libopenblas.so.0 by soname — no auditwheel-vendored numpy.libs/ copy —
    resolved at runtime out of the SAME activated prefix via an $ORIGIN RUNPATH.
    Building from the sdist is also the only option on the BSDs (no PyPI wheel).
    Installed as a proper wheel (real dist-info/RECORD/METADATA) via pip, so a
    user's later `pip install <other>` coexists and pip's resolver sees numpy as
    satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches + sha256-
# verifies this tarball and extracts it (strip_components) to CVC_SOURCE_DIR;
# build.sh compiles it with meson-python against the prefix's OpenBLAS.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/d0/ad/fed0499ce6a338d2a03ebae59cd15093910c8875328855781952abf6c2fe/numpy-2.4.6.tar.gz
  sha256: "f3a3570c4a2a16746ac2c31a7c7c7b0c186b95ce902e33db6f28094ed7387dda"
  strip_components: 1

# Interpreter/ABI metadata: exported to build.sh as CVC_PYTHON_ABI /
# CVC_PYTHON_INTERPRETER so cvc_python_exe resolves the prefix's python3.11 and
# the wheel lands in ITS site-packages.
python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    # Native CLIs meson-python shells out to (on PATH in the build prefix).
    - name: pkg-config
    - name: meson
    - name: ninja
    # PEP-517 backend + cythonizer, imported by the build interpreter under
    # --no-build-isolation (bridged from the build prefix via PYTHONPATH in
    # build.sh). meson-python-cp311 pulls packaging-cp311 + pyproject-metadata-cp311.
    - name: cython-cp311
    - name: meson-python-cp311
    # OpenBLAS headers + openblas.pc at compile time (linux/BSD; macOS uses
    # Accelerate and does not resolve this edge — see the platform note below).
    - name: openblas
      version: ">=0.3.28"
  runtime:
    - name: python311
    # libopenblas.so.0 resolved from the merged prefix at import (linux/BSD).
    - name: openblas
      version: ">=0.3.28"
  host_tools:
    - python311
    - pkg-config
    - meson
    - ninja
    # Stamps the relocatable $ORIGIN RUNPATH into the extension .so on ELF
    # platforms (Linux/BSD).
    - patchelf

build:
  # The Python ABI is stable across cvcpkg build types; build once, optimized.
  build_type_independent: true
  # openblas builds on linux/BSD/windows; macOS uses Accelerate (build.sh picks
  # -Dblas=accelerate there). windows is a deliberate delta: meson + MSVC + DLL
  # discovery differ enough to need its own build.ps1 (currently a loud stub —
  # until the port lands, windows numpy is unavailable from this recipe).
  # wasm/wasi/cosmo are excluded: static interpreter, no extension-module ABI.
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.3"   # Accelerate new-LAPACK floor
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY — stage_bundle ships the whole CVC_INSTALL_DIR tree;
  # build.sh keeps it pure by pip-installing --prefix into an empty dir. There is
  # NO numpy.libs/: the OpenBLAS runtime is the cvcpkg openblas package.
  files:
    - lib/python3.11/site-packages/numpy/
    - lib/python3.11/site-packages/numpy-2.4.6.dist-info/
    - Lib/site-packages/numpy/
    - Lib/site-packages/numpy-2.4.6.dist-info/

abi:
  cxx_std: 17
