python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_28

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11*/site-packages/numpy/
    - lib/python3.11*/site-packages/numpy-2.4.6.dist-info/
    - Lib/site-packages/numpy/
    - Lib/site-packages/numpy-2.4.6.dist-info/
