schema_version: 1
recipe:
  name: numpy-cp311
  upstream_version: "2.4.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://numpy.org/
  license: BSD-3-Clause
  tags: [math, python, wheel]
  description: >-
    NumPy 2.4.6 for CPython 3.11 (cp311) — the cp311 column of cvcpkg's
    per-interpreter wheel matrix.  The wheel is pinned by filename + sha256
    and installed into the python311 interpreter's own site-packages inside
    the prefix, so one activatable prefix carries both the native C/C++
    libraries and a complete, pinned Python environment.

