schema_version: 1
recipe:
  name: markupsafe-cp313t
  upstream_version: "3.0.3"
  # Bumped 1 -> 2: converted from the prebuilt PyPI wheel to a FROM-SOURCE
  # sdist build. A published wheel is a binary somebody else compiled, against
  # headers and a libc we did not build — and PyPI ships NO FreeBSD/OpenBSD/NetBSD
  # wheel for markupsafe at all, which is the whole reason this package was
  # missing on the three BSDs. Compiling markupsafe._speedups from the sdist
  # fixes both at once. markupsafe links nothing but libc, so the only new
  # dependency edge is the PEP-517 backend (setuptools-cp313t) that
  # --no-build-isolation requires to already be in the prefix.
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/markupsafe/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    MarkupSafe 3.0.3 for CPython 3.13t (cp313t) — the cp313t column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE rather than installed from the PyPI
    wheel. The markupsafe._speedups C extension is compiled here by the catalog's
    own toolchain, and building from the sdist is the ONLY option on the BSDs, for
    which PyPI ships no markupsafe wheel. build.sh refuses the silent
    pure-Python fallback upstream's setup.py would otherwise take, so a column
    that ships is a column with the C accelerator in it. Installed as a proper
    wheel (real dist-info/RECORD/METADATA) via pip, so a user's later
    `pip install <other>` coexists and pip's resolver sees MarkupSafe as
    satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the PEP-517 backend
# already present in the build prefix. The sha256 is upstream's own sdist digest
# from the PyPI JSON API, re-derived from the downloaded tarball.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz
  sha256: "722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.13t and the wheel lands in ITS site-packages. manylinux_min is gone
# with the prebuilt wheel it used to describe — nothing is downloaded any more,
# so there is no wheel tag to floor.
python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python313t
    # PEP-517 backend. markupsafe's pyproject requires setuptools>=77; the base
    # python313t ships 65.5, so this column is what makes --no-build-isolation
    # work at all. It is a build-only edge, so build.sh bridges it out of
    # CVC_BUILD_PREFIX onto PYTHONPATH (where it also wins over the bundled 65.5).
    - name: setuptools-cp313t
  runtime:
    # markupsafe._speedups links nothing but libc — the interpreter is the whole
    # runtime closure.
    - name: python313t
  host_tools:
    # Must run on the BUILDER: the interpreter drives pip and the compile.
    - python313t

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and on Windows a Debug extension would want the debug CRT the release
  # interpreter does not have — so build once, optimized.
  build_type_independent: true
  # One build.sh covers Linux, macOS and all three BSDs (each sources its own
  # _common/env-<platform>.sh). The three BSD entries are new and are the point of
  # this revision: they were impossible while the recipe consumed a PyPI wheel,
  # because PyPI publishes none for them. Windows is a separate script only
  # because `script:` is per-matrix-entry — build.ps1 does the same three steps
  # with cl.exe. wasm/wasi/cosmo stay out: static interpreter, no extension-module
  # ABI to install into.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python313t recipe — an extension built
        # for a different deployment target than the interpreter that loads it is
        # exactly the mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.13t/site-packages/markupsafe/
    - lib/python3.13t/site-packages/*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/markupsafe/
    - Lib/site-packages/*.dist-info/
