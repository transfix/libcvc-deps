schema_version: 1
recipe:
  name: pythran-cp313t
  upstream_version: "0.18.1"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pythran/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    pythran 0.18.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/d4/84/17c4c44a24f5ec709991e603e601bf316d09c4fe915fbe348c689dede998/pythran-0.18.1.tar.gz
  sha256: "8803ed948bf841a11bbbb10472a8ff6ea24ebd70e67c3f77b77be3db900eccfe"
  strip_components: 1

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: beniget-cp313t
    - name: gast-cp313t
    - name: numpy-cp313t
    - name: ply-cp313t
    - name: setuptools-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
  runtime:
    - name: python313t
    - name: beniget-cp313t
    - name: gast-cp313t
    - name: numpy-cp313t
    - name: ply-cp313t
    - name: setuptools-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13t/site-packages/pythran/
    - lib/python3.13t/site-packages/omp/
    - lib/python3.13t/site-packages/pythran-*.dist-info/
    - Lib/site-packages/pythran/
    - Lib/site-packages/*.dist-info/
