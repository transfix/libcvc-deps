schema_version: 1
recipe:
  name: sympy-cp313t
  upstream_version: "1.13.3"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/sympy/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    sympy 1.13.3 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/99/ff/c87e0622b1dadea79d2fb0b25ade9ed98954c9033722eb707053d310d4f3/sympy-1.13.3-py3-none-any.whl
      sha256: "54612cf55a62755ee71824ce692986f23c88ffa77207b30c1368eda4a7060f73"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: mpmath-cp313t
  runtime:
    - name: python313t
    - name: mpmath-cp313t

provides:
  - sympy

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/sympy/
    - lib/python3.13t/site-packages/isympy.py
    - lib/python3.13t/site-packages/sympy-*.dist-info/
    - bin/isympy
