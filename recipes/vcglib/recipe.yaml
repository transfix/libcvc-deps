schema_version: 1
recipe:
  name: vcglib
  upstream_version: "2025.07"
  # Added wasm/wasi/cosmo entries — but NOT build-wasm.sh/build-wasi.sh/
  # build-cosmo.sh scripts, which is the one place this recipe departs from the
  # zlib/libpng cross model, on purpose.  vcglib compiles nothing: build.sh is
  # `cp -R` of the vcg/ and wrap/ header trees plus a generated cmake config, it
  # never sources recipes/_common/env-${CVC_PLATFORM}.sh, and it never invokes a
  # compiler.  The other recipes need a per-target script only because each one
  # sources a different env helper to get a different toolchain; here there is
  # no toolchain to get, so the same script produces a byte-identical result on
  # every target and three copies of it would assert a platform difference that
  # does not exist.  The headers themselves are templates over geometry and
  # linear algebra — the target compiler, not this build, is what ever compiles
  # them — so a wasm/wasi/cosmo consumer can use them as-is.
  #
  # What these entries buy: the closure check refuses to let a wasm/wasi/cosmo
  # recipe depend on vcglib unless vcglib declares those targets.  Without them
  # any cross consumer is blocked on a package that was already portable.
  #
  # See also the note on each cross matrix entry below.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "vcglib — header-only C++ mesh processing library from the Visual Computing Lab (ISTI-CNR)."
  homepage: https://github.com/cnr-isti-vclab/vcglib
  license: GPL-3.0-or-later
  tags: [graphics, mesh, wasm, wasi]

source:
  type: tarball
  url: https://github.com/cnr-isti-vclab/vcglib/archive/refs/tags/2025.07.tar.gz
  sha256: "e49fc9342d5476b3e39a5e1939b965b57c91d7a17b4f97b8c5eaf01228b16cf0"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build.sh
      note: >-
        Reuses build.sh rather than a build-wasm.sh: vcglib is header-only, so
        the build stages headers and never runs a compiler or sources a
        toolchain env helper.  The output is identical on every target.
    - platform: wasi
      host_platform: linux
      script: build.sh
      note: >-
        Reuses build.sh — header staging only, no compilation.  None of the
        wasip1 restrictions apply to copying headers into the prefix.
    - platform: cosmo
      host_platform: linux
      script: build.sh
      note: >-
        Reuses build.sh — header staging only, no compilation.  Nothing is
        linked here, so cosmo's static-only restriction does not apply.

package:
  files:
    - include/vcg/
    - include/wrap/
    - share/vcglib/
    - share/cmake/vcglib/
  cmake_packages:
    - { name: vcglib, targets: ["vcglib::vcglib"] }

abi:
  cxx_std: 11
