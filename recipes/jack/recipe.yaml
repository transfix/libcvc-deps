schema_version: 1
recipe:
  name: jack
  upstream_version: "1.9.22"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/jackaudio/jack2
  license: "GPL-2.0-or-later AND LGPL-2.1-or-later"
  tags: [libraries, audio]
  description: >-
    JACK Audio Connection Kit (jack2 implementation) — a low-latency,
    synchronous, callback-based audio/MIDI server.  Provides libjack
    (client library, LGPL), libjackserver, libjacknet and the jackd
    server plus command-line tools.  The ALSA backend is enabled on
    Linux.  NOTE: jack2's waf build produces SHARED libraries only on
    Unix (its --static switch is Windows-only); a pure-static libjack is
    not supported, so CVC_LINK=static still yields shared libraries.
    macOS and Windows are intentionally out of scope for this recipe.

source:
  type: tarball
  url: https://github.com/jackaudio/jack2/archive/refs/tags/v1.9.22.tar.gz
  sha256: "1e42b9fc4ad7db7befd414d45ab2f8a159c0b30fcd6eee452be662298766a849"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - python3
  runtime:
    - name: alsa-lib
  host_tools:
    - python3

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh

package:
  files:
    - lib/libjack*
    - lib/libjackserver*
    - lib/libjacknet*
    - lib/jack/
    - lib/pkgconfig/jack.pc
    - include/jack/
    - bin/jack*
  pkg_config:
    - jack
