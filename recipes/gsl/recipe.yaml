schema_version: 1
recipe:
  name: gsl
  upstream_version: "2.8"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU Scientific Library — a numerical library for C and C++ programmers."
  homepage: https://www.gnu.org/software/gsl/
  license: GPL-3.0-or-later
  tags: [math, wasm]

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz
  sha256: "6a99eeed15632c6354895b1dd542ed5a855c0f15d9ad1326c6fe2b2c9e423190"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
      vcpkg_port: gsl
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libgsl*
    - lib/gsl*
    - lib/cmake/GSL/
    - lib/pkgconfig/gsl*
    - include/gsl/
  cmake_packages:
    - { name: GSL, targets: ["GSL::gsl", "GSL::gslcblas"] }

abi:
  cxx_std: 17
