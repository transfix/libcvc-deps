schema_version: 1
recipe:
  name: gsl
  upstream_version: "2.8"
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU Scientific Library — a numerical library for C and C++ programmers."
  homepage: https://www.gnu.org/software/gsl/
  license: GPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz
  # Fallback: ftp.gnu.org is unreachable from some builders (the
  # freebsd/openbsd dev nodes time out on it), which failed builds that
  # had nothing wrong with them. mirrors.kernel.org is
  # a reliable, well-maintained GNU mirror. ftpmirror.gnu.org, GNU's own
  # redirector, was tried first and is not reachable at all (HTTP 000).
  mirror: https://mirrors.kernel.org/gnu/gsl/gsl-2.8.tar.gz
  sha256: "6a99eeed15632c6354895b1dd542ed5a855c0f15d9ad1326c6fe2b2c9e423190"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  # NOT declaring mingw-w64-gcc here, though the Windows build needs it.
  # host_tools is `array of string` in the schema -- unlike a normal dep entry
  # it cannot be platform-scoped -- and mingw-w64-gcc is published for windows
  # ONLY. Unscoped it breaks every other platform:
  #     cvcpkg install-deps recipes/gsl --platform linux --include-host-tools
  #     Error: requested component(s) not found in the catalog for this
  #     platform tuple: mingw-w64-gcc
  # which is the same trap the `make` dep above was scoped away from, in the
  # other direction. (recipes/x264 carries the identical construct and has the
  # same latent breakage; it simply has no caller that trips it.)
  #
  # The Windows toolchain comes from the pacman step in windows-build.yml /
  # windows-recipe-check.yml instead, which installs mingw-w64-x86_64-gcc --
  # that provides both `gcc` and the x86_64-w64-mingw32-gcc spelling libtool
  # invokes via --host.
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libgsl*
    - lib/gsl*
    - lib/cmake/GSL/
    - lib/pkgconfig/gsl*
    - include/gsl/
  cmake_packages:
    - { name: GSL, targets: ["GSL::gsl", "GSL::gslcblas"] }

abi:
  cxx_std: 17
