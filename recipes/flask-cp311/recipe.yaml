schema_version: 1
recipe:
  name: flask-cp311
  upstream_version: "3.1.3"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/flask/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    flask 3.1.3 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/26/00/35d85dcce6c57fdc871f3867d465d780f302a175ea360f62533f12b27e2b/flask-3.1.3.tar.gz
  sha256: "0ef0e52b8a9cd932855379197dd8f94047b359ca0a78695144304cb45f87c9eb"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: blinker-cp311
    - name: click-cp311
    - name: itsdangerous-cp311
    - name: jinja2-cp311
    - name: markupsafe-cp311
    - name: werkzeug-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp311
  runtime:
    - name: python311
    - name: blinker-cp311
    - name: click-cp311
    - name: itsdangerous-cp311
    - name: jinja2-cp311
    - name: markupsafe-cp311
    - name: werkzeug-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/flask/
    - lib/python3.11/site-packages/flask-*.dist-info/
    - Lib/site-packages/flask/
    - Lib/site-packages/*.dist-info/
