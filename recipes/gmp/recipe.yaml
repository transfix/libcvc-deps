schema_version: 1
recipe:
  name: gmp
  upstream_version: "6.3.0"
  cvc_revision: 8
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GMP — the GNU Multiple Precision Arithmetic Library for arbitrary precision integer, rational, and floating-point arithmetic."
  homepage: https://gmplib.org/
  license: LGPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
  mirror: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
  sha256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  strip_components: 1

patches: []

depends:
  build:
    # Scoped away from windows: there is no `make` bundle for windows in the
    # catalog, and build.ps1 does not want one -- it builds through MSYS2's
    # MinGW-w64 gcc / GNU make / m4, which it sets up itself. Unscoped, this
    # made `cvcpkg install-deps recipes/gmp --platform windows` fail
    # outright with "no bundles found in catalog for this platform tuple",
    # which is what blocked publishing the windows-debug bundles.
    - name: make
      platforms: [linux, macos, freebsd, openbsd, netbsd, wasm, wasi, cosmo]
  # The MinGW toolchain the Windows build needs. build.ps1 goes through
  # Invoke-CvcMsysAutotoolsBuild, which needs a real gcc + binutils; the
  # GitHub-hosted windows image ships MSYS2 with only the `base` package
  # group (no gcc, no make, no m4), and #169 removed the pacman self-heal
  # that used to install them. Declaring it here stages the pinned compiler
  # into CVC_BUILD_PREFIX -- the same route that made x264 build on Windows.
  # host_tools are excluded from the runtime prefix by design, so gcc does
  # not end up shadowing MSVC for later CMake builds.
  host_tools:
    - mingw-w64-gcc

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libgmp*
    - lib/gmp*
    - lib/pkgconfig/gmp*
    - include/gmp.h
    - include/gmpxx.h
  cmake_packages: []

abi:
  cxx_std: 17
