schema_version: 1
recipe:
  name: gmp
  upstream_version: "6.3.0"
  cvc_revision: 8
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GMP — the GNU Multiple Precision Arithmetic Library for arbitrary precision integer, rational, and floating-point arithmetic."
  homepage: https://gmplib.org/
  license: LGPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
  mirror: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
  sha256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  strip_components: 1

patches: []

depends:
  build:
    # Scoped away from windows: there is no `make` bundle for windows in the
    # catalog, and build.ps1 does not want one -- it builds through MSYS2's
    # MinGW-w64 gcc / GNU make / m4, which it sets up itself. Unscoped, this
    # made `cvcpkg install-deps recipes/gmp --platform windows` fail
    # outright with "no bundles found in catalog for this platform tuple",
    # which is what blocked publishing the windows-debug bundles.
    - name: make
      platforms: [linux, macos, freebsd, openbsd, netbsd, wasm, wasi, cosmo]
  # NOT declaring mingw-w64-gcc here, though the Windows build needs it.
  # host_tools is `array of string` in the schema -- unlike a normal dep entry
  # it cannot be platform-scoped -- and mingw-w64-gcc is published for windows
  # ONLY. Unscoped it breaks every other platform:
  #     cvcpkg install-deps recipes/gsl --platform linux --include-host-tools
  #     Error: requested component(s) not found in the catalog for this
  #     platform tuple: mingw-w64-gcc
  # which is the same trap the `make` dep above was scoped away from, in the
  # other direction. (recipes/x264 carries the identical construct and has the
  # same latent breakage; it simply has no caller that trips it.)
  #
  # The Windows toolchain comes from the pacman step in windows-build.yml /
  # windows-recipe-check.yml instead, which installs mingw-w64-x86_64-gcc --
  # that provides both `gcc` and the x86_64-w64-mingw32-gcc spelling libtool
  # invokes via --host.
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libgmp*
    - lib/gmp*
    - lib/pkgconfig/gmp*
    - include/gmp.h
    - include/gmpxx.h
  cmake_packages: []

abi:
  cxx_std: 17
