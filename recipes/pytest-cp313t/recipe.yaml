schema_version: 1
recipe:
  name: pytest-cp313t
  upstream_version: "9.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pytest/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    pytest 9.1.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/24/25/1de2678b631f5a49215c6c96fff41ba892b0a34df68d6d80292b1b48aa7f/pytest-9.1.1-py3-none-any.whl
      sha256: "37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: iniconfig-cp313t
    - name: packaging-cp313t
    - name: pluggy-cp313t
    - name: pygments-cp313t
  runtime:
    - name: python313t
    - name: iniconfig-cp313t
    - name: packaging-cp313t
    - name: pluggy-cp313t
    - name: pygments-cp313t

provides:
  - pytest

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/_pytest/
    - lib/python3.13t/site-packages/pytest/
    - lib/python3.13t/site-packages/py.py
    - lib/python3.13t/site-packages/pytest-*.dist-info/
    - bin/pytest
    - bin/py.test
