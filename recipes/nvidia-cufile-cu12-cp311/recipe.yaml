schema_version: 1
recipe:
  name: nvidia-cufile-cu12-cp311
  upstream_version: "1.13.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/nvidia-cufile-cu12/
  license: "LicenseRef-NVIDIA-Proprietary"
  tags: [python, wheel, cuda, nvidia, gpu]
  description: >-
    nvidia-cufile-cu12 1.13.1.3 — prebuilt NVIDIA CUDA 12.8 runtime component (py3-none
    linux x86_64 wheel), a runtime dependency of torch-cp311-cuda. Installs its
    bundled CUDA .so libraries into the python311 site-packages `nvidia/`
    namespace; torch loads them at import. NOT built from source (proprietary
    NVIDIA redistributable). CUDA torch is GPU-only — see torch-cp311-cuda.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/bb/fe/1bcba1dfbfb8d01be8d93f07bfc502c93fa23afa6fd5ab3fc7c1df71038a/nvidia_cufile_cu12-1.13.1.3-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
      sha256: "1d069003be650e131b21c932ec3d8969c1715379251f8d23a1860554b1cb24fc"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_17

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/nvidia/
    - lib/python3.11*/site-packages/nvidia_cufile_cu12-*.dist-info/
