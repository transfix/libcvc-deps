schema_version: 1
recipe:
  name: python313
  upstream_version: "3.13.3"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.python.org/
  license: PSF-2.0
  tags: [language, runtime, scripting]
  description: >-
    CPython 3.13 — the reference Python implementation.  Ships libpython3.13,
    the python3.13 interpreter, and the full standard library including ssl,
    sqlite3, ctypes, bz2, lzma, readline, and curses modules.
    Latest stable release with the new free-threaded (no-GIL) build option.

source:
  type: tarball
  url: https://www.python.org/ftp/python/3.13.3/Python-3.13.3.tar.xz
  sha256: "40f868bcbdeb8149a3149580bb9bfd407b3321cd48f0be631af955ac92c0e041"
  strip_components: 1

patches: []

depends:
  build:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - bin/python3.13*
    - bin/python3
    - bin/python
    - bin/pip3.13*
    - bin/pip3
    - bin/pip
    - bin/idle3.13*
    - bin/pydoc3.13*
    - lib/libpython3.13*
    - lib/python3.13/
    - lib/pkgconfig/python-3.13*.pc
    - include/python3.13/
  cmake_packages:
    - { name: Python3, targets: ["Python3::Python", "Python3::Interpreter"] }

abi:
  cxx_std: 17

notes:
  - title: "Multiple Python versions coexist"
    platforms: [linux, macos, freebsd]
    description: >-
      python311, python312, and python313 install to versioned paths
      (bin/python3.13, lib/python3.13/, libpython3.13.so) and can be
      installed into the same prefix simultaneously without conflict.
  - title: "Free-threaded build (no-GIL)"
    platforms: [linux, macos, freebsd]
    description: >-
      3.13 supports an experimental free-threaded build via
      --disable-gil.  This recipe builds the standard GIL-enabled
      interpreter.  A separate python313t recipe can target the
      free-threaded variant when it matures.
