schema_version: 1
recipe:
  name: openssh-server
  upstream_version: "10.4p1"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    OpenSSH server — sshd plus its sshd-session, sshd-auth and sftp-server
    helpers, and a sample sshd_config + moduli. Built from the portable
    OpenSSH source; only the server programs are installed. Needs
    openssh-client at runtime for ssh-keygen (host-key generation).
  homepage: https://www.openssh.com/
  license: SSH-OpenSSH
  tags: [networking, tools, crypto]

source:
  type: tarball
  url: https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.4p1.tar.gz
  sha256: "ef6026dd2aea8d56059638d5d3262902c892ceba9f88395835e0d06d3fb63238"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
    - name: openssh-client        # provides ssh-keygen for host-key generation
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - sbin/sshd
    - libexec/sshd-session
    - libexec/sshd-auth
    - libexec/sftp-server
    - etc/ssh/sshd_config.sample
    - etc/ssh/moduli

abi:
  cxx_std: 17
