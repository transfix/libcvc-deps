schema_version: 1
recipe:
  name: tiff
  upstream_version: "4.7.0"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "libtiff — a library for reading and writing TIFF (Tagged Image File Format) files."
  homepage: https://libtiff.gitlab.io/libtiff/
  license: libtiff
  tags: [graphics, io, wasm, wasi]

source:
  type: tarball
  url: https://download.osgeo.org/libtiff/tiff-4.7.0.tar.gz
  sha256: "67160e3457365ab96c5b3286a0903aa6e78bdc44c4bc737d2e486bcecb6ba976"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: zlib
      version: "^1.3"
    - name: libjpeg-turbo
      version: "^3.1"
    - name: xz
      version: "^5.6"
    - name: zstd
      version: "^1.5"
    - name: libwebp
      version: "^1.5"
    - name: lerc
      version: "^4.0"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libtiff*
    - lib/tiff*
    - lib/cmake/tiff/
    - lib/pkgconfig/libtiff*
    - include/tiff.h
    - include/tiffio.h
    - include/tiffio.hxx
    - include/tiffvers.h
    - include/tiffconf.h
  cmake_packages:
    - { name: TIFF, targets: ["TIFF::TIFF"] }

abi:
  cxx_std: 17
