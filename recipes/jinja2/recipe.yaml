schema_version: 1
recipe:
  name: jinja2
  upstream_version: "3.1.4"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/jinja2/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    jinja2 3.1.4 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a runtime
    dependency of torch-cp311 (the GRL-SNAM / cvcpkg Python stack), installed into
    the interpreter's site-packages.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/31/80/3a54838c3fb461f6fec263ebf3a3a41771bd05190238de3486aae8540c36/jinja2-3.1.4-py3-none-any.whl
      sha256: "bc5dd2abb727a5319567b7a813e6a2e7318c39f4f487cfe6c89c6f9c7d25197d"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
    - name: markupsafe
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/jinja2/
    - lib/python3.*/site-packages/jinja2-*.dist-info/
