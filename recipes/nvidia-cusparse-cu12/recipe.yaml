schema_version: 1
recipe:
  name: nvidia-cusparse-cu12
  upstream_version: "12.5.8"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/nvidia-cusparse-cu12/
  license: "LicenseRef-NVIDIA-Proprietary"
  tags: [python, wheel, cuda, nvidia, gpu]
  description: >-
    nvidia-cusparse-cu12 12.5.8.93 — prebuilt NVIDIA CUDA 12.8 runtime component (py3-none
    linux x86_64 wheel), a runtime dependency of torch-cp311-cuda. Installs its
    bundled CUDA .so libraries into the python311 site-packages `nvidia/`
    namespace; torch loads them at import. NOT built from source (proprietary
    NVIDIA redistributable). CUDA torch is GPU-only — see torch-cp311-cuda.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/c2/f5/e1854cb2f2bcd4280c44736c93550cc300ff4b8c95ebe370d0aa7d2b473d/nvidia_cusparse_cu12-12.5.8.93-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
      sha256: "1ec05d76bbbd8b61b06a80e1eaf8cf4959c3d4ce8e711b65ebd0443bb0ebb13b"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_17

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/nvidia/
    - lib/python3.11*/site-packages/nvidia_cusparse_cu12-*.dist-info/
