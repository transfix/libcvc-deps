schema_version: 1
recipe:
  name: cython-cp312
  upstream_version: "3.1.6"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cython/
  license: "Apache-2.0"
  tags: [python, wheel]
  description: >-
    cython 3.1.6 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/18/d5/7a04640bf559bb890455ffb28978daf7d44f667c3f04a4d422c655c1ba92/cython-3.1.6-py3-none-any.whl
      sha256: "91dcf7eb9b6a089ce4e9e1140e571d84c3bca834afb77ec269be7aa9d31a8157"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312

provides:
  - cython

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.12/site-packages/Cython/
    - lib/python3.12/site-packages/cython.py
    - lib/python3.12/site-packages/pyximport/
    - lib/python3.12/site-packages/cython-*.dist-info/
    - bin/cython
    - bin/cythonize
    - bin/cygdb
