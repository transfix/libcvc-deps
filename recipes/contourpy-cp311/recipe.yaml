schema_version: 1
recipe:
  name: contourpy-cp311
  upstream_version: "1.3.1"
  cvc_revision: 6

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/contourpy/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    contourpy 1.3.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp311 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/25/c2/fc7193cc5383637ff390a712e88e4ded0452c9fbcf84abe3de5ea3df1866/contourpy-1.3.1.tar.gz
  sha256: "dfd97abd83335045a913e3bcc4a09c0ceadbe66580cf573fe961f4a825efa699"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: numpy-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: meson
    - name: meson-python-cp311
    - name: pybind11-cp311
  runtime:
    - name: python311
    - name: numpy-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/contourpy/
    - lib/python3.11/site-packages/contourpy-*.dist-info/
    - Lib/site-packages/contourpy/
    - Lib/site-packages/*.dist-info/
