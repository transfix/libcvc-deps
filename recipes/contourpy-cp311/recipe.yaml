schema_version: 1

recipe:
  name: contourpy-cp311
  upstream_version: "1.3.1"
  # Bumped 6 -> 7: source.type tarball (from-source sdist, compiled with meson +
  # pybind11) -> python_wheel (pinned prebuilt PyPI wheels, sha256-verified).
  # The from-source build could not produce a Windows column: on windows-2022
  # meson's cmake/pkg-config lookup for pybind11 fails (no pkg-config, and the
  # staged pybind11-cp311 headers are not on meson's search path), so
  # matplotlib-cp311's Windows closure was unbuildable. contourpy ships official
  # cp311 manylinux + win_amd64 wheels; use them (the torch-cp311 model). This
  # deliberately trades the from-source hermetic build for prebuilt wheels on
  # these C-extension deps so the Windows Python stack can publish.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/contourpy/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    contourpy 1.3.1 for CPython 3.11 (cp311): the pinned prebuilt PyPI wheels
    (manylinux_2_17 x86_64 + win_amd64), sha256-verified and installed into the
    python311 interpreter's site-packages. Switched off the from-source sdist
    build so the Windows column publishes without an MSVC / meson / pybind11
    source build (matplotlib-cp311's Windows closure needs contourpy). Prebuilt-
    wheel model, like torch-cp311.

source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/85/fc/7fa5d17daf77306840a4e84668a48ddff09e6bc09ba4e37e85ffc8e4faa3/contourpy-1.3.1-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
      sha256: "3a04ecd68acbd77fa2d39723ceca4c3197cb2969633836ced1bea14e219d077c"
    windows-x86_64:
      url: https://files.pythonhosted.org/packages/a8/7e/cd93cab453720a5d6cb75588cc17dcdc08fc3484b9de98b885924ff61900/contourpy-1.3.1-cp311-cp311-win_amd64.whl
      sha256: "b2bdca22a27e35f16794cf585832e542123296b4687f9fd96822db6bae17bfc9"
    macos-arm64:
      url: https://files.pythonhosted.org/packages/67/71/1e6e95aee21a500415f5d2dbf037bf4567529b6a4e986594d7026ec5ae90/contourpy-1.3.1-cp311-cp311-macosx_11_0_arm64.whl
      sha256: "20914c8c973f41456337652a6eeca26d2148aa96dd7ac323b74516988bea89fc"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_17

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
    - name: numpy-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1
    - platform: macos
      script: build.sh

package:
  files:
    - lib/python3.11/site-packages/contourpy/
    - lib/python3.11/site-packages/contourpy-*.dist-info/
    - Lib/site-packages/contourpy/
    - Lib/site-packages/contourpy-*.dist-info/
