schema_version: 1
recipe:
  name: trimesh-cp311
  upstream_version: "5.0.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/trimesh/
  license: "MIT"
  tags: [python, source]
  description: >-
    trimesh 5.0.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/a8/45/5b9943631f265073bb96ca4cc2a9de05d151cd8c1a6896fcbaac132a1355/trimesh-5.0.0.tar.gz
  sha256: "0195003198baaf2550aebe612254ba2f01c385cec46c37ecc5beca8291f79a13"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/trimesh/
    - lib/python3.11/site-packages/trimesh-*.dist-info/
    - Lib/site-packages/trimesh/
    - Lib/site-packages/*.dist-info/
