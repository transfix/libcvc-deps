schema_version: 1
recipe:
  name: haiku-image
  upstream_version: "1.0.0-beta.5"
  # NOT bumped for the boot fixes below, because haiku-image has never been
  # published: `cvcpkg info haiku-image` answers "component 'haiku-image'
  # not found in catalog". There is no immutable published variant for
  # revision 1 to collide with, so there is nothing to supersede.
  #
  # This stops being true the moment it IS published. Published variants are
  # immutable, so from then on every recipe change needs a bump or it
  # silently no-ops against the already-published artifact.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.haiku-os.org/
  license: MIT
  tags: [tools, images, haiku]
  description: >-
    A headless, self-configuring HaikuOS builder image, built from source
    (configure + jam) with OpenSSH, a build toolchain, and a builder user
    baked in.  Boots with NO VGA/GUI interaction — Haiku's Installer is
    graphical-only, so this image is pre-installed and pre-configured at
    build time.  Ships a qcow2 (portable) plus an anyboot image and import
    docs for Incus, LXD, Proxmox, and plain QEMU/libvirt.

source:
  # build.sh clones the Haiku source + buildtools at pinned refs and builds a
  # custom anyboot image via a dedicated jam build profile.  There is no
  # single upstream tarball.
  type: prebuilt
  url: https://github.com/haiku/haiku

# Intentionally empty — do NOT list the .patch files in this directory here.
# cvcpkg applies `patches:` to whatever fetch_source() returns, and for
# `source.type: prebuilt` (above) that is an EMPTY dummy dir, not the Haiku
# checkout — every patch would fail to apply and abort the build.  build.sh
# applies recipes/haiku-image/*.patch to the tree it clones itself, right
# after the clone.  See the "2b. Patch the haiku source tree" block there.
patches: []

depends:
  build: []
  host_tools: []

build:
  # A Linux-host recipe that PRODUCES a Haiku VM image (the recipe itself is
  # not a Haiku package).  Runs only on Linux x86_64 builders.
  build_type_independent: true
    # Linux x86_64 host only (builds a Haiku cross-toolchain + x86_64 image).
  matrix:
    - platform: linux
      script: build.sh
      env:
        # Set by the fleet's CI from a secret so the image trusts the builder
        # key; empty in public builds (import then inject a key — see README).
        HAIKU_BUILDER_SSH_PUBKEY: ""

package:
  files:
    - haiku-builder.qcow2
    - haiku-builder-anyboot.iso
    - metadata.yaml
    - README-import.md

notes: |-
  Build cost: Haiku is built from source, cross-toolchain first, so budget
  roughly 90 minutes on a modern multi-core Linux host. Disk is the tighter
  constraint than the old "~30 GB" note claimed: the tree carries the
  cross-toolchain and object dirs (~15 GB) AND two full-size copies of a
  10 GiB image (generated/haiku.image plus the anyboot), and then stages a
  third into CVC_INSTALL_DIR alongside the qcow2. Budget ~50 GB free. The
  recipe installs its own host build dependencies on Debian/Ubuntu builders
  (git, nasm, xorriso, qemu-utils, ...).

  BUILDERS MUST NOT REAP /tmp UNDER THIS RECIPE. A cvcpkg janitor of the
  form `find /tmp -maxdepth 1 -name 'cvcpkg-*' -type d -mmin +60 -exec rm
  -rf {} +` will delete this recipe's work dir out from under it: the build
  takes ~90 minutes and the janitor fires at 60. That is not hypothetical —
  it destroyed a completed toolchain plus the built ISO mid-run during the
  boot debugging. Exclude cvcpkg-haiku-image-*, raise the threshold past the
  build time, or build outside /tmp.

  Boot status: the four boot blockers this recipe fixes (anyboot 32-bit
  partition overflow, the `baron`/`user` account name, a toolchain staged
  unactivated in /boot/_packages_, and pkgman's missing TLS) were each
  verified on a booted VM — it gets DHCP, accepts SSH for `user`, and
  compiles and runs a C program against Haiku's own headers. Two further
  defects found during that work are fixed here too: the authorized_keys
  path is Haiku's config/settings/ssh, not ~/.ssh, and nothing in Haiku
  starts sshd headlessly, so the image ships a launch_daemon SYSTEM job.

  Independently re-verified against pristine upstream r1beta5 sources, off
  the build host: the anyboot patch applies with no fuzz to the r1beta5
  anyboot.cpp and, compiled and run on a real 10 GiB image, turns MBR entry 1
  from 4194304 sectors (2 GiB, wrapped) into 20971520 (exactly 10 GiB) and
  moves the EFI entry from inside the BFS payload to the BFS end. The package
  preflight was run against the real r1beta5 repository manifests: all 27
  requested names resolve, and it correctly rejects cmake/ninja/patchelf/
  rsync/python3 with a "did you mean python3.10" hint.

  What is NOT yet verified: this recipe has never been run start to finish.
  The boot verification above was done by injecting these exact artifacts
  into an already-built image — and specifically into a RESCUED diagnostic
  copy that had been through roughly ten boots of debugging, not into a clean
  build artifact — because the /tmp janitor destroyed the source tree before a
  clean re-run was possible. The preflight and patch checks were likewise run
  standalone rather than in situ. build.sh's clone/configure/jam path in
  particular is unexercised since these edits, and cvcpkg.haikuhost has never
  driven a real build against the image. Treat the first CI run as the real
  proof.

  Toolchain: gcc 13.3.0, binutils 2.42, make, jam, autotools, git, perl and
  python3.10 are baked in and activated. `ninja` is NOT available at this
  Haiku version — HaikuPorts builds it against r1~beta6 and this image is
  beta5. cmake, patchelf and rsync are not baked in but do install at
  runtime via `pkgman install -y cmake patchelf rsync`. That is a MANUAL
  step: there is deliberately no first-boot top-up automation. A
  launch_daemon job that would have run it on first boot was tried and failed
  reproducibly, so it is not shipped — the only launch job in the image is
  the sshd one. Getting ninja (and a newer python) means moving HAIKU_REF off
  r1beta5, which is a new cross-toolchain build and a full revalidation.
