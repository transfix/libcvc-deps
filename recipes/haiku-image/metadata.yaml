# Incus/LXD image metadata for the HaikuOS builder image.
#
# build.sh copies this to share/haiku-image/incus/metadata.yaml AND wraps it in
# share/haiku-image/incus/metadata.tar.xz — `incus image import` takes the
# TARBALL, not this file:
#   incus image import "$(cvcpkg image path haiku-image --role incus-metadata)" \
#                      "$(cvcpkg image path haiku-image)" --alias haiku-builder
# (see README-import.md). creation_date is a placeholder — set it at import
# time if you need provenance.
architecture: x86_64
creation_date: 1735689600
properties:
  description: HaikuOS r1beta5 headless builder (OpenSSH + toolchain baked in)
  os: Haiku
  release: r1beta5
  variant: builder
  type: virtual-machine
