schema_version: 1
recipe:
  name: pkgconfig-cp311
  upstream_version: "1.5.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pkgconfig/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    pkgconfig 1.5.5 (noarch py3-none-any) for the python311 interpreter — a
    BUILD-TIME backend for cvcpkg from-source Python packages (numpy, h5py).
    Declared as a depends.build edge, so it lands in the build prefix and is
    stripped from the deliverable; never shipped to users.

# Pure-Python noarch wheel: one platform-independent artifact, but tied to the
# python311 interpreter (installs into ITS site-packages, where --no-build-
# isolation backends must be importable). The -cp311 suffix names that target.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/32/af/89487c7bbf433f4079044f3dc32f9a9f887597fe04614a37a292e373e16b/pkgconfig-1.5.5-py3-none-any.whl
      sha256: "d20023bbeb42ee6d428a0fac6e0904631f545985a10cdd71a20aa58bc47a4209"

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/pkgconfig/
    - lib/python3.11*/site-packages/pkgconfig-*.dist-info/
