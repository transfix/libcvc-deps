schema_version: 1
recipe:
  name: msys2
  upstream_version: "20250221"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    MSYS2 — a software distribution and build platform for Windows.
    Provides a Unix-like POSIX shell (bash), GNU make, and the
    MinGW-w64 GCC toolchain.  Required as a host tool for
    autotools-based and Meson-based builds on Windows.  Use
    Invoke-CvcMsysAutotoolsBuild or Invoke-CvcMesonBuild in build.ps1.
    Additional tools (m4, autoconf, automake, libtool, meson, ninja)
    are managed by their own cvcpkg recipes; declare those as
    host_tools rather than relying on pacman.
  homepage: https://www.msys2.org/
  license: BSD-3-Clause

# MSYS2 is a Windows-native build environment used only at build time.
# env-windows.ps1's Get-CvcGitBash locates bash.exe by checking (in
# order): CVC_MSYS2_DIR env var, CVC_DEPS_PREFIX\msys2, C:\msys64,
# and finally Git Bash.

source:
  # The build script handles downloading the MSYS2 installer directly.
  type: prebuilt

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: windows
      script: build.ps1

package:
  # We only ship a small version marker; the full MSYS2 tree lives at
  # C:\msys64 (or the path chosen by --root in the installer).  This
  # keeps bundle sizes reasonable — MSYS2 is a system prerequisite,
  # not a library to be bundled with every consumer package.
  files:
    - msys2/

abi:
  cxx_std: 17

notes:
  - title: "System-level installation"
    platforms: [windows]
    description: >-
      The build script installs MSYS2 into
      %CVC_INSTALL_DIR%\msys2 via the official NSIS silent installer.
      If MSYS2 is already present at that path the installer is
      skipped and the existing installation is updated instead.
      Only base-devel (make, patch, diffutils, POSIX utilities) and
      mingw-w64-x86_64-toolchain (gcc, g++, binutils) are installed
      via pacman.  Autotools (m4, autoconf, automake, libtool),
      meson, ninja, and pkg-config come from their own cvcpkg recipes.
  - title: "Large download (~500 MB)"
    platforms: [windows]
    description: >-
      The MSYS2 base installer is ~90 MB; post-install package updates
      bring the on-disk footprint to ~500 MB.
  - title: "bash.exe discovery"
    platforms: [windows]
    description: >-
      env-windows.ps1's Get-CvcGitBash locates bash.exe by checking
      (1) CVC_MSYS2_DIR env var, (2) CVC_DEPS_PREFIX\msys2 (recipe
      install path), (3) C:\msys64, (4) Git Bash.  Downstream recipes
      call Invoke-CvcMsysAutotoolsBuild or Invoke-CvcMesonBuild from
      their build.ps1 and declare required tools (autoconf, meson,
      etc.) as host_tools in recipe.yaml.
