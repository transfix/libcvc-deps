python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_27

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
