schema_version: 1
recipe:
  name: imageio-cp312
  upstream_version: "2.36.1"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/imageio/
  license: "BSD-2-Clause"
  tags: [python, source]
  description: >-
    imageio 2.36.1 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/70/aa/2e7a49259339e691ff2b477ae0696b1784a09313c5872700bbbdd00a3030/imageio-2.36.1.tar.gz
  sha256: "e4e1d231f47f9a9e16100b0f7ce1a86e8856fb4d1c0fa2c4365a316f1746be62"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: pillow-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
    - name: pillow-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.12/site-packages/imageio/
    - lib/python3.12/site-packages/imageio-*.dist-info/
    - Lib/site-packages/imageio/
    - Lib/site-packages/*.dist-info/
