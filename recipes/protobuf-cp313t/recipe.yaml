schema_version: 1
recipe:
  name: protobuf-cp313t
  upstream_version: "7.35.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/protobuf/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    protobuf 7.35.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/19/c7/5f7c636ec43e0c545e28d1f1db71990108306f7bdcb89f069ba97e428e7f/protobuf-7.35.1-py3-none-any.whl
      sha256: "4bc97768d8fe4ad6743c8a19403e314511ed9f6d13205b687e52421c023ac1b9"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
  runtime:
    - name: python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/google/protobuf/
    - lib/python3.13t/site-packages/*.dist-info/
