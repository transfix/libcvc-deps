schema_version: 1
recipe:
  name: qtmultimedia
  upstream_version: "6.8.2"
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Qt 6 Multimedia — multimedia playback and capture support."
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [multimedia]

source:
  type: tarball
  url: https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtmultimedia-everywhere-src-6.8.2.tar.xz
  sha256: "34f561fdc07b158bcc4ad040b596fc6086c48908060e854b473b557e4feb1569"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    - python312
  runtime:
    - {name: qt6, version: ">=6.8"}
    - {name: qtshadertools, version: ">=6.8"}
  host_tools:
    - perl

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CXXFLAGS: "-O2 -std=c++17"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libQt6Multimedia*
    - lib/Qt6Multimedia*
    - lib/cmake/Qt6Multimedia*/
    - lib/pkgconfig/Qt6Multimedia*
    - include/QtMultimedia/
    - include/QtMultimediaWidgets/
    - plugins/multimedia/
    - plugins/mediaservice/
    - plugins/audio/
  cmake_packages:
    - {
        name: Qt6Multimedia,
        targets: ["Qt6::Multimedia", "Qt6::MultimediaWidgets"],
      }

abi:
  cxx_std: 17
