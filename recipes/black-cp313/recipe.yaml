schema_version: 1
recipe:
  name: black-cp313
  upstream_version: "26.5.1"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/black/
  license: "MIT"
  tags: [python, source]
  description: >-
    black 26.5.1 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/c0/37/5628dd55bf2b34257fc7603f0fe97c40e3aaf24265f416a9c85c95ca1436/black-26.5.1.tar.gz
  sha256: "dd321f668053961824bcc1be1cc1df748b2d7e4fa28086b08331e577b0100a73"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    - name: click-cp313
    - name: mypy-extensions-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: platformdirs-cp313
    - name: pytokens-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatch-fancy-pypi-readme-cp313
    - name: hatch-vcs-cp313
    - name: hatchling-cp313
  runtime:
    - name: python313
    - name: click-cp313
    - name: mypy-extensions-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: platformdirs-cp313
    - name: pytokens-cp313
  host_tools:
    - python313

provides:
  - black

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/black/
    - lib/python3.13/site-packages/blackd/
    - lib/python3.13/site-packages/blib2to3/
    - lib/python3.13/site-packages/_black_version.py
    - lib/python3.13/site-packages/black-*.dist-info/
    - bin/black
    - bin/blackd
    - Lib/site-packages/black/
    - Lib/site-packages/*.dist-info/
