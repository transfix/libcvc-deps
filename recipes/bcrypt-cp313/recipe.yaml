schema_version: 1
recipe:
  name: bcrypt-cp313
  upstream_version: "5.0.0"
  # Bumped 2 -> 3: converted from the prebuilt PyPI wheel to a FROM-SOURCE sdist
  # build, and gained freebsd + netbsd.
  #
  # bcrypt's extension links nothing but libc — the KDF is pure Rust, not
  # OpenSSL — so unlike cryptography there is no vendored-library argument. The
  # reason is reach: PyPI publishes no FreeBSD or NetBSD wheel, so password
  # hashing was simply unavailable there. Compiling the sdist is the only route
  # and it needs cargo on the target, which recipes/rust gained in rust+cvc.2.
  #
  # Version kept at 5.0.0: `[build-system] requires` is
  # setuptools>=42 + wheel + setuptools-rust>=1.7, all satisfied by the matrix
  # (80.9.0 / 0.45.1 / 1.13.0). Note bcrypt is the ONE package in this group that
  # does NOT use maturin — it declares setuptools.build_meta and drives cargo
  # through the setuptools-rust plugin, so its build closure is the shorter one.
  #
  # openbsd is still absent, and not by oversight: Rust publishes no OpenBSD
  # toolchain, so there is no cargo to build this with anywhere in the graph.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/bcrypt/
  license: "Apache-2.0"
  tags: [python, wheel]
  description: >-
    bcrypt 5.0.0 for CPython 3.13 (cp313) — the cp313 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE with cvcpkg's own Rust toolchain
    rather than installed from the PyPI wheel. _bcrypt is a pyo3 cdylib linking
    nothing but libc, so the point of building it is coverage: PyPI publishes no
    BSD wheel, so this is what makes bcrypt available on FreeBSD and NetBSD at
    all. Unlike cryptography and pydantic-core this one builds through
    setuptools + setuptools-rust rather than maturin. Installed as a proper wheel
    (real dist-info/RECORD/METADATA) via pip, so a user's later
    `pip install <other>` coexists and pip's resolver sees bcrypt as satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the setuptools/
# setuptools-rust backend already present in the build prefix. The sha256 was
# recomputed from the downloaded tarball and matches upstream's own sdist digest
# in the PyPI JSON API.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/d4/36/3329e2518d70ad8e2e5817d5a4cac6bba05a47767ec416c7d020a965f408/bcrypt-5.0.0.tar.gz
  sha256: "f748f7c2d6fd375cc93d3fba7ef4a9e3a092421b8dbf34d8d4dc06be9492dfdd"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.13 and the wheel lands in ITS site-packages. abi3 is right for this
# column: bcrypt's pyproject sets `py-limited-api = "auto"`, which resolves to the
# stable ABI on a GIL-ful interpreter. manylinux_min is gone with the prebuilt
# wheel it used to describe — nothing is downloaded any more, so there is no
# wheel tag to floor.
python:
  interpreter: python313
  abi: abi3

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python313
    # PEP-517 backend: bcrypt names setuptools.build_meta explicitly ("to disable
    # Pip's fallback guessing", per its own comment) and requires setuptools>=42.
    - name: setuptools-cp313
    # The plugin that actually runs cargo. bcrypt declares its extension
    # declaratively, via [[tool.setuptools-rust.ext-modules]] in pyproject.toml —
    # there is no setup.py in this sdist at all.
    - name: setuptools-rust-cp313
    # Named in `[build-system] requires`; pip checks declared build requirements
    # even under --no-build-isolation.
    - name: wheel-cp313
    # cargo + rustc. This is the edge that decides the platform set — see the
    # matrix comment. (bcrypt's crate declares rust-version 1.74.0, the most
    # relaxed MSRV in this group.)
    - name: rust
  runtime:
    # Nothing but the interpreter: _bcrypt has no external NEEDED library and the
    # Python half imports only the extension.
    - name: python313
  host_tools:
    # Must run on the BUILDER: the interpreter (drives pip; setuptools-rust also
    # passes it to cargo as PYO3_PYTHON) and the Rust toolchain. No patchelf —
    # there is no external library reference to repoint.
    - python313
    - rust

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and cargo builds its own release profile regardless — so build once.
  build_type_independent: true
  # freebsd and netbsd are new and are the point of this revision: they were
  # impossible while the recipe consumed a PyPI wheel (upstream publishes none)
  # and are possible now only because recipes/rust covers them. openbsd is the
  # one native platform still missing, and the reason is upstream Rust, not
  # bcrypt: there is no official OpenBSD rustc/cargo to build it with.
  # wasm/wasi/cosmo stay out — the static interpreter has no extension-module ABI.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python313 recipe — an extension built for a different
        # deployment target than the interpreter that loads it is exactly the
        # mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.13/site-packages/bcrypt/
    - lib/python3.13/site-packages/bcrypt-*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/bcrypt/
    - Lib/site-packages/bcrypt-*.dist-info/

notes:
  - title: "cargo fetches crates from the network during this build"
    platforms: [linux, macos, windows, freebsd, netbsd]
    description: >-
      The bcrypt sdist ships src/_bcrypt/Cargo.lock but does NOT vendor its crate
      sources, so cargo resolves every dependency (pyo3, bcrypt, bcrypt-pbkdf,
      ...) out of crates.io. The pip layer is fully offline (--no-index,
      --no-build-isolation) and crate versions are lock-pinned, but the cargo
      layer is not air-gapped. Set CVC_CARGO_HOME to a pre-populated registry and
      CVC_CARGO_OFFLINE=1 to force CARGO_NET_OFFLINE=true on a builder that must
      not reach the network; build.sh prints which mode it is in.
