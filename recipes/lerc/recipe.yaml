schema_version: 1
recipe:
  name: lerc
  upstream_version: "4.0.0"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "LERC — Limited Error Raster Compression, an open-source image/raster format for lossy and lossless compression."
  homepage: https://github.com/Esri/lerc
  license: Apache-2.0
  tags: [wasi, graphics, io, wasm]

source:
  type: tarball
  url: https://github.com/Esri/lerc/archive/refs/tags/v4.0.0.tar.gz
  sha256: "91431c2b16d0e3de6cbaea188603359f87caed08259a645fd5a3805784ee30a0"
  strip_components: 1

patches:
  - bsd-assert-macro-collision.patch

depends:
  build:
    - cmake
    - ninja
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libLerc*
    - lib/Lerc*
    - lib/pkgconfig/Lerc.pc
    - include/Lerc_c_api.h
    - include/Lerc_types.h
  cmake_packages: []

abi:
  cxx_std: 17
