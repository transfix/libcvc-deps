schema_version: 1
recipe:
  name: lerc
  upstream_version: "4.0.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "LERC — Limited Error Raster Compression, an open-source image/raster format for lossy and lossless compression."
  homepage: https://github.com/Esri/lerc
  license: Apache-2.0
  tags: [graphics, io, wasm]

source:
  type: tarball
  url: https://github.com/Esri/lerc/archive/refs/tags/v4.0.0.tar.gz
  sha256: "91431c2b16d0e3de6cbaea188603359f87caed08259a645fd5a3805784ee30a0"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libLerc*
    - lib/Lerc*
    - lib/pkgconfig/Lerc.pc
    - include/Lerc_c_api.h
    - include/Lerc_types.h
  cmake_packages: []

abi:
  cxx_std: 17
