schema_version: 1
recipe:
  name: joltphysics
  upstream_version: "5.6.0"
  # cvc.2: disable Jolt's ENABLE_ALL_WARNINGS (-Werror). +cvc.1 built on the BSD
  # (clang) builders but failed on the prod linux (GCC) builder — a
  # -Wuninitialized false positive in Jolt/Core/HashTable.h was fatal under
  # -Werror. Rebuild all platforms coherently without upstream's -Werror.
  #
  # cvc.3: added wasm and cosmo.  Jolt is a headless solver — no files, sockets
  # or display — and upstream supports Emscripten directly (it defines
  # JPH_PLATFORM_WASM for __EMSCRIPTEN__ and ships a wasm build script).  cosmocc
  # is an ordinary x86-64 C++ toolchain that defines __linux__, so Jolt takes its
  # Linux branch there.  Both cross scripts force every x86 ISA switch OFF: under
  # Emscripten because the toolchain file reports CMAKE_SYSTEM_PROCESSOR as
  # "x86" and Jolt would otherwise pass -msse4.2 to a compiler targeting another
  # instruction set; under cosmo because an APE is meant to run anywhere and
  # SSE4.2 narrows it to Nehalem-and-later.  Jolt's scalar Vec4/Mat44 path covers
  # both.  That is an ABI change relative to the native build, which is safe only
  # because Jolt exports those settings as PUBLIC compile definitions on
  # Jolt::Jolt — see the ABI warning in the description below.
  #
  # NOT wasi, deliberately: Jolt's core unconditionally compiles
  # JobSystemThreadPool and Semaphore, which need std::thread, std::mutex and
  # std::condition_variable.  wasi-sdk's wasm32-wasip1 libc++ is built
  # _LIBCPP_HAS_NO_THREADS and does not provide them, and Jolt's platform
  # detection has no __wasi__ branch either.  A wasip1-threads sysroot would be
  # a different toolchain than env-wasi.sh configures.
  # cvc.4: (1) wasm from a Windows host too (build-wasm.ps1) -- the cvc.3
  # cvc.5: patch JPH_STACK_ALLOC to __builtin_alloca on GCC/Clang. Jolt includes no
  #   header for alloca outside MSVC; on NetBSD the bare call resolved to libc alloca(3)
  #   (ld: "most likely will not work") and the cvc.4 smoke consumer segfaulted there.
  # wasm/cosmo/openbsd variants never reached the catalog (the live catalog has
  # no cross-target bundle for ANY package touched by 82d7acb8, so this is not
  # a Jolt-specific failure); (2) CROSS_PLATFORM_DETERMINISTIC=ON on EVERY
  # platform: upstream guarantees identical results across compiler (incl.
  # emscripten), OS, arch and word size only with it on (~8% cost) -- the
  # property a native-authoritative / browser-replay digital twin needs. It is
  # a JPH_VERSION_ID feature bit, so all platforms flip together;
  # PROFILER_IN_DEBUG_AND_RELEASE=OFF likewise (upstream's wasm CI config is
  # Distribution, i.e. no profiler). (3) test.sh builds + runs a find_package
  # consumer, natively and under node for wasm (JPH::RegisterTypes aborts on a
  # config mismatch, so it is a real ABI check).
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/jrouwe/JoltPhysics
  license: MIT
  tags: [libraries, physics, game, wasm]
  description: >-
    Jolt Physics — a fast, multi-core-friendly rigid-body physics and
    collision-detection library for games and VR, written in C++17.  Builds the
    core Jolt library (static + shared) only; the samples, viewer, unit tests,
    and the DX12/Vulkan/Metal debug-renderer backends are disabled, so the
    package is dependency-free and headless.  The x86_64 build targets a
    portable SSE4.2 baseline (AVX/AVX2/AVX-512/BMI off) so the binary runs on
    generic x86_64; ARM uses NEON.  IMPORTANT: Jolt is ABI-sensitive to its
    configuration — a consumer MUST be compiled with the same JPH_* settings as
    the library.  Use find_package(Jolt) + link Jolt::Jolt: Jolt attaches those
    settings (SSE level, object-layer bits, shared-library import, profiler /
    debug-renderer flags) as PUBLIC compile definitions, so a CMake consumer of
    the exported target inherits the matching defines automatically.

source:
  type: tarball
  url: https://github.com/jrouwe/JoltPhysics/archive/refs/tags/v5.6.0.tar.gz
  sha256: "6e069ee0172478cc78182047aac87e5310ba14a67a53348ae14cc37801fd3f8e"
  strip_components: 1

patches:
  - patches/netbsd-builtin-alloca.patch

depends:
  build:
    - cmake
    - ninja
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # Unix static + shared artifacts (.a / .so / .so.N / .dylib).
    - lib/libJolt*
    # Windows import/static lib + runtime DLL (MSVC).
    - lib/Jolt.lib
    - bin/Jolt.dll
    # Relocatable CMake package export (Jolt::Jolt) + headers.
    - lib/cmake/Jolt/
    - include/Jolt/
  cmake_packages:
    - { name: Jolt, targets: ["Jolt::Jolt"] }

test:
  script: test.sh

abi:
  cxx_std: 17
