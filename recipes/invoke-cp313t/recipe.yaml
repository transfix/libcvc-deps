schema_version: 1
recipe:
  name: invoke-cp313t
  upstream_version: "3.0.3"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/invoke/
  license: "BSD-2-Clause"
  tags: [python, wheel]
  description: >-
    invoke 3.0.3 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/5a/de/bbc12563bbf979618d17625a4e753ff7a078523e28d870d3626daa97261a/invoke-3.0.3-py3-none-any.whl
      sha256: "f11327165e5cbb89b2ad1d88d3292b5113332c43b8553b494da435d6ec6f5053"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
  runtime:
    - name: python313t

provides:
  - invoke

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/invoke/
    - lib/python3.13t/site-packages/*.dist-info/
    - bin/invoke
    - bin/inv
