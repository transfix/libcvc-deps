schema_version: 1
recipe:
  name: pyinstaller-hooks-contrib-cp313
  upstream_version: "2026.6"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pyinstaller-hooks-contrib/
  license: "Apache-2.0 OR GPL-2.0-or-later"
  tags: [python, source]
  description: >-
    pyinstaller-hooks-contrib 2026.6 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/94/5b/c9fe0db5e83ee1c39b2258fa21d23b15e1a60786b6c5990ee5074ead8bb6/pyinstaller_hooks_contrib-2026.6.tar.gz
  sha256: "bef5002c32f4f50bd55b005da12cff64eca8783e7eaf86a06a62410164bab725"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    - name: packaging-cp313
    - name: setuptools-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: wheel-cp313
  runtime:
    - name: python313
    - name: packaging-cp313
    - name: setuptools-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/_pyinstaller_hooks_contrib/
    - lib/python3.13/site-packages/pyinstaller_hooks_contrib-*.dist-info/
    - Lib/site-packages/pyinstaller_hooks_contrib/
    - Lib/site-packages/*.dist-info/
