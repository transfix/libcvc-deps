schema_version: 1
recipe:
  name: libunistring
  upstream_version: "1.3"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU libunistring — Unicode string library for C (required by libidn2 and others)."
  homepage: https://www.gnu.org/software/libunistring/
  license: LGPL-3.0-or-later OR GPL-2.0-or-later
  tags: [libraries, i18n]

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/libunistring/libunistring-1.3.tar.gz
  sha256: "8ea8ccf86c09dd801c8cac19878e804e54f707cf69884371130d20bde68386b7"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: iconv
      version: ">=1.17"
      platforms: [freebsd, netbsd, openbsd, macos]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh

package:
  files:
    - lib/libunistring*
    - include/unistr.h
    - include/uniconv.h
    - include/unictype.h
    - include/uniname.h
    - include/uninorm.h
    - include/unistdio.h
    - include/unistr/
    - include/unistring/
    - include/uniwbrk.h
    - include/uniwidth.h
    - include/unilbrk.h
    - include/unicase.h
    - include/uniwbrk/
    - include/unilbrk/
    - include/unictype/
    - include/uninorm/
    - include/unicase/
    - include/unimetadata/
  cmake_packages: []

abi:
  cxx_std: 17
