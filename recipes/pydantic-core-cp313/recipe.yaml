schema_version: 1
recipe:
  name: pydantic-core-cp313
  upstream_version: "2.46.4"
  # Bumped 2 -> 3: converted from the prebuilt PyPI wheel to a FROM-SOURCE sdist
  # build, and gained freebsd + netbsd.
  #
  # Unlike cffi or cryptography there is no vendored-library argument here —
  # _pydantic_core links nothing but libc. The reason is coverage: PyPI ships no
  # FreeBSD or NetBSD wheel for pydantic-core, so on those platforms the package
  # simply did not exist, and pydantic (hence FastAPI, hence most of the API
  # surface cvcpkg consumers care about) did not either. Building from the sdist
  # is the only route, and it needs cargo on the target, which is what
  # recipes/rust gained in rust+cvc.2.
  #
  # Version kept at 2.46.4: its `[build-system] requires` is `maturin>=1.10,<2`,
  # satisfied by the maturin 1.14.1 column, so there was no reason to chase
  # 2.47.0. NOTE the crate itself declares `rust-version = "1.88"` with
  # `edition = "2024"` — that is one of the two MSRVs that forced rust off 1.84.0.
  #
  # openbsd is still absent, and not by oversight: Rust publishes no OpenBSD
  # toolchain, so there is no cargo to build this with anywhere in the graph.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pydantic-core/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    pydantic-core 2.46.4 for CPython 3.13 (cp313) — the cp313 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE with maturin and cvcpkg's own Rust
    toolchain rather than installed from the PyPI wheel. _pydantic_core is a pyo3
    cdylib that links no external library, so there is nothing to unvendor here —
    the reason to build it is reach: PyPI publishes no BSD wheel, so this is what
    makes pydantic available on FreeBSD and NetBSD at all. Installed as a proper
    wheel (real dist-info/RECORD/METADATA) via pip, so a user's later
    `pip install <other>` coexists and pip's resolver sees pydantic-core as
    satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the maturin backend
# already present in the build prefix. The sha256 was recomputed from the
# downloaded tarball and matches upstream's own sdist digest in the PyPI JSON API.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/9d/56/921726b776ace8d8f5db44c4ef961006580d91dc52b803c489fafd1aa249/pydantic_core-2.46.4.tar.gz
  sha256: "62f875393d7f270851f20523dd2e29f082bcc82292d66db2b64ea71f64b6e1c1"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.13 and the wheel lands in ITS site-packages. Version-specific ABI, not
# abi3 — pyo3 is configured without the abi3 feature here. manylinux_min is gone
# with the prebuilt wheel it used to describe: nothing is downloaded any more, so
# there is no wheel tag to floor.
python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python313
    # The PEP-517 backend pydantic-core declares (`build-backend = 'maturin'`).
    # Build-only, so build.sh bridges its site-packages onto PYTHONPATH and its
    # bin/ onto PATH — the shim shells out to the maturin EXECUTABLE.
    - name: maturin-cp313
    # cargo + rustc: maturin drives cargo, and the whole extension is Rust. This
    # is the edge that decides the platform set — see the matrix comment.
    - name: rust
    # Declared runtime dependency (`typing-extensions>=4.14.1`); kept as a build
    # edge too so the verification step at the end of build.sh can import the
    # package the way a consumer will.
    - name: typing-extensions-cp313
  runtime:
    - name: python313
    - name: typing-extensions-cp313
  host_tools:
    # Must run on the BUILDER: the interpreter (drives pip and is what maturin is
    # pointed at with -i) and the Rust toolchain. No patchelf here, unlike
    # cryptography/cffi — this extension has no external NEEDED library, so there
    # is no RUNPATH worth stamping.
    - python313
    - rust

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and cargo builds its own release profile regardless — so build once.
  build_type_independent: true
  # freebsd and netbsd are new and are the point of this revision: they were
  # impossible while the recipe consumed a PyPI wheel (upstream publishes none)
  # and are possible now only because recipes/rust covers them. openbsd is the
  # one native platform still missing, and the reason is upstream Rust, not
  # pydantic-core: there is no official OpenBSD rustc/cargo to build it with.
  # wasm/wasi/cosmo stay out — the static interpreter has no extension-module ABI.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python313 recipe — an extension built for a different
        # deployment target than the interpreter that loads it is exactly the
        # mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.13/site-packages/pydantic_core/
    - lib/python3.13/site-packages/pydantic_core-*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/pydantic_core/
    - Lib/site-packages/pydantic_core-*.dist-info/

notes:
  - title: "cargo fetches crates from the network during this build"
    platforms: [linux, macos, windows, freebsd, netbsd]
    description: >-
      The pydantic-core sdist ships Cargo.lock but does NOT vendor its crate
      sources, so cargo resolves every dependency (pyo3, serde, jiter, ...) out of
      crates.io. The pip layer is fully offline (--no-index,
      --no-build-isolation) and crate versions are lock-pinned, but the cargo
      layer is not air-gapped. Set CVC_CARGO_HOME to a pre-populated registry and
      CVC_CARGO_OFFLINE=1 to force CARGO_NET_OFFLINE=true on a builder that must
      not reach the network; build.sh prints which mode it is in.
