schema_version: 1
recipe:
  name: m4
  upstream_version: "1.4.19"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/m4/
  license: GPL-3.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU m4 — macro processor required by autoconf and bison.
    BSD systems ship a non-GNU m4 that lacks features needed
    by GNU autotools.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/m4/m4-1.4.19.tar.xz
  sha256: "63aede5c6d33b6d9b13511cd0be2cac046f2e70fd0a07aa9573a04a82783af96"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/m4
    - share/man/man1/m4*
