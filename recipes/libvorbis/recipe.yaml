schema_version: 1
recipe:
  name: libvorbis
  upstream_version: "1.3.7"
  # Added wasm/wasi/cosmo entries.  The codec is portable floating-point DSP —
  # MDCT, codebooks, psychoacoustics — with no threads, sockets or assembly and
  # no runtime CPU dispatch to disable; the only platform call is
  # libvorbisfile's ov_open(FILE *), and all three targets have stdio (consumers
  # that want to avoid it entirely already have ov_open_callbacks).  This became
  # legal only once libogg gained the same three targets in its cvc.2 — the
  # closure check rejects a target the runtime dependency cannot build for.
  # Bumped 2 -> 3: Windows build.ps1 rework: honour CVC_LINK in both directions and pin
  # the build to the cvcpkg MinGW toolchain (exported PATH/PKG_CONFIG_PATH,
  # drive-letter prefixes, TMPDIR fix). Script-only change, so the catalog
  # and dev build cache only pick it up with a revision bump.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.xiph.org/vorbis/
  license: BSD-3-Clause
  tags: [libraries, multimedia, audio, wasm, wasi]
  description: >-
    libvorbis — the Ogg Vorbis audio compression library.  Provides
    Vorbis encoding and decoding for FFmpeg (--enable-libvorbis).
    Depends on libogg.

source:
  type: tarball
  url: https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz
  sha256: "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"
  strip_components: 1

patches: []

depends:
  build:
    - name: libogg
    - pkg-config
  runtime:
    - name: libogg
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libvorbis*
    - lib/pkgconfig/vorbis*.pc
    - include/vorbis/
    - bin/libvorbis-*.dll
    - bin/libvorbisenc-*.dll
    - bin/libvorbisfile-*.dll
  pkg_config:
    - vorbis
    - vorbisenc
    - vorbisfile
