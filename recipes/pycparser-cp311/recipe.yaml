schema_version: 1
recipe:
  name: pycparser-cp311
  upstream_version: "3.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pycparser/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    pycparser 3.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/0c/c3/44f3fbbfa403ea2a7c779186dc20772604442dde72947e7d01069cbe98e3/pycparser-3.0-py3-none-any.whl
