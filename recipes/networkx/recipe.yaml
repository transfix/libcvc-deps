schema_version: 1
recipe:
  name: networkx
  upstream_version: "3.4.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/networkx/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    networkx 3.4.2 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a runtime
    dependency of torch-cp311 (the GRL-SNAM / cvcpkg Python stack), installed into
    the interpreter's site-packages.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/b9/54/dd730b32ea14ea797530a4479b2ed46a6fb250f682a9cfb997e968bf0261/networkx-3.4.2-py3-none-any.whl
      sha256: "df5d4365b724cf81b8c6a7312509d0c22386097011ad1abe274afd5e9d3bbc5f"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/networkx/
    - lib/python3.*/site-packages/networkx-*.dist-info/
