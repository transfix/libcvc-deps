schema_version: 1
recipe:
  name: requests-cp313t
  upstream_version: "2.34.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/requests/
  license: "Apache-2.0"
  tags: [python, wheel]
  description: >-
    requests 2.34.2 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
      sha256: "2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: certifi-cp313t
    - name: charset-normalizer-cp313t
    - name: idna-cp313t
    - name: urllib3-cp313t
  runtime:
    - name: python313t
    - name: certifi-cp313t
    - name: charset-normalizer-cp313t
    - name: idna-cp313t
    - name: urllib3-cp313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/requests/
    - lib/python3.13t/site-packages/*.dist-info/
