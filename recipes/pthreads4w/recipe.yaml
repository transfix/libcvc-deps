schema_version: 1
recipe:
  name: pthreads4w
  upstream_version: "3.0.0"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "pthreads4w — a POSIX Threads library for Windows, providing pthreads API on Win32/Win64."
  homepage: https://sourceforge.net/projects/pthreads4w/
  license: Apache-2.0
  tags: [concurrency]

source:
  # Upstream pthreads4w is only distributed as a .zip on SourceForge and
  # the project has been effectively unmaintained since 2018 (v3.0.0).
  # We vendor the pruned source tree here so builds are reproducible and
  # do not depend on SourceForge availability or on zip extractor support
  # in the cvcpkg fetcher.
  type: vendored
  path: third-party/pthreads4w

patches: []

depends:
  build: []
  host_tools: []

build:
  matrix:
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/pthreadV*.lib
    - lib/libpthreadV*.lib
    - bin/pthreadV*.dll
    - include/pthread.h
    - include/sched.h
    - include/semaphore.h
    - include/_ptw32.h
  cmake_packages:
    - { name: Threads, targets: ["Threads::Threads"] }

abi:
  cxx_std: 17
