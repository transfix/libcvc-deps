schema_version: 1
recipe:
  name: openssh-win
  upstream_version: "10.0.0.0"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    OpenSSH for native Windows — built from source (PowerShell/openssh-portable,
    the Win32-OpenSSH port) with MSVC, linking cvcpkg's own OpenSSL + zlib
    recipes instead of the vcpkg-fetched crypto. Windows-only; POSIX platforms
    use the portable `openssh` recipe.
  homepage: https://github.com/PowerShell/openssh-portable
  license: SSH-OpenSSH
  tags: [networking, tools, crypto, windows]

source:
  # PowerShell/openssh-portable @ latestw_all HEAD (OpenSSH_for_Windows_10.0).
  # Pinned to a commit for reproducibility; bump commit + sha256 to update.
  type: tarball
  url: https://github.com/PowerShell/openssh-portable/archive/e98b11e5de035cbd0eecbddc95a87da42f14671f.tar.gz
  sha256: "d0bf8571d8be1ae0f4bbcbad874e48e934b2a8530e98566829979c0fc00868a6"
  strip_components: 1

patches: []

depends:
  build:
    # cvcpkg's own crypto/compression, staged into the build in place of the
    # vcpkg-fetched libraries (see build.ps1).
    - name: openssl
      version: "^3.0"
    - name: zlib
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
  host_tools: []

build:
  matrix:
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/ssh.exe
    - bin/scp.exe
    - bin/sftp.exe
    - bin/ssh-add.exe
    - bin/ssh-agent.exe
    - bin/ssh-keygen.exe
    - bin/ssh-keyscan.exe
    - bin/ssh-pkcs11-helper.exe
    - bin/ssh-shellhost.exe
    - bin/sshd.exe
    - bin/sshd-session.exe
    - bin/sshd-auth.exe
    - bin/sftp-server.exe
    - bin/libcrypto*.dll
    - etc/ssh/sshd_config.sample

notes:
  - title: "Built from source with cvcpkg's own OpenSSL + zlib"
    platforms: [windows]
    description: >-
      Unlike a prebuilt-binary stage, this compiles the Win32-OpenSSH port
      (Start-OpenSSHBuild, MSVC/msbuild) and links the openssl + zlib recipes
      from CVC_DEPS_PREFIX rather than the vcpkg-managed libraries the upstream
      build normally fetches. windows/x86_64 only.
  - title: "Experimental — validate on a Windows builder"
    description: >-
      The upstream Windows build system is tightly coupled to its vcpkg crypto
      layout; substituting our own OpenSSL is a first-pass wiring that may need
      iteration on a real Windows builder (lib naming: the solution wants
      libcrypto.lib and zs.lib; header/lib search paths). If a from-source
      build regresses, cvc_revision 1 staged the official prebuilt
      OpenSSH-Win64.zip instead.
