  upstream_version: "0.7.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/annotated-types/
  license: "MIT"
  tags: [python, wheel]
  description: >-
