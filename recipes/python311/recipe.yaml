schema_version: 1
recipe:
  name: python311
  upstream_version: "3.11.13"
  # Bumped 1 -> 2: fix extension-module RPATH so the stdlib C extensions find the
  # prefix's own shared libs. The +cvc.1 build shipped lib-dynload/*.so (incl.
  # _ssl/_hashlib) with RUNPATH reduced to bare $ORIGIN (lib-dynload/), missing the
  # ../.. hop to lib/, so a standalone interpreter loaded the SYSTEM libcrypto and
  # `import ssl` failed with "OPENSSL_x.y.z not found". Fixed in _common/build-python.sh
  # (per-file $ORIGIN-relative path to lib/). ABI-identical; a drop-in rebuild.
  # Bumped 2 -> 3: rebuild on the glibc-2.35 fleet.  The +cvc.2 artifact was
  # published from a manual off-fleet build (glibc 2.38) and would not run on the
  # fleet builders or on users with glibc < 2.38 (every python build failed at
  # `import` with "GLIBC_2.38 not found").  Content-identical to +cvc.2; only the
  # build host's glibc baseline differs.
  # Bumped 3 -> 4: scoped the readline/ncurses dependency edges to the Unix
  # platforms that actually consume them. build-python.sh passes
  # --with-readline=tkinter on every cross target (its own comment: "readline/
  # ncurses not available on wasm/wasi/cosmo") and the Windows build runs
  # PCbuild/build.bat, which links neither. Both were previously unscoped, so
  # this recipe advertised windows/wasm/wasi/cosmo while depending on packages
  # with no build there — claims that could never resolve.
  # Bumped 4 -> 5: scoped the libffi edge away from wasi. libffi's wasm
  # backend builds its call trampolines with EM_JS — it synthesises JavaScript
  # and patches the wasm table at runtime — so it needs an Emscripten JS engine
  # and cannot work on wasip1. CPython upstream ships its own WASI build without
  # _ctypes for the same reason. wasm keeps the dependency.
  # Bumped 6 -> 7: make the WINDOWS build actually work (it had never published).
  # build.ps1 used a non-existent `--experimental-instdir` build.bat flag and then
  # copied an `inst/` dir that was never produced. Rewrote it to build via
  # PCbuild\build.bat -e (CPython fetches its own externals) + PC\layout
  # --include-dev, which lays out the python.org-style tree find_package(Python3
  # Development.Embed) expects. Also scoped the libffi edge off windows (CPython
  # bundles its own, and libffi has no windows package) and added the windows
  # files to package.files.
  # Bumped 7 -> 8: ship Lib/site-packages/cvcpkg-dll-directories.pth on Windows.
  # Since Python 3.8 the loader ignores PATH for a .pyd's dependent DLLs (only the
  # module dir, system dirs, and os.add_dll_directory() dirs are searched), so a
  # downstream `import numpy` / `import pycvc` could not find the cvcpkg DLLs in
  # <prefix>\bin. The .pth registers <prefix>\bin at interpreter startup — the
  # Windows $ORIGIN analog, matching python312. Additive; unix builds unaffected.
  cvc_revision: 8
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.python.org/
  license: PSF-2.0
  tags: [language, runtime, scripting]
  description: >-
    CPython 3.11 — the reference Python implementation.  Ships libpython3.11,
    the python3.11 interpreter, and the full standard library including ssl,
    sqlite3, ctypes, bz2, lzma, readline, and curses modules.
    Security-support branch; recommended for codebases pinned to 3.11.x.

source:
  type: tarball
  url: https://www.python.org/ftp/python/3.11.13/Python-3.11.13.tar.xz
  sha256: "8fb5f9fbc7609fa822cb31549884575db7fd9657cbffb89510b5d7975963a83a"
  strip_components: 1

patches: []

depends:
  build:
    - name: patchelf
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd, wasm, cosmo]  # not windows: CPython fetches its own libffi via get_externals
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd, wasm, cosmo]  # not windows: CPython fetches its own libffi via get_externals
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CFLAGS: "-O2"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
      env:
        CFLAGS: "-O2"
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh
      env:
        CFLAGS: "-O2"

package:
  files:
    # Unix layout (bin/lib/include). Globs that match nothing on a given platform
    # are skipped, so the Windows entries below coexist in this one list.
    - bin/python3.11*
    - bin/pip3.11*
    - bin/idle3.11*
    - bin/pydoc3.11*
    - lib/libpython3.11*
    - lib/python3.11/
    - lib/pkgconfig/python-3.11*.pc
    - include/python3.11/
    # Windows layout (python.org / PC\layout tree at the prefix root): python.exe,
    # python3XX.dll, the stdlib (Lib/), extension modules (DLLs/), embed headers +
    # import lib (include/, libs/python3XX.lib), and pip (Scripts/). This is exactly
    # what find_package(Python3 Development.Embed) locates via Python3_ROOT_DIR.
    - python*.exe
    - python3*.dll
    - vcruntime*.dll
    - Lib/
    - DLLs/
    - include/
    - libs/
    - Scripts/
  cmake_packages:
    - { name: Python3, targets: ["Python3::Python", "Python3::Interpreter"] }

abi:
  cxx_std: 17

notes:
  - title: "Multiple Python versions coexist"
    platforms:
      [linux, macos, freebsd, openbsd, netbsd, windows, wasm, wasi, cosmo]
    description: >-
      python311, python312, and python313 install to versioned paths
      (bin/python3.11, lib/python3.11/, libpython3.11.so) and can be
      installed into the same prefix simultaneously without conflict.
      The bin/python3 and bin/python symlinks are "last-write wins"
      convenience aliases.
  - title: "Static builds on wasm/wasi/cosmo"
    platforms: [wasm, wasi, cosmo]
    description: >-
      Cross-compilation targets build libpython as a static archive
      (--disable-shared) since extension modules (.so) are uncommon.
      Readline is disabled (--with-readline=tkinter) because the
      ncurses/readline ecosystem is not available on these platforms.
