schema_version: 1
recipe:
  name: python311
  upstream_version: "3.11.13"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.python.org/
  license: PSF-2.0
  tags: [language, runtime, scripting]
  description: >-
    CPython 3.11 — the reference Python implementation.  Ships libpython3.11,
    the python3.11 interpreter, and the full standard library including ssl,
    sqlite3, ctypes, bz2, lzma, readline, and curses modules.
    Security-support branch; recommended for codebases pinned to 3.11.x.

source:
  type: tarball
  url: https://www.python.org/ftp/python/3.11.13/Python-3.11.13.tar.xz
  sha256: "8fb5f9fbc7609fa822cb31549884575db7fd9657cbffb89510b5d7975963a83a"
  strip_components: 1

patches: []

depends:
  build:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - bin/python3.11*
    - bin/python3
    - bin/python
    - bin/pip3.11*
    - bin/pip3
    - bin/pip
    - bin/idle3.11*
    - bin/pydoc3.11*
    - lib/libpython3.11*
    - lib/python3.11/
    - lib/pkgconfig/python-3.11*.pc
    - include/python3.11/
  cmake_packages:
    - { name: Python3, targets: ["Python3::Python", "Python3::Interpreter"] }

abi:
  cxx_std: 17

notes:
  - title: "Multiple Python versions coexist"
    platforms: [linux, macos, freebsd]
    description: >-
      python311, python312, and python313 install to versioned paths
      (bin/python3.11, lib/python3.11/, libpython3.11.so) and can be
      installed into the same prefix simultaneously without conflict.
      The bin/python3 and bin/python symlinks are "last-write wins"
      convenience aliases.
