schema_version: 1
recipe:
  name: meson-python-cp311
  upstream_version: "0.18.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/meson-python/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    meson-python 0.18.0 (noarch py3-none-any) for the python311 interpreter — a
    BUILD-TIME backend for cvcpkg from-source Python packages (numpy, h5py).
    Declared as a depends.build edge, so it lands in the build prefix and is
    stripped from the deliverable; never shipped to users.

# Pure-Python noarch wheel: one platform-independent artifact, but tied to the
# python311 interpreter (installs into ITS site-packages, where --no-build-
# isolation backends must be importable). The -cp311 suffix names that target.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/28/58/66db620a8a7ccb32633de9f403fe49f1b63c68ca94e5c340ec5cceeb9821/meson_python-0.18.0-py3-none-any.whl
      sha256: "3b0fe051551cc238f5febb873247c0949cd60ded556efa130aa57021804868e2"

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
    - name: packaging-cp311
    - name: pyproject-metadata-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/mesonpy/
    - lib/python3.11*/site-packages/meson_python-*.dist-info/
