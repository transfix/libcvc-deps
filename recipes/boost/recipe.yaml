schema_version: 1
recipe:
  name: boost
  upstream_version: "1.86.0"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Boost C++ Libraries — portable, peer-reviewed C++ source libraries for general-purpose programming."
  homepage: https://www.boost.org/
  license: BSL-1.0
  tags: [utils, wasm]

source:
  type: tarball
  url: https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-cmake.tar.gz
  sha256: "c62ce6e64d34414864fef946363db91cea89c1b90360eabed0515f0eda74c75c"
  strip_components: 1

patches:
  - netbsd-dirfd-macro.patch
  - netbsd-exit-code-constexpr.patch

depends:
  build: []
  runtime:
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libboost*
    - lib/boost*
    - lib/cmake/Boost*/
    - lib/cmake/boost*/
    - include/boost/
  cmake_packages:
    - { name: Boost, targets: ["Boost::boost"] }

abi:
  cxx_std: 17

notes:
  - title: "Wasm-excluded libraries"
    platforms: [wasm]
    description: >-
      The following Boost libraries are excluded on wasm because they
      depend on native assembly (x86/ARM context switching) or OS-specific
      facilities not available in Emscripten: context, coroutine, fiber,
      stacktrace, asio, cobalt, log, process, and beast.  Additionally,
      BOOST_HAS_PTHREADS is defined to force Boost.Container to use
      pthread mutex stubs (which Emscripten provides as no-ops in
      single-threaded mode) rather than the Windows CriticalSection path.
