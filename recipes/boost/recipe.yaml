schema_version: 1
recipe:
  name: boost
  upstream_version: "1.86.0"
  # Added wasi entries (build-wasi.sh / .ps1).  `cgal` already declares
  # platform: wasi on both hosts and runtime-depends on boost, so the wasi
  # half of cgal's matrix was unbuildable.  See the wasi note below for the
  # libraries the single-threaded wasip1 target forces us to exclude.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Boost C++ Libraries — portable, peer-reviewed C++ source libraries for general-purpose programming."
  homepage: https://www.boost.org/
  license: BSL-1.0
  tags: [utils, wasm]

source:
  type: tarball
  url: https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-cmake.tar.gz
  sha256: "c62ce6e64d34414864fef946363db91cea89c1b90360eabed0515f0eda74c75c"
  strip_components: 1

patches:
  - netbsd-dirfd-macro.patch
  - netbsd-exit-code-constexpr.patch

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1

package:
  files:
    - lib/libboost*
    - lib/boost*
    - lib/cmake/Boost*/
    - lib/cmake/boost*/
    - include/boost/
  cmake_packages:
    - { name: Boost, targets: ["Boost::boost"] }

abi:
  cxx_std: 17

notes:
  - title: "Wasm-excluded libraries"
    platforms: [wasm]
    description: >-
      The following Boost libraries are excluded on wasm because they
      depend on native assembly (x86/ARM context switching) or OS-specific
      facilities not available in Emscripten: context, coroutine, fiber,
      stacktrace, asio, cobalt, log, process, and beast.  Additionally,
      BOOST_HAS_PTHREADS is defined to force Boost.Container to use
      pthread mutex stubs (which Emscripten provides as no-ops in
      single-threaded mode) rather than the Windows CriticalSection path.
  - title: "Wasi-excluded libraries"
    platforms: [wasi]
    description: >-
      wasm32-wasip1 is single-threaded and has no signal handlers, no
      process control, no BSD sockets and no dynamic loading, so the wasi
      build excludes everything the wasm build excludes plus thread,
      contract, test, locale, wave and filesystem.  BOOST_HAS_PTHREADS is
      deliberately NOT defined here: unlike Emscripten, wasi-libc's
      pthread_create fails at runtime on wasip1, so Boost is left to pick
      its single-threaded code paths.  Boost.Filesystem is dropped because
      wasip1 resolves every path relative to a preopened directory, which
      does not match the absolute-path semantics the library assumes.
      CGAL — the only cvcpkg consumer of boost on wasi — uses Boost
      header-only (graph, property_map, variant, multiprecision).
