schema_version: 1
recipe:
  name: vtk
  upstream_version: "9.5.0"
  # Bumped 1 -> 2: consume the hermetic X11 + OpenGL(GLVND)/GLU recipes on Linux
  # instead of system libs (find_package(X11)/OpenGL now resolve to the cvcpkg
  # prefix). Lets libcvc's publish-cvcpkg.yml drop its apt-get X11/GL line.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "VTK — the Visualization Toolkit, an open-source system for 3D computer graphics, image processing, and visualization."
  homepage: https://vtk.org/
  license: BSD-3-Clause
  tags: [graphics, wasm]

source:
  type: tarball
  url: https://www.vtk.org/files/release/9.5/VTK-9.5.0.tar.gz
  sha256: "04ae86246b9557c6b61afbc534a6df099244fbc8f3937f82e6bc0570953af87d"
  strip_components: 1

patches:
  - vtk-fmt-cstdlib-wasm.patch

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: qt6
      version: ">=6.7"
    - name: hdf5
      version: "^1.14"
    - name: tiff
      version: "^4.6"
    - name: zlib
      version: "^1.3"
    # Hermetic X11 + OpenGL (Linux only; macOS/Windows use native windowing/GL).
    # VTK's X11 render window + RenderingOpenGL2 link these instead of system libs.
    - name: libx11
      platforms: [linux]
    - name: libxext
      platforms: [linux]
    - name: libxt
      platforms: [linux]
    - name: libglvnd
      platforms: [linux]
    - name: glu
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libvtk*
    - lib/vtk*
    - lib/cmake/vtk*/
    - include/vtk*/
    - bin/vtk*
    - share/vtk*/
    - share/licenses/VTK/
  cmake_packages:
    - { name: VTK, targets: ["VTK::CommonCore", "VTK::RenderingCore"] }

abi:
  cxx_std: 17
