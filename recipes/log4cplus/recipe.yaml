schema_version: 1
recipe:
  name: log4cplus
  upstream_version: "2.1.2"
  # Bumped 4 -> 5: all four linux +cvc.4 variants reference GLIBC_2.38 and so
  # fail to load on the 2.35 fleet floor (2026-08-03 catalog audit). Nothing in
  # this recipe is wrong — it needs a rebuild on a correct builder. Published
  # variants are immutable, so republishing at the same revision silently
  # no-ops; the bump is what actually retires the bad bytes. pack_recipe now
  # verifies the floor (#432), so this cannot recur silently.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "log4cplus — a simple-to-use C++ logging library modeled after Java's log4j."
  homepage: https://log4cplus.sourceforge.io/
  license: Apache-2.0
  tags: [utils, wasm, wasi]

source:
  type: tarball
  url: https://github.com/log4cplus/log4cplus/releases/download/REL_2_1_2/log4cplus-2.1.2.tar.gz
  sha256: "e2673815ea34886f29b2213fff19cc1a6707a7e65099927a19ea49b4eb018822"
  strip_components: 1

patches: []

depends:
  runtime: []
  build:
    - cmake
    - ninja
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/liblog4cplus*
    - lib/log4cplus*
    - lib/cmake/log4cplus/
    - lib/pkgconfig/log4cplus*
    - include/log4cplus/
  cmake_packages:
    - { name: log4cplus, targets: ["log4cplus::log4cplus"] }

abi:
  cxx_std: 17
