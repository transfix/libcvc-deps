schema_version: 1
recipe:
  name: log4cplus
  upstream_version: "2.1.2"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "cvcpkg@cyberpcangel.com"
  maintainer_url: "https://cyberpcangel.com"
  description: "log4cplus — a simple-to-use C++ logging library modeled after Java's log4j."
  homepage: https://log4cplus.sourceforge.io/
  license: Apache-2.0
  tags: [utils, wasm]

source:
  type: tarball
  url: https://github.com/log4cplus/log4cplus/releases/download/REL_2_1_2/log4cplus-2.1.2.tar.gz
  sha256: "e2673815ea34886f29b2213fff19cc1a6707a7e65099927a19ea49b4eb018822"
  strip_components: 1

patches: []

depends:
  build: 
    - name: emsdk
      version: ">=5.0"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1
      vcpkg_port: log4cplus
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/liblog4cplus*
    - lib/log4cplus*
    - lib/cmake/log4cplus/
    - lib/pkgconfig/log4cplus*
    - include/log4cplus/
  cmake_packages:
    - { name: log4cplus, targets: ["log4cplus::log4cplus"] }

abi:
  cxx_std: 17
