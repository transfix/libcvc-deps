schema_version: 1
recipe:
  name: pydantic-cp311
  upstream_version: "2.13.4"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pydantic/
  license: "MIT"
  tags: [python, source]
  description: >-
    pydantic 2.13.4 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/18/a5/b60d21ac674192f8ab0ba4e9fd860690f9b4a6e51ca5df118733b487d8d6/pydantic-2.13.4.tar.gz
  sha256: "c40756b57adaa8b1efeeced5c196f3f3b7c435f90e84ea7f443901bec8099ef6"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: annotated-types-cp311
    - name: pydantic-core-cp311
    - name: typing-extensions-cp311
    - name: typing-inspection-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp311
    - name: hatch-fancy-pypi-readme-cp311
  runtime:
    - name: python311
    - name: annotated-types-cp311
    - name: pydantic-core-cp311
    - name: typing-extensions-cp311
    - name: typing-inspection-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/pydantic/
    - lib/python3.11/site-packages/*.dist-info/
    - Lib/site-packages/pydantic/
    - Lib/site-packages/*.dist-info/
