schema_version: 1
recipe:
  name: setuptools-rust-cp312
  upstream_version: "1.13.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/setuptools-rust/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    setuptools_rust 1.13.0 for CPython 3.12 — the cp312 column of cvcpkg's
    per-interpreter wheel matrix, BUILT FROM SOURCE from the PyPI sdist.
    The setuptools plugin that teaches build_ext to drive cargo. Two consumers in
    this graph: maturin's own bootstrap build (setup.py uses RustBin) and bcrypt,
    whose pyproject declares its extension through
    [[tool.setuptools-rust.ext-modules]]. Pure Python itself — it shells out to
    the cargo supplied by the `rust` recipe.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh builds it there with pip + the PEP-517 backend already
# present in the build prefix. The sha256 was recomputed from the downloaded
# tarball and matches upstream's own sdist digest in the PyPI JSON API.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/68/ba/b31781d61bf9ee3c232a1d1160db11c11cdeae1d44e06c90723b25a8279f/setuptools_rust-1.13.0.tar.gz
  sha256: "f2afcf4baeee689910ce49cfa8aad4e08cce72f417449bcc32891b8664fdc726"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.12 and the wheel lands in ITS site-packages.
python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    # The interpreter this pure-Python package installs under.
    - name: python312
    # PEP-517 backend (`setuptools>=62.4`, build-backend setuptools.build_meta).
    - name: setuptools-cp312
    # Named in `[build-system] requires`. pip checks declared build
    # requirements even under --no-build-isolation, so it must be importable
    # even though this sdist pins its version statically.
    - name: setuptools-scm-cp312
    # Same reason as the setuptools-scm column: keep the declared build
    # requirement importable rather than betting on setuptools' bundled copy.
    - name: wheel-cp312
  runtime:
    # The interpreter.
    - name: python312
    # Declared runtime dependency (`setuptools>=62.4`) — it IS a setuptools
    # plugin.
    - name: setuptools-cp312
    # Declared runtime dependency (`semantic_version>=2.8.2,<3`), imported at
    # module scope by extension.py and rustc_info.py.
    - name: semantic-version-cp312
  host_tools:
    # Must run on the BUILDER: the interpreter drives pip and the PEP-517
    # backend. Nothing native is involved — this package compiles nothing.
    - python312

build:
  # Pure Python: no compiled artifact, so nothing varies with cvcpkg's
  # Release/Debug build type.
  build_type_independent: true
  # `platform: any` — the wheel this produces is py3-none-any, valid on every
  # platform cvcpkg targets, so the recipe is built once and published noarch,
  # exactly like the other pure-Python columns (setuptools, packaging, wheel).
  # That also means there is no build.ps1: one build.sh serves the single job.
  matrix:
    - platform: any
      script: build.sh

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.12/site-packages/setuptools_rust/
    - lib/python3.12/site-packages/setuptools_rust-*.dist-info/
    # Windows (Lib\site-packages) scheme, for a prefix staged on that host.
    - Lib/site-packages/setuptools_rust/
    - Lib/site-packages/setuptools_rust-*.dist-info/
