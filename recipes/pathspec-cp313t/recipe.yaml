schema_version: 1
recipe:
  name: pathspec-cp313t
  upstream_version: "1.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pathspec/
  license: "MPL-2.0"
  tags: [python, wheel]
  description: >-
    pathspec 1.1.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
      sha256: "a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
  runtime:
    - name: python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/pathspec/
    - lib/python3.13t/site-packages/pathspec-*.dist-info/
