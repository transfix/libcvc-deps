schema_version: 1

recipe:
  name: pillow-cp311
  upstream_version: "11.1.0"
  # Bumped 2 -> 3: source.type tarball (hand-crafted from-source build linking
  # cvcpkg's own zlib/libjpeg-turbo/tiff/freetype/libwebp) -> python_wheel
  # (pinned prebuilt PyPI wheels). The from-source build cannot produce a
  # Windows column (the codec libraries + their discovery are not wired for
  # windows-2022), so matplotlib-cp311's Windows closure was unbuildable. The
  # official PyPI manylinux/win_amd64 wheels are auditwheel-vendored: every
  # codec (zlib/jpeg/tiff/freetype/webp) is bundled in pillow.libs/, so codec
  # support is guaranteed (the build.sh check asserts PNG + JPEG) without the
  # per-feature hermetic link. Trades the from-source model for prebuilt wheels
  # on this dep, like torch-cp311 + contourpy-cp311.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pillow/
  license: "MIT-CMU"
  tags: [python, wheel, imaging]
  description: >-
    Pillow 11.1.0 for CPython 3.11 (cp311): the pinned prebuilt PyPI wheels
    (manylinux_2_17 x86_64 + win_amd64), sha256-verified and installed into the
    python311 interpreter's site-packages. The wheels are auditwheel-vendored,
    so every codec the grl-snam imaging path needs (zlib/jpeg/tiff/freetype/webp)
    ships in pillow.libs/; the build check asserts PNG + JPEG support. Switched
    off the from-source build so the Windows column publishes. Prebuilt-wheel
    model, like torch-cp311.

source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/e4/c2/e25199e7e4e71d64eeb869f5b72c7ddec70e0a87926398785ab944d92375/pillow-11.1.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
      sha256: "f189805c8be5ca5add39e6f899e6ce2ed824e65fb45f3c28cb2841911da19070"
    windows-x86_64:
      url: https://files.pythonhosted.org/packages/3a/c6/fce9255272bcf0c39e15abd2f8fd8429a954cf344469eaceb9d0d1366913/pillow-11.1.0-cp311-cp311-win_amd64.whl
      sha256: "fbd43429d0d7ed6533b25fc993861b8fd512c42d04514a0dd6337fb3ccf22761"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_17

patches: []

depends:
  build:
    - name: python311
  runtime:
    # The prebuilt wheel vendors its codec libraries in pillow.libs/ (auditwheel),
    # so no external zlib/libjpeg/tiff/freetype/webp edges are needed.
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/PIL/
    - lib/python3.11/site-packages/pillow.libs/
    - lib/python3.11/site-packages/pillow-*.dist-info/
    - Lib/site-packages/PIL/
    - Lib/site-packages/pillow-*.dist-info/
