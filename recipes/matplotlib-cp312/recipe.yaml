schema_version: 1
recipe:
  name: matplotlib-cp312
  upstream_version: "3.10.0"
  # Bumped 4 -> 5: dropped the pybind11 discovery shim.  meson's
  # config-tool probe now finds bin/pybind11-config on its own (relocatable
  # console-script shebangs, pybind11 2.13.6+cvc.3), so hand-feeding it the
  # .pc dir and the header dir via CXXFLAGS is dead weight.  The hermetic
  # freetype/qhull wiring and the Agg render check are unchanged.
  cvc_revision: 5

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/matplotlib/
  license: "PSF-2.0"
  tags: [python, source]
  description: >-
    matplotlib 3.10.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp312 from the PyPI sdist).
    HAND-CONVERTED: builds against cvcpkg's OWN freetype and qhull
    (-Dsystem-freetype/-Dsystem-qhull — the default meson wraps DOWNLOAD
    both, impossible offline and hermetic nowhere), stamps an $ORIGIN
    RUNPATH, and verifies an actual Agg PNG render.  pybind11 needs no
    help: meson's pybind11-config probe resolves it off PATH.  See build.sh.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/68/dd/fa2e1a45fce2d09f4aea3cee169760e672c8262325aa5796c49d543dc7e6/matplotlib-3.10.0.tar.gz
  sha256: "b886d02a581b96704c9d1ffe55709e49b4d2d52709ccebc4be42db856e511278"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    # Native feature libraries (see build.sh): freetype + qhull are what
    # -Dsystem-freetype/-Dsystem-qhull link; zlib/libpng/bzip2 are
    # freetype's flat closure (cvcpkg staging is flat).
    - name: freetype
    - name: qhull
    - name: zlib
    - name: libpng
    - name: bzip2
    - name: contourpy-cp312
    - name: cycler-cp312
    - name: fonttools-cp312
    - name: kiwisolver-cp312
    - name: numpy-cp312
    - name: packaging-cp312
    - name: pillow-cp312
    - name: pyparsing-cp312
    - name: python-dateutil-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: meson-python-cp312
    - name: pybind11-cp312
    - name: setuptools-scm-cp312
  runtime:
    - name: python312
    - name: freetype
    - name: qhull
    - name: zlib
    - name: libpng
    - name: bzip2
    - name: contourpy-cp312
    - name: cycler-cp312
    - name: fonttools-cp312
    - name: kiwisolver-cp312
    - name: numpy-cp312
    - name: packaging-cp312
    - name: pillow-cp312
    - name: pyparsing-cp312
    - name: python-dateutil-cp312
  host_tools:
    - python312
    - pkg-config
    - patchelf

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.12/site-packages/matplotlib/
    - lib/python3.12/site-packages/mpl_toolkits/
    - lib/python3.12/site-packages/pylab.py
    - lib/python3.12/site-packages/matplotlib-*.dist-info/
    - Lib/site-packages/matplotlib/
    - Lib/site-packages/*.dist-info/
