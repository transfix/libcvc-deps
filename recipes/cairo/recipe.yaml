schema_version: 1
recipe:
  name: cairo
  upstream_version: "1.18.2"
  # cvc.2: add the windows build (build.ps1, Meson + MSVC) and the MSVC
  # artifact patterns.  +cvc.1 was POSIX-only, which made gtk4's
  # `platform: windows` matrix entry a phantom claim — the closure validator
  # flagged cairo as having no windows build.  The packaged file set changes
  # (import libs in lib/, runtime DLLs in bin/), so this needs a revision
  # rather than a silent republish at the same one.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://cairographics.org/
  license: LGPL-2.1-only
  tags: [libraries]
  description: >-
    Cairo — a 2D graphics library with support for multiple output
    devices (X Window, Win32, image buffers, PDF, SVG).  Required
    by Pango and GTK 4.

source:
  type: tarball
  url: https://cairographics.org/releases/cairo-1.18.2.tar.xz
  sha256: "a62b9bb42425e844cc3d6ddde043ff39dbabedd1542eba57a2eb79f85889d45a"
  strip_components: 1

patches: []

depends:
  build:
    - ninja
    - meson
    - pkg-config
  runtime:
    - name: pixman
      version: "^0.44"
    - name: freetype
      version: "^2.13"
    - name: fontconfig
      version: "^2.15"
    - name: glib
      version: "^2.80"
    - name: libpng
      version: "^1.6"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # Unix shared/static artifacts (.so / .so.N / .dylib / .a).
    - lib/libcairo*
    - lib/pkgconfig/cairo*.pc
    - include/cairo/
    # Windows (MSVC): meson drops the "lib" prefix, installs import
    # libraries under lib/ and the versioned runtime DLLs under bin/
    # (cairo.lib + cairo-2.dll, and the same for cairo-gobject and
    # cairo-script-interpreter).
    - lib/cairo*.lib
    - bin/cairo*.dll
  pkg_config:
    - cairo
    - cairo-gobject
    - cairo-png
    - cairo-ft
    - cairo-pdf
    - cairo-svg
    # Windows-only backends, enabled automatically by upstream's host check.
    - cairo-win32
    - cairo-win32-font

abi:
  cxx_std: 17
