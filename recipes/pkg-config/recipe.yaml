schema_version: 1
recipe:
  name: pkg-config
  # Provided by pkgconf (the maintained pkg-config implementation) rather than
  # freedesktop pkg-config 0.29.2. 0.29.2 bundles an ancient glib whose sources
  # (gatomic.c int->pointer conversions) and libtool (`-print-multi-os-directory`)
  # don't build under Xcode 26.5 / clang 21. pkgconf is standalone C with no glib
  # and builds cleanly on modern toolchains. It's argument-compatible and ships
  # pkg.m4; we install both `pkgconf` and a `pkg-config` name. No recipe pins a
  # pkg-config version, so the 0.29.2 -> 3.0.4 jump is safe.
  upstream_version: "3.0.4"
  # Bumped 1 -> 2: the windows build is Meson + MSVC, not autotools under
  # MSYS2/MinGW64. Git for Windows ships bash but no C compiler, so the old
  # path failed "C compiler cannot create executables" and the recipe
  # advertised a windows build it could never produce.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/pkgconf/pkgconf
  license: ISC
  tags: [tools, build-system]
  description: >-
    pkg-config (provided by pkgconf) — helper tool for querying installed
    library compile and link flags.  Required as a host tool by autotools- and
    Meson-based recipes that use PKG_CHECK_MODULES.  Installed as both
    ``pkgconf`` and a ``pkg-config`` compatibility name.

source:
  type: tarball
  url: https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.4/pkgconf-3.0.4.tar.xz
  sha256: "91ce346b47f46b87d680c6928e6c43240b9cdc7a31afbea19f2298de4dbe266d"
  strip_components: 1

patches: []

depends:
  # pkgconf is standalone C — no external deps (unlike 0.29.2's bundled glib,
  # which linked libiconv on OpenBSD).
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/pkg-config*
    - bin/pkgconf*
    - share/aclocal/pkg.m4
