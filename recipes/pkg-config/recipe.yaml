schema_version: 1
recipe:
  name: pkg-config
  upstream_version: "0.29.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.freedesktop.org/wiki/Software/pkg-config/
  license: GPL-2.0-or-later
  tags: [tools, build-system]
  description: >-
    pkg-config — helper tool for querying installed library compile
    and link flags.  Required as a host tool by autotools- and
    Meson-based recipes that use PKG_CHECK_MODULES or
    --pkg-config-path.  Built with --with-internal-glib so it has
    no external dependencies.

source:
  type: tarball
  url: https://pkgconfig.freedesktop.org/releases/pkg-config-0.29.2.tar.gz
  sha256: "6fc69c01688c9458a57eb9a1664c9aba372ccda420a02bf4429fe610e7e7d591"
  strip_components: 1

patches: []

depends:
  build:
    # OpenBSD has no iconv in libc; the bundled internal glib needs GNU libiconv.
    - name: iconv
      version: ">=1.17"
      platforms: [openbsd]
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/pkg-config*
    - share/aclocal/pkg.m4
