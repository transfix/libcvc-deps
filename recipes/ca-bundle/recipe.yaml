schema_version: 1
recipe:
  name: ca-bundle
  upstream_version: "2026.05.14"
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://curl.se/docs/caextract.html
  license: MPL-2.0
  tags: [networking, crypto, security]
  description: >-
    Mozilla CA certificate bundle — the same root CA set used by Firefox,
    extracted from Mozilla's NSS certdata.txt and maintained by the curl
    project.  Installs cert.pem into etc/ssl/ inside the cvcpkg prefix so
    that tools loading cvcpkg OpenSSL via LD_LIBRARY_PATH in minimal/
    container environments (no system /etc/ssl) can verify TLS certificates
    by setting SSL_CERT_FILE.
    Updated per Mozilla's CA schedule (~4-6 times per year).

source:
  # Build script handles the download; prebuilt means cvcpkg does not
  # attempt to extract this URL as a tarball.
  type: prebuilt
  url: https://curl.se/ca/cacert-2026-05-14.pem

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    # noarch: the payload is a PEM file and a POSIX shell hook, identical on
    # every platform.  Built once, installed everywhere.  There is nothing to
    # compile, so there is no reason for this to be a per-platform recipe --
    # and a per-platform matrix meant the Windows path needed a whole separate
    # build.ps1 that shipped broken for a year without anyone noticing.
    - platform: any
      script: build.sh

package:
  files:
    - etc/ssl/cert.pem
    - share/ca-bundle/

notes:
  - title: "Usage: hermetic / container environments"
    platforms: [any]
    description: >-
      After installing ca-bundle into your cvcpkg prefix, point OpenSSL
      (and tools like curl, Python, git) at the bundled certs by exporting:

        export SSL_CERT_FILE="${CVC_DEPS_PREFIX}/etc/ssl/cert.pem"

      This overrides OpenSSL's compiled-in openssldir path (/etc/ssl) at
      runtime — no recompilation needed.  A convenience env hook is
      installed at share/ca-bundle/env.sh that you can source directly.

      This package deliberately ships only the single-file bundle, not an
      SSL_CERT_DIR directory.  SSL_CERT_DIR uses OpenSSL's hashed-directory
      lookup (X509_LOOKUP_hash_dir), which finds a certificate only by
      opening <dir>/<subject-hash>.<seq> — e.g. 3513523f.0.  Populating such
      a directory correctly requires c_rehash behaviour
      (`openssl x509 -subject_hash`), i.e. an openssl binary at build time,
      which would make this zero-dependency data package depend on building
      openssl (plus perl and nasm) first.  SSL_CERT_FILE loads the entire
      root set in one read and fully covers the use case, so the directory
      buys nothing.  Do not re-add a certs/ directory with numbered or
      otherwise non-hashed filenames: OpenSSL silently never reads them, so
      it looks like it works while verification actually falls back to
      whatever else is configured.
  - title: "Update cadence"
    platforms: [any]
    description: >-
      Mozilla updates its CA set approximately 4-6 times per year.
      When a new cacert.pem is published at https://curl.se/ca/cacert.pem
      bump upstream_version (YYYY.MM.DD), update the URL and sha256 in
      build.sh, and publish a new cvc_revision.  This is a noarch package,
      so that is one build for every platform rather than six.
