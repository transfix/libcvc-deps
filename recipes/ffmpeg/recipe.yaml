schema_version: 1
recipe:
  name: ffmpeg
  upstream_version: "7.1.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://ffmpeg.org/
  license: GPL-2.0-or-later
  tags: [multimedia]
  description: >-
    FFmpeg — a complete, cross-platform solution to record, convert and
    stream audio and video.  Ships the libavformat, libavcodec,
    libavutil, libavfilter, libavdevice, libswscale and libswresample
    shared libraries.  Built with --enable-gpl and a broad external
    codec set: H.264 (x264), H.265/HEVC (x265), Opus, MP3, Vorbis,
    VP8/VP9 (libvpx), AV1 (dav1d), WebP, JPEG, PNG, OpenSSL,
    bzip2/lzma, freetype/fontconfig/fribidi, and PulseAudio on Linux.
    Pared-down static builds are also provided for wasm, wasi, and cosmo.

source:
  type: tarball
  url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
  sha256: "089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304"
  strip_components: 1

patches: []

depends:
  build:
    - name: nasm
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: x264
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: x265
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libopus
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libmp3lame
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libogg
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvorbis
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: dav1d
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvpx
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libwebp
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libjpeg-turbo
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpng
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: freetype
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: fontconfig
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: fribidi
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: openssl
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: bzip2
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: xz
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: zlib
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpulse
      platforms: [linux]
    - pkg-config
  runtime:
    - name: x264
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: x265
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libopus
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libmp3lame
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libogg
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvorbis
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: dav1d
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvpx
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libwebp
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libjpeg-turbo
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpng
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: freetype
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: fontconfig
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: fribidi
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: openssl
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: bzip2
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: xz
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: zlib
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpulse
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # Unix shared libs (.so / .dylib)
    - lib/libavformat*
    - lib/libavcodec*
    - lib/libavutil*
    - lib/libavfilter*
    - lib/libavdevice*
    - lib/libswscale*
    - lib/libswresample*
    - lib/pkgconfig/libav*
    - lib/pkgconfig/libsw*
    # Windows DLLs and import libs
    - bin/avformat-*.dll
    - bin/avcodec-*.dll
    - bin/avutil-*.dll
    - bin/avfilter-*.dll
    - bin/avdevice-*.dll
    - bin/swscale-*.dll
    - bin/swresample-*.dll
    - lib/avformat.lib
    - lib/avcodec.lib
    - lib/avutil.lib
    - lib/avfilter.lib
    - lib/avdevice.lib
    - lib/swscale.lib
    - lib/swresample.lib
    # Headers (shared)
    - include/libavformat/
    - include/libavcodec/
    - include/libavutil/
    - include/libavfilter/
    - include/libavdevice/
    - include/libswscale/
    - include/libswresample/
  pkg_config:
    - libavformat
    - libavcodec
    - libavutil
    - libavfilter
    - libavdevice
    - libswscale
    - libswresample

abi:
  cxx_std: 17
