schema_version: 1
recipe:
  name: ffmpeg
  upstream_version: "7.1.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://ffmpeg.org/
  license: LGPL-2.1-or-later
  tags: [multimedia]
  description: >-
    FFmpeg — a complete, cross-platform solution to record, convert and
    stream audio and video.  Ships the libavformat, libavcodec,
    libavutil, libavfilter, libavdevice, libswscale and libswresample
    shared libraries.  Built as LGPL with a broad set of external
    codecs and libraries: Opus (libopus), MP3 (libmp3lame), Vorbis
    (libvorbis), VP8/VP9 (libvpx), AV1 (dav1d), WebP (libwebp), JPEG
    (libjpeg-turbo), PNG, OpenSSL for HTTPS, bzip2/lzma compression,
    freetype/fontconfig/fribidi for subtitle rendering, and PulseAudio
    on Linux.

source:
  type: tarball
  url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
  sha256: "089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304"
  strip_components: 1

patches: []

depends:
  build:
    - name: nasm
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libopus
    - name: libmp3lame
    - name: libogg
    - name: libvorbis
    - name: dav1d
    - name: libvpx
    - name: libwebp
    - name: libjpeg-turbo
    - name: libpng
    - name: freetype
    - name: fontconfig
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: fribidi
    - name: openssl
    - name: bzip2
    - name: xz
    - name: zlib
    - name: libpulse
      platforms: [linux]
  runtime:
    - name: libopus
    - name: libmp3lame
    - name: libogg
    - name: libvorbis
    - name: dav1d
    - name: libvpx
    - name: libwebp
    - name: libjpeg-turbo
    - name: libpng
    - name: freetype
    - name: fontconfig
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: fribidi
    - name: openssl
    - name: bzip2
    - name: xz
    - name: zlib
    - name: libpulse
      platforms: [linux]
  host_tools:
    - pkg-config

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # Unix shared libs (.so / .dylib)
    - lib/libavformat*
    - lib/libavcodec*
    - lib/libavutil*
    - lib/libavfilter*
    - lib/libavdevice*
    - lib/libswscale*
    - lib/libswresample*
    - lib/pkgconfig/libav*
    - lib/pkgconfig/libsw*
    # Windows DLLs and import libs
    - bin/avformat-*.dll
    - bin/avcodec-*.dll
    - bin/avutil-*.dll
    - bin/avfilter-*.dll
    - bin/avdevice-*.dll
    - bin/swscale-*.dll
    - bin/swresample-*.dll
    - lib/avformat.lib
    - lib/avcodec.lib
    - lib/avutil.lib
    - lib/avfilter.lib
    - lib/avdevice.lib
    - lib/swscale.lib
    - lib/swresample.lib
    # Headers (shared)
    - include/libavformat/
    - include/libavcodec/
    - include/libavutil/
    - include/libavfilter/
    - include/libavdevice/
    - include/libswscale/
    - include/libswresample/
  pkg_config:
    - libavformat
    - libavcodec
    - libavutil
    - libavfilter
    - libavdevice
    - libswscale
    - libswresample

abi:
  cxx_std: 17
