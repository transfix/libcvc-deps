schema_version: 1
recipe:
  name: yaml-cpp
  upstream_version: "0.8.0"
  # Bumped 1 -> 2: added the BSD builds. yaml-cpp is a plain CMake C++ library
  # with no platform-specific code and is packaged by all three BSDs; the
  # linux+macos scoping was an oversight rather than a portability limit.
  #
  # Bumped 2 -> 3: added wasm/wasi/cosmo.  Same argument carried to the cross
  # targets — parsing YAML is pure computation over a std::istream, with no
  # threads, sockets, dlopen or fork, and the library never opens a file itself.
  # It does throw, which is the one thing worth checking on wasip1; libgeos and
  # libspatialindex, both exception-driven C++, already build at that target.
  # The cross scripts must pass YAML_BUILD_SHARED_LIBS=OFF: build.sh forces it
  # ON, and all three cross targets are static-only.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "yaml-cpp — a YAML parser and emitter for C++ (jbeder/yaml-cpp). Used by volrover3 for ~/.volrover/settings.yaml."
  homepage: https://github.com/jbeder/yaml-cpp
  license: MIT
  tags: [utils, cpp, yaml, wasm, wasi]

source:
  type: tarball
  url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz
  sha256: "fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libyaml-cpp*
    - lib/cmake/yaml-cpp/
    - lib/pkgconfig/yaml-cpp*
    - include/yaml-cpp/
  cmake_packages:
    - { name: yaml-cpp, targets: ["yaml-cpp::yaml-cpp"] }

abi:
  cxx_std: 17
