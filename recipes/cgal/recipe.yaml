schema_version: 1
recipe:
  name: cgal
  upstream_version: "6.0.1"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "cvcpkg@cyberpcangel.com"
  maintainer_url: "https://cyberpcangel.com"
  description: "CGAL — the Computational Geometry Algorithms Library providing geometric data structures and algorithms."
  homepage: https://www.cgal.org/
  license: GPL-3.0-or-later
  tags: [math, graphics, wasm]

source:
  type: tarball
  url: https://github.com/CGAL/cgal/releases/download/v6.0.1/CGAL-6.0.1.tar.xz
  sha256: "0acdfbf317c556630dd526f3253780f29b6ec9713ee92903e81b5c93c0f59b7f"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: boost
      version: ">=1.82.0"
    - name: gmp
      version: ">=6.1.0"
    - name: mpfr
      version: ">=4.1.0"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1
      vcpkg_port: cgal
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libCGAL*
    - lib/CGAL*
    - lib/cmake/CGAL/
    - include/CGAL/
  cmake_packages:
    - { name: CGAL, targets: ["CGAL::CGAL"] }

abi:
  cxx_std: 17
