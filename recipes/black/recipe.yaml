schema_version: 1
recipe:
  name: black
  upstream_version: "26.5.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/black/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    black 26.5.1 (noarch py3-none-any) — the code formatter recipe `test:` blocks run `black --check` with. A BUILD-TIME
    lint/test tool for cvcpkg recipes: it lands in the build prefix as a
    depends.build edge (so a recipe `test:` block can run it) and is stripped
    from the deliverable — never shipped to users.

# Pure-Python noarch wheel (py3-none-any): one platform-independent artifact.
# platform: any + a reference interpreter -> the builder fans it into EVERY
# interpreter's site-packages, so one bare recipe serves all.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/94/51/f975cae76d44274cc2868dc9040ac5d58d464784610234455b4e7b19c6ef/black-26.5.1-py3-none-any.whl
      sha256: "4ed7f7da04046d2e488437170797d3b4a4ad83906683bcb7dfc68b673bbce5e2"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: click
    - name: mypy-extensions
    - name: packaging
    - name: pathspec
    - name: platformdirs
    - name: pytokens
  runtime:
    - name: python312
    - name: click
    - name: mypy-extensions
    - name: packaging
    - name: pathspec
    - name: platformdirs
    - name: pytokens
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/black/
    - lib/python3.*/site-packages/blackd/
    - lib/python3.*/site-packages/blib2to3/
    - lib/python3.*/site-packages/_black_version.py
    - lib/python3.*/site-packages/black-*.dist-info/
