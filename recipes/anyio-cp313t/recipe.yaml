python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: idna-cp313t
  runtime:
    - name: python313t
    - name: idna-cp313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/anyio/
    - lib/python3.13t/site-packages/*.dist-info/
