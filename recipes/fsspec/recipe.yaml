schema_version: 1
recipe:
  name: fsspec
  upstream_version: "2024.10.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fsspec/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    fsspec 2024.10.0 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a runtime
    dependency of torch-cp311 (the GRL-SNAM / cvcpkg Python stack), installed into
    the interpreter's site-packages.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/c6/b2/454d6e7f0158951d8a78c2e1eb4f69ae81beb8dca5fee9809c6c99e9d0d0/fsspec-2024.10.0-py3-none-any.whl
      sha256: "03b9a6785766a4de40368b88906366755e2819e758b83705c88cd7cb5fe81871"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/fsspec/
    - lib/python3.*/site-packages/fsspec-*.dist-info/
