schema_version: 1
recipe:
  name: mingw-w64-gcc
  upstream_version: "16.1.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://winlibs.com/
  license: "GPL-3.0-or-later WITH GCC-exception-3.1"
  tags: [tools, toolchain, windows]
  description: >-
    A native Windows MinGW-w64 GCC toolchain — gcc, g++ and **gfortran** 16.1.0
    over mingw-w64 14.0.0, UCRT runtime, MCF threads, SEH exceptions (the
    WinLibs distribution).  This is cvcpkg's only Fortran compiler on any
    platform: MSVC has none, and the llvm/llvm18/llvm20 recipes build
    LLVM_ENABLE_PROJECTS="clang;lld" with no flang.  Packages that need Fortran
    on Windows — scipy above all — declare this in depends.host_tools, which
    puts its bin/ on the build subprocess PATH.

    Two flavour choices, both load-bearing, both learned by hitting the wall:

    UCRT, not msvcrt: extension modules built here have to be ABI compatible
    with cvcpkg's MSVC-built CPython, which links the UCRT.  The msvcrt flavour
    would mix C runtimes inside one process.

    MCF threads, not POSIX: with the posix (winpthreads) flavour, GCC 16.1.0's
    libstdc++ does not compile its own <thread> header — winpthreads' pthread_t
    is a struct, and bits/std_thread.h compares native_handle_type with ==,
    so any translation unit including <thread> dies with
    "no match for 'operator==' ... std::thread::native_handle_type".  scipy hits
    this through HiGHS (highs/parallel/HighsTaskExecutor.h).  mcfgthread's
    handle is a pointer, so the comparison is well-formed.

    Prebuilt and sha256-pinned, following recipes/mingw-w64 (llvm-mingw).  That
    is a deliberate exception to the build-from-source rule and a narrow one:
    GCC cannot be built by MSVC, so a from-source Windows GCC needs a GNU
    toolchain to already exist — the bootstrap problem this package exists to
    break.  What the hermetic rule actually forbids is an *ambient* toolchain
    found on PATH (gvsbuild, C:\Strawberry) deciding how things link; this
    artifact is fetched, verified and staged by cvcpkg like any other package.

# Single Windows-host artifact; this toolchain only runs on the build host, so
# a sha256-pinned archive is simpler than a per-platform prebuilt block.
source:
  type: tarball
  url: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0mcf-14.0.0-ucrt-r1/winlibs-x86_64-mcf-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r1.zip
  sha256: "2ff1522a70adeb4e9bc450e917501da72bf48cb583e47530baa8cd0524fea0fd"
  # The archive has a single mingw64/ root.
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: windows
      script: build.ps1
      env: {}

package:
  files:
    - bin/
    - lib/
    - libexec/
    - include/
    - share/
    - x86_64-w64-mingw32/
  cmake_packages: []
