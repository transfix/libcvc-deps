schema_version: 1
recipe:
  name: mpmath
  upstream_version: "1.3.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/mpmath/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    mpmath 1.3.0 (noarch py3-none-any) for all cvcpkg interpreters (noarch, fanned) — a runtime
    dependency of torch-cp311 (the GRL-SNAM / cvcpkg Python stack), installed into
    the interpreter's site-packages.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/43/e3/7d92a15f894aa0c9c4b49b8ee9ac9850d6e63b03c9c32c0367a13ae62209/mpmath-1.3.0-py3-none-any.whl
      sha256: "a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/mpmath/
    - lib/python3.*/site-packages/mpmath-*.dist-info/
