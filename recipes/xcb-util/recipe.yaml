schema_version: 1
recipe:
  name: xcb-util
  upstream_version: "0.4.1"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XCB utility functions (aux, atom, event) atop libxcb.

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/xcb/xcb-util-0.4.1.tar.xz
  sha256: "5abe3bbbd8e54f0fa3ec945291b7e8fa8cfd3cccc43718f8758430f94126e512"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
  runtime:
    - name: libxcb
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
