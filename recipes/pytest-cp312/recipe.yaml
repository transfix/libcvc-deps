python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: iniconfig-cp312
    - name: packaging-cp312
    - name: pluggy-cp312
    - name: pygments-cp312
  runtime:
    - name: python312
    - name: iniconfig-cp312
    - name: packaging-cp312
    - name: pluggy-cp312
    - name: pygments-cp312

provides:
  - pytest

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.12/site-packages/_pytest/
    - lib/python3.12/site-packages/pytest/
    - lib/python3.12/site-packages/py.py
    - lib/python3.12/site-packages/pytest-*.dist-info/
    - bin/pytest
    - bin/py.test
