schema_version: 1
recipe:
  name: trimesh-cp312
  upstream_version: "5.0.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/trimesh/
  license: "MIT"
  tags: [python, source]
  description: >-
    trimesh 5.0.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/a8/45/5b9943631f265073bb96ca4cc2a9de05d151cd8c1a6896fcbaac132a1355/trimesh-5.0.0.tar.gz
  sha256: "0195003198baaf2550aebe612254ba2f01c385cec46c37ecc5beca8291f79a13"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: numpy-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
    - name: numpy-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.12/site-packages/trimesh/
    - lib/python3.12/site-packages/trimesh-*.dist-info/
    - Lib/site-packages/trimesh/
    - Lib/site-packages/*.dist-info/
