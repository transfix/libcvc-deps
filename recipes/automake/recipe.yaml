schema_version: 1
recipe:
  name: automake
  upstream_version: "1.17"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/automake/
  license: GPL-2.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU Automake — generates Makefile.in files for autoconf.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/automake/automake-1.17.tar.xz
  sha256: "8920c1fc411e13b90bf704ef9db6f29d540e76d232cb3b2c9f4dc4cc599bd990"
  strip_components: 1

patches: []

depends:
  # automake is a build-time host tool; nothing links or loads it at runtime.
  # An explicit empty runtime list keeps its build deps (autoconf/perl/m4) out
  # of the consumer-facing required_deps the manifest generator derives from
  # depends.get("runtime", depends.get("build", [])).
  runtime: []
  build:
    - autoconf
    - perl
    # m4 is autoconf's engine: autom4te resolves it as $M4 or the hard-coded
    # /usr/bin/m4 and never searches PATH, so automake's "whether autoconf
    # works" configure check fails on builders where /usr/bin/m4 is absent
    # (minimal linux images) or non-GNU (the BSDs' base m4). Ship a GNU m4 in
    # the build closure and point $M4 at it from build.sh.
    - m4
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/automake*
    - bin/aclocal*
    - share/automake-*/
    - share/aclocal-*/
    - share/aclocal/
