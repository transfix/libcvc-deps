schema_version: 1
recipe:
  name: gdk-pixbuf
  upstream_version: "2.42.12"
  # cvc.2: add the windows build (build.ps1, Meson + MSVC) and the MSVC
  # artifact patterns.  +cvc.1 was POSIX-only, which left gtk4's
  # `platform: windows` matrix entry a phantom claim.  The windows build
  # keeps the libpng/libjpeg-turbo/tiff loaders instead of the WIC ones
  # (-Dnative_windows_loaders=false) so the declared runtime deps stay
  # honest, and it installs a differently-named artifact set, so it takes
  # a revision rather than a republish.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://gitlab.gnome.org/GNOME/gdk-pixbuf
  license: LGPL-2.1-or-later
  tags: [libraries]
  description: >-
    GDK-Pixbuf — an image loading library for GTK and GNOME.
    Supports JPEG, PNG, TIFF, and other formats.  Required by GTK 4.

source:
  type: tarball
  url: https://download.gnome.org/sources/gdk-pixbuf/2.42/gdk-pixbuf-2.42.12.tar.xz
  sha256: "b9505b3445b9a7e48ced34760c3bcb73e966df3ac94c95a148cb669ab748e3c7"
  strip_components: 1

patches: []

depends:
  build:
    - ninja
    - meson
    - pkg-config
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
  runtime:
    - name: glib
      version: "^2.80"
    - name: libjpeg-turbo
      version: "^3.0"
    - name: libpng
      version: "^1.6"
    - name: tiff
      version: "^4.6"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # Unix shared/static artifacts (.so / .so.N / .dylib / .a).
    - lib/libgdk_pixbuf-2.0*
    - lib/pkgconfig/gdk-pixbuf-2.0.pc
    - lib/gdk-pixbuf-2.0/
    - include/gdk-pixbuf-2.0/
    - bin/gdk-pixbuf-*
    # Windows (MSVC): import library under lib/, versioned runtime DLL
    # under bin/.  Note the library uses an underscore (gdk_pixbuf-2.0)
    # while the tools above use a hyphen, so it needs its own patterns.
    - lib/gdk_pixbuf-2.0*.lib
    - bin/gdk_pixbuf-2.0*.dll
  pkg_config:
    - gdk-pixbuf-2.0

abi:
  cxx_std: 17
