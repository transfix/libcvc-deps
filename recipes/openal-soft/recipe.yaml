schema_version: 1
recipe:
  name: openal-soft
  # TEMPORARY downgrade 1.25.2 -> 1.24.3.  1.25.x's alc.cpp uses C++20
  # `std::views::split` with contiguous_range subranges (the P2210 split_view),
  # which only compiles on GCC >= 13; the prod linux builders run an older GCC
  # and failed with "no match for std::ranges::__for_each_fn(split_view, ...)".
  # 1.24.3 is the last release free of views::split (verified tree-wide) and
  # builds on GCC 11+.  Revert to 1.25.x once the prod linux builders are on
  # GCC >= 13 (matching the dev builders / local).  Nothing was published for
  # 1.25.2 (it failed on every platform), so this is not a downgrade over an
  # existing bundle.
  upstream_version: "1.24.3"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/kcat/openal-soft
  license: LGPL-2.0-or-later
  tags: [libraries, audio]
  description: >-
    OpenAL Soft — a software implementation of the OpenAL 3D audio API.
    Provides positional audio for games and multimedia applications.
    Audio backends (ALSA, PulseAudio, PipeWire, CoreAudio, WASAPI, ...)
    are dlopen'd at runtime, so the library carries no hard external
    link dependencies.

source:
  type: tarball
  url: https://github.com/kcat/openal-soft/archive/refs/tags/1.24.3.tar.gz
  sha256: "7e1fecdeb45e7f78722b776c5cf30bd33934b961d7fd2a11e0494e064cc631ce"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    - pkg-config
  runtime:
    # Audio backends. OpenAL-Soft compiles these in and dlopen's them at
    # runtime, so their headers must be present at build time. Linux/BSD only —
    # macOS uses CoreAudio and Windows WASAPI/DirectSound (native, no deps).
    - name: alsa-lib
      platforms: [linux]
    - name: libpulse
      platforms: [linux]
    - name: pipewire
      platforms: [linux]
    - name: jack
      platforms: [linux, freebsd]
    - name: sndio
      platforms: [linux, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # Unix static + shared artifacts (.a / .so / .so.N / .dylib).
    - lib/libopenal*
    # Windows static/import lib + runtime DLL (MSVC).
    - lib/OpenAL*
    - bin/OpenAL*
    - lib/pkgconfig/openal.pc
    - lib/cmake/OpenAL/
    - include/AL/
  pkg_config:
    - openal
  cmake_packages:
    - { name: OpenAL, targets: ["OpenAL::OpenAL"] }

abi:
  cxx_std: 20
