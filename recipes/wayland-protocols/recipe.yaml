schema_version: 1
recipe:
  name: wayland-protocols
  upstream_version: "1.38"
  # Bumped 1 -> 2: added openbsd/netbsd builds, matching the wayland recipe.
  # These are XML protocol definitions plus a meson install, so they follow
  # wherever wayland itself builds.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://wayland.freedesktop.org/
  license: MIT
  tags: [libraries]
  description: >-
    Wayland Protocols — a collection of Wayland protocol extensions.
    Provides xdg-shell, xdg-decoration, and other standard protocols
    used by GTK 4 and other Wayland compositors/clients.

source:
  type: tarball
  url: https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.38/downloads/wayland-protocols-1.38.tar.xz
  sha256: "ff17292c05159d2b20ce6cacfe42d7e31a28198fa1429a769b03af7c38581dbe"
  strip_components: 1

patches: []

depends:
  runtime: []
  build:
    - ninja
    - meson
    - pkg-config
    # This package ships only protocol XML + a .pc file -- it links nothing, so
    # wayland cannot be a runtime dep; it is only needed to build/validate.
    - name: wayland
      version: "^1.23"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - share/wayland-protocols/
    - lib/pkgconfig/wayland-protocols.pc
  pkg_config:
    - wayland-protocols

abi:
  cxx_std: 17

notes:
  - title: "Linux and FreeBSD only"
    platforms: [linux, freebsd]
    description: >-
      Wayland protocols are only relevant on platforms that use the
      Wayland display protocol.
