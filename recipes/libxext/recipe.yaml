schema_version: 1
recipe:
  name: libxext
  upstream_version: "1.3.7"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X11 miscellaneous extensions library (Xext: SHM, Sync, DPMS, …).

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libXext-1.3.7.tar.xz
  sha256: "6c643c7035cdacf67afd68f25d01b90ef889d546c9fcd7c0adf7c2cf91e3a32d"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
