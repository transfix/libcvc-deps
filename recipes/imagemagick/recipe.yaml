schema_version: 1
recipe:
  name: imagemagick
  upstream_version: "7.1.2"
  # Bumped 6 -> 7 to republish the macOS bundle with @rpath install names (the
  # autotools/libtool build baked an absolute build-temp install_name into
  # libMagick++, breaking dyld for consumers — see libcvc-deps#345). The fix
  # (_patch_macos_install_names) only rewrites NEWLY built bundles, and the
  # macos-arm64 +cvc.6 bundle is immutable, so a revision bump is required for
  # the corrected bundle to publish and be picked up by libcvc's macOS CI.
  #
  # Bumped 7 -> 8: build against the cvcpkg libxml2 (2.12.9, FTP client removed
  # in 2.11) instead of the build host's system libxml2 (still has FTP).
  # ImageMagick REQUIRES libxml2 (it parses its own delegates.xml/type.xml config
  # at runtime), and configure previously auto-detected the SYSTEM libxml2 — so
  # MagickCore baked in xmlNanoFTP* symbols the cvcpkg libxml2 no longer exports,
  # breaking every consumer's link (libcvc: undefined reference to
  # xmlNanoFTPClose@LIBXML2_2.4.30). Now declares libxml2 and points configure at
  # it (see build.sh). The +cvc.7 bundle is immutable, so republishing needs +cvc.8.
  #
  # Bumped 8 -> 9: enable the full image-codec delegate set. +cvc.8 shipped a
  # minimal build (fontconfig/freetype/lzma/tiff/xml/zlib/zstd — no jpeg/png/webp)
  # because the recipe passed --without-jpeg/png/webp. Now builds with jpeg, png,
  # webp, tiff, zstd, lzma and bzlib ON, with each codec declared so the exposed
  # cvcpkg prefix is a complete link closure (this is also what puts -ljpeg/-lwebp
  # on the link line, resolving both MagickCore's coders and libtiff's codec refs).
  #
  # Bumped 9 -> 10: fix the hermetic link. cvc.9 RELEASE published but the DEBUG
  # fleet build failed with `undefined reference to SharpYuvInit / ZSTD_decompress`
  # — MagickCore references those directly but they are only *private* pkg-config
  # deps of the cvcpkg libwebp/libtiff (Requires.private), which a dynamic
  # `pkg-config --libs` drops. build.sh now links -lsharpyuv/-lzstd/-lLerc via
  # $LIBS. (cvc.9 release linked only because that fleet job happened to see a
  # system libwebp bundling sharpyuv; not reproducible/portable.)
  #
  # (Revisions 11 -> 22 were the wasm codec-chain and Windows coder-staging
  # iteration series — see the build-wasm.sh / build.ps1 history.)
  #
  # Bumped 22 -> 23: align the version across platforms. Unix builds from the
  # 7.1.1-41 source tarball, but the Windows recipe repackages the official
  # prebuilt installer (build.ps1) and that was pinned to 7.1.2-22 — a version
  # skew. Upstream deletes old release binaries from GitHub, so 7.1.1's Windows
  # installer is already gone (404); the earliest still-downloadable is 7.1.2-15.
  # So align UP: bump the source tarball to 7.1.2-24 (the same version whose
  # Windows installer we repackage) rather than down to an unavailable 7.1.1.
  # All platforms are now 7.1.2-24. Also fixes an OpenBSD build failure —
  # MagickCore/random.c unconditionally does `#if
  # defined(MAGICKCORE_HAVE_GETENTROPY) #include <sys/random.h> #endif`.
  # configure correctly detects getentropy() exists (OpenBSD originated that
  # syscall), but assumes any platform with getentropy() also has
  # <sys/random.h> — true on Linux/macOS/FreeBSD/NetBSD, false on OpenBSD,
  # which declares getentropy() in <unistd.h> instead (already pulled in
  # earlier via MagickCore/studio.h's own MAGICKCORE_HAVE_UNISTD_H-gated
  # include). Patched to skip the <sys/random.h> include on OpenBSD only.
  cvc_revision: 23
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "ImageMagick — a software suite for creating, editing, composing, and converting images."
  homepage: https://imagemagick.org/
  license: Apache-2.0
  tags: [graphics, io, wasm]

source:
  type: tarball
  url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-24.tar.gz
  sha256: "645f1dc68482ba952a02a854ffaf67efca42871b168e0cf702a043db2ec54638"
  strip_components: 1

patches:
  - openbsd-getentropy-no-sys-random-h.patch

depends:
  host_tools:
    - cmake
    - ninja
  build:
    # Full delegate set — a hermetic ImageMagick built entirely against cvcpkg
    # codecs (no fall-through to the build host's system libraries). build.sh
    # exposes the deps prefix and enables each delegate (--with-jpeg/png/webp/…);
    # declaring the libs here puts them in the prefix so both ImageMagick's own
    # coders AND libtiff's codec references resolve at link time. (The earlier
    # jpeg_std_error / ZSTD_* link failures were exactly this: libtiff pulled in
    # jpeg/zstd but they were --without / undeclared, so nothing put -ljpeg
    # -lzstd on the link line.) cvcpkg resolves each dep's own transitive closure
    # (e.g. freetype→brotli/png, fontconfig→expat) into the prefix automatically.
    - name: zlib
      version: "^1.3"
    - name: bzip2
    - name: tiff
      version: "^4.6"
    - name: libjpeg-turbo
      version: "^3.1"
    - name: libpng
    - name: libwebp
      version: "^1.5"
    - name: xz
      version: "^5.6"
    - name: zstd
      version: "^1.5"
    - name: lerc
    # (freetype/fontconfig are auto-detected from the builder as in +cvc.8; not
    # declared here to avoid dragging in their heavy build closure — python3 via
    # meson, expat, brotli — for a text-rendering delegate the image pipeline
    # does not need. Enable them hermetically in a later revision if wanted.)
    # ImageMagick links libxml2 (config-file parsing) and ships referencing it.
    # Pinned to the cvcpkg 2.12.x bundle, which has the FTP client removed — so
    # MagickCore never references xmlNanoFTP*. build.sh forces configure to use
    # THIS libxml2 rather than the build host's system one.
    - name: libxml2
      version: "^2.12"

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1

package:
  files:
    - lib/libMagick*
    - lib/ImageMagick*
    - lib/CORE_RL_*.lib
    - lib/Magick++.lib
    - lib/MagickCore.lib
    - lib/MagickWand.lib
    - lib/cmake/ImageMagick/
    - lib/pkgconfig/Magick*
    - lib/pkgconfig/ImageMagick*
    - include/Magick++/
    - include/Magick++.h
    - include/MagickCore/
    - include/MagickWand/
    - include/ImageMagick*/
    - bin/magick*
    - bin/Magick*
    - bin/convert.exe
    - bin/CORE_RL_*.dll
    - bin/IM_MOD_RL_*.dll
    - bin/FILTER_*.dll
    - share/ImageMagick*/
    - share/imagemagick/
  cmake_packages:
    - { name: ImageMagick, targets: ["ImageMagick::Magick++"] }

abi:
  cxx_std: 17
