schema_version: 1
recipe:
  name: imagemagick
  upstream_version: "7.1.1"
  # Bumped 6 -> 7 to republish the macOS bundle with @rpath install names (the
  # autotools/libtool build baked an absolute build-temp install_name into
  # libMagick++, breaking dyld for consumers — see libcvc-deps#345). The fix
  # (_patch_macos_install_names) only rewrites NEWLY built bundles, and the
  # macos-arm64 +cvc.6 bundle is immutable, so a revision bump is required for
  # the corrected bundle to publish and be picked up by libcvc's macOS CI.
  #
  # Bumped 7 -> 8: build against the cvcpkg libxml2 (2.12.9, FTP client removed
  # in 2.11) instead of the build host's system libxml2 (still has FTP).
  # ImageMagick REQUIRES libxml2 (it parses its own delegates.xml/type.xml config
  # at runtime), and configure previously auto-detected the SYSTEM libxml2 — so
  # MagickCore baked in xmlNanoFTP* symbols the cvcpkg libxml2 no longer exports,
  # breaking every consumer's link (libcvc: undefined reference to
  # xmlNanoFTPClose@LIBXML2_2.4.30). Now declares libxml2 and points configure at
  # it (see build.sh). The +cvc.7 bundle is immutable, so republishing needs +cvc.8.
  cvc_revision: 8
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "ImageMagick — a software suite for creating, editing, composing, and converting images."
  homepage: https://imagemagick.org/
  license: Apache-2.0
  tags: [graphics, io, wasm]

source:
  type: tarball
  url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.1-41.tar.gz
  sha256: "cabf2516dce66da56dd4e3071453b808eefaf4326a93292d2a222a4ea623d601"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: zlib
      version: "^1.3"
    - name: tiff
      version: "^4.6"
    # tiff's own delegate closure. Once build.sh exposes the cvcpkg deps prefix
    # (for libxml2, below), ImageMagick links the cvcpkg libtiff instead of the
    # build host's system one — and the cvcpkg libtiff pulls in these codecs
    # (see the tiff recipe). Without declaring them the prefix is missing
    # libjpeg/libzstd/xz/webp/lerc and MagickCore fails to link with undefined
    # references to jpeg_std_error / ZSTD_isError / ZSTD_getErrorName. Declaring
    # tiff's full closure makes the exposed prefix self-consistent (a hermetic
    # build) rather than silently falling back to system codecs.
    - name: libjpeg-turbo
      version: "^3.1"
    - name: xz
      version: "^5.6"
    - name: zstd
      version: "^1.5"
    - name: libwebp
      version: "^1.5"
    - name: lerc
    # ImageMagick links libxml2 (config-file parsing) and ships referencing it.
    # Pinned to the cvcpkg 2.12.x bundle, which has the FTP client removed — so
    # MagickCore never references xmlNanoFTP*. build.sh forces configure to use
    # THIS libxml2 rather than the build host's system one.
    - name: libxml2
      version: "^2.12"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1

package:
  files:
    - lib/libMagick*
    - lib/ImageMagick*
    - lib/CORE_RL_*.lib
    - lib/Magick++.lib
    - lib/MagickCore.lib
    - lib/MagickWand.lib
    - lib/cmake/ImageMagick/
    - lib/pkgconfig/Magick*
    - lib/pkgconfig/ImageMagick*
    - include/Magick++/
    - include/Magick++.h
    - include/MagickCore/
    - include/MagickWand/
    - include/ImageMagick*/
    - bin/magick*
    - bin/Magick*
    - bin/convert.exe
    - bin/CORE_RL_*.dll
    - bin/IM_MOD_RL_*.dll
    - bin/FILTER_*.dll
    - share/ImageMagick*/
    - share/imagemagick/
  cmake_packages:
    - { name: ImageMagick, targets: ["ImageMagick::Magick++"] }

abi:
  cxx_std: 17
