schema_version: 1
recipe:
  name: llvm20
  upstream_version: "20.1.8"
  # Bumped 1 -> 2: scoped the ncurses build edge to Unix. LLVM uses it
  # only for terminfo colour detection in its Unix Process/Terminal support;
  # the MSVC build uses the console API instead. Unscoped, it made this recipe
  # advertise windows while depending on a package with no windows build.
  # Bumped 2 -> 3: added the netbsd build. pkgsrc ships lang/llvm, and
  # build.sh is already platform-generic (its only platform branch is the RPATH
  # form, whose $ORIGIN default is correct for NetBSD). OpenBSD is deliberately
  # NOT added: this builds LLVM_BUILD_LLVM_DYLIB=ON and relies on an $ORIGIN
  # RPATH for relocatability, which OpenBSD's ld.so does not implement (see
  # _ELF_RPATH_PLATFORMS in builder.py) — the bundle would build but not
  # relocate.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://llvm.org
  license: Apache-2.0
  tags: [compiler, toolchain, llvm, development]
  description: >-
    LLVM 20 — the LLVM core libraries, headers and CMake package, built
    from the LLVM monorepo.  This exists alongside the main `llvm` recipe
    (currently 22.x) because some consumers are pinned to a specific LLVM
    major: LLVM's CMake config matches on SameMajorVersion, so a project
    asking for LLVM 20.1 cannot be satisfied by 22.x.

    Its consumer is `llvm-cbe`, whose upstream tracks one LLVM major at a
    time and currently requires 20.1.  Prefer the `llvm` recipe for
    anything not pinned to LLVM 20.

    Unlike `llvm`, this builds LLVM only — no clang, no lld.  llvm-cbe
    links LLVM's libraries and references neither, so building them would
    roughly double an already long build for no consumer.  Targets:
    X86, AArch64, WebAssembly.

source:
  type: tarball
  url: https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz
  sha256: "6898f963c8e938981e6c4a302e83ec5beb4630147c7311183cf61069af16333d"
  strip_components: 1

patches: []

depends:
  build:
    - name: zlib
      version: "^1.3"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  runtime:
    # libLLVM links zlib, so it must ship alongside; ncurses is only needed
    # while compiling (LLVM_ENABLE_TERMINFO probes it) -- see the llvm recipe.
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/llvm-*
    - bin/opt
    - bin/llc
    - bin/lli
    - lib/libLLVM*
    - lib/cmake/llvm/
    - include/llvm/
    - include/llvm-c/
  cmake_packages:
    - { name: LLVM, targets: ["LLVM"] }

abi:
  cxx_std: 17

notes:
  - title: "Build time"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      LLVM is a very large project.  Expect 20–60 minutes to compile
      depending on hardware — less than the `llvm` recipe, since clang and
      lld are not built.  LLVM_PARALLEL_LINK_JOBS is capped at 2 to avoid
      OOM during linking.
  - title: "Relationship to the llvm recipe"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      `llvm` and `llvm20` install the same paths (bin/llvm-*, lib/libLLVM*,
      lib/cmake/llvm/) and so must never share a prefix.  Nothing depends on
      both: llvm-cbe depends on llvm20 alone.  If a future consumer needs
      both majors at once, they need separate prefixes.
  - title: "Why LLVM 20"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      llvm-cbe's CMakeLists does find_package(LLVM 20.1 REQUIRED CONFIG).
      LLVM's LLVMConfigVersion.cmake accepts only a matching major, so
      20.1.8 satisfies it and 22.x does not.  When llvm-cbe upstream moves
      to a newer LLVM major, retarget llvm-cbe at `llvm` and drop this.
