schema_version: 1
recipe:
  name: meson-python-cp313t
  upstream_version: "0.18.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/meson-python/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    meson-python 0.18.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/28/58/66db620a8a7ccb32633de9f403fe49f1b63c68ca94e5c340ec5cceeb9821/meson_python-0.18.0-py3-none-any.whl
      sha256: "3b0fe051551cc238f5febb873247c0949cd60ded556efa130aa57021804868e2"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: packaging-cp313t
    - name: pyproject-metadata-cp313t
  runtime:
    - name: python313t
    - name: packaging-cp313t
    - name: pyproject-metadata-cp313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/mesonpy/
    - lib/python3.13t/site-packages/meson_python-*.dist-info/
