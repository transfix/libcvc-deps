schema_version: 1
recipe:
  name: torch-cp313
  upstream_version: "2.8.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pytorch.org/
  license: BSD-3-Clause
  tags: [python, wheel, ml, tensor, scientific]
  description: >-
    PyTorch 2.8.0 (CPU build) for CPython 3.13 (cp313) — the pinned prebuilt
    manylinux_2_28 CPU wheel from the official PyTorch index, installed into the
    python313 interpreter's site-packages. torch is NOT built from source (an
    impractical multi-hour MKL/CUDA build); it is the roadmap's canonical
    "ship-good-manylinux-wheels" package. This is the CPU variant (no CUDA / no
    nvidia-* deps) — sufficient for the GRL-SNAM surrogate-dynamics numerics and
    the grl-snam-selftest correctness demo. A CUDA torch-cp313-cuda variant + the
    macOS/Windows columns are follow-ups.

# Prebuilt CPU wheel from download.pytorch.org (not PyPI — PyPI's linux torch is
# the ~2GB CUDA build). cvcpkg fetches + sha256-verifies it, then build.sh
# pip-installs it offline into the prefix interpreter's site-packages.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl
      sha256: "8f81dedb4c6076ec325acc3b47525f9c550e5284a18eae1d9061c543f7b6e7de"

python:
  interpreter: python313
  abi: cp313
  manylinux_min: manylinux_2_28

patches: []

depends:
  build:
    - name: python313
  runtime:
    # torch's Requires-Dist (CPU build) — each resolved to the cp313 column.
    - name: python313
    - name: numpy-cp313
    - name: typing-extensions-cp313
    - name: setuptools-cp313
    - name: sympy-cp313
    - name: networkx-cp313
    - name: jinja2-cp313
    - name: fsspec-cp313
    - name: filelock-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    # macOS (CPU) + Windows (CPU) columns are a follow-up; the CUDA variant is a
    # separate torch-cp313-cuda recipe (pulls nvidia-*-cu wheels).

package:
  files:
    # torch bundles its own libs under torch/lib/ (auditwheel-vendored); the whole
    # package tree ships. The dist-info dir is "torch-2.8.0+cpu.dist-info".
    - lib/python3.13*/site-packages/torch/
    - lib/python3.13*/site-packages/torchgen/
    - lib/python3.13*/site-packages/functorch/
    - lib/python3.13*/site-packages/torch-2.8.0*.dist-info/

abi:
  cxx_std: 17
