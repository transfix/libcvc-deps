schema_version: 1
recipe:
  name: libx11
  upstream_version: "1.8.13"
  # Bumped 2 -> 3: add xorgproto as a RUNTIME dep so the X protocol headers
  # (X11/X.h etc.) are transitive for downstream X11 builds (see depends).
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    Xlib — the core X11 client library, layered on libxcb.

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libX11-1.8.13.tar.xz
  sha256: "69606f485c2c07c14ef64f75b7bb326d48587af33795d9ab3e607c0b5f94f11c"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
    - name: xtrans
  runtime:
    - name: libxcb
    # xorgproto: libX11's public Xlib.h #includes X11/X.h, and its extension
    # headers pull X11/extensions/*proto.h — all shipped by xorgproto (one
    # package = every X protocol header). Make it a RUNTIME dep so anything
    # building against X11 (e.g. VTK's FindX11 needs X11/X.h) gets the protocol
    # headers transitively via `cvcpkg install <thing that pulls libx11>`,
    # instead of having to install xorgproto explicitly.
    - name: xorgproto
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
