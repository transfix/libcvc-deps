schema_version: 1
recipe:
  name: curl
  upstream_version: "8.13.0"
  # Bumped 1 -> 2: OpenBSD fixes — libcurl.so had no DT_SONAME at all (so
  # every consumer that links it bakes in the literal, ephemeral build-time
  # path instead of a portable soname, e.g. cmake: "ld.so: cmake: can't load
  # library '.../cvcpkg-job-curl-.../lib/libcurl.so.12.0'"), no bare
  # libcurl.so symlink, and the $ORIGIN rpath meant for its own libssl lookup
  # was corrupted to "RIGIN" by an under-escaped LDFLAGS string (make's `$O`
  # single-letter variable syntax ate the dollar+O). See build.sh.
  #
  # Bumped 2 -> 3: +cvc.2 failed to build at all — "ld: error: cannot open
  # libcurl.so.12.0: No such file or directory" during the CCLD libcurl.la
  # step. The comma-joined -Wl,-soname,libcurl.so.12.0 gets split by libtool
  # into separate tokens, and its filename heuristic matched "libcurl.so.12.0"
  # as a reference to an existing library to link against, stripping the
  # -Wl, protection and passing it to the linker as a bare positional input
  # (which doesn't exist — it's the very file this link step produces).
  # Two independently -Wl,-prefixed flags (the same pattern already used for
  # -Wl,-rpath -Wl,$$ORIGIN two lines above) avoid the comma-split entirely.
  #
  # Bumped 3 -> 4: +cvc.3 hit the EXACT SAME "ld: error: cannot open
  # libcurl.so.12.0" failure — splitting into two -Wl, flags did not help
  # either; libtool's filename classifier matches the value regardless of how
  # it's split. Gave up on injecting -soname through libtool's own link step
  # entirely. Reverted build.sh to the plain (working, soname-less) build and
  # added a POST-install patchelf --set-soname step, which operates on the
  # already-linked artifact and never touches libtool's argument handling.
  # Added patchelf as an OpenBSD-only build dependency (already has an
  # OpenBSD recipe in this tree).
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://curl.se/
  license: curl
  tags: [networking]
  description: >-
    curl — command-line tool and library for transferring data with URLs.
    Provides libcurl with HTTPS support needed by cmake's file(DOWNLOAD).

source:
  type: tarball
  url: https://curl.se/download/curl-8.13.0.tar.gz
  sha256: "c261a4db579b289a7501565497658bbd52d3138fdbaccf1490fa918129ab45bc"
  strip_components: 1

patches: []

depends:
  build:
    # OpenBSD only: post-install SONAME injection (see build.sh) — libtool's
    # OpenBSD versioning support doesn't emit -soname, and passing it via
    # LDFLAGS through libtool's own -Wl, handling reliably breaks the link
    # (tried both a single comma-joined flag and two separate -Wl, flags;
    # both produced "ld: error: cannot open libcurl.so.12.0: No such file or
    # directory" — libtool's argument classifier matches the filename-shaped
    # value as a reference to an existing library no matter how it's split).
    - name: patchelf
      platforms: [openbsd]
  runtime:
    - name: openssl
      version: "^3.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libcurl*
    - lib/curl*.lib
    - lib/pkgconfig/libcurl*
    - lib/cmake/CURL/
    - include/curl/
    - bin/curl*
    - bin/libcurl*.dll
  cmake_packages:
    - { name: CURL, targets: ["CURL::libcurl"] }

abi:
  cxx_std: 17
