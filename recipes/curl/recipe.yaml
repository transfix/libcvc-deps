schema_version: 1
recipe:
  name: curl
  upstream_version: "8.13.0"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "cvcpkg@cyberpcangel.com"
  maintainer_url: "https://cyberpcangel.com"
  homepage: https://curl.se/
  license: curl
  tags: [networking]
  description: >-
    curl — command-line tool and library for transferring data with URLs.
    Provides libcurl with HTTPS support needed by cmake's file(DOWNLOAD).

source:
  type: tarball
  url: https://curl.se/download/curl-8.13.0.tar.gz
  sha256: "c261a4db579b289a7501565497658bbd52d3138fdbaccf1490fa918129ab45bc"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: openssl
      version: "^3.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libcurl*
    - lib/pkgconfig/libcurl*
    - lib/cmake/CURL/
    - include/curl/
    - bin/curl*
  cmake_packages:
    - { name: CURL, targets: ["CURL::libcurl"] }

abi:
  cxx_std: 17
