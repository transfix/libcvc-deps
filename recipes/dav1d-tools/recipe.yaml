schema_version: 1
recipe:
  name: dav1d-tools
  upstream_version: "1.4.3"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://code.videolan.org/videolan/dav1d
  license: BSD-2-Clause
  tags: [tools, multimedia, video]
  description: >-
    dav1d command-line AV1 decoder tool.  Built from the same
    source tarball as the dav1d library recipe; only the dav1d
    binary is installed.  Requires libdav1d at both build and runtime.

source:
  type: tarball
  url: https://github.com/videolan/dav1d/archive/refs/tags/1.4.3.tar.gz
  sha256: "88a023e58d955e0886faf49c72940e0e90914a948a8e60c1326ce3e09e7a6099"
  strip_components: 1

patches: []

depends:
  build:
    - name: dav1d
    - ninja
    - meson
    - pkg-config
  runtime:
    - name: dav1d
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/dav1d*
