schema_version: 1
recipe:
  name: perl
  upstream_version: "5.40.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.perl.org/
  license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
  tags: [tools, scripting]
  description: >-
    Perl 5 interpreter — a build-time host tool required by projects
    whose configure or code-generation steps invoke perl (e.g. OpenSSL
    and Qt). Provided so builds do not depend on the host's perl.

source:
  type: tarball
  url: https://www.cpan.org/src/5.0/perl-5.40.2.tar.gz
  sha256: "10d4647cfbb543a7f9ae3e5f6851ec49305232ea7621aed24c7cfbb0bef4b70d"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh

package:
  files:
    - bin/perl
    - bin/perl5.40.2
    - lib/5.40.2/
    - lib/site_perl/

notes:
  - title: "Windows deferred"
    platforms: [windows]
    description: >-
      A native Windows build (Strawberry/ActiveState-style) is out of
      scope for this recipe; add a build.ps1 + windows matrix entry as a
      follow-up if a Windows consumer needs a cvcpkg-supplied perl.
