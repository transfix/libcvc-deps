schema_version: 1
recipe:
  name: libogg
  upstream_version: "1.3.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.xiph.org/ogg/
  license: BSD-3-Clause
  tags: [libraries, multimedia]
  description: >-
    libogg — the Ogg bitstream and framing library.  Required at
    runtime by libvorbis.

source:
  type: tarball
  url: https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-1.3.6.tar.gz
  sha256: "83e6704730683d004d20e21b8f7f55dcb3383cdf84c0daedf30bde175f774638"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libogg*
    - lib/pkgconfig/ogg.pc
    - include/ogg/
    - bin/libogg-*.dll
  pkg_config:
    - ogg
