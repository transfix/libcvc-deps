schema_version: 1
recipe:
  name: libogg
  upstream_version: "1.3.6"
  # Added wasm/wasi/cosmo entries.  libogg is the Ogg framing layer and touches
  # nothing outside caller-owned buffers — no files, threads, sockets or
  # assembly — so the only platform question is integer width, which configure
  # answers from the compiler instead of by running a probe.  The cross scripts
  # stay on autotools (libogg also ships a CMakeLists.txt) so the installed
  # layout keeps matching the package.files globs, which do not declare the
  # lib/cmake/Ogg/ directory the CMake path would add.  Unblocks libvorbis,
  # which runtime-depends on libogg and could not claim these targets until now.
  # Bumped 2 -> 3: Windows build.ps1 rework: honour CVC_LINK in both directions and pin
  # the build to the cvcpkg MinGW toolchain (exported PATH/PKG_CONFIG_PATH,
  # drive-letter prefixes, TMPDIR fix). Script-only change, so the catalog
  # and dev build cache only pick it up with a revision bump.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.xiph.org/ogg/
  license: BSD-3-Clause
  tags: [libraries, multimedia, wasm, wasi]
  description: >-
    libogg — the Ogg bitstream and framing library.  Required at
    runtime by libvorbis.

source:
  type: tarball
  url: https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-1.3.6.tar.gz
  sha256: "83e6704730683d004d20e21b8f7f55dcb3383cdf84c0daedf30bde175f774638"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libogg*
    - lib/pkgconfig/ogg.pc
    - include/ogg/
    - bin/libogg-*.dll
  pkg_config:
    - ogg
