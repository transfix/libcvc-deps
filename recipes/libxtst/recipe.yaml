schema_version: 1
recipe:
  name: libxtst
  upstream_version: "1.2.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X11 Test and Record extension client library (libXtst / Xtst).  Provides
    synthetic input (XTEST) and event recording (XRECORD).  Consumed by SDL's
    X11 backend (SDL_X11_XTEST, used for global mouse warp).

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libXtst-1.2.5.tar.xz
  sha256: "b50d4c25b97009a744706c1039c598f4d8e64910c9fde381994e1cae235d9242"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
    - name: libxi
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
