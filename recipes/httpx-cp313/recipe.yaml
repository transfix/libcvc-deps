schema_version: 1
recipe:
  name: httpx-cp313
  upstream_version: "0.28.1"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/httpx/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    httpx 0.28.1 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/b1/df/48c586a5fe32a0f01324ee087459e112ebb7224f646c0b5023f5e79e9956/httpx-0.28.1.tar.gz
  sha256: "75e98c5f16b0f35b567856f597f06ff2270a374470a5c2392242528e3e3e42fc"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    - name: anyio-cp313
    - name: certifi-cp313
    - name: httpcore-cp313
    - name: idna-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: hatch-fancy-pypi-readme-cp313
  runtime:
    - name: python313
    - name: anyio-cp313
    - name: certifi-cp313
    - name: httpcore-cp313
    - name: idna-cp313
  host_tools:
    - python313

provides:
  - httpx

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/httpx/
    - lib/python3.13/site-packages/*.dist-info/
    - bin/httpx
    - Lib/site-packages/httpx/
    - Lib/site-packages/*.dist-info/
