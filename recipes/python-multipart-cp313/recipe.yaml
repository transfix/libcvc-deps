schema_version: 1
recipe:
  name: python-multipart-cp313
  upstream_version: "0.0.29"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/python-multipart/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    python-multipart 0.0.29 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/4e/fe/70bd71a6738b09a0bdf6480ca6436b167469ca4578b2a0efbe390b4b0e70/python_multipart-0.0.29.tar.gz
  sha256: "643e93849196645e2dbdd81a0f8829a23123ad7f797a84a364c6fb3563f18904"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/multipart/
    - lib/python3.13/site-packages/*.dist-info/
    - Lib/site-packages/multipart/
    - Lib/site-packages/*.dist-info/
