schema_version: 1
recipe:
  name: allegro5
  # Upstream ships 4-component versions (5.2.11.3); cvcpkg SemVer allows at
  # most major.minor.patch, so the series is recorded as 5.2.11 and the exact
  # point release (5.2.11.3) is pinned by the source URL + sha256 below.
  upstream_version: "5.2.11"
  # cvc.2: export LDFLAGS=-L${prefix}/lib in build.sh. +cvc.1 failed to link on
  # the hermetic builder — Allegro's ALSA/PulseAudio drivers link bare
  # -lasound/-lpulse/-lpulse-simple and the deps' lib dir was not on the link
  # path ("cannot find -lpulse").
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://liballeg.org/
  license: Zlib
  tags: [libraries, game, graphics, audio, gui]
  description: >-
    Allegro 5 — a cross-platform library for game and multimedia
    programming.  Handles low-level tasks such as creating windows,
    accepting input, loading data, drawing images, and playing sounds.
    Builds the core plus the image, font/ttf, primitives, color, dialog,
    memfile, physfs, audio and acodec addons.  The Ogg video addon is
    disabled (no Theora recipe in the dependency set).

source:
  type: tarball
  url: https://github.com/liballeg/allegro5/archive/refs/tags/5.2.11.3.tar.gz
  sha256: "13c5626d425d5bf757e6db75f7e8dbc6aa0910cb6a5903f37d4be11fa8d78aa3"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    - pkg-config
  runtime:
    # Audio backends — ALSA + PulseAudio drivers (OpenAL is declared below).
    # Linux only; macOS uses CoreAudio, Windows DirectSound.
    - name: alsa-lib
      platforms: [linux]
    - name: libpulse
      platforms: [linux]
    # Image addon.
    - name: libpng
    - name: libjpeg-turbo
    - name: libwebp
    # Font / TTF addon (FreeType directly; HarfBuzz is not linked by the
    # TTF addon in 5.2.x — declared per the batch dep list, can be dropped).
    - name: freetype
    - name: harfbuzz
    # Audio + acodec addons.
    - name: openal-soft
    - name: libvorbis
    - name: libogg
    - name: flac
    - name: opusfile
    # PhysicsFS addon.
    - name: physfs
    # OpenGL / GLU headers for the OpenGL graphics driver (Linux/BSD;
    # macOS uses the system OpenGL framework).  The GL loader (glvnd) is
    # a system component at runtime.
    - name: libglvnd
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: glu
      platforms: [linux, freebsd, openbsd, netbsd]
    # X11 windowing backend (Linux/BSD only; macOS uses Cocoa).
    - name: libx11
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxcursor
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxrandr
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxinerama
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxi
      platforms: [linux, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    # TODO windows — the Allegro 5 Windows build (Direct3D/DirectSound,
    # native dialog, per-dep import libs) is nontrivial; omitted until a
    # working build.ps1 exists.

package:
  files:
    # Core + every addon, static + shared (.a / .so / .so.N / .dylib).
    - lib/liballegro*
    # pkg-config files: shared → allegro*-5.pc, static → allegro*-static-5.pc.
    - lib/pkgconfig/allegro*.pc
    - lib/cmake/allegro/
    - include/allegro5/
  pkg_config:
    # Shared-variant .pc names (static builds gain a "-static" infix).
    - allegro-5
    - allegro_audio-5
    - allegro_acodec-5
    - allegro_image-5
    - allegro_font-5
    - allegro_ttf-5
    - allegro_primitives-5
    - allegro_color-5
    - allegro_dialog-5
    - allegro_memfile-5
    - allegro_physfs-5
  cmake_packages:
    - name: Allegro
      targets:
        - "Allegro::allegro"
        - "Allegro::allegro_main"
        - "Allegro::allegro_audio"
        - "Allegro::allegro_acodec"
        - "Allegro::allegro_image"
        - "Allegro::allegro_font"
        - "Allegro::allegro_ttf"
        - "Allegro::allegro_primitives"
        - "Allegro::allegro_color"
        - "Allegro::allegro_dialog"
        - "Allegro::allegro_memfile"
        - "Allegro::allegro_physfs"
