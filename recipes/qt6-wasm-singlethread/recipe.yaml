schema_version: 1
recipe:
  name: qt6-wasm-singlethread
  upstream_version: "6.8.2"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [graphics, wasm]
  # Qt 6 built for the wasm_singlethread target.  Produces static .a
  # libraries that link into Emscripten-compiled WASM applications.
  # The host-side tools (moc, rcc, uic) are native binaries bundled
  # inside for convenience so consumers don't need a separate native
  # Qt6 install at matching version.

source:
  type: tarball
  url: https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtbase-everywhere-src-6.8.2.tar.xz
  sha256: "012043ce6d411e6e8a91fdc4e05e6bedcfa10fcb1347d3c33908f7fdd10dfe05"
  strip_components: 1

patches: []

depends:
  build:
    - name: emsdk
      version: ">=5.0"
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja
    - perl
    - python3

build:
  matrix:
    # The target artifacts are wasm, but the build runs on a native host.
    # Each entry represents the host platform used to cross-compile;
    # the output .a files are wasm regardless.
    - platform: wasm
      host_platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -std=c++17"
    - platform: wasm
      host_platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasm
      host_platform: windows
      script: build.ps1

package:
  files:
    - lib/libQt6*
    - lib/Qt6*
    - lib/cmake/Qt6*/
    - lib/qt6/
    - include/Qt*/
    - bin/moc*
    - bin/rcc*
    - bin/uic*
    - bin/qmake*
    - plugins/
    - mkspecs/wasm-emscripten/
  cmake_packages:
    - { name: Qt6, targets: ["Qt6::Core", "Qt6::Gui", "Qt6::Widgets"] }

abi:
  cxx_std: 17
  link: static
