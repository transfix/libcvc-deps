schema_version: 1
recipe:
  name: shiboken6-cp311
  upstream_version: "6.8.2"
  # Bumped 2 -> 3: the first Windows build (+cvc.2) shipped a broken
  # Shiboken6Config.abi3.cmake — cmake baked the absolute build-time install dir
  # (C:\Users\...\install\Lib\site-packages\shiboken6) into SHIBOKEN_PYTHON_MODULE_DIR
  # instead of a relocatable path, so a downstream find_package(Shiboken6) (pyside6)
  # died with "Invalid character escape '\U'". build.ps1 now runs
  # Invoke-CvcRewriteInstallPaths to anchor the config at ${CMAKE_CURRENT_LIST_DIR}.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://doc.qt.io/qtforpython/shiboken6/
  # Qt-for-Python is tri-licensed LGPL-3.0-only / GPL-2.0-only / GPL-3.0-only
  # (plus a commercial option). We consume it under LGPL-3.0-only, same as qt6.
  license: LGPL-3.0-only
  tags: [python, bindings, codegen]
  description: >-
    Shiboken6 6.8.2 (cp311) — the CPython<->C++ binding layer of Qt for Python,
    built from the Qt `pyside-setup` v6.8.2 source tree (sources/shiboken6).
    Ships THREE things used by the rest of the stack: (1) `libshiboken6` — the
    runtime C++ support library that PySide6's per-module bindings link against;
    (2) the importable `shiboken6` Python package (cp311) that exposes
    `wrapInstance(addr, PyType)` / `getCppPointer()` — the exact API a volrover3
    embedded interpreter uses to adopt the app's live cvcpkg-Qt QMainWindow; and
    (3) the `shiboken6` code generator (bin/shiboken6, links QtCore) plus the
    Shiboken6 CMake config that the `pyside6` recipe consumes to generate its
    bindings. Built against the cvcpkg python311 interpreter and the cvcpkg qt6
    6.8.2 — the SAME Qt PySide6 and the host app link, so there is one
    libQt6Core in-process. The ApiExtractor parser links the hermetic cvcpkg llvm18
    (see the CLANG COUPLING note below); the cvcpkg `llvm` recipe is deliberately NOT used
    because it is LLVM 22, newer than shiboken 6.8.2 supports. Built with
    FORCE_LIMITED_API against cp311, then abi3-fanned into every cvcpkg
    interpreter (cp311/cp312/cp313) — see the `python:` block below — so a
    single build covers the whole non-free-threaded matrix.

source:
  # Qt for Python is released as one `pyside-setup` source tarball that contains
  # BOTH sources/shiboken6 and sources/pyside6. This recipe configures only the
  # sources/shiboken6 CMake sub-project; the `pyside6` recipe uses the same
  # pinned tarball + sha256 and configures sources/pyside6.
  type: tarball
  url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2-src/pyside-setup-everywhere-src-6.8.2.tar.xz
  sha256: "8422e9aa403f4119e3192853e9b0cfa09e57e3e0a1a3393e7fdf394179c112f8"
  strip_components: 1

# FORCE_LIMITED_API=yes (build.sh) makes the compiled .so's abi3, but this
# recipe is the explicit cp311 COLUMN of the matrix: it installs only into
# python3.11's site-packages and depends on python311 alone.
python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - cmake
    - ninja
    # Bindings + libshiboken are built against the cvcpkg python311 interpreter
    # (cp311); the ABI must match pycvc / numpy-cp311 / the embedded host.
    - name: python311
    # The `shiboken6` generator links QtCore, and libshiboken is built against
    # the same Qt headers the host app uses. Pin to the exact in-process Qt.
    - name: qt6
      version: "6.8.2"
    # Hermetic libclang 18 for shiboken's ApiExtractor: find_package(Clang CONFIG)
    # (ClangConfig.cmake), libclang the generator links, and the Clang builtin
    # (resource) headers under lib/clang/<ver>/include the parser needs at
    # generation time. Pinned to 18 — the top-level `llvm` recipe (LLVM 22) is too
    # new for shiboken 6.8.2. Replaces the former SYSTEM libclang-18 requirement.
    - name: llvm18
      version: "18.1.8"
  runtime:
    # The shiboken6 Python module (wrapInstance) imports against this cp311.
    - name: python311
    # The shipped generator binary loads libQt6Core; pin to the exact ABI so it
    # matches PySide6 and the in-process host Qt.
    - name: qt6
      version: "6.8.2"
    # bin/shiboken6 links libclang — keep it resolvable when a consumer (pyside6)
    # runs the generator.
    - name: llvm18
      version: "18.1.8"
  host_tools:
    - cmake
    - ninja
    - python311

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1

package:
  files:
    # Code generator (used at pyside6 build time) + its CMake export.
    - bin/shiboken6*
    # Runtime C++ support library PySide6 bindings link against.
    - lib/libshiboken6*
    # Importable abi3 Python package, fanned into every interpreter
    # (cp311/cp312/cp313): exposes wrapInstance / getCppPointer.
    - lib/python3.*/site-packages/shiboken6/
    - lib/python3.*/site-packages/shiboken6_generator/
    # CMake config consumed by the `pyside6` recipe: find_package(Shiboken6).
    - lib/cmake/Shiboken6*/
    # Public headers for anything that links libshiboken directly.
    - include/shiboken6*/
    # Windows layout (globs matching nothing are skipped): DLLs land in bin/,
    # import libs in lib/, and the importable package under Lib/site-packages/.
    - bin/shiboken6*.dll
    # Defensive: the runtime DLL may install to lib/ instead of bin/ (the
    # Shiboken6 config advertises SHIBOKEN_SHARED_LIBRARY_DIR=<prefix>/lib) —
    # harmless if empty, but avoids silently shipping without the DLL.
    - lib/shiboken6*.dll
    - lib/shiboken6*.lib
    - Lib/site-packages/shiboken6/
    - Lib/site-packages/shiboken6_generator/
  cmake_packages:
    - {
        name: Shiboken6,
        targets: ["Shiboken6::libshiboken", "Shiboken6::shiboken6"],
      }

abi:
  cxx_std: 17

notes: >-
  SINGLE-QT / NO-BUNDLE CONTRACT: this recipe builds the sources/shiboken6 CMake
  project directly (route b), NOT via setup.py --standalone. The direct CMake
  path does not copy Qt or libclang into the install tree, so shiboken6 links
  the cvcpkg qt6 by soname and there is one libQt6Core in-process. Never enable
  STANDALONE here.

  CLANG COUPLING: the generator is validated against LLVM/Clang 18, provided
  hermetically by the cvcpkg `llvm18` dependency. shiboken 6.8.2's setup_clang()
  runs find_package(Clang CONFIG REQUIRED) and warns below 18.0 (hard-fails below
  14.0); the runtime parser additionally needs the Clang builtin/resource headers
  (lib/clang/18/include), which llvm18 packages. build.sh sets LLVM_INSTALL_DIR to
  the dependency prefix (where llvm18 installs ClangConfig.cmake + libclang + the
  resource headers), falling back to a system /usr/lib/llvm-18 only if absent.

  LIMITED API: built with FORCE_LIMITED_API=yes (upstream default → stable-ABI
  .abi3.so). pyside6 MUST be built with the same setting. Set FORCE_LIMITED_API=no
  in build.sh if a strict cp311-tagged (non-abi3) build is wanted instead.

  PER-INTERPRETER COLUMN: this is shiboken6's cp311 column — built against and
  installed under python3.11 only, depending on python311 alone. Further
  columns (shiboken6-cp312, ...) are this recipe rebuilt against their own
  interpreter; cp313t is impossible while FORCE_LIMITED_API=yes (no stable
  ABI on the free-threaded build). Must stay in lockstep with the matching
  pyside6-cp311 (same FORCE_LIMITED_API setting, revisions bumped together).
