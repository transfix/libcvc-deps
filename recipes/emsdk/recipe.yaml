schema_version: 1
recipe:
  name: emsdk
  upstream_version: "5.0.7"
  cvc_revision: 2
  maintainer: "Emscripten Contributors"
  homepage: https://emscripten.org/
  license: MIT
  tags: [tools, wasm]
  description: >-
    The Emscripten SDK provides the C/C++ → wasm compiler toolchain.
    This is a build-time host tool — it runs natively on the build host
    and cross-compiles to the "wasm" platform target.

cross_toolchain:
  target_platforms: [wasm, wasm-mt]
  env:
    CVC_EMSDK_DIR: "${PREFIX}"

source:
  type: prebuilt
  url: https://github.com/emscripten-core/emsdk.git
  # The build script clones, installs, and activates the emsdk at a pinned tag.
  # No tarball — emsdk is a release bundler that downloads its own toolchain.

patches: []

depends:
  build: []
  host_tools:
    - python3

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
      env: {}
    - platform: macos
      script: build.sh
      env: {}
    - platform: windows
      script: build.ps1

package:
  # The COMPLETE emsdk tree that build.sh stages.  The previous list omitted
  # emsdk.py, the json manifests and the .emscripten config -- and `pack`
  # IGNORES unmatched globs silently ('emsdk/' matched nothing: emsdk is a
  # FILE at the repo root, not a directory), so the archive shipped without
  # the launcher emsdk_env.sh needs.  Every fleet wasm build then died with
  # emsdk's "unable to determine 'emsdk' directory", which is what got the
  # fleet written off as wasm-incapable in August (cyberpcangel-cvcgl#7,
  # libcvc-deps#531) and the demos downgraded to single-threaded.
  files:
    - emsdk
    - emsdk.py
    - emsdk.bat
    - emsdk.ps1
    - emsdk_env.sh
    - emsdk_env.ps1
    - emsdk_env.bat
    - emsdk_env.csh
    - emsdk_env.fish
    - emsdk_manifest.json
    - emscripten-releases-tags.json
    - .emscripten
    - upstream/
    - node/
    - bin/

toolchain:
  python:
    min_version: "3.8"
    description: "Python 3 is required by the emsdk installer"
  note: >-
    The emsdk is itself a toolchain provider.  It downloads and manages
    its own compiler (emcc/em++) and system libraries internally.

notes:
  - title: "Large download (~3 GB)"
    platforms: [linux, macos, windows]
    description: >-
      The emsdk install step downloads the Emscripten compiler, system
      headers, and precompiled system libraries.  Total download is
      approximately 3 GB.
  - title: "Self-contained git clone approach"
    platforms: [linux, macos, windows]
    description: >-
      The recipe uses source type 'prebuilt' and clones the emsdk git
      repo in the build script, since emsdk is a release bundler that
      downloads its own toolchain rather than being a traditional tarball.
