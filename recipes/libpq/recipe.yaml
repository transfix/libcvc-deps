schema_version: 1
recipe:
  name: libpq
  upstream_version: "18.4"
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.postgresql.org/
  license: PostgreSQL
  tags: [database]
  description: >-
    libpq — the PostgreSQL C client library, built standalone.
    Enables Qt6 QPSQL SQL driver plugin and libcvc database layer.
    Only the client library is built, not the PostgreSQL server.

source:
  type: tarball
  url: https://github.com/postgres/postgres/archive/refs/tags/REL_18_4.tar.gz
  sha256: "9b4f86dd2ac00b914582e9893d1bad1f54bc9be7108fa794318b8184f921ec08"
  strip_components: 1

patches: []

depends:
  build:
    - ninja
    - meson
    - pkg-config
    - bison
    - flex
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: zstd
      version: "^1.5"
    - name: lz4
      version: "^1.9"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: gettext
      version: "^1.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: krb5
      version: "^1.21"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libpq*
    - lib/*/libpq*
    - lib/pq*
    - lib/pkgconfig/libpq.pc
    - lib/*/pkgconfig/libpq.pc
    - include/libpq-fe.h
    - include/libpq-events.h
    - include/libpq/
    - include/pg_config*.h
    - include/postgres_ext.h
  cmake_packages:
    - { name: PostgreSQL, targets: ["PostgreSQL::PostgreSQL"] }

abi:
  cxx_std: 17

toolchain:
  cc:
    min_version: "any"
    description: "C99-capable compiler"
  meson:
    min_version: "0.54"
    description: "Meson build system required by PostgreSQL >= 16"

notes:
  - title: "Meson build system required"
    platforms: [linux, macos]
    description: >-
      PostgreSQL 16+ uses Meson as its build system.  The meson and
      ninja host tools must be available.  On Ubuntu: apt install meson ninja-build.
  - title: "flex and bison required"
    platforms: [linux, macos]
    description: >-
      PostgreSQL requires flex and bison to build its parsers.
      On Ubuntu: apt install flex bison.
  - title: "Full PostgreSQL built, only libpq packaged"
    platforms: [linux, macos, windows]
    description: >-
      The meson build builds the entire PostgreSQL tree including the
      server.  Only libpq client library artifacts are selected by the
      package.files globs.  This is because PostgreSQL's meson build
      does not support building just libpq standalone.
  - title: "Multiarch library path on Debian/Ubuntu"
    platforms: [linux]
    description: >-
      On Debian-based systems, meson installs libraries to
      lib/x86_64-linux-gnu/ instead of lib/.  The package.files globs
      include lib/*/libpq* to handle this.
