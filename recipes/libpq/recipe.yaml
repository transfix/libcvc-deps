schema_version: 1
recipe:
  name: libpq
  upstream_version: "18.4"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  homepage: https://www.postgresql.org/
  license: PostgreSQL
  tags: [database]
  # libpq — the PostgreSQL C client library, built standalone.
  # Enables Qt6 QPSQL SQL driver plugin and libcvc database layer.
  # Only the client library is built, not the PostgreSQL server.

source:
  type: tarball
  url: https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2
  sha256: "FIXME"  # Compute: curl -sL <url> | sha256sum
  strip_components: 1

patches: []

depends:
  build:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
  host_tools:
    - meson
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libpq*
    - lib/pq*
    - lib/pkgconfig/libpq.pc
    - include/libpq-fe.h
    - include/libpq-events.h
    - include/libpq/
    - include/pg_config*.h
    - include/postgres_ext.h
  cmake_packages:
    - { name: PostgreSQL, targets: ["PostgreSQL::PostgreSQL"] }

abi:
  cxx_std: 17
