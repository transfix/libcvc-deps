schema_version: 1
recipe:
  name: numpy-cp313t
  upstream_version: "2.4.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://numpy.org/
  license: BSD-3-Clause
  tags: [math, python, wheel]
  description: >-
    NumPy 2.4.6 for CPython 3.13 free-threaded (cp313t, no-GIL) — the cp313t column of cvcpkg's
    per-interpreter wheel matrix.  The wheel is pinned by filename + sha256
    and installed into the python313t interpreter's own site-packages inside
    the prefix, so one activatable prefix carries both the native C/C++
    libraries and a complete, pinned Python environment.
    The cp313t column is the flagship of the matrix: this wheel is
    installed into the free-threaded interpreter and its check runs with
    the GIL *disabled* on every platform we publish for, so the no-GIL
    support is demonstrated rather than assumed.

