schema_version: 1
recipe:
  name: gymnasium-cp312
  upstream_version: "1.3.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/gymnasium/
  license: "MIT"
  tags: [python, source]
  description: >-
    gymnasium 1.3.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/4d/ff/14b6880d703dfaca204490979d3254ccd280c99550798993319902873658/gymnasium-1.3.0.tar.gz
  sha256: "6939e86e835d6b71b6ba6bfd360487420876deafc79bfb7bacba83a7c446bcf3"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: cloudpickle-cp312
    - name: farama-notifications-cp312
    - name: numpy-cp312
    - name: typing-extensions-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
  runtime:
    - name: python312
    - name: cloudpickle-cp312
    - name: farama-notifications-cp312
    - name: numpy-cp312
    - name: typing-extensions-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.12/site-packages/gymnasium/
    - lib/python3.12/site-packages/gymnasium-*.dist-info/
    - Lib/site-packages/gymnasium/
    - Lib/site-packages/*.dist-info/
