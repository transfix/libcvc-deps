schema_version: 1
recipe:
  name: pyinstaller-cp311
  upstream_version: "6.21.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pyinstaller.org/
  license: "GPL-2.0-or-later WITH Bootloader-exception"
  tags: [python, packaging]
  description: >-
    PyInstaller 6.21.0 for CPython 3.11 (cp311), BUILT FROM SOURCE. The
    PyPI wheels are py3-none-<plat> archives of a PREBUILT bootloader, and
    upstream publishes none for the BSDs; building the sdist compiles the
    bootloader here, so the BSD columns exist at all and every column ships a
    launcher we produced ourselves.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches +
# sha256-verifies this tarball and extracts it to CVC_SOURCE_DIR, which is what
# lets patches/ below apply to a real source tree.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/d5/4d/ec706c3fcf39e26888c35b39615ff4d5865d184069666c47492cff1fbe50/pyinstaller-6.21.0.tar.gz
  sha256: "bb9fab705983e393a2d1cac77d6972513057ad800215fd861dc15ff5272e98fd"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

# Teaches the bootloader build about NetBSD. Upstream's bootloader/wscript has
# no 'netbsd' in DESTOS_TO_SYSTEM, so compiling there dies with
# KeyError: 'netbsd'; it also lacks NetBSD/OpenBSD in SYSTEM_TO_BUILDOS, which
# makes a native build on either look like a cross-compilation.
# Submitted upstream as pyinstaller/pyinstaller#9496 — drop this once a release
# carries the fix.
patches:
  - netbsd-platform-tables.patch

depends:
  build:
    - name: python311
    # PEP-517 backend, imported by the build interpreter under
    # --no-build-isolation (hatchling pulls packaging/pathspec/pluggy/
    # trove-classifiers columns).
    - name: hatchling-cp311
    # zlib headers: the bootloader links libz (bootloader/wscript probes it).
    - name: zlib
  runtime:
    - name: python311
    - name: altgraph-cp311
    - name: packaging-cp311
    - name: pyinstaller-hooks-contrib-cp311
    - name: setuptools-cp311
    - name: zlib
  host_tools:
    - python311

provides:
  - pyinstaller

build:
  # The Python ABI is stable across cvcpkg build types; build once.
  build_type_independent: true
  # Every platform compiles its own bootloader from the same sdist. The BSDs are
  # the whole point: upstream ships no wheel for them, so a python_wheel recipe
  # could not express these columns at all.
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/PyInstaller/
    - lib/python3.11/site-packages/pyinstaller-*.dist-info/
    - bin/pyinstaller
    - bin/pyi-makespec
    - bin/pyi-archive_viewer
    - bin/pyi-bindepend
    - bin/pyi-grab_version
    - bin/pyi-set_version
    - Lib/site-packages/PyInstaller/
    - Lib/site-packages/pyinstaller-*.dist-info/
    - Scripts/pyinstaller.exe
