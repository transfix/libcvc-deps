schema_version: 1
recipe:
  name: pygments
  upstream_version: "2.20.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pygments/
  license: "BSD-2-Clause"
  tags: [python, wheel, build-tool]
  description: >-
    pygments 2.20.0 (noarch py3-none-any) — the syntax highlighter pytest uses to colourise tracebacks. A BUILD-TIME
    lint/test tool for cvcpkg recipes: it lands in the build prefix as a
    depends.build edge (so a recipe `test:` block can run it) and is stripped
    from the deliverable — never shipped to users.

# Pure-Python noarch wheel (py3-none-any): one platform-independent artifact.
# platform: any + a reference interpreter -> the builder fans it into EVERY
# interpreter's site-packages, so one bare recipe serves all.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/f4/7e/a72dd26f3b0f4f2bf1dd8923c85f7ceb43172af56d63c7383eb62b332364/pygments-2.20.0-py3-none-any.whl
      sha256: "81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/pygments/
    - lib/python3.*/site-packages/pygments-*.dist-info/
