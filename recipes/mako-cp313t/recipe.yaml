schema_version: 1
recipe:
  name: mako-cp313t
  upstream_version: "1.3.12"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/mako/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    mako 1.3.12 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/bc/b1/a0ec7a5a9db730a08daef1fdfb8090435b82465abbf758a596f0ea88727e/mako-1.3.12-py3-none-any.whl
      sha256: "8f61569480282dbf557145ce441e4ba888be453c30989f879f0d652e39f53ea9"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: markupsafe-cp313t
  runtime:
    - name: python313t
    - name: markupsafe-cp313t

provides:
  - mako

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/mako/
    - lib/python3.13t/site-packages/*.dist-info/
    - bin/mako-render
