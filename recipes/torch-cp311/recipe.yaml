schema_version: 1
recipe:
  name: torch-cp311
  upstream_version: "2.8.0"
  # Bumped 1 -> 2: noarch python deps renamed to their -cp311 columns
  # (the bare-name + fanout model is retired; see tools/gen_python_recipes.py).
  # Bumped 2 -> 3: add the windows-x86_64 column. torch is a
  # PREBUILT_ONLY package (there is no realistic from-source build of
  # PyTorch in this fleet), so windows follows the same pinned,
  # sha256-verified artifact pattern linux already uses — the official
  # CPU wheel from download.pytorch.org, not a resolver-chosen one.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pytorch.org/
  license: BSD-3-Clause
  tags: [python, wheel, ml, tensor, scientific]
  description: >-
    PyTorch 2.8.0 (CPU build) for CPython 3.11 (cp311) — the pinned prebuilt
    manylinux_2_28 CPU wheel from the official PyTorch index, installed into the
    python311 interpreter's site-packages. torch is NOT built from source (an
    impractical multi-hour MKL/CUDA build); it is the roadmap's canonical
    "ship-good-manylinux-wheels" package. This is the CPU variant (no CUDA / no
    nvidia-* deps) — sufficient for the GRL-SNAM surrogate-dynamics numerics and
    the grl-snam-selftest correctness demo. A CUDA torch-cp311-cuda variant + the
    macOS/Windows columns are follow-ups.

# Prebuilt CPU wheel from download.pytorch.org (not PyPI — PyPI's linux torch is
# the ~2GB CUDA build). cvcpkg fetches + sha256-verifies it, then build.sh
# pip-installs it offline into the prefix interpreter's site-packages.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl
      sha256: "cb06175284673a581dd91fb1965662ae4ecaba6e5c357aa0ea7bb8b84b6b7eeb"
    windows-x86_64:
      url: https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp311-cp311-win_amd64.whl
      sha256: "7631ef49fbd38d382909525b83696dc12a55d68492ade4ace3883c62b9fc140f"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_28

patches: []

depends:
  build:
    - name: python311
  runtime:
    # torch's Requires-Dist (CPU build) — each resolved to the cp311 column.
    - name: python311
    - name: numpy-cp311
    - name: typing-extensions-cp311
    - name: setuptools-cp311
    - name: sympy-cp311
    - name: networkx-cp311
    - name: jinja2-cp311
    - name: fsspec-cp311
    - name: filelock-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1
    # macOS (CPU) + Windows (CPU) columns are a follow-up; the CUDA variant is a
    # separate torch-cp311-cuda recipe (pulls nvidia-*-cu wheels).

package:
  files:
    # torch bundles its own libs under torch/lib/ (auditwheel-vendored); the whole
    # package tree ships. The dist-info dir is "torch-2.8.0+cpu.dist-info".
    - lib/python3.11*/site-packages/torch/
    - lib/python3.11*/site-packages/torchgen/
    - lib/python3.11*/site-packages/functorch/
    - lib/python3.11*/site-packages/torch-2.8.0*.dist-info/

abi:
  cxx_std: 17
