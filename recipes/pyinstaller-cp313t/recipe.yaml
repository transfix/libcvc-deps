python:
  interpreter: python313t
  abi: cp313t
  manylinux_min: manylinux_2_17

patches: []

depends:
  build:
    - name: python313t
    - name: altgraph-cp313t
    - name: packaging-cp313t
    - name: pyinstaller-hooks-contrib-cp313t
    - name: setuptools-cp313t
  runtime:
    - name: python313t
    - name: altgraph-cp313t
    - name: packaging-cp313t
    - name: pyinstaller-hooks-contrib-cp313t
    - name: setuptools-cp313t

provides:
  - pyinstaller

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13t/site-packages/PyInstaller/
    - lib/python3.13t/site-packages/pyinstaller-*.dist-info/
    - bin/pyinstaller
    - bin/pyi-makespec
    - bin/pyi-archive_viewer
    - bin/pyi-bindepend
    - bin/pyi-grab_version
    - bin/pyi-set_version
    - Lib/site-packages/pyinstaller/
    - Lib/site-packages/*.dist-info/
