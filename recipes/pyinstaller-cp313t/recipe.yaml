recipe:
  name: pyinstaller-cp313t
  upstream_version: "6.21.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pyinstaller/
  license: "GPL-2.0-or-later WITH Bootloader-exception"
  tags: [python, wheel]
  description: >-
    pyinstaller 6.21.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (platform wheel with no ABI tag, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

