      sha256: "7071d4b094d5b40deeef5fa3d3b98a1b846087f7562b49209663d5f9281fe251"
    macos-x86_64:
      url: https://files.pythonhosted.org/packages/0c/4a/53cf98bf66daed012dc9cd78c8203f19a675d696f2fc12afcf8c5049a0e0/pyinstaller-6.21.0-py3-none-macosx_10_13_universal2.whl
