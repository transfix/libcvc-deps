schema_version: 1
recipe:
  name: pytest-cp311
  upstream_version: "9.1.1"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pytest/
  license: "MIT"
  tags: [python, source]
  description: >-
    pytest 9.1.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/e4/47/b9efed96c114afcfa3c9d3fe98a76a1d14c74a9e266d397cf6eb64be5e01/pytest-9.1.1.tar.gz
  sha256: "1088fbde8f2b49d95a549a195707afa7a76a3ce9bcadc26b6d71f0ffda5fe313"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: iniconfig-cp311
    - name: packaging-cp311
    - name: pluggy-cp311
    - name: pygments-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: setuptools-scm-cp311
    - name: trove-classifiers-cp311
  runtime:
    - name: python311
    - name: iniconfig-cp311
    - name: packaging-cp311
    - name: pluggy-cp311
    - name: pygments-cp311
  host_tools:
    - python311

provides:
  - pytest

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.11/site-packages/_pytest/
    - lib/python3.11/site-packages/pytest/
    - lib/python3.11/site-packages/py.py
    - lib/python3.11/site-packages/pytest-*.dist-info/
    - bin/pytest
    - bin/py.test
    - Lib/site-packages/pytest/
    - Lib/site-packages/*.dist-info/
