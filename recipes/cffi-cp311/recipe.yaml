schema_version: 1
recipe:
  name: cffi-cp311
  upstream_version: "2.0.0"
  # Bumped 2 -> 3: converted from the prebuilt PyPI wheel to a FROM-SOURCE
  # sdist build. The published cffi wheel statically links an auditwheel-supplied
  # libffi we neither built nor track, and PyPI ships NO FreeBSD/OpenBSD/NetBSD
  # wheel at all — the whole reason cffi was missing on the three BSDs. Building
  # from the sdist links cvcpkg's OWN libffi (recipes/libffi, libffi.so.8) by
  # soname, resolved at runtime out of the SAME activated prefix, so there is
  # exactly one libffi in the process no matter who else pulled one in. New dep
  # edges: libffi (build+runtime, non-Windows), pkg-config (cffi's setup.py
  # discovers libffi by shelling out to it), and the setuptools-cp311 PEP-517
  # backend that --no-build-isolation requires to already be in the prefix.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cffi/
  license: "MIT"
  tags: [python, wheel]
  description: >-
    cffi 2.0.0 for CPython 3.11 (cp311) — the cp311 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE against cvcpkg's OWN libffi rather
    than installed from the PyPI wheel. _cffi_backend links libffi.so.8 by soname
    and resolves it, at runtime, out of the SAME activated prefix via an $ORIGIN
    RUNPATH — no auditwheel-vendored static copy, so a process that also loads
    libffi through GLib/GStreamer sees one libffi, not two. Building from the
    sdist is also the ONLY option on the BSDs, for which PyPI ships no cffi wheel.
    On Windows cffi compiles the libffi subset vendored in its own sdist (the copy
    CPython ships), so the libffi edge does not apply there. Installed as a proper
    wheel (real dist-info/RECORD/METADATA) via pip, so a user's later
    `pip install <other>` coexists and pip's resolver sees cffi as satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles it there with pip + the PEP-517 backend
# already present in the build prefix. The sha256 is upstream's own sdist digest
# from the PyPI JSON API, re-derived from the downloaded tarball.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/eb/56/b1ba7935a17738ae8453301356628e8147c79dbb825bcbc73dc7401f9846/cffi-2.0.0.tar.gz
  sha256: "44d1b5909021139fe36001ae048dbdde8214afa20200eda0f64c068cac5d5529"
  strip_components: 1

# Interpreter/ABI metadata: the builder exports these to build.sh as
# CVC_PYTHON_INTERPRETER / CVC_PYTHON_ABI so cvc_python_exe resolves the prefix's
# python3.11 and the wheel lands in ITS site-packages. manylinux_min is gone
# with the prebuilt wheel it used to describe — nothing is downloaded any more,
# so there is no wheel tag to floor.
python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    # The interpreter the extension is compiled against and installed into.
    - name: python311
    # PEP-517 backend (cffi's pyproject requires setuptools>=66.1). Build-only,
    # so build.sh bridges it out of CVC_BUILD_PREFIX onto PYTHONPATH.
    - name: setuptools-cp311
    # ffi.h + libffi.so.8 to compile and link _cffi_backend against.
    # NOT on Windows: there, cffi's setup.py compiles the libffi subset vendored
    # in its own sdist (src/c/libffi_x86_x64, the copy CPython ships) and never
    # looks for an external one, so declaring the edge would be a lie the closure
    # checker would then have to satisfy.
    - name: libffi
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    # cffi's setup.py discovers libffi by shelling out to pkg-config; if that
    # probe fails it silently falls back to /usr/include/ffi and links the SYSTEM
    # libffi. build.sh pins PKG_CONFIG/PKG_CONFIG_LIBDIR at our prefixes and
    # asserts the probe resolves, so this tool is load-bearing, not incidental.
    - name: pkg-config
  runtime:
    # At import, _cffi_backend pulls libffi.so.8 out of the merged prefix, and
    # cffi.cparser imports pycparser.
    - name: python311
    - name: pycparser-cp311
    - name: libffi
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  host_tools:
    # Must run on the BUILDER: the interpreter (drives pip and the compile),
    # pkg-config (the libffi probe), and patchelf to stamp the relocatable
    # $ORIGIN RUNPATH into _cffi_backend*.so on ELF platforms (Linux/BSD).
    - python311
    - pkg-config
    - patchelf

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type — and on Windows a Debug extension would want the debug CRT the release
  # interpreter does not have — so build once, optimized.
  build_type_independent: true
  # One build.sh covers Linux, macOS and all three BSDs (each sources its own
  # _common/env-<platform>.sh). The three BSD entries are new and are the point of
  # this revision: they were impossible while the recipe consumed a PyPI wheel,
  # because PyPI publishes none for them — and libffi already builds on all three.
  # Windows is a real from-source build too, but a genuinely different one: MSVC
  # takes cffi's vendored libffi subset instead of ours, so build.ps1 has no
  # pkg-config probe and no rpath pass. wasm/wasi/cosmo stay out — libffi has no
  # wasi backend at all (see recipes/libffi notes) and the static interpreter has
  # no extension-module ABI.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        # Same floor as the python311 recipe, and as the libffi it links — an extension built
        # for a different deployment target than the interpreter that loads it is
        # exactly the mismatch this pin exists to prevent.
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY. cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR
  # tree — package.files is parsed but NOT applied as a filter. build.sh keeps
  # the staged tree pure by pip-installing --prefix into an initially empty
  # per-recipe CVC_INSTALL_DIR, so the entries below are exactly what ships.
  files:
    - lib/python3.11/site-packages/cffi/
    - lib/python3.11/site-packages/_cffi_backend*
    - lib/python3.11/site-packages/*.dist-info/
    # Windows (build.ps1) site-packages scheme.
    - Lib/site-packages/cffi/
    - Lib/site-packages/_cffi_backend*
    - Lib/site-packages/*.dist-info/
