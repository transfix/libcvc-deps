schema_version: 1
recipe:
  name: libpng
  upstream_version: "1.6.44"
  # Added wasm/wasi/cosmo entries.  libpng is plain C over zlib, which already
  # covers all three; the cross scripts force the static-only target set and
  # take the portable C path instead of the x86/ARM/POWER/MIPS intrinsics.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: http://www.libpng.org/pub/png/libpng.html
  license: Libpng
  tags: [libraries, wasm, wasi]
  description: >-
    libpng — the official reference library for reading, creating, and
    manipulating PNG image files.  Required by FreeType, Cairo, and
    GDK-Pixbuf.

source:
  type: tarball
  url: https://download.sourceforge.net/libpng/libpng-1.6.44.tar.xz
  sha256: "60c4da1d5b7f0aa8d158da48e8f8afa9773c1c8baa5d21974df61f1886b8ce8e"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libpng16*
    - lib/libpng*
    - lib/pkgconfig/libpng*.pc
    - lib/cmake/PNG/
    - include/png*.h
    - include/libpng16/
    - bin/libpng*-config
    - bin/png-fix-itxt
    - bin/pngfix
  cmake_packages:
    - { name: PNG, targets: ["PNG::PNG"] }
  pkg_config:
    - libpng
    - libpng16

abi:
  cxx_std: 17
