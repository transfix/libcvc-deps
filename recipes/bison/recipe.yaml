schema_version: 1
recipe:
  name: bison
  upstream_version: "3.8.2"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/bison/
  license: GPL-3.0-or-later
  tags: [tools, codegen]
  description: >-
    GNU Bison — parser generator required by SWIG and other code generators.
    Build-time host tool only.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.gz
  sha256: "06c9e13bdf7eb24d4ceb6b59205a4f67c2c7e7213119644430fe82fbd14a0abb"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools:
    - m4

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/bison*
    - bin/yacc*
    - lib/liby*
    - share/bison/
    - share/aclocal/bison*
    - share/man/man1/bison*

toolchain:
  cc:
    min_version: "any"
    description: "C99-capable compiler (gcc, clang, or MSVC)"

notes:
  - title: "Windows uses winflexbison pre-built binaries"
    platforms: [windows]
    description: >-
      On Windows the recipe downloads winflexbison pre-built binaries
      instead of building GNU Bison from source, since the autotools
      build system is not available.
