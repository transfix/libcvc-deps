schema_version: 1
recipe:
  name: openssl
  upstream_version: "3.4.1"
  # Bumped 3 -> 4: added the cosmo build. cosmocc is an ordinary x86_64 C
  # toolchain with a POSIX libc, so unlike the wasm/wasi targets this needs
  # neither no-sock nor -DNO_FORK; only the APE-inherent limits (static single
  # file, so no shared/dso/engine) are compiled out. python31x already declared
  # cosmo and runtime-depends on openssl, so this was also an unresolvable claim.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "OpenSSL — a robust, full-featured toolkit for TLS/SSL and general-purpose cryptography."
  homepage: https://www.openssl.org/
  license: Apache-2.0
  tags: [networking, crypto, wasm]

source:
  type: tarball
  url: https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz
  sha256: "002a2d6b30b58bf4bea46c43bdd96365aaf8daa6c428782aa4feee06da197df3"
  strip_components: 1

patches: []

depends:
  build:
    - nasm
    # OpenBSD's cvcpkg perl build is broken (missing core modules like strict.pm),
    # so ./Configure aborts.  Use the base-system perl on OpenBSD instead — it has
    # everything openssl's Configure + build scripts need.
    - name: perl
      platforms: [linux, macos, freebsd, netbsd, windows]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libssl*
    - lib/libcrypto*
    - lib/engines-3/
    - lib/ossl-modules/
    - lib/cmake/OpenSSL/
    - lib/pkgconfig/openssl*
    - lib/pkgconfig/libssl*
    - lib/pkgconfig/libcrypto*
    - include/openssl/
    - bin/openssl*
  cmake_packages:
    - { name: OpenSSL, targets: ["OpenSSL::SSL", "OpenSSL::Crypto"] }

abi:
  cxx_std: 17
