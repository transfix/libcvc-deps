schema_version: 1
recipe:
  name: x264
  upstream_version: "0.164.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.videolan.org/developers/x264.html
  license: GPL-2.0-or-later
  tags: [libraries, multimedia, video]
  description: >-
    x264 — a free H.264/AVC video encoder.  Provides high-quality,
    fast H.264 encoding for FFmpeg (--enable-gpl --enable-libx264).
    Only the library is built; the standalone encoder CLI is omitted.
    This is a rolling snapshot of the upstream stable branch.

source:
  type: tarball
  url: https://code.videolan.org/videolan/x264/-/archive/stable/x264-stable.tar.gz
  sha256: "1108b94cd4c6943bc569afff1f8ec8c6034594a80d2baebc2b043bb438847485"
  strip_components: 1

patches: []

depends:
  build:
    - name: nasm
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - pkg-config
  runtime: []
  host_tools:
    # x264's configure/make is a GNU toolchain build. Declaring the compiler
    # here is what makes it hermetic: cvcpkg stages host_tools into the
    # EPHEMERAL build prefix and puts that bin/ first on PATH, so the build
    # uses our pinned gcc. Without it the Windows build silently falls through
    # to C:\msys64\mingw64\bin -- a toolchain cvcpkg never pinned or verified.
    #
    # It must NOT be installed into the runtime prefix instead: gcc in the
    # shared prefix shadows MSVC for every later CMake build against it
    # ("Check for working CXX compiler: .../dbg-deps/bin/c++.exe", followed by
    # link errors from mixing GCC objects with MSVC-built libraries).
    - mingw-w64-gcc

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libx264*
    - lib/pkgconfig/x264.pc
    - include/x264*.h
    - bin/libx264-*.dll
  pkg_config:
    - x264
