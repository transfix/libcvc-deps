schema_version: 1
recipe:
  name: nvidia-cufft-cu12-cp311
  upstream_version: "11.3.3"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/nvidia-cufft-cu12/
  license: "LicenseRef-NVIDIA-Proprietary"
  tags: [python, wheel, cuda, nvidia, gpu]
  description: >-
    nvidia-cufft-cu12 11.3.3.83 — prebuilt NVIDIA CUDA 12.8 runtime component (py3-none
    linux x86_64 wheel), a runtime dependency of torch-cp311-cuda. Installs its
    bundled CUDA .so libraries into the python311 site-packages `nvidia/`
    namespace; torch loads them at import. NOT built from source (proprietary
    NVIDIA redistributable). CUDA torch is GPU-only — see torch-cp311-cuda.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/1f/13/ee4e00f30e676b66ae65b4f08cb5bcbb8392c03f54f2d5413ea99a5d1c80/nvidia_cufft_cu12-11.3.3.83-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
      sha256: "4d2dd21ec0b88cf61b62e6b43564355e5222e4a3fb394cac0db101f2dd0d4f74"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_17

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/nvidia/
    - lib/python3.11*/site-packages/nvidia_cufft_cu12-*.dist-info/
