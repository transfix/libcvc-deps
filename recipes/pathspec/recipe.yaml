schema_version: 1
recipe:
  name: pathspec
  upstream_version: "1.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pathspec/
  license: "MPL-2.0"
  tags: [python, wheel, build-tool]
  description: >-
    pathspec 1.1.1 (noarch py3-none-any) — the gitignore-style path matcher black uses to honour excludes. A BUILD-TIME
    lint/test tool for cvcpkg recipes: it lands in the build prefix as a
    depends.build edge (so a recipe `test:` block can run it) and is stripped
    from the deliverable — never shipped to users.

# Pure-Python noarch wheel (py3-none-any): one platform-independent artifact.
# platform: any + a reference interpreter -> the builder fans it into EVERY
# interpreter's site-packages, so one bare recipe serves all.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
      sha256: "a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
  runtime:
    - name: python312
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.*/site-packages/pathspec/
    - lib/python3.*/site-packages/pathspec-*.dist-info/
