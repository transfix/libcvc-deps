schema_version: 1
recipe:
  name: setuptools-cp311
  upstream_version: "80.9.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/setuptools/
  license: "MIT"
  tags: [python, wheel, build-tool]
  description: >-
    setuptools 80.9.0 (noarch py3-none-any) for the python311 interpreter — a
    BUILD-TIME backend for cvcpkg from-source Python packages (numpy, h5py).
    Declared as a depends.build edge, so it lands in the build prefix and is
    stripped from the deliverable; never shipped to users.

# Pure-Python noarch wheel: one platform-independent artifact, but tied to the
# python311 interpreter (installs into ITS site-packages, where --no-build-
# isolation backends must be importable). The -cp311 suffix names that target.
source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl
      sha256: "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922"

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/setuptools/
    - lib/python3.11*/site-packages/pkg_resources/
    - lib/python3.11*/site-packages/_distutils_hack/
    - lib/python3.11*/site-packages/setuptools-*.dist-info/
