schema_version: 1
recipe:
  name: weasyprint-cp313
  upstream_version: "69.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/weasyprint/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    weasyprint 69.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/59/53/dcc3885c2f7a47faa45f6b8b801412f5f9e055173a52801ef01c09943c5a/weasyprint-69.0.tar.gz
  sha256: "a7a32f39ca16bd82ef11de99c92ea4b5f14951c9033af035e451ce4f4ee0a88c"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    - name: cffi-cp313
    - name: cssselect2-cp313
    - name: fonttools-cp313
    - name: pillow-cp313
    - name: pydyf-cp313
    - name: pyphen-cp313
    - name: tinycss2-cp313
    - name: tinyhtml5-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp313
  runtime:
    - name: python313
    - name: cffi-cp313
    - name: cssselect2-cp313
    - name: fonttools-cp313
    - name: pillow-cp313
    - name: pydyf-cp313
    - name: pyphen-cp313
    - name: tinycss2-cp313
    - name: tinyhtml5-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/weasyprint/
    - lib/python3.13/site-packages/weasyprint-*.dist-info/
    - Lib/site-packages/weasyprint/
    - Lib/site-packages/*.dist-info/
