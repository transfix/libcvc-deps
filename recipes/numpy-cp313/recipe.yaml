schema_version: 1
recipe:
  name: numpy-cp313
  upstream_version: "2.4.6"
  # Bumped 1 -> 2: switched from the prebuilt PyPI wheel to a
  # FROM-SOURCE meson-python build, matching numpy-cp311. The wheel bundles
  # its own auditwheel-vendored libscipy_openblas64_*.so, which does not load
  # inside a cvcpkg prefix — `import numpy` then dies with
  # "libscipy_openblas64_...so: cannot open shared object file", taking every
  # build that imports numpy with it (h5py-cp313, torch-cp313). Building from
  # the sdist links cvcpkg's own libopenblas.so.0 by soname instead, so ONE
  # OpenBLAS is shared across the prefix, and it is the only option on the
  # BSDs (no PyPI wheel).
  # Bumped 2 -> 3: link cvcpkg's own OpenBLAS on macOS instead of the
  # system Accelerate framework. openblas had no macOS build when this recipe was
  # written, so macOS was the one column linking a BLAS we neither build nor ship;
  # openblas+cvc.6 added it. The macOS payload's BLAS changes, hence the bump.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://numpy.org/
  license: BSD-3-Clause
  tags: [math, python]
  description: >-
    NumPy 2.4.6 for CPython 3.13 (cp313), BUILT FROM SOURCE with meson-python
    against cvcpkg's own OpenBLAS (LP64). The compiled extensions link
    libopenblas.so.0 by soname — no auditwheel-vendored numpy.libs/ copy —
    resolved at runtime out of the SAME activated prefix via an $ORIGIN RUNPATH.
    Building from the sdist is also the only option on the BSDs (no PyPI wheel).
    Installed as a proper wheel (real dist-info/RECORD/METADATA) via pip, so a
    user's later `pip install <other>` coexists and pip's resolver sees numpy as
    satisfied.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches + sha256-
# verifies this tarball and extracts it (strip_components) to CVC_SOURCE_DIR;
# build.sh compiles it with meson-python against the prefix's OpenBLAS.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/d0/ad/fed0499ce6a338d2a03ebae59cd15093910c8875328855781952abf6c2fe/numpy-2.4.6.tar.gz
  sha256: "f3a3570c4a2a16746ac2c31a7c7c7b0c186b95ce902e33db6f28094ed7387dda"
  strip_components: 1

# Interpreter/ABI metadata: exported to build.sh as CVC_PYTHON_ABI /
# CVC_PYTHON_INTERPRETER so cvc_python_exe resolves the prefix's python3.13 and
# the wheel lands in ITS site-packages.
python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # Native CLIs meson-python shells out to (on PATH in the build prefix).
    - name: pkg-config
    - name: meson
    - name: ninja
    # PEP-517 backend + cythonizer, imported by the build interpreter under
    # --no-build-isolation (bridged from the build prefix via PYTHONPATH in
    # build.sh). meson-python-cp313 pulls packaging-cp313 + pyproject-metadata-cp313.
    - name: cython-cp313
    - name: meson-python-cp313
    # OpenBLAS headers + openblas.pc at compile time, on every platform
    # including macOS (openblas gained a macOS build in openblas+cvc.6).
    - name: openblas
      version: ">=0.3.28"
  runtime:
    - name: python313
    # libopenblas resolved from the merged prefix at import, every platform.
    - name: openblas
      version: ">=0.3.28"
  host_tools:
    - python313
    - pkg-config
    - meson
    - ninja
    # Stamps the relocatable $ORIGIN RUNPATH into the extension .so on ELF
    # platforms (Linux/BSD).
    - patchelf

build:
  # The Python ABI is stable across cvcpkg build types; build once, optimized.
  build_type_independent: true
  # openblas now builds on every native platform including macOS, so every
  # column links the same BLAS. windows is a deliberate delta: meson + MSVC + DLL
  # discovery differ enough to need its own build.ps1 (currently a loud stub —
  # until the port lands, windows numpy is unavailable from this recipe).
  # wasm/wasi/cosmo are excluded: static interpreter, no extension-module ABI.
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"   # matches the openblas recipe
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY — stage_bundle ships the whole CVC_INSTALL_DIR tree;
  # build.sh keeps it pure by pip-installing --prefix into an empty dir. There is
  # NO numpy.libs/: the OpenBLAS runtime is the cvcpkg openblas package.
  files:
    - lib/python3.13/site-packages/numpy/
    - lib/python3.13/site-packages/numpy-2.4.6.dist-info/
    - Lib/site-packages/numpy/
    - Lib/site-packages/numpy-2.4.6.dist-info/

abi:
  cxx_std: 17
