python:
  interpreter: python313
  abi: cp313
  manylinux_min: manylinux_2_28

patches: []

depends:
  build:
    - name: python313
  runtime:
    - name: python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13*/site-packages/numpy/
    - lib/python3.13*/site-packages/numpy-2.4.6.dist-info/
    - Lib/site-packages/numpy/
    - Lib/site-packages/numpy-2.4.6.dist-info/
