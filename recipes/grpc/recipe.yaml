schema_version: 1
recipe:
  name: grpc
  upstream_version: "1.68.2"
  cvc_revision: 1
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "joe@angelx.dev"
  description: "gRPC — a high-performance, open-source universal RPC framework."
  homepage: https://grpc.io/
  license: Apache-2.0
  tags: [networking]

source:
  type: tarball
  url: https://github.com/grpc/grpc/archive/refs/tags/v1.68.2.tar.gz
  sha256: "afbc5d78d6ba6d509cc6e264de0d49dcd7304db435cbf2d630385bacf49e066c"
  strip_components: 1

patches: []

depends:
  build:
    - name: protobuf
      version: ">=27.0"
    - name: abseil
      version: ">=20240722,<20260000"
    - name: openssl
      version: "^3.0"
    - name: c-ares
      version: ">=1.34.0"
    - name: re2
      version: ">=2024-07-02"
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1
      vcpkg_port: grpc

package:
  files:
    - bin/grpc_cpp_plugin*
    - bin/grpc_*_plugin*
    - lib/libgrpc*
    - lib/grpc*
    - lib/cmake/grpc/
    - lib/pkgconfig/grpc*
    - include/grpc/
    - include/grpcpp/
  cmake_packages:
    - { name: gRPC, targets: ["gRPC::grpc", "gRPC::grpc++"] }

test:
  script: test.sh

abi:
  cxx_std: 17
