schema_version: 1
recipe:
  name: hdf5
  upstream_version: "1.14.4"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "HDF5 — a data model, library, and file format for storing and managing large, complex data."
  homepage: https://www.hdfgroup.org/solutions/hdf5/
  license: BSD-3-Clause
  tags: [io, wasm, wasi]

source:
  type: tarball
  url: https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.4.3/hdf5-1.14.4-3.tar.gz
  sha256: "019ac451d9e1cf89c0482ba2a06f07a46166caf23f60fea5ef3c37724a318e03"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
      vcpkg_features: ["cpp"]
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1

package:
  files:
    - lib/libhdf5*
    - lib/hdf5*
    - lib/cmake/hdf5/
    - lib/pkgconfig/hdf5*
    - include/hdf5.h
    - include/hdf5_hl.h
    - include/H5*.h
    - include/H5*.hpp
    - bin/h5*
  cmake_packages:
    - { name: HDF5, targets: ["HDF5::HDF5"] }

abi:
  cxx_std: 17
