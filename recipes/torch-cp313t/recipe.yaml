schema_version: 1
recipe:
  name: torch-cp313t
  upstream_version: "2.8.0"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pytorch.org/
  license: BSD-3-Clause
  tags: [python, wheel, ml, tensor, scientific]
  # EXPERIMENTAL: upstream's free-threaded wheel; the build's no-GIL
  # assertion (cvc_python_check) is the gate — if torch re-enables the
  # GIL at import, the build fails and the column stays unpublished.
  description: >-
    PyTorch 2.8.0 (CPU build) for CPython 3.13t (cp313t) — the pinned prebuilt
    manylinux_2_28 CPU wheel from the official PyTorch index, installed into the
    python313t interpreter's site-packages. torch is NOT built from source (an
    impractical multi-hour MKL/CUDA build); it is the roadmap's canonical
    "ship-good-manylinux-wheels" package. This is the CPU variant (no CUDA / no
    nvidia-* deps) — sufficient for the GRL-SNAM surrogate-dynamics numerics and
    the grl-snam-selftest correctness demo. A CUDA torch-cp313t-cuda variant + the
    macOS/Windows columns are follow-ups.

# Prebuilt CPU wheel from download.pytorch.org (not PyPI — PyPI's linux torch is
# the ~2GB CUDA build). cvcpkg fetches + sha256-verifies it, then build.sh
# pip-installs it offline into the prefix interpreter's site-packages.
source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp313-cp313t-manylinux_2_28_x86_64.whl
      sha256: "a9dbb6f64f63258bc811e2c0c99640a81e5af93c531ad96e95c5ec777ea46dab"

python:
  interpreter: python313t
  abi: cp313t
  manylinux_min: manylinux_2_28

patches: []

depends:
  build:
    - name: python313t
  runtime:
    # torch's Requires-Dist (CPU build) — each resolved to the cp313t column.
    - name: python313t
    - name: numpy-cp313t
    - name: typing-extensions-cp313t
    - name: setuptools-cp313t
    - name: sympy-cp313t
    - name: networkx-cp313t
    - name: jinja2-cp313t
    - name: fsspec-cp313t
    - name: filelock-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    # macOS (CPU) + Windows (CPU) columns are a follow-up; the CUDA variant is a
    # separate torch-cp313t-cuda recipe (pulls nvidia-*-cu wheels).

package:
  files:
    # torch bundles its own libs under torch/lib/ (auditwheel-vendored); the whole
    # package tree ships. The dist-info dir is "torch-2.8.0+cpu.dist-info".
    - lib/python3.13t*/site-packages/torch/
    - lib/python3.13t*/site-packages/torchgen/
    - lib/python3.13t*/site-packages/functorch/
    - lib/python3.13t*/site-packages/torch-2.8.0*.dist-info/

abi:
  cxx_std: 17
