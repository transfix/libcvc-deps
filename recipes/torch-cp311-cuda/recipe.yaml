schema_version: 1
recipe:
  name: torch-cp311-cuda
  upstream_version: "2.8.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pytorch.org/
  license: BSD-3-Clause
  tags: [python, wheel, ml, tensor, scientific, cuda, gpu]
  description: >-
    PyTorch 2.8.0 (CUDA 12.8 build) for CPython 3.11 (cp311) — the pinned
    prebuilt manylinux CUDA wheel from PyPI, installed into python311's
    site-packages. The GPU peer of torch-cp311 (CPU): it `provides: [torch-cp311]`
    so a dependency on the virtual name `torch-cp311` resolves to EITHER the CPU
    or this CUDA build (mutually exclusive; a hardware-aware resolver — cvcpkg
    Roadmap Phase 10 — tie-breaks CPU vs GPU; selection is not implemented yet).
    Pulls the NVIDIA CUDA 12.8 runtime (nvidia-*-cu12) + triton wheels. torch is
    NOT built from source. Linux/x86_64 only (macOS has no CUDA; Windows is a
    follow-up). Needs an NVIDIA driver + GPU at runtime.

# Requires a CUDA-capable builder to verify (import loads the CUDA runtime), so
# publishing runs on a [self-hosted, linux, cuda] runner — see torch-cp311 for
# the CPU column that builds anywhere.
provides: ["torch-cp311"]

source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/5a/63/4fdc45a0304536e75a5e1b1bbfb1b56dd0e2743c48ee83ca729f7ce44162/torch-2.8.0-cp311-cp311-manylinux_2_28_x86_64.whl
      sha256: "c12fa219f51a933d5f80eeb3a7a5d0cbe9168c0a14bbb4055f1979431660879b"

python:
  interpreter: python311
  abi: cp311
  manylinux_min: manylinux_2_28

patches: []

depends:
  build:
    - name: python311
  runtime:
    # torch's Requires-Dist (CUDA build) resolved to cvcpkg recipes.
    - name: python311
    - name: numpy-cp311
    - name: typing-extensions
    - name: setuptools
    - name: sympy
    - name: networkx
    - name: jinja2
    - name: fsspec
    - name: filelock
    # GPU kernel compiler (torch.compile / inductor).
    - name: triton
    # NVIDIA CUDA 12.8 runtime (bundled .so libraries torch loads at import).
    - name: nvidia-cuda-nvrtc-cu12
    - name: nvidia-cuda-runtime-cu12
    - name: nvidia-cuda-cupti-cu12
    - name: nvidia-cudnn-cu12
    - name: nvidia-cublas-cu12
    - name: nvidia-cufft-cu12
    - name: nvidia-curand-cu12
    - name: nvidia-cusolver-cu12
    - name: nvidia-cusparse-cu12
    - name: nvidia-cusparselt-cu12
    - name: nvidia-nccl-cu12
    - name: nvidia-nvtx-cu12
    - name: nvidia-nvjitlink-cu12
    - name: nvidia-cufile-cu12
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.11*/site-packages/torch/
    - lib/python3.11*/site-packages/torchgen/
    - lib/python3.11*/site-packages/functorch/
    - lib/python3.11*/site-packages/torch-2.8.0*.dist-info/

abi:
  cxx_std: 17
