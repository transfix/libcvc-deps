# Build self-contained cvcpkg executables for Linux, macOS, and Windows.
#
# Produces single-file binaries via PyInstaller that embed the Python
# runtime and all dependencies — no system Python required.
#
# Triggered alongside the regular PyPI publish on cvcpkg-v* tags,
# or manually via workflow_dispatch.
#
# Artifacts are uploaded to the GitHub Release as:
#   cvcpkg-linux-x86_64
#   cvcpkg-macos-arm64
#   cvcpkg-macos-x86_64
#   cvcpkg-windows-x86_64.exe

name: Build cvcpkg standalone

on:
  push:
    tags:
      - 'cvcpkg-v[0-9]+.*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Attach binaries to the matching GitHub Release (if one exists).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed for gh-release uploads

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-latest
            artifact: cvcpkg-linux-x86_64
          - os: macos-arm64
            runner: macos-latest        # Apple Silicon
            artifact: cvcpkg-macos-arm64
          - os: macos-x86_64
            runner: macos-13            # Intel
            artifact: cvcpkg-macos-x86_64
          - os: windows-x86_64
            runner: windows-latest
            artifact: cvcpkg-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg + PyInstaller
        working-directory: tools/cvcpkg
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Bundle recipes into package
        shell: bash
        run: |
          # Copy repo-level recipes so PyInstaller can bundle them
          rm -rf tools/cvcpkg/src/cvcpkg/recipes/*
          cp -r recipes/* tools/cvcpkg/src/cvcpkg/recipes/ 2>/dev/null || true
          # Remove the gitignore that hides them
          rm -f tools/cvcpkg/src/cvcpkg/recipes/.gitignore

      - name: Build standalone binary
        shell: bash
        working-directory: tools/cvcpkg
        run: |
          # PyInstaller data separator: ";" on Windows, ":" elsewhere
          SEP=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; fi

          pyinstaller \
            --onefile \
            --name cvcpkg \
            --console \
            --noconfirm \
            --clean \
            --add-data "src/cvcpkg/recipes${SEP}cvcpkg/recipes" \
            --add-data "src/cvcpkg/migrations${SEP}cvcpkg/migrations" \
            --hidden-import cvcpkg.backends \
            --hidden-import cvcpkg.server \
            --hidden-import cvcpkg.server.cli \
            --hidden-import yaml \
            --hidden-import click \
            --hidden-import sqlalchemy \
            --hidden-import httpx \
            --hidden-import cryptography \
            --collect-submodules cvcpkg \
            src/cvcpkg/__main__.py

      - name: Verify binary runs
        shell: bash
        working-directory: tools/cvcpkg
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            ./dist/cvcpkg.exe --version
          else
            chmod +x ./dist/cvcpkg
            ./dist/cvcpkg --version
          fi

      - name: Rename artifact
        shell: bash
        working-directory: tools/cvcpkg
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            mv dist/cvcpkg.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/cvcpkg "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/cvcpkg/dist/${{ matrix.artifact }}

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/cvcpkg-linux-x86_64
            artifacts/cvcpkg-macos-arm64
            artifacts/cvcpkg-macos-x86_64
            artifacts/cvcpkg-windows-x86_64.exe
          fail_on_unmatched_files: false
