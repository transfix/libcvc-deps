# Build self-contained cvcpkg executables for Linux, macOS, Windows,
# and BSDs (FreeBSD, OpenBSD, NetBSD).
#
# Produces single-file binaries via PyInstaller that embed the Python
# runtime and all dependencies — no system Python required.
#
# Triggered alongside the regular PyPI publish on cvcpkg-v* tags,
# or manually via workflow_dispatch.
#
# Artifacts are uploaded to the GitHub Release as:
#   cvcpkg-linux-x86_64
#   cvcpkg-macos-arm64
#   cvcpkg-windows-x86_64.exe
#   cvcpkg-freebsd-x86_64
#   cvcpkg-openbsd-x86_64
#   cvcpkg-netbsd-x86_64

name: Build cvcpkg standalone

on:
  push:
    tags:
      - 'cvcpkg-v[0-9]+.*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Attach binaries to the matching GitHub Release (if one exists).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed for gh-release uploads

concurrency:
  group: cvcpkg-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-latest
            artifact: cvcpkg-linux-x86_64
          - os: macos-arm64
            runner: macos-latest
            artifact: cvcpkg-macos-arm64
          - os: windows-x86_64
            runner: windows-latest
            artifact: cvcpkg-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg + PyInstaller
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Bundle recipes into package
        shell: bash
        run: |
          # Copy repo-level recipes so PyInstaller can bundle them
          rm -rf src/cvcpkg/recipes/*
          cp -r recipes/* src/cvcpkg/recipes/ 2>/dev/null || true
          # Remove the gitignore that hides them
          rm -f src/cvcpkg/recipes/.gitignore

      - name: Build standalone binary
        shell: bash
        working-directory: .
        run: |
          # PyInstaller data separator: ";" on Windows, ":" elsewhere
          SEP=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; fi

          pyinstaller \
            --onefile \
            --name cvcpkg \
            --console \
            --noconfirm \
            --clean \
            --add-data "src/cvcpkg/recipes${SEP}cvcpkg/recipes" \
            --add-data "src/cvcpkg/migrations${SEP}cvcpkg/migrations" \
            --hidden-import cvcpkg.backends \
            --hidden-import cvcpkg.server \
            --hidden-import cvcpkg.server.cli \
            --hidden-import yaml \
            --hidden-import click \
            --hidden-import sqlalchemy \
            --hidden-import httpx \
            --hidden-import cryptography \
            --collect-submodules cvcpkg \
            src/cvcpkg/__main__.py

      - name: Verify binary runs
        shell: bash
        working-directory: .
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            ./dist/cvcpkg.exe --version
          else
            chmod +x ./dist/cvcpkg
            ./dist/cvcpkg --version
          fi

      - name: Rename artifact
        shell: bash
        working-directory: .
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            mv dist/cvcpkg.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/cvcpkg "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # ─────────────────── BSD builds via SSH ──────────────────────
  build-bsd:
    name: Build (${{ matrix.os }})
    runs-on: ["self-hosted", "Linux", "X64", "cvcpkg-builder"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd-x86_64
            host: 10.66.77.174
            python: python3.11
            artifact: cvcpkg-freebsd-x86_64
          - os: openbsd-x86_64
            host: 10.66.77.197
            python: python3.12
            artifact: cvcpkg-openbsd-x86_64
          - os: netbsd-x86_64
            host: 10.66.77.214
            python: python3.13
            artifact: cvcpkg-netbsd-x86_64

    env:
      SSH_OPTS: '-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes'

    steps:
      - uses: actions/checkout@v5

      - name: Resolve BSD VM IP
        id: vm
        shell: bash
        run: |
          resolve_vm_ip() {
            local vm_name="$1" fallback="$2"
            if command -v incus >/dev/null 2>&1; then
              local ip
              ip=$(incus list "$vm_name" --format csv -c 4 2>/dev/null \
                   | grep -oE '10\.66\.77\.[0-9]+' | head -1)
              if [ -n "$ip" ]; then echo "$ip"; return; fi
            fi
            echo "$fallback"
          }
          vm_is_reachable() {
            ssh ${SSH_OPTS} -o ConnectTimeout=5 "root@$1" true >/dev/null 2>&1
          }
          case "${{ matrix.os }}" in
            freebsd*)
              HOST=$(resolve_vm_ip "freebsd-build" "${{ matrix.host }}")
              FALLBACK=$(resolve_vm_ip "freebsd-build-2" "10.66.77.154")
              ;;
            openbsd*)
              HOST=$(resolve_vm_ip "openbsd-build" "${{ matrix.host }}")
              FALLBACK=$(resolve_vm_ip "openbsd-build-2" "10.66.77.235")
              ;;
            netbsd*)
              HOST=$(resolve_vm_ip "netbsd-build" "${{ matrix.host }}")
              FALLBACK=$(resolve_vm_ip "netbsd-build-2" "10.66.77.167")
              ;;
            *)
              HOST="${{ matrix.host }}"
              FALLBACK=""
              ;;
          esac
          if ! vm_is_reachable "$HOST" && [ -n "$FALLBACK" ]; then
            echo "::warning::Primary VM $HOST unreachable, falling back to $FALLBACK"
            HOST="$FALLBACK"
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Selected ${{ matrix.os }} VM: $HOST"

      - name: Sync repo to BSD VM
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          case "${{ matrix.os }}" in
            openbsd*) BASE_DIR="/usr/local/tmp" ;;
            *)        BASE_DIR="/tmp" ;;
          esac
          REMOTE_DIR="${BASE_DIR}/cvcpkg-standalone-$$"

          ssh ${SSH_OPTS} "${VM}" "mkdir -p ${REMOTE_DIR}"
          tar cf - --exclude='.git' --exclude='build' --exclude='prefix' \
            --exclude='dist' --exclude='__pycache__' --exclude='*.egg-info' . \
            | ssh ${SSH_OPTS} "${VM}" "tar xf - -C ${REMOTE_DIR}"

          echo "remote_dir=${REMOTE_DIR}" >> "$GITHUB_ENV"

      - name: Install deps + build standalone
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          PYTHON="${{ matrix.python }}"

          ssh ${SSH_OPTS} "${VM}" "cd ${remote_dir} && \
            TMPDIR=/usr/local/tmp ${PYTHON} -m pip install --break-system-packages pyinstaller 2>/dev/null \
              || ${PYTHON} -m pip install pyinstaller && \
            TMPDIR=/usr/local/tmp ${PYTHON} -m pip install --break-system-packages . 2>/dev/null \
              || ${PYTHON} -m pip install . && \
            rm -f src/cvcpkg/recipes/.gitignore && \
            cp -r recipes/* src/cvcpkg/recipes/ 2>/dev/null || true && \
            cd . && \
            ${PYTHON} -m PyInstaller \
              --onefile \
              --name cvcpkg \
              --console \
              --noconfirm \
              --clean \
              --add-data 'src/cvcpkg/recipes:cvcpkg/recipes' \
              --add-data 'src/cvcpkg/migrations:cvcpkg/migrations' \
              --hidden-import cvcpkg.backends \
              --hidden-import cvcpkg.server \
              --hidden-import cvcpkg.server.cli \
              --hidden-import yaml \
              --hidden-import click \
              --hidden-import sqlalchemy \
              --hidden-import httpx \
              --hidden-import cryptography \
              --collect-submodules cvcpkg \
              src/cvcpkg/__main__.py"

      - name: Verify + retrieve binary
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"

          ssh ${SSH_OPTS} "${VM}" "cd ${remote_dir. && \
            chmod +x dist/cvcpkg && ./dist/cvcpkg --version"

          mkdir -p dist
          scp ${SSH_OPTS} "${VM}:${remote_dir./dist/cvcpkg" \
            "dist/${{ matrix.artifact }}"

      - name: Clean up BSD VM
        if: always()
        shell: bash
        run: |
          VM="root@${{ steps.vm.outputs.host }}"
          ssh ${SSH_OPTS} "${VM}" "rm -rf ${remote_dir}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Attach to GitHub Release
    needs: [build, build-bsd]
    runs-on: ubuntu-latest
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.build.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/cvcpkg-linux-x86_64
            artifacts/cvcpkg-macos-arm64
            artifacts/cvcpkg-windows-x86_64.exe
            artifacts/cvcpkg-freebsd-x86_64
            artifacts/cvcpkg-openbsd-x86_64
            artifacts/cvcpkg-netbsd-x86_64
          fail_on_unmatched_files: false
