# Publish cvcpkg to PyPI on tag push.
#
# Triggered by tags matching `cvcpkg-v*` (e.g. cvcpkg-v2.0.0,
# cvcpkg-v2.0.0a1, cvcpkg-v2.0.0rc1).
#
# Pipeline:
#   1. test          — unit + integration tests on Python 3.10-3.13
#   2. build         — build sdist + wheel, sanity-check `cvcpkg --version`
#   3. live-smoke    — install the built wheel on Linux/macOS/Windows and
#                      exercise it against the live https://cvcpkg.org
#                      registry (list, info, install, verify). A green
#                      smoke run is the gate for any publish.
#   4. publish-pypi  — publish to PyPI. Runs only on STABLE tags
#                      (cvcpkg-vMAJOR.MINOR.PATCH with no pre-release
#                      suffix). Pre-release tags (a/b/rc/dev) stop after
#                      the live smoke so we can iterate without burning
#                      version numbers on PyPI.
#
# Prerequisites:
#   - PyPI project "cvcpkg" configured for trusted publishing from
#     transfix/libcvc-deps, workflow cvcpkg-publish.yml, environment
#     "pypi". See:
#     https://docs.pypi.org/trusted-publishers/adding-a-publisher/

name: Publish cvcpkg to PyPI

on:
  push:
    tags:
      - "cvcpkg-v[0-9]+.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (workflow_dispatch only; runs smoke + PyPI for stable tags)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # Required for PyPI trusted publishing (OIDC)

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras "server db-sqlite"

      - name: Run tests
        working-directory: .
        run: poetry run pytest tests/ -v --tb=short

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      # Recipes are bundled by the in-tree PEP 517 backend (pep517-backend/),
      # which pyproject's [build-system] selects — no hand-rolled `cp -r` step.
      # The "Verify wheel + sdist contents" gate below asserts the recipes
      # actually landed, in the ARTIFACT rather than in a staging directory.
      - name: Build sdist and wheel
        working-directory: .
        run: python -m build

      - name: Check distributions with twine
        working-directory: .
        run: twine check dist/*

      - name: Verify wheel + sdist contents
        run: |
          python packaging/verify_wheel.py dist/cvcpkg-*.whl --min-recipes 100
          python packaging/verify_wheel.py dist/cvcpkg-*.tar.gz --min-recipes 100

      - name: Verify wheel installs and recipes are usable
        run: |
          pip install dist/cvcpkg-*.whl
          cvcpkg --version
          cvcpkg recipes --list | grep -q zlib

      - uses: actions/upload-artifact@v4
        with:
          name: cvcpkg-dist
          path: dist/
          retention-days: 7

  live-smoke:
    name: Live smoke (${{ matrix.os }} / Py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: cvcpkg-dist
          path: dist/

      - name: Install cvcpkg from built wheel
        shell: bash
        run: |
          set -eux
          pip install --upgrade pip
          pip install dist/cvcpkg-*.whl
          cvcpkg --version

      - name: Probe the live registry
        shell: bash
        env:
          CVCPKG_SERVER_URL: https://cvcpkg.org
        run: |
          set -eux
          # Catalog HTTP probe (must respond with non-empty JSON).
          python -c "
          import json, urllib.request, sys
          r = urllib.request.urlopen('https://cvcpkg.org/v1/catalog', timeout=30)
          d = json.load(r)
          assert d.get('schema_version') == 1, d
          assert len(d.get('bundles') or []) > 0, 'empty catalog'
          print('catalog revision:', d.get('revision'),
                'bundles:', len(d['bundles']))
          "
          # CLI probes against the live site.  Capture full output first
          # so a SIGPIPE from `head` closing early does not fail cvcpkg
          # under `set -o pipefail`.
          cvcpkg list --available > cvcpkg-list.txt
          head -20 cvcpkg-list.txt
          cvcpkg info zlib

      - name: Install a real package and verify it
        shell: bash
        env:
          CVCPKG_SERVER_URL: https://cvcpkg.org
        run: |
          set -eux
          prefix="$(pwd)/_cvcpkg_smoke_prefix"
          # zlib is published on linux/macos/windows; use it as the
          # canary because it is small and exercises download + verify
          # + extract on every platform.
          cvcpkg install --prefix "$prefix" zlib
          cvcpkg verify --prefix "$prefix" || true
          # Spot-check that something landed in the prefix.
          python -c "
          import os, sys
          prefix = sys.argv[1]
          contents = []
          for root, dirs, files in os.walk(prefix):
              for f in files:
                  contents.append(os.path.join(root, f))
                  if len(contents) > 5: break
              if len(contents) > 5: break
          assert contents, f'prefix {prefix} is empty'
          print('installed files (sample):')
          for c in contents[:5]: print(' ', c)
          " "$prefix"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: live-smoke
    # Publishing to PyPI is the deliberate FINAL step of the release and is
    # double-gated:
    #
    #   1. `vars.CVCPKG_PUBLISH_TO_PYPI == 'true'` — an explicit repo
    #      variable that must be set when the team is ready to publish.
    #      Until it is set, pushing even a stable tag builds + live-smokes
    #      but does NOT publish, so the release can be staged (rename repo,
    #      configure the trusted publisher, close roadmap gaps) first.
    #   2. Stable tag only: cvcpkg-vMAJOR.MINOR.PATCH with no pre-release
    #      suffix.  Uses `github.ref_name` (bare tag) so the substring
    #      checks do not false-match against "tags" in the full ref path.
    if: >-
      vars.CVCPKG_PUBLISH_TO_PYPI == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'cvcpkg-v') &&
      !contains(github.ref_name, 'a') &&
      !contains(github.ref_name, 'b') &&
      !contains(github.ref_name, 'rc') &&
      !contains(github.ref_name, 'dev') &&
      !contains(github.ref_name, 'post')
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cvcpkg-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
