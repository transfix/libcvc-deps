# Publish cvcpkg to PyPI on tag push.
#
# Triggered by tags matching `cvcpkg-v*` (e.g. cvcpkg-v0.1.0a1).
# Builds the wheel in an isolated environment, runs the test suite,
# then uploads to PyPI via trusted publishing (OIDC).
#
# Prerequisites:
#   - PyPI project "cvcpkg" configured for trusted publishing
#     from transfix/libcvc-deps, workflow cvcpkg-publish.yml.

name: Publish cvcpkg to PyPI

on:
  push:
    tags:
      - 'cvcpkg-v[0-9]+.*'

permissions:
  contents: read
  id-token: write  # Required for PyPI trusted publishing (OIDC)

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: tools/cvcpkg
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Run tests
        working-directory: tools/cvcpkg
        run: poetry run pytest tests/ -v --tb=short

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: tools/cvcpkg
        run: python -m build

      - name: Verify wheel installs
        run: |
          pip install tools/cvcpkg/dist/cvcpkg-*.whl
          cvcpkg --version

      - uses: actions/upload-artifact@v4
        with:
          name: cvcpkg-dist
          path: tools/cvcpkg/dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cvcpkg-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
