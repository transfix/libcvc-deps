name: publish-weights-cvc

# Publish the grl-snam-weights data package (base GRL-SNAM nav coefficients — the
# research tier, NO RF-comm forces) to the PUBLIC `cvc` org on cvcpkg.org.
#
# Runs SELF-HOSTED (a cvcpkg-builder box), so it is not blocked by GitHub-hosted
# Actions billing, and reuses the existing CVCPKG_PUBLISHER_TOKEN secret — the raw
# token never leaves the runner. Deliberately targets `--org cvc` only: the
# generic (research) weights are public here; the DBG (development) weights are the
# separate private `cvc-dbg-weights` on the `utdbg` org (publish-weights-utdbg in
# the cvcdbg repo). That org boundary is the research/development seam.
#
#   workflow_dispatch: dry_run=true (default) packs only; dry_run=false publishes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only; skip the publish to cvc.'
        default: 'true'

concurrency:
  group: publish-weights-cvc-${{ github.ref }}
  cancel-in-progress: false

env:
  CVCPKG_SERVER: https://cvcpkg.org
  CVCPKG_ORG: cvc

jobs:
  publish:
    name: publish grl-snam-weights → cvc (public)
    runs-on: [self-hosted, Linux, X64, cvcpkg-builder]
    steps:
      - uses: actions/checkout@v4

      - name: Install cvcpkg into a venv
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP:-/tmp}"; mkdir -p "$TMPDIR"
          VENV="$RUNNER_TEMP/cvc-wts-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --upgrade pip >/dev/null
          "$VENV/bin/pip" install 'git+https://github.com/transfix/libcvc-deps@master'
          "$VENV/bin/cvcpkg" --version

      - name: Pack + publish grl-snam-weights
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          CVCPKG="$RUNNER_TEMP/cvc-wts-venv/bin/cvcpkg"
          rm -rf dist && mkdir -p dist

          # --bump packs above whatever is published for cvc (or the recipe floor on
          # a first publish), so re-runs never 409. --recipes-dir recipes uses the
          # source recipe tree (not the gitignored generated copy).
          "$CVCPKG" pack recipes/grl-snam-weights --bump --recipes-dir recipes \
            --server "$CVCPKG_SERVER" --org "$CVCPKG_ORG" --token "$CVCPKG_TOKEN" \
            --output-dir dist
          ls -l dist

          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            "$CVCPKG" publish dist/grl-snam-weights-*.tar.gz \
              --server "$CVCPKG_SERVER" --org "$CVCPKG_ORG" --token "$CVCPKG_TOKEN"
            echo "published grl-snam-weights → $CVCPKG_ORG (public)"
          else
            echo "DRY RUN — packed only, did not publish."
          fi
