# Recipe-driven build for libcvc-deps.
#
# Builds every recipe in dependency order using `cvcpkg build-all`,
# then uploads the prefix as an artifact.  Each recipe builds from
# its pinned source (tarball, vendored, or vcpkg) so the result is
# fully reproducible from the recipe files alone.
#
# Reusable from release.yml and ci.yml.

name: Recipe Build

on:
  workflow_call:
    inputs:
      platform:
        description: "Target platform (linux, macos, windows, wasm)"
        required: true
        type: string
      config:
        description: "Build config (release, debug)"
        required: true
        type: string
      link:
        description: "Link mode (shared, static)"
        required: true
        type: string
      sha_suffix:
        description: "Short SHA for CI builds (empty for tag releases)"
        required: false
        type: string
        default: ''
      runner:
        description: "JSON runs-on override (e.g. '[\"self-hosted\",\"Linux\",\"X64\",\"cvcpkg-builder\"]'). Leave empty for platform default."
        required: false
        type: string
        default: ''
      host_platform:
        description: "Host OS for cross-compilation (e.g. linux, macos, windows). Only used with platform=wasm."
        required: false
        type: string
        default: ''
      shard:
        description: "Recipe shard in INDEX/TOTAL format (e.g. 0/3). Empty = build all."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || inputs.host_platform == 'macos' && 'macos-latest' || inputs.host_platform == 'windows' && 'windows-latest' || inputs.platform == 'macos' && 'macos-latest' || inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    # Default: ubuntu-latest for linux/wasm, platform-latest for mac/win.
    # For wasm with host_platform, the HOST selects the runner.

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Self-hosted Windows runners may not have Git bash or PowerShell 7
      # on PATH.  GitHub-hosted runners have them pre-configured, but
      # self-hosted runners running as LocalSystem may not inherit them.
      - name: Add Git bash and pwsh to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\bin\bash.exe" (
            echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
          )
          if exist "C:\Program Files\PowerShell\7\pwsh.exe" (
            echo C:\Program Files\PowerShell\7>> "%GITHUB_PATH%"
          )

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          BTLC=$(echo "${{ inputs.config }}" | tr '[:upper:]' '[:lower:]')
          LINKSFX=""
          [ "${{ inputs.link }}" = "static" ] && LINKSFX="-static"
          SHASFX=""
          if [ -n "${{ inputs.sha_suffix }}" ]; then
            short=$(echo "${{ inputs.sha_suffix }}" | cut -c1-7)
            SHASFX="-${short}"
          fi
          case "${{ inputs.platform }}" in
            any)     ARCH=noarch ;;
            linux)   ARCH=x86_64 ;;
            macos)   ARCH=arm64  ;;
            windows) ARCH=x86_64 ;;
            wasm)    ARCH=wasm32 ;;
            freebsd) ARCH=x86_64 ;;
            openbsd) ARCH=x86_64 ;;
            netbsd)  ARCH=x86_64 ;;
          esac
          STEM="libcvc-deps-${VERSION}${SHASFX}-${{ inputs.platform }}-${ARCH}-${BTLC}${LINKSFX}"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"         >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "stem=$STEM"         >> "$GITHUB_OUTPUT"

      # ── System build tools (Linux) ──
      - name: Install system build tools (Linux)
        if: inputs.platform == 'linux' || (inputs.platform == 'wasm' && (inputs.host_platform == 'linux' || inputs.host_platform == ''))
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "::group::apt attempt $attempt: $*"
              if timeout 600 "$@" \
                   -o Dpkg::Use-Pty=0 \
                   -o Acquire::Retries=3 \
                   -o Acquire::http::Timeout=30 \
                   -o Acquire::https::Timeout=30; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              echo "apt attempt $attempt failed, sleeping before retry…"
              sleep $((attempt * 15))
            done
            echo "apt: giving up after 5 attempts" >&2
            return 1
          }
          apt_retry sudo -E apt-get update
          apt_retry sudo -E apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson patchelf pkg-config \
            autoconf automake libtool gfortran perl flex bison \
            python3 python3-pip python3-venv \
            libgl1-mesa-dev libxt-dev mesa-common-dev libglew-dev \
            libxrender-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxext-dev libxfixes-dev libxrandr-dev libxcb1-dev \
            libx11-dev libx11-xcb-dev libfontconfig1-dev \
            libfreetype-dev libharfbuzz-dev
          # LLVM 18 dev packages: needed by wasmedge AOT.  Ubuntu 24.04
          # ships Clang/LLVM 18 but the dev packages must be explicitly
          # installed.  Non-fatal so non-wasmedge builds still succeed.
          apt_retry sudo -E apt-get install -y --no-install-recommends \
            llvm-18-dev lld-18 liblld-18-dev 2>/dev/null || \
            echo "::warning::LLVM 18 dev packages not available — wasmedge AOT will be disabled"

      # ── System build tools (macOS) ──
      - name: Install system build tools (macOS)
        if: inputs.platform == 'macos'
        run: |
          brew install ninja autoconf automake libtool pkg-config libomp meson flex bison
          # LLVM 18 is pre-installed via Homebrew on macos-latest runners.
          # Ensure it's present for wasmedge AOT compilation.
          brew install llvm@18 2>/dev/null || true
          # Pin cmake to 3.x — Boost 1.86 cmake files are incompatible with cmake 4.x
          pip3 install --break-system-packages "cmake>=3.31,<4"

      # ── System build tools (Windows) ──
      # Use an explicit -ExecutionPolicy Bypass because self-hosted
      # runners may have restrictive default execution policies.
      - name: Install system build tools (Windows)
        if: inputs.platform == 'windows'
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # Ensure Chocolatey is available (pre-installed on windows-latest,
          # may be missing on self-hosted runners).
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            # Remove leftover broken installs that block the installer.
            if (Test-Path 'C:\ProgramData\chocolatey') {
              Write-Host "Removing stale Chocolatey directory..."
              Remove-Item -Recurse -Force 'C:\ProgramData\chocolatey'
            }
            Write-Host "Installing Chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            # Refresh PATH from registry, then ensure the choco bin dir is
            # present even if the installer's setx hasn't propagated yet.
            $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH', 'User')
            $chocoDir = 'C:\ProgramData\chocolatey\bin'
            if ((Test-Path $chocoDir) -and ($env:PATH -notlike "*$chocoDir*")) {
              $env:PATH = "$chocoDir;$env:PATH"
            }
          }
          choco install ninja -y
          choco install cmake --version=3.31.7 --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install python3 -y
          choco install nasm -y
          # Refresh PATH to pick up all choco-installed tools.
          $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH', 'User')
          # NASM installs to "C:\Program Files\NASM" - add it to PATH
          # so OpenSSL and libjpeg-turbo can find it for optimised assembly.
          echo 'C:\Program Files\NASM' | Out-File -Append $env:GITHUB_PATH
          # vcpkg is pre-installed on windows-latest at C:\vcpkg;
          # on self-hosted runners we bootstrap it if absent.
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            Write-Host 'vcpkg not found - bootstrapping into C:\vcpkg ...'
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          $env:PATH = "C:\vcpkg;$env:PATH"
          echo 'C:\vcpkg' | Out-File -Append $env:GITHUB_PATH
          vcpkg version

      # ── Activate MSVC environment (Windows) ──
      # Required so Ninja/CMake find cl.exe instead of MinGW g++.
      - name: Set up MSVC developer environment
        if: inputs.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Install cvcpkg ──
      - name: Install cvcpkg
        shell: bash
        run: |
          # On Windows, python3 may not exist; fall back to python.
          PY=$(command -v python3 2>/dev/null || command -v python 2>/dev/null || echo python3)
          "$PY" -m pip install --quiet --break-system-packages ./tools/cvcpkg \
            || "$PY" -m pip install --quiet ./tools/cvcpkg
          # Ensure ~/.local/bin is on PATH (self-hosted runners may not have it)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── Cache the built prefix ──
      - name: Compute recipe cache key
        id: cache-key
        shell: bash
        run: |
          # Hash all recipe files + common env scripts for a stable cache key
          HASH=$(find recipes/ -type f \( -name '*.yaml' -o -name '*.sh' -o -name '*.ps1' \) \
                 | sort | xargs cat | sha256sum | cut -d' ' -f1)
          HOST="${{ inputs.host_platform }}"
          SHARD="${{ inputs.shard }}"
          KEY="recipe-build-${{ inputs.platform }}-${HOST:-native}-${SHARD:-all}-${{ inputs.config }}-${{ inputs.link }}-${HASH}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cache built prefix
        id: prefix-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/prefix
            ${{ github.workspace }}/dist
          key: ${{ steps.cache-key.outputs.key }}

      # Validate that the restored cache actually contains a
      # populated prefix.  A prior cancelled or failed build may
      # have cached an empty directory.
      - name: Validate cache contents
        id: cache-valid
        shell: bash
        run: |
          if [ "${{ steps.prefix-cache.outputs.cache-hit }}" = "true" ] \
             && [ -d "${{ github.workspace }}/prefix" ] \
             && [ -n "$(ls -A "${{ github.workspace }}/prefix" 2>/dev/null)" ] \
             && [ -d "${{ github.workspace }}/dist" ] \
             && [ -n "$(ls -A "${{ github.workspace }}/dist" 2>/dev/null)" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Cache is valid — skipping build"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss or empty — will build from scratch"
            rm -rf "${{ github.workspace }}/prefix" "${{ github.workspace }}/dist"
          fi

      # ── Pre-build emsdk for wasm cross-compilation ──
      # Wasm recipes run on a host that has the Emscripten SDK.  The
      # emsdk recipe is a host-platform build-tool.  Install it into
      # the prefix first, using the host platform (linux/macos/windows).
      - name: Pre-build emsdk (wasm)
        if: inputs.platform == 'wasm' && steps.cache-valid.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          HOST_PLAT="${{ inputs.host_platform }}"
          [ -z "$HOST_PLAT" ] && HOST_PLAT="linux"
          cvcpkg build emsdk --platform "$HOST_PLAT" --no-deps \
            --prefix "${{ github.workspace }}/prefix" \
            --recipes-dir recipes

      # ── Build and package all recipes (per-component) ──
      - name: Build and package all recipes (cvcpkg pack-all)
        if: steps.cache-valid.outputs.valid != 'true'
        continue-on-error: true
        shell: bash
        env:
          CVCPKG_SERVER_CACHE: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_SERVER_CACHE_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
          CVCPKG_SERVER_CACHE_PUSH: "1"
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ -n "${{ inputs.host_platform }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --host-platform ${{ inputs.host_platform }}"
          fi
          if [ -n "${{ inputs.shard }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --shard ${{ inputs.shard }}"
          fi
          cvcpkg pack-all \
            --keep-going \
            --platform "${{ inputs.platform }}" \
            --config "${{ inputs.config }}" \
            --link "${{ inputs.link }}" \
            --prefix "${{ github.workspace }}/prefix" \
            --output-dir "${{ github.workspace }}/dist" \
            --recipes-dir recipes \
            $EXTRA_ARGS

      # ── Install marker cmake config ──
      - name: Install libcvc-deps marker config
        if: inputs.platform != 'wasm' && inputs.platform != 'any'
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.config == 'release' && 'Release' || 'Debug' }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          cmake --install build

      # Upload per-component bundles for publishing to cvcpkg-server
      - name: Upload per-component bundles
        uses: actions/upload-artifact@v4
        with:
          name: components-${{ inputs.platform }}-${{ steps.meta.outputs.btlc }}-${{ inputs.link }}${{ inputs.shard && format('-shard{0}', inputs.shard) || '' }}
          path: dist/
          if-no-files-found: error
