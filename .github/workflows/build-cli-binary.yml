# Build the self-contained single-file `cvcpkg` CLI (PyInstaller) for each OS.
#
# The binary bundles the CPython runtime, cvcpkg + its CLI dependency closure,
# and the STANDARD RECIPES — so it discovers recipes with no --recipes-dir
# (find_recipes_dir() checks sys._MEIPASS first). One binary per OS; for a
# single cross-OS binary see the Cosmopolitan/APE track.
name: build-cli-binary

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        # jsonschema is a validate-time dep (not in the main group); pyinstaller
        # builds the binary.
        run: pip install -e . jsonschema pyinstaller

      - name: Build binary
        run: pyinstaller --clean --noconfirm packaging/cvcpkg.spec

      - name: Smoke test (version + bundled-recipe discovery from a clean dir)
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/dist/cvcpkg"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$PWD/dist/cvcpkg.exe"
          "$BIN" --version
          # Run from an empty dir so recipes can only come from the bundle.
          work="$(mktemp -d)"; cd "$work"
          "$BIN" validate recipes/asyncpg
          "$BIN" validate recipes

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/cvcpkg.exe "out/cvcpkg-${{ runner.os }}-${{ runner.arch }}.exe"
          else
            cp dist/cvcpkg "out/cvcpkg-${{ runner.os }}-${{ runner.arch }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cvcpkg-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
