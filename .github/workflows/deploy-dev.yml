name: deploy-dev

# Deploys cvcpkg to the dev/test environment on the star incus cluster:
#   - cvcpkg-server     (incus VM — test cvcpkg-server)
#   - cvcpkg-builder-01 (incus VM — test builder)
#   - cvcpkg-builder-02 (incus VM — test builder)
#
# A self-hosted Linux runner picks up the job.
# These machines host the incus cluster directly so they use
# `incus exec` to update the VMs.
#
# Required repo secrets:
#   (none — the runners are on the incus cluster hosts)

# Deploys on every master push.  This used to key off a `dev` branch, but
# nothing ever pushed there: `dev` stalled at 2026-08-05 while master moved 94
# commits ahead, so the dev cluster silently ran week-old cvcpkg while every
# recipe PR was gated against master's CLI.  Master is the branch that actually
# moves, so it is the one the dev cluster should track.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to master HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev (star incus cluster)
    runs-on: [self-hosted, Linux, star-01]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target SHA
        id: target
        run: |
          if [[ -n "${{ inputs.sha }}" ]]; then
            sha="${{ inputs.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::invalid sha: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying sha: $sha"

      # ── Deploy to cvcpkg-server VM ──────────────────────────
      - name: Update cvcpkg-server VM
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="dev-${SHORT_SHA}"
          DEPLOY_DIR="/opt/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}"

          echo "=== Deploying to cvcpkg-server VM (dev) ==="

          # Use incus exec for the actual deploy
          incus exec cvcpkg-server -- bash -c "
            set -euo pipefail
            cd ${DEPLOY_DIR}
            git fetch origin
            git checkout -f ${SHA}

            cd ${CVCPKG_DIR}
            export CVCPKG_RELEASE='${RELEASE_TAG}'

            # Install CLI update. NOT '2>/dev/null || true': a discarded error
            # here is how the cluster ends up serving jobs with a cvcpkg that
            # never installed, while this step still reports success.
            pip install --break-system-packages --quiet .

            # Check for env file
            if [[ ! -f .env.production ]]; then
              echo '::error::.env.production not found'
              exit 1
            fi

            # The dev cluster is a SATELLITE of prod: its public catalog must
            # mirror cvcpkg.org so it carries every global package (imported by
            # the populate loop every CVCPKG_POPULATE_INTERVAL) instead of lagging
            # on whatever was built locally. Enforce the upstream on every deploy
            # so it survives host re-provisioning and cannot silently drift.
            # Public mirroring needs NO token; org/private packages stay local.
            # (Prod == cvcpkg.org is the ROOT and must NOT set this — that is why
            # it lives here in deploy-dev.yml, not in docker-compose.production.yml.)
            grep -v '^CVCPKG_POPULATE_UPSTREAM=' .env.production > .env.production.tmp || true
            mv .env.production.tmp .env.production
            echo 'CVCPKG_POPULATE_UPSTREAM=https://cvcpkg.org' >> .env.production
            echo 'Dev cluster will mirror the public catalog from https://cvcpkg.org'

            DC='docker compose'
            COMPOSE=\"\$DC -f docker-compose.production.yml --env-file .env.production\"

            # Build and deploy
            echo 'Building cvcpkg-server:${RELEASE_TAG}...'
            \$COMPOSE build --build-arg 'CVCPKG_RELEASE=${RELEASE_TAG}' backend

            echo 'Ensuring postgres is up...'
            \$COMPOSE up -d postgres
            for i in \$(seq 1 30); do
              if \$COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            # Migrations
            echo 'Running database migrations...'
            if ! \$COMPOSE exec -T postgres psql -U cvcpkg -tAc \\
                 \"SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'\" \\
                 2>/dev/null | grep -q 1; then
              echo 'Stamping database at revision 002...'
              \$COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
            fi
            \$COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
            echo 'Migrations complete.'

            echo 'Restarting backend...'
            \$COMPOSE up -d --force-recreate backend

            # Health check
            echo 'Waiting for health...'
            deadline=\$(( \$(date +%s) + 60 ))
            while (( \$(date +%s) < deadline )); do
              if \$COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '\"ok\"'; then
                echo 'Dev server healthy!'
                \$COMPOSE exec -T backend curl -s http://localhost:8420/healthz
                exit 0
              fi
              sleep 2
            done

            echo '::error::Dev server failed health check'
            \$COMPOSE logs --tail=40 backend || true
            exit 1
          "

      # ── Update builder VMs ─────────────────────────────────
      - name: Update builder VMs
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          DEPLOY_DIR="/opt/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}"

          for VM in cvcpkg-builder-01 cvcpkg-builder-02; do
            echo "=== Updating $VM ==="
            incus exec "$VM" -- bash -c "
              set -euo pipefail
              cd ${DEPLOY_DIR}
              git fetch origin
              git checkout -f ${SHA}
              cd ${CVCPKG_DIR}
              pip install --break-system-packages --quiet .
              # Verify by COMMIT, not by 'cvcpkg --version'. The package version
              # (2.0.2 at time of writing) does not move commit to commit, so it
              # prints the same string on a build from weeks ago and confirms
              # nothing. Compare what the installed cvcpkg reports as its source
              # tree against the SHA we were asked to deploy.
              # Resolve BOTH sides: workflow_dispatch accepts a short sha
              # (^[0-9a-f]{7,40}$), which would never string-equal a 40-char
              # HEAD.
              want=\$(git -C ${DEPLOY_DIR} rev-parse ${SHA})
              got=\$(git -C ${DEPLOY_DIR} rev-parse HEAD)
              if [ \"\$got\" != \"\$want\" ]; then
                echo \"::error::$VM is at \$got but \$want (${SHA}) was requested\"
                exit 1
              fi
              echo \"$VM: \$(cvcpkg --version) @ \$got\"
            "
          done
          echo "All dev builder VMs updated."

      # ── Restart builder agents on dev VMs ───────────────────
      - name: Restart builder agents
        run: |
          set -euo pipefail

          for VM in cvcpkg-builder-01 cvcpkg-builder-02; do
            echo "=== Restarting builder on $VM ==="
            incus exec "$VM" -- bash -c "
              # Ensure --cross-platform wasm and wasi are in the systemd unit
              UNIT=/etc/systemd/system/cvcpkg-builder.service
              # Migrate from old --cross-target if present
              sed -i 's|--cross-target |--cross-platform |g' \"\$UNIT\"
              # Add --cross-platform wasm if missing
              if ! grep -q -- '--cross-platform wasm' \"\$UNIT\" 2>/dev/null; then
                sed -i 's|--work-dir [^ ]*|& --cross-platform wasm|' \"\$UNIT\"
              fi
              # Add --cross-platform wasi if missing
              if ! grep -q -- '--cross-platform wasi' \"\$UNIT\" 2>/dev/null; then
                sed -i 's|--cross-platform wasm|& --cross-platform wasi|' \"\$UNIT\"
              fi
              # Add --cross-platform cosmo if missing
              if ! grep -q -- '--cross-platform cosmo' \"\$UNIT\" 2>/dev/null; then
                sed -i 's|--cross-platform wasi|& --cross-platform cosmo|' \"\$UNIT\"
              fi
              systemctl daemon-reload
              systemctl restart cvcpkg-builder
              sleep 2
              if systemctl is-active --quiet cvcpkg-builder; then
                echo 'Builder restarted successfully.'
              else
                echo '::warning::Builder failed to start on $VM'
                journalctl -u cvcpkg-builder --no-pager -n 5
              fi
            " || echo "Warning: failed to restart builder on $VM"
          done

      # ── Update the WSL windows-cross builder on sandipaws ──────
      # sandipaws-wsl is a WSL2 distro on the sandipaws laptop that
      # serves windows/x86_64 dev jobs via the winhost delegation
      # (recipes' build.ps1 runs on the Windows host through interop).
      # Reached DIRECTLY over the star WireGuard overlay (10.100.0.10) —
      # the runner host (star-01) is a WG peer, so no Windows-host SSH
      # relay / wsl.exe hop is needed. See vm-provisioning
      # cluster/wireguard/WIREGUARD.md. Best-effort: the laptop may be off.
      - name: Update WSL windows-cross builder (sandipaws-wsl)
        continue-on-error: true
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          echo "=== Updating sandipaws-wsl (WSL windows-cross builder) ==="
          ssh -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=accept-new tfx@10.100.0.10 \
            "set -e; cd ~/src/cvc/libcvc-deps && git fetch origin && git checkout -f ${SHA} && ~/.venv-cvcpkg/bin/pip install -q -e . && sudo systemctl restart cvcpkg-builder && systemctl is-active cvcpkg-builder" \
            && echo "sandipaws-wsl updated and restarted." \
            || echo "::warning::sandipaws-wsl unreachable or update failed (offline?)"

      # ── Notify builders to self-update via server API ─────────
      # This is the ONLY update path for every builder that is not one of the
      # two incus VMs or sandipaws-wsl -- the BSD guests and the Windows
      # cross-builders among them. It stays continue-on-error (a deploy that
      # already succeeded must not be failed by an unreachable builder), but it
      # no longer stays SILENT: the point of the report below is that
      # "everything is fine" and "half the fleet never heard about it" stopped
      # looking identical. A windows builder ran a cvcpkg without git-source
      # support for weeks behind exactly this gap.
      - name: Notify builders to self-update
        continue-on-error: true
        env:
          CVCPKG_ADMIN_TOKEN: ${{ secrets.CVCPKG_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          sleep 10
          SERVER_URL="http://$(incus list cvcpkg-server -c4 -fcsv | tr -d '"' | tr ',' '\n' | awk '{print $1}' | grep -E '^10\.' | head -1):8420"
          if [ -z "${CVCPKG_ADMIN_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_ADMIN_TOKEN is unset — no builder outside the incus VMs was told to update. They keep running whatever cvcpkg they last had."
            exit 0
          fi

          echo "Notifying builders via $SERVER_URL to self-update..."
          if ! curl -fsS -X POST "$SERVER_URL/v1/admin/update-builders" \
                 -H "Authorization: Bearer $CVCPKG_ADMIN_TOKEN" \
                 -H "Content-Type: application/json"; then
            echo "::warning::update-builders call failed — the fleet was NOT notified"
            exit 0
          fi

          # Report which builders are actually reachable, so a builder that is
          # offline (and therefore did not get the message) is visible here
          # rather than discovered later by a job that will not build.
          echo ""
          echo "Fleet after notify:"
          curl -fsS "$SERVER_URL/v1/builders" 2>/dev/null | python3 -c '
          import json, sys
          try:
              builders = json.load(sys.stdin)["builders"]
          except Exception as exc:
              print("::warning::could not read the builder list: {}".format(exc))
              sys.exit(0)
          stale = []
          for b in builders:
              caps = b.get("capabilities", {}) or {}
              cross = ",".join(p["platform"] for p in caps.get("cross_platforms", []))
              serves = b["platform"] + (" (+" + cross + ")" if cross else "")
              print("  {:8} {:30} {:24} {}".format(
                  b["status"], b["name"], serves, b["last_heartbeat"]))
              if b["status"] == "offline":
                  stale.append(b["name"] + " (" + serves + ")")
          if stale:
              print("::warning::offline builders did not receive the update: " + ", ".join(stale))
          ' || echo "::warning::could not summarise the fleet"
