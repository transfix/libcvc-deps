name: Populate cvcpkg.org

# Pushes recipes to the server, then submits remote build DAGs for the
# selected platforms.  Builders pick up jobs automatically.
#
# By default this covers every recipe and skips variants the server has
# already published, so a run fills in gaps rather than rebuilding the
# world.  Set `recipes` to rebuild a specific few (e.g. after a version
# normalization), or turn `skip_existing` off to force a rebuild.
#
# Required repo secrets:
#   CVCPKG_PUBLISHER_TOKEN  — a publisher-role token for cvcpkg.org

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms to build"
        required: true
        default: "linux,freebsd,netbsd,openbsd,windows,wasm,wasi,cosmo"
        type: string
      arch:
        description: "Target architecture(s), comma-separated"
        required: true
        default: "x86_64,wasm32"
        type: string
      config:
        description: "Build config (release, debug, or all)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
          - all
      link:
        description: "Link mode (shared, static, or all)"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - static
          - all
      server:
        description: "cvcpkg server URL"
        required: true
        default: "https://cvcpkg.org"
        type: string
      skip_push:
        description: "Skip recipe push (recipes already on server)"
        required: false
        default: false
        type: boolean
      recipes:
        description: "Recipe names to build, space- or comma-separated (default: every recipe)"
        required: false
        default: ""
        type: string
      skip_existing:
        description: "Skip variants already published on the server (leave on to fill gaps, off to force a rebuild)"
        required: false
        default: true
        type: boolean

concurrency:
  group: populate-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  populate:
    name: Push recipes & submit builds
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Push all recipes
        if: ${{ !inputs.skip_push }}
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          cvcpkg recipe push-all --recipes-dir recipes

      - name: Submit build DAGs
        id: submit
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail

          # Collect recipe names.  With the `recipes` input set, build exactly
          # those (validated against the tree, so a typo fails loudly instead of
          # silently submitting nothing); otherwise every recipe.
          REQUESTED="$(echo '${{ inputs.recipes }}' | tr ',' ' ' | xargs || true)"
          RECIPES=()
          if [[ -n "$REQUESTED" ]]; then
            MISSING=()
            for name in $REQUESTED; do
              if [[ -f "recipes/$name/recipe.yaml" ]]; then
                RECIPES+=("$name")
              else
                MISSING+=("$name")
              fi
            done
            if (( ${#MISSING[@]} )); then
              echo "::error::no such recipe(s): ${MISSING[*]}"
              exit 1
            fi
            echo "Targeting ${#RECIPES[@]} requested recipe(s): ${RECIPES[*]}"
          else
            for dir in recipes/*/; do
              name="$(basename "$dir")"
              [[ "$name" == _* || "$name" == .* ]] && continue
              [[ -f "$dir/recipe.yaml" ]] || continue
              RECIPES+=("$name")
            done
          fi

          echo "Submitting ${#RECIPES[@]} recipes for platforms: ${{ inputs.platforms }}"
          echo "Config: ${{ inputs.config }}, Link: ${{ inputs.link }}, Arch: ${{ inputs.arch }}"

          DAG_ID="populate-$(date +%Y%m%d-%H%M%S)"
          echo "dag_id=$DAG_ID" >> "$GITHUB_OUTPUT"

          # A published variant is immutable, so rebuilding one is pure waste.
          # Default on: "populate" means fill the gaps.  Turn it off to force a
          # rebuild of variants that already exist.  submit-dag now defaults to
          # --skip-existing, so pass the flag explicitly either way to honour an
          # explicit skip_existing=false input.
          if [[ "${{ inputs.skip_existing }}" == "true" ]]; then
            SKIP_EXISTING=(--skip-existing)
          else
            SKIP_EXISTING=(--no-skip-existing)
          fi

          # Tee the submit output so the follow step can tell "nothing needed
          # building" apart from "jobs were staged and then went missing".
          # Without that distinction a run that stages work and observes none
          # of it reports success -- see the check in the next step.
          cvcpkg builds submit-dag \
            --platform "$(echo '${{ inputs.platforms }}' | tr ',' '\n' | grep -vx macos | paste -sd, || true)" \
            --arch "${{ inputs.arch }}" \
            --config "${{ inputs.config }}" \
            --link "${{ inputs.link }}" \
            --dag-id "$DAG_ID" \
            --recipes-dir recipes \
            ${SKIP_EXISTING[@]+"${SKIP_EXISTING[@]}"} \
            "${RECIPES[@]}" | tee /tmp/submit.log

          # "Staged N job(s) for <tuple>", summed over every tuple. awk, not
          # `paste -sd+`, so this is a number rather than the string "9+29".
          STAGED=$(grep -oE '^[[:space:]]*Staged [0-9]+ job' /tmp/submit.log \
                   | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          echo "staged=${STAGED:-0}" >> "$GITHUB_OUTPUT"
          echo "submit-dag staged ${STAGED:-0} job(s)"

      - name: Follow build output
        # Backstop below the job's 120 min budget: --wait-timeout exits
        # cleanly with a diagnostic, this only fires if the CLI itself wedges.
        timeout-minutes: 95
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          # Follow all DAGs whose IDs start with the generated prefix.
          # submit-dag creates one DAG per platform/arch/config/link combo.
          DAG_PREFIX="${{ steps.submit.outputs.dag_id }}"
          # Exit 75 means "timed out with jobs still building" — the builds
          # continue on the cluster, so surface it as a warning rather than
          # failing the run.
          set +e
          cvcpkg builds follow-dag "$DAG_PREFIX" --wait-timeout 5400 2>&1 | tee /tmp/follow.log
          rc=${PIPESTATUS[0]}
          set -e

          # A populate run that builds NOTHING must not report success.
          #
          # submit-dag names one DAG per platform/arch/config/link -- e.g.
          # populate-20260816-182051-release-static -- and follow-dag takes the
          # bare prefix and matches them. When that match comes back empty it
          # prints
          #     DAG populate-20260816-182051: 0/0 succeeded, 0 failed
          # and exits 0, because zero jobs failed. On 2026-08-16 a Windows run
          # staged 38 jobs, reported exactly that, published nothing, and went
          # green -- while libcvc's CI stayed red on the very packages the run
          # was meant to supply. Nothing in the log said anything was wrong.
          #
          # Staging zero jobs is a legitimate no-op (everything already
          # published). Staging jobs and then observing none of them is not.
          STAGED="${{ steps.submit.outputs.staged }}"
          if [[ "${STAGED:-0}" -gt 0 ]] && grep -qE 'DAG [^:]+: 0/0 succeeded' /tmp/follow.log; then
            echo "::error::submit-dag staged ${STAGED} job(s) but follow-dag matched none." \
                 "Nothing was published and no failure was reported. Check that" \
                 "follow-dag's prefix matching still agrees with the per-tuple DAG" \
                 "ids submit-dag creates."
            exit 1
          fi

          if [[ $rc -eq 75 ]]; then
            echo "::warning::follow-dag timed out; builds continue on the cluster"
            exit 0
          fi
          exit $rc

  # macOS has no persistent remote-builder service, so its bundles are
  # built via the macos-build.yml workflow on ephemeral GitHub-hosted
  # macOS runners.  Kick it off automatically when 'macos' appears in
  # the platforms input, so 'populate-server' actually populates macOS
  # (previously users had to remember to dispatch macos-build.yml by
  # hand — the platforms input silently dropped 'macos' otherwise).
  populate-macos:
    name: Build & publish macOS packages
    needs: populate
    if: contains(inputs.platforms, 'macos') && contains(fromJSON('["release","debug"]'), inputs.config) && contains(fromJSON('["shared","static"]'), inputs.link)
    uses: ./.github/workflows/macos-build.yml
    with:
      config: ${{ inputs.config }}
      link: ${{ inputs.link }}
      server: ${{ inputs.server }}
      shards: "4"
    secrets: inherit

  # macOS x86_64. macos-latest is Apple Silicon, so the job above only ever
  # produced macos/arm64 — the catalog has ZERO macos/x86_64 bundles. Intel
  # macOS users therefore source-build their entire closure.
  #
  # macos-15-intel is the last x86_64 macOS image GitHub offers and is retired
  # in August 2027, so this lane has a definite shelf life. It is worth having
  # anyway: it is the only way to serve Intel Mac users before then.
  populate-macos-intel:
    name: Build & publish macOS x86_64 packages
    needs: populate
    if: contains(inputs.platforms, 'macos') && contains(inputs.arch, 'x86_64') && contains(fromJSON('["release","debug"]'), inputs.config) && contains(fromJSON('["shared","static"]'), inputs.link)
    uses: ./.github/workflows/macos-build.yml
    with:
      config: ${{ inputs.config }}
      link: ${{ inputs.link }}
      server: ${{ inputs.server }}
      shards: "4"
      runner: "macos-15-intel"
    secrets: inherit

  # linux/arm64 has the same shape of problem as macOS: the builder fleet is
  # x86_64-only, so `builds submit-dag` has nothing to schedule an arm64 job
  # onto and those variants simply never get built — the catalog currently has
  # ZERO linux/arm64 packages. Same remedy: build on ephemeral GitHub-hosted
  # arm64 runners and publish directly.
  #
  # Keyed off `arch` rather than `platforms`, because arm64 is an architecture
  # of the linux platform, not a platform of its own.
  populate-linux-arm64:
    name: Build & publish linux/arm64 packages
    needs: populate
    if: contains(inputs.arch, 'arm64') && contains(fromJSON('["release","debug"]'), inputs.config) && contains(fromJSON('["shared","static"]'), inputs.link)
    uses: ./.github/workflows/linux-arm-build.yml
    with:
      config: ${{ inputs.config }}
      link: ${{ inputs.link }}
      server: ${{ inputs.server }}
      shards: "4"
      recipes: ${{ inputs.recipes }}
    secrets: inherit
