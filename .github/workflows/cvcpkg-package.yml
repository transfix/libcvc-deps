# Per-component package stage for libcvc-deps.
#
# This workflow splits a built monolithic install prefix into
# per-component bundle archives using the recipe definitions.
# It runs as a post-step after the existing platform build jobs
# and produces per-component archives alongside the monolithic
# ones.
#
# Can be called as a reusable workflow from release.yml or run
# standalone on a pre-built prefix.
#
# See docs/roadmap/split-distribution.md §8 for the design.

name: Package components

on:
  workflow_call:
    inputs:
      platform:
        description: "Target platform (linux, macos, windows)"
        required: true
        type: string
      arch:
        description: "Target architecture (x86_64, arm64)"
        required: false
        type: string
        default: x86_64
      config:
        description: "Build config (release, debug)"
        required: true
        type: string
      link:
        description: "Link mode (shared, static)"
        required: true
        type: string
      prefix_artifact:
        description: "Name of the artifact containing the built prefix"
        required: true
        type: string
      version:
        description: "Release version (e.g. 1.2.0)"
        required: false
        type: string
        default: ''
      release_tag:
        description: "Git tag for the release (e.g. v1.4.1). When set, publish packages to cvcpkg-server after packaging."
        required: false
        type: string
        default: ''
    secrets:
      CVCPKG_PUBLISH_TOKEN:
        description: "Token for publishing to cvcpkg-server (pkg.tx.wtf)"
        required: false

  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        type: choice
        options: [linux, macos, windows]
      config:
        description: "Build config"
        required: true
        type: choice
        options: [release, debug]
      link:
        description: "Link mode"
        required: true
        type: choice
        options: [shared, static]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ inputs.platform }}/${{ inputs.config }}/${{ inputs.link }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg
        run: |
          pip install --upgrade pip
          pip install ./tools/cvcpkg

      - name: Download built prefix
        if: inputs.prefix_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.prefix_artifact }}
          path: monolithic/

      - name: Extract monolithic bundle
        run: |
          set -euo pipefail
          mkdir -p prefix

          # Generic extractor — handles any archive format the
          # platform build jobs might produce (.tar.gz, .zip, .7z,
          # .tar.xz, .tar.bz2, .tar.zst, etc.).
          extract() {
            local f="$1" dst="$2"
            case "$f" in
              *.tar.gz|*.tgz)   tar xzf  "$f" --strip-components=1 -C "$dst" ;;
              *.tar.bz2|*.tbz2) tar xjf  "$f" --strip-components=1 -C "$dst" ;;
              *.tar.xz|*.txz)   tar xJf  "$f" --strip-components=1 -C "$dst" ;;
              *.tar.zst)        tar --zstd -xf "$f" --strip-components=1 -C "$dst" ;;
              *.tar)            tar xf   "$f" --strip-components=1 -C "$dst" ;;
              *.zip)
                # unzip has no --strip-components; extract to temp dir
                # then move contents of the single top-level dir up.
                local tmp
                tmp=$(mktemp -d)
                unzip -o "$f" -d "$tmp"
                local top
                top=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d)
                if [ "$(echo "$top" | wc -l)" -eq 1 ] && [ -d "$top" ]; then
                  cp -a "$top"/. "$dst"/
                else
                  cp -a "$tmp"/. "$dst"/
                fi
                rm -rf "$tmp"
                ;;
              *.7z)             7z x "$f" -o"$dst" -y ;;
              *) echo "Unknown archive format: $f" >&2; return 1 ;;
            esac
          }

          cd monolithic
          for f in *; do
            [ -f "$f" ] || continue
            echo "Extracting: $f"
            extract "$f" ../prefix
          done
          echo "Prefix contents:"
          ls ../prefix/ || true

      # Split the monolithic prefix into per-component bundles.
      # For each recipe, the script:
      #   1. Reads package.files globs from recipe.yaml
      #   2. Copies matching files from the prefix into a staging dir
      #   3. Generates a manifest.yaml
      #   4. Archives the staging dir
      - name: Split into per-component bundles
        env:
          CVC_PLATFORM: ${{ inputs.platform }}
          CVC_CONFIG: ${{ inputs.config }}
          CVC_LINK: ${{ inputs.link }}
          CVC_ARCH: ${{ inputs.arch || 'x86_64' }}
          CVC_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_SCRIPT'
          import fnmatch
          import os
          import sys
          from pathlib import Path

          import yaml

          # Add cvcpkg to path
          sys.path.insert(0, str(Path("tools/cvcpkg/src")))
          from cvcpkg.builder import (
              Recipe,
              create_archive,
              generate_manifest,
              list_recipes,
              stage_bundle,
          )

          prefix = Path("prefix")
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          index_entries = []

          platform = os.environ.get("CVC_PLATFORM", "linux")
          config = os.environ.get("CVC_CONFIG", "release")
          link = os.environ.get("CVC_LINK", "shared")
          arch = os.environ.get("CVC_ARCH", "x86_64")
          version = os.environ.get("CVC_VERSION", "")

          recipes_dir = Path("recipes")
          recipes = list_recipes(recipes_dir)

          # Collect all files in the prefix
          all_files = []
          for p in sorted(prefix.rglob("*")):
              if p.is_file():
                  all_files.append(str(p.relative_to(prefix)))

          print(f"Prefix has {len(all_files)} files")
          print(f"Found {len(recipes)} recipes")

          for recipe in recipes:
              # Check if this recipe targets the current platform
              platforms = [m.platform for m in recipe.build_matrix]
              if platform not in platforms:
                  print(f"  SKIP {recipe.name} (not for {platform})")
                  continue

              # Match files using the recipe's package.files globs
              matched = set()
              for pattern in recipe.package_files:
                  for f in all_files:
                      if fnmatch.fnmatch(f, pattern):
                          matched.add(f)

              if not matched:
                  print(f"  SKIP {recipe.name} (no matching files in prefix)")
                  continue

              print(f"  {recipe.name}: {len(matched)} files")

              # Stage matched files
              staging = Path(f"staging-{recipe.name}")
              staging.mkdir(exist_ok=True)
              for f in sorted(matched):
                  src = prefix / f
                  dst = staging / f
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  # Preserve symlinks
                  if src.is_symlink():
                      dst.symlink_to(os.readlink(src))
                  else:
                      import shutil
                      shutil.copy2(src, dst)

              # Generate manifest
              manifest = generate_manifest(
                  recipe, staging, platform, arch, config, link,
                  maintainer="CyberPC Angel, LLC",
              )

              # Write manifest into staging
              manifest_dir = staging / "share" / "libcvc-deps"
              manifest_dir.mkdir(parents=True, exist_ok=True)
              with open(manifest_dir / "manifest.yaml", "w") as f:
                  yaml.dump(manifest, f, default_flow_style=False, sort_keys=False)

              # Include the recipe that produced this package
              recipe_dest = manifest_dir / "recipe"
              recipe_dest.mkdir(parents=True, exist_ok=True)
              import shutil as _shutil
              _exts = {".yaml", ".sh", ".ps1", ".cmake", ".patch"}
              for rf in sorted(recipe.recipe_dir.iterdir()):
                  if rf.is_file() and rf.suffix in _exts:
                      _shutil.copy2(rf, recipe_dest / rf.name)

              # Create archive
              archive_path, sha256, size = create_archive(
                  staging, dist,
                  recipe.name, recipe.full_version,
                  platform, arch, config, link,
              )

              index_entries.append({
                  "name": recipe.name,
                  "version": recipe.full_version,
                  "upstream_version": recipe.upstream_version,
                  "cvc_revision": recipe.cvc_revision,
                  "platform": platform,
                  "arch": arch,
                  "config": config,
                  "link": link,
                  "sha256": sha256,
                  "size_bytes": size,
                  "archive": archive_path.name,
              })

              # Cleanup staging
              import shutil
              shutil.rmtree(staging)

          # Write release index
          index = {
              "schema_version": 1,
              "release_version": version,
              "platform": platform,
              "arch": arch,
              "config": config,
              "link": link,
              "bundles": index_entries,
          }
          index_path = dist / f"index-{platform}-{arch}-{config}-{link}.yaml"
          with open(index_path, "w") as f:
              yaml.dump(index, f, default_flow_style=False, sort_keys=False)

          print(f"\nGenerated {len(index_entries)} component bundles in {dist}/")
          print(f"Index: {index_path}")
          PYTHON_SCRIPT

      - name: List component bundles
        run: |
          echo "=== Component bundles ==="
          ls -lh dist/
          echo ""
          echo "=== Index ==="
          cat dist/index-*.yaml

      - name: Upload component bundles
        uses: actions/upload-artifact@v4
        with:
          name: components-${{ inputs.platform }}-${{ inputs.config }}-${{ inputs.link }}
          path: dist/
          if-no-files-found: error

      # ── Publish to cvcpkg-server immediately after packaging ──
      # Each platform/config/link publishes its own bundles as soon
      # as they're ready, instead of waiting for all platforms.
      - name: Publish to cvcpkg-server
        if: inputs.release_tag != ''
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN secret not set — skipping server publish"
            exit 0
          fi

          archives=$(find dist \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No component archives to publish for ${{ inputs.platform }}/${{ inputs.config }}/${{ inputs.link }}"
            exit 0
          fi

          count=$(echo "$archives" | wc -l)
          echo "Publishing $count archives (${{ inputs.platform }}/${{ inputs.config }}/${{ inputs.link }}) to $CVCPKG_SERVER_URL ..."
          # shellcheck disable=SC2086
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ inputs.release_tag }}"
