name: deploy-prod

# Deploys cvcpkg-server to the primary (cvcpkg.org) and a local read-only
# mirror (pkg.tx.wtf).  A self-hosted runner (label: cvcpkg-prod) picks up the
# job: it deploys the mirror locally and SSHes to the primary over the internal
# network.
#
# Host/target coordinates come from repository variables
# (vars.PROD_SERVER_SSH, vars.BSD_BUILDER_SSH_HOSTS, vars.WINDOWS_BUILDER_SSH)
# so they are not hard-coded in this public workflow.  The mirror pulls the
# upstream catalog hourly inside the backend container; downloads are proxied
# on demand and cached to the local archives volume.

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to prod HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cvcpkg.org + pkg.tx.wtf
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target SHA
        id: target
        run: |
          if [[ -n "${{ inputs.sha }}" ]]; then
            sha="${{ inputs.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::invalid sha: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying sha: $sha"

      # ── Deploy to cvcpkg.org (primary) via SSH ──────────────
      - name: Deploy to cvcpkg.org
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"
          REMOTE="${{ vars.PROD_SERVER_SSH }}"
          DEPLOY_DIR="/home/tfx/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}"
          SSH="ssh -o StrictHostKeyChecking=accept-new"

          echo "=== Deploying to cvcpkg.org (primary) ==="

          # ── Pre-deploy disk cleanup ──
          echo "Checking disk space on primary..."
          $SSH "$REMOTE" bash -s <<'CLEANUP'
          set -euo pipefail
          echo "Before cleanup: $(df -h / | tail -1)"

          # Prune unused Docker images, build cache, and stopped containers
          sudo docker system prune -af --volumes 2>/dev/null || true

          # Remove stale cvcpkg build temp dirs
          sudo find /tmp -maxdepth 1 -name 'cvcpkg-*' -type d -mmin +60 -exec rm -rf {} + 2>/dev/null || true

          # Clean old database backups (keep last 5)
          BKDIR="/home/tfx/libcvc-deps/backups"
          if [ -d "$BKDIR" ]; then
            ls -1t "$BKDIR"/pre-deploy-*.sql.gz 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
          fi

          # Clean old git objects
          if [ -d /home/tfx/libcvc-deps/.git ]; then
            cd /home/tfx/libcvc-deps && git gc --auto 2>/dev/null || true
          fi

          # Clean apt caches
          sudo apt-get clean 2>/dev/null || true

          # Clean old logs
          sudo journalctl --vacuum-size=50M 2>/dev/null || true

          echo "After cleanup:  $(df -h / | tail -1)"
          CLEANUP

          # Migrate .env.production from old tools/cvcpkg/ location before rsync
          $SSH "$REMOTE" "
            cd ${DEPLOY_DIR}
            if [[ ! -f .env.production && -f tools/cvcpkg/.env.production ]]; then
              echo 'Migrating .env.production from tools/cvcpkg/ to repo root...'
              mv tools/cvcpkg/.env.production .env.production
            fi
            rm -rf tools/cvcpkg tools 2>/dev/null || true
          "

          # Sync checkout to remote host
          echo "Syncing checkout to ${REMOTE}:${DEPLOY_DIR}..."
          rsync -a --delete \
            --exclude '.env.production' \
            --exclude 'backups/' \
            -e "$SSH" \
            "${GITHUB_WORKSPACE}/" "${REMOTE}:${DEPLOY_DIR}/"

          # Write deploy script to remote host (avoids bash -s stdin
          # issues where docker compose commands steal heredoc lines)
          $SSH "$REMOTE" "cat > /tmp/cvcpkg-deploy.sh" << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          RELEASE_TAG="$1"; SHORT_SHA="$2"; DEPLOY_DIR="$3"; CVCPKG_DIR="$4"
          cd "$CVCPKG_DIR"

          # Bundle recipes
          rm -rf src/cvcpkg/recipes
          cp -r "${DEPLOY_DIR}/recipes" src/cvcpkg/recipes

          # Migration: move .env.production from old tools/cvcpkg/ location
          if [[ ! -f .env.production && -f tools/cvcpkg/.env.production ]]; then
            echo "Migrating .env.production from tools/cvcpkg/ to repo root..."
            mv tools/cvcpkg/.env.production .env.production
            rm -rf tools/cvcpkg tools
          fi

          if [[ ! -f .env.production ]]; then
            echo "::error::.env.production not found at ${CVCPKG_DIR}/"
            exit 1
          fi

          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          # Backup database
          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          # Build and deploy
          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Migrations
          echo "Running database migrations..."
          if ! $COMPOSE exec -T postgres psql -U cvcpkg -tAc \
               "SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'" \
               2>/dev/null | grep -q 1; then
            echo "Stamping database at revision 002 (pre-Alembic baseline)..."
            $COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
          fi
          $COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
          echo "Migrations complete."

          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          # Health check (use docker exec so it works regardless of bind address)
          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if $COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "cvcpkg.org backend healthy!"
              $COMPOSE exec -T backend curl -s http://localhost:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'cvcpkg.org deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::cvcpkg.org backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1
          DEPLOY_SCRIPT

          # Execute the deploy script on the remote host
          $SSH "$REMOTE" "bash /tmp/cvcpkg-deploy.sh \
            '${RELEASE_TAG}' '${SHORT_SHA}' '${DEPLOY_DIR}' '${CVCPKG_DIR}'"

      # ── Deploy to pkg.tx.wtf (local mirror) ────────────────
      - name: Deploy to pkg.tx.wtf
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"
          DEPLOY_DIR="/home/tfx/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}"

          echo "=== Deploying to pkg.tx.wtf (local mirror) ==="

          # Migrate .env.production from old tools/cvcpkg/ location before rsync
          if [[ ! -f "${DEPLOY_DIR}/.env.production" && -f "${DEPLOY_DIR}/tools/cvcpkg/.env.production" ]]; then
            echo "Migrating .env.production from tools/cvcpkg/ to repo root..."
            mv "${DEPLOY_DIR}/tools/cvcpkg/.env.production" "${DEPLOY_DIR}/.env.production"
          fi
          rm -rf "${DEPLOY_DIR}/tools/cvcpkg" "${DEPLOY_DIR}/tools" 2>/dev/null || true

          echo "Syncing checkout to ${DEPLOY_DIR}..."
          rsync -a --delete \
            --exclude '.env.production' \
            --exclude 'backups/' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_DIR}/"

          cd "$CVCPKG_DIR"

          rm -rf src/cvcpkg/recipes
          cp -r "${DEPLOY_DIR}/recipes" src/cvcpkg/recipes

          # Migration: move .env.production from old tools/cvcpkg/ location
          if [[ ! -f .env.production && -f tools/cvcpkg/.env.production ]]; then
            echo "Migrating .env.production from tools/cvcpkg/ to repo root..."
            mv tools/cvcpkg/.env.production .env.production
            rm -rf tools/cvcpkg tools
          fi

          if [[ ! -f .env.production ]]; then
            echo "::error::.env.production not found at ${CVCPKG_DIR}/"
            exit 1
          fi

          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "Running database migrations..."
          if ! $COMPOSE exec -T postgres psql -U cvcpkg -tAc \
               "SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'" \
               2>/dev/null | grep -q 1; then
            echo "Stamping database at revision 002 (pre-Alembic baseline)..."
            $COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
          fi
          $COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
          echo "Migrations complete."

          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if $COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "pkg.tx.wtf backend healthy!"
              $COMPOSE exec -T backend curl -s http://localhost:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'pkg.tx.wtf deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::pkg.tx.wtf backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1

      # ── Push recipes to the primary server DB ─────────────────
      # The deploy above bundles recipes into the backend image, but
      # the DB-backed /v1/recipes/* store (used by builders to fetch
      # recipes at build time) is not refreshed automatically.  Push
      # every recipe from the checkout so builders always see the
      # deployed revision.
      - name: Push recipes to cvcpkg.org
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          export CVCPKG_SERVER_URL=https://cvcpkg.org
          if [[ -z "${CVCPKG_TOKEN:-}" ]]; then
            echo "::warning::CVCPKG_PUBLISHER_TOKEN not set — skipping recipe push"
            exit 0
          fi
          python3 -m pip install --quiet --user . || true
          # Prefer the freshly-checked-out package script over any installed copy.
          CVCPKG="python3 -m cvcpkg"
          ok=0
          fail=0
          for d in recipes/*/; do
            name=$(basename "$d")
            [[ "$name" == "_common" ]] && continue
            [[ -f "$d/recipe.yaml" ]] || continue
            if $CVCPKG recipe push "$name" >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              echo "::warning::recipe push failed: $name"
              fail=$((fail+1))
            fi
          done
          echo "Recipes: $ok ok, $fail failed"

      # ── Update BSD builders via SSH ───────────────────────────
      # (Linux builder runners are updated by the update-linux-builders
      #  job below)
      # (the Windows builder is updated by the update-windows-builder job below)
      - name: Clean up BSD builder disk space
        continue-on-error: true
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          # BSD builders reachable only by LAN IP from the cvcpkg-prod
          # runner (no DNS for the *-build hostnames).
          for host in ${{ vars.BSD_BUILDER_SSH_HOSTS }}; do
            echo "--- $host ---"
            $SSH "$host" "
              # Remove leaked work dirs from failed builds
              find /tmp -maxdepth 1 -name 'cvcpkg-*' -type d -mmin +60 -exec rm -rf {} + 2>/dev/null
              # Clean pip cache
              pip cache purge 2>/dev/null || true
              # Reclaim cvcpkg client cache if it landed on the root fs
              rm -rf /root/.cache/cvcpkg 2>/dev/null || true
              echo \"\$(hostname): \$(df -h / | awk 'NR==2{print \$4}') free\"
            " || echo "::warning::$host: cleanup failed"
          done

      - name: Update non-runner builders (BSD)
        continue-on-error: true
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"

          # BSD builders reachable only by LAN IP from the cvcpkg-prod runner.
          for host in ${{ vars.BSD_BUILDER_SSH_HOSTS }}; do
            echo "--- $host ---"
            $SSH "$host" "
              cd /root/libcvc-deps 2>/dev/null || cd /usr/local/src/libcvc-deps &&
              git fetch origin &&
              git checkout -f $SHA &&
              cd . &&
              pip install --break-system-packages --quiet . 2>/dev/null;
              pip install --quiet . 2>/dev/null;
              echo \"\$(hostname): \$(cvcpkg --version)\"
            " || echo "::warning::Failed to update $host"
          done

      # ── Restart BSD builder agents ────────────────────────────
      - name: Restart non-runner builders (BSD)
        continue-on-error: true
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"

          # BSD builders reachable only by LAN IP from the cvcpkg-prod runner.
          # Kill the running daemon, re-launch from its @reboot crontab entry.
          for host in ${{ vars.BSD_BUILDER_SSH_HOSTS }}; do
            echo "--- $host ---"
            $SSH "$host" "
              pkill -f 'cvcpkg builder run' 2>/dev/null || true
              sleep 2
              CMD=\$(crontab -l 2>/dev/null | grep '@reboot.*cvcpkg builder run' | sed 's/@reboot //')
              if [ -n \"\$CMD\" ]; then
                eval \"\$CMD\"
                sleep 2
                pgrep -f 'cvcpkg builder run' >/dev/null 2>&1 && echo \"\$(hostname): builder restarted\" || echo \"::warning::\$(hostname): builder failed to start\"
              else
                echo \"::warning::\$(hostname): no @reboot cvcpkg entry found\"
              fi
            " || echo "::warning::Failed to restart builder on $host"
          done

  # ── Update Linux builder runners ───────────────────────────────
  # Each runner has a unique label matching its hostname.
  update-linux-builders:
    name: Update builder (${{ matrix.runner }})
    needs: deploy
    runs-on: [self-hosted, Linux, X64, "${{ matrix.runner }}"]
    strategy:
      fail-fast: false
      matrix:
        runner: [star-00, star-01, lat, rebota]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.sha }}

      - name: Ensure LLVM 18 dev packages
        run: |
          if ! dpkg -s llvm-18-dev >/dev/null 2>&1; then
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            echo 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main' | sudo tee /etc/apt/sources.list.d/llvm-18.list
            sudo apt-get update -qq
            sudo NEEDRESTART_MODE=a apt-get install -y -qq llvm-18-dev lld-18 liblld-18-dev
          fi
          echo "$(hostname): LLVM $(llvm-config-18 --version 2>/dev/null || echo 'not found')"

      - name: Install cvcpkg
        working-directory: .
        run: |
          pip install --break-system-packages --quiet . 2>/dev/null || \
          pip install --quiet .
          echo "$(hostname): $(cvcpkg --version)"

      - name: Clean up stale build artifacts
        run: |
          # Remove leaked work dirs from failed builds
          find /tmp -maxdepth 1 -name 'cvcpkg-*' -type d -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          # Clean pip cache
          pip cache purge 2>/dev/null || true
          echo "$(hostname): disk $(df -h / | awk 'NR==2{print $4}') free"

      - name: Restart builder service
        run: |
          UNIT=/etc/systemd/system/cvcpkg-builder.service
          if [ -f "$UNIT" ]; then
            # Migrate from old --cross-target if present
            sudo sed -i 's|--cross-target |--cross-platform |g' "$UNIT"
            # Remove stale CVC_COSMOCC_DIR env (toolchain path is now
            # resolved dynamically per-build by _install_cross_toolchains)
            sudo sed -i '/^Environment=CVC_COSMOCC_DIR=/d' "$UNIT"
            # Add --cross-platform wasm if missing
            if ! grep -q -- '--cross-platform wasm' "$UNIT" 2>/dev/null; then
              sudo sed -i 's|--work-dir [^ ]*|& --cross-platform wasm|' "$UNIT"
            fi
            # Add --cross-platform wasi if missing
            if ! grep -q -- '--cross-platform wasi' "$UNIT" 2>/dev/null; then
              sudo sed -i 's|--cross-platform wasm|& --cross-platform wasi|' "$UNIT"
            fi
            # Add --cross-platform cosmo if missing
            if ! grep -q -- '--cross-platform cosmo' "$UNIT" 2>/dev/null; then
              sudo sed -i 's|--cross-platform wasi|& --cross-platform cosmo|' "$UNIT"
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable cvcpkg-builder 2>/dev/null || true
            sudo systemctl restart cvcpkg-builder
            sleep 3
            if systemctl is-active --quiet cvcpkg-builder; then
              echo "$(hostname): builder restarted successfully"
            else
              echo "::error::$(hostname): builder failed to start"
              journalctl -u cvcpkg-builder --no-pager -n 10
              exit 1
            fi
          else
            echo "::warning::$(hostname): no systemd unit at $UNIT — skipping restart"
          fi

  # ── Update Windows builder ─────────────────────────────────────
  # The Windows builder is reachable via SSH from a Linux runner.
  update-windows-builder:
    name: Update builder (windows)
    needs: deploy
    runs-on: [self-hosted, Linux, X64, star-00]
    timeout-minutes: 10

    steps:
      - name: Update and restart the Windows builder
        run: |
          set -euo pipefail
          SHA="${{ needs.deploy.outputs.sha }}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          WIN="${{ vars.WINDOWS_BUILDER_SSH }}"

          echo "--- Configuring Windows Defender exclusions ---"
          $SSH "$WIN" "powershell -Command \"Add-MpPreference -ExclusionPath 'C:\Users\tfx\cvcpkg-builder' -ErrorAction SilentlyContinue; Add-MpPreference -ExclusionPath \$env:TEMP -ErrorAction SilentlyContinue; Add-MpPreference -ExclusionProcess 'pwsh.exe' -ErrorAction SilentlyContinue; Add-MpPreference -ExclusionProcess 'bash.exe' -ErrorAction SilentlyContinue; Write-Host 'Defender exclusions set'\"" || true

          echo "--- Cleaning up stale build artifacts ---"
          $SSH "$WIN" "powershell -Command \"Get-ChildItem C:\Users\tfx\cvcpkg-builder -Directory | Where-Object { \$_.Name -match '^cvcpkg-' -and \$_.LastWriteTime -lt (Get-Date).AddHours(-1) } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue; Write-Host 'Cleanup done'\"" || true

          echo "--- Stopping Windows builder ---"
          # Kill any running cvcpkg builder so pip can overwrite the exe
          $SSH "$WIN" "taskkill /f /im cvcpkg.exe 2>NUL & taskkill /f /im python.exe 2>NUL & echo stopped" || true
          sleep 5

          echo "--- Updating the Windows builder ---"
          $SSH "$WIN" "
            cd C:/Users/tfx/src/cvc/libcvc-deps &&
            git fetch origin &&
            git checkout -f $SHA &&
            cd . &&
            pip install --quiet . 2>NUL &&
            set PYTHONIOENCODING=utf-8 &&
            cvcpkg --version
          "

          echo "--- Restarting Windows builder ---"
          $SSH "$WIN" "schtasks /run /tn cvcpkg-builder 2>NUL && echo windows: builder restarted || echo windows: no scheduled task found"
