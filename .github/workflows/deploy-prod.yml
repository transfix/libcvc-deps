name: deploy-prod

# Deploys cvcpkg-server to pkg.tx.wtf on every push to the `prod` branch.
#
# The self-hosted runner on catx-03.tx.wtf picks up the job and runs
# the auto-deploy script which rebuilds the Docker image and restarts
# the production stack.
#
# Required repo secrets:
#   (none — the runner IS the production host)

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to prod HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to pkg.tx.wtf
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target SHA
        id: target
        run: |
          if [[ -n "${{ inputs.sha }}" ]]; then
            sha="${{ inputs.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::invalid sha: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying sha: $sha"

      - name: Deploy
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"

          cd tools/cvcpkg

          # Copy .env.production from the persistent host location
          if [[ -f /home/tfx/libcvc-deps/tools/cvcpkg/.env.production ]]; then
            cp /home/tfx/libcvc-deps/tools/cvcpkg/.env.production .env.production
          else
            echo "::error::.env.production not found at /home/tfx/libcvc-deps/tools/cvcpkg/"
            exit 1
          fi

          # Detect docker compose
          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          # Backup database if postgres is running
          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          # Build and deploy
          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          # Wait for health
          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if curl -fsS --max-time 3 http://127.0.0.1:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "Backend healthy!"
              curl -s http://127.0.0.1:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'Deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::Backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1
