name: deploy-prod

# Deploys cvcpkg-server to both:
#   - cvcpkg.org  (cvcpkg-00, 10.10.10.134 — primary)
#   - pkg.tx.wtf  (catx-03, local — legacy, transition period)
#
# The self-hosted runner on catx-03.tx.wtf picks up the job.
# catx-03 deploys locally for pkg.tx.wtf and SSHes to cvcpkg-00
# over the internal LAN for cvcpkg.org.
#
# Required repo secrets:
#   (none — the runner IS catx-03 and has SSH access to cvcpkg-00)

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to prod HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cvcpkg.org + pkg.tx.wtf
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target SHA
        id: target
        run: |
          if [[ -n "${{ inputs.sha }}" ]]; then
            sha="${{ inputs.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::invalid sha: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying sha: $sha"

      # ── Deploy to cvcpkg.org (cvcpkg-00) via SSH ──────────────
      - name: Deploy to cvcpkg.org
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"
          REMOTE="tfx@10.10.10.134"
          DEPLOY_DIR="/home/tfx/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}/tools/cvcpkg"
          SSH="ssh -o StrictHostKeyChecking=accept-new"

          echo "=== Deploying to cvcpkg.org (cvcpkg-00) ==="

          # Sync checkout to remote host
          echo "Syncing checkout to ${REMOTE}:${DEPLOY_DIR}..."
          rsync -a --delete \
            --exclude '.env.production' \
            --exclude 'backups/' \
            -e "$SSH" \
            "${GITHUB_WORKSPACE}/" "${REMOTE}:${DEPLOY_DIR}/"

          # Write deploy script to remote host (avoids bash -s stdin
          # issues where docker compose commands steal heredoc lines)
          $SSH "$REMOTE" "cat > /tmp/cvcpkg-deploy.sh" << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          RELEASE_TAG="$1"; SHORT_SHA="$2"; DEPLOY_DIR="$3"; CVCPKG_DIR="$4"
          cd "$CVCPKG_DIR"

          # Bundle recipes
          rm -rf src/cvcpkg/recipes
          cp -r "${DEPLOY_DIR}/recipes" src/cvcpkg/recipes

          if [[ ! -f .env.production ]]; then
            echo "::error::.env.production not found at ${CVCPKG_DIR}/"
            exit 1
          fi

          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          # Backup database
          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          # Build and deploy
          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Migrations
          echo "Running database migrations..."
          if ! $COMPOSE exec -T postgres psql -U cvcpkg -tAc \
               "SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'" \
               2>/dev/null | grep -q 1; then
            echo "Stamping database at revision 002 (pre-Alembic baseline)..."
            $COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
          fi
          $COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
          echo "Migrations complete."

          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          # Health check (use docker exec so it works regardless of bind address)
          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if $COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "cvcpkg.org backend healthy!"
              $COMPOSE exec -T backend curl -s http://localhost:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'cvcpkg.org deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::cvcpkg.org backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1
          DEPLOY_SCRIPT

          # Execute the deploy script on the remote host
          $SSH "$REMOTE" "bash /tmp/cvcpkg-deploy.sh \
            '${RELEASE_TAG}' '${SHORT_SHA}' '${DEPLOY_DIR}' '${CVCPKG_DIR}'"

      # ── Deploy to pkg.tx.wtf (catx-03, local) ────────────────
      - name: Deploy to pkg.tx.wtf
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"
          DEPLOY_DIR="/home/tfx/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}/tools/cvcpkg"

          echo "=== Deploying to pkg.tx.wtf (catx-03, local) ==="

          echo "Syncing checkout to ${DEPLOY_DIR}..."
          rsync -a --delete \
            --exclude '.env.production' \
            --exclude 'backups/' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_DIR}/"

          cd "$CVCPKG_DIR"

          rm -rf src/cvcpkg/recipes
          cp -r "${DEPLOY_DIR}/recipes" src/cvcpkg/recipes

          if [[ ! -f .env.production ]]; then
            echo "::error::.env.production not found at ${CVCPKG_DIR}/"
            exit 1
          fi

          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "Running database migrations..."
          if ! $COMPOSE exec -T postgres psql -U cvcpkg -tAc \
               "SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'" \
               2>/dev/null | grep -q 1; then
            echo "Stamping database at revision 002 (pre-Alembic baseline)..."
            $COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
          fi
          $COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
          echo "Migrations complete."

          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if $COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "pkg.tx.wtf backend healthy!"
              $COMPOSE exec -T backend curl -s http://localhost:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'pkg.tx.wtf deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::pkg.tx.wtf backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1

      # ── Update builder agents ─────────────────────────────────
      - name: Update builder agents
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"

          echo "=== Updating cvcpkg on builder machines ==="

          # Linux builders (via SSH from catx-03)
          for host in tfx@star-00 tfx@star-01; do
            echo "--- $host ---"
            $SSH "$host" "
              cd ~/libcvc-deps &&
              git fetch origin &&
              git checkout -f $SHA &&
              cd tools/cvcpkg &&
              pip install --break-system-packages --quiet . 2>/dev/null;
              pip install --quiet . 2>/dev/null;
              echo \"\$(hostname): \$(cvcpkg --version)\"
            " || echo "::warning::Failed to update $host"
          done

          # BSD builders (root access)
          for host in root@netbsd-build root@netbsd-build-2 \
                      root@freebsd-build root@freebsd-build-2 \
                      root@openbsd-build root@openbsd-build-2; do
            echo "--- $host ---"
            $SSH "$host" "
              cd /root/libcvc-deps 2>/dev/null || cd /usr/local/src/libcvc-deps &&
              git fetch origin &&
              git checkout -f $SHA &&
              cd tools/cvcpkg &&
              pip install --break-system-packages --quiet . 2>/dev/null;
              pip install --quiet . 2>/dev/null;
              echo \"\$(hostname): \$(cvcpkg --version)\"
            " || echo "::warning::Failed to update $host"
          done

          # Windows builder (sandipaws)
          $SSH tfx@sandipaws "
            cd C:/Users/tfx/libcvc-deps &&
            git fetch origin &&
            git checkout -f $SHA &&
            cd tools/cvcpkg &&
            pip install --quiet . 2>NUL &&
            cvcpkg --version
          " || echo "::warning::Failed to update sandipaws"

          echo "Builder update complete."

      # ── Restart builder agents ────────────────────────────────
      - name: Restart builder agents
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"

          echo "=== Restarting builder agents ==="

          # Linux builders (systemd) — kill any rogue daemon, use systemd
          for host in tfx@star-00 tfx@star-01; do
            echo "--- $host ---"
            $SSH "$host" "
              # Kill any manually-started daemon
              pkill -f 'cvcpkg builder run' 2>/dev/null || true
              sleep 1
              # Ensure --cross-platform wasm and wasi are in the systemd unit
              UNIT=/etc/systemd/system/cvcpkg-builder.service
              # Migrate from old --cross-target if present
              sudo sed -i 's|--cross-target |--cross-platform |g' \"\$UNIT\"
              # Add --cross-platform wasm if missing
              if ! grep -q -- '--cross-platform wasm' \"\$UNIT\" 2>/dev/null; then
                sudo sed -i 's|--work-dir [^ ]*|& --cross-platform wasm|' \"\$UNIT\"
              fi
              # Add --cross-platform wasi if missing
              if ! grep -q -- '--cross-platform wasi' \"\$UNIT\" 2>/dev/null; then
                sudo sed -i 's|--cross-platform wasm|& --cross-platform wasi|' \"\$UNIT\"
              fi
              sudo systemctl daemon-reload
              # Enable and restart systemd service
              sudo systemctl enable cvcpkg-builder 2>/dev/null || true
              sudo systemctl restart cvcpkg-builder
              sleep 2
              if systemctl is-active --quiet cvcpkg-builder; then
                echo \"\$(hostname): builder restarted (systemd)\"
              else
                echo \"::warning::\$(hostname): builder failed to start\"
                journalctl -u cvcpkg-builder --no-pager -n 5
              fi
            " || echo "::warning::Failed to restart builder on $host"
          done

          # BSD builders — kill daemon, re-launch from crontab entry
          for host in root@netbsd-build root@netbsd-build-2 \
                      root@freebsd-build root@freebsd-build-2 \
                      root@openbsd-build root@openbsd-build-2; do
            echo "--- $host ---"
            $SSH "$host" "
              pkill -f 'cvcpkg builder run' 2>/dev/null || true
              sleep 2
              # Extract the @reboot command from crontab and re-run it
              CMD=\$(crontab -l 2>/dev/null | grep '@reboot.*cvcpkg builder run' | sed 's/@reboot //')
              if [ -n \"\$CMD\" ]; then
                eval \"\$CMD\"
                sleep 2
                if pgrep -f 'cvcpkg builder run' >/dev/null 2>&1; then
                  echo \"\$(hostname): builder restarted (daemon)\"
                else
                  echo \"::warning::\$(hostname): builder failed to start\"
                fi
              else
                echo \"::warning::\$(hostname): no @reboot cvcpkg entry found\"
              fi
            " || echo "::warning::Failed to restart builder on $host"
          done

          # Windows builder (sandipaws) — restart via schtasks
          $SSH tfx@sandipaws "
            taskkill /f /im python.exe /fi \"WINDOWTITLE eq cvcpkg*\" 2>NUL
            schtasks /run /tn cvcpkg-builder 2>NUL && echo sandipaws: builder restarted || echo sandipaws: no scheduled task found
          " || echo "::warning::Failed to restart builder on sandipaws"

          echo "All builder agents restarted."
