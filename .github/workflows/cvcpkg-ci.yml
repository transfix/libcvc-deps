# CI for the cvcpkg Python tool.
#
# Runs the test suite and linter on PRs/pushes that touch the
# cvcpkg source, recipes, or packaging schemas.

name: cvcpkg CI

on:
  pull_request:
    paths:
      - 'tools/cvcpkg/**'
      - 'recipes/**'
      - 'packaging/**'
  push:
    branches: [master, main]
    paths:
      - 'tools/cvcpkg/**'
      - 'recipes/**'
      - 'packaging/**'

concurrency:
  group: cvcpkg-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: tools/cvcpkg
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras server

      - name: Run unit tests
        working-directory: tools/cvcpkg
        shell: bash
        run: |
          poetry run pytest tests/unit/ -v --tb=short \
            --junitxml=unit-results.xml \
            --cov=cvcpkg --cov-branch --cov-report=xml:coverage-unit.xml

      - name: Run integration tests
        working-directory: tools/cvcpkg
        shell: bash
        run: |
          poetry run pytest tests/integration/ -v --tb=short \
            --junitxml=integration-results.xml \
            --cov=cvcpkg --cov-branch --cov-append --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: tools/cvcpkg/*-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tools/cvcpkg/coverage.xml
            tools/cvcpkg/htmlcov/

  validate:
    name: Validate schemas & recipes
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run validation
        run: python packaging/validate.py

  lint:
    name: Lint & type-check
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tools/cvcpkg
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras server

      - name: Ruff check
        working-directory: tools/cvcpkg
        run: poetry run ruff check src/ tests/
        continue-on-error: true

      - name: Ruff format check
        working-directory: tools/cvcpkg
        run: poetry run ruff format --check src/ tests/
        continue-on-error: true

      - name: Black format check
        working-directory: tools/cvcpkg
        run: poetry run black --check --diff src/ tests/
