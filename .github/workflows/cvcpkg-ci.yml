# CI for the cvcpkg Python tool.
#
# Runs the test suite and linter on PRs/pushes that touch the
# cvcpkg source, recipes, or packaging schemas.

name: cvcpkg CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'recipes/**'
      - 'packaging/**'
      - 'tests/**'
      - 'docker-compose.test.yml'
      - 'Dockerfile.test'
      - 'Dockerfile.playwright'
      - 'pep517-backend/**'
      # Dependency changes must run the suite: the installed set is what the
      # tests actually exercise, and adding/removing a dep can silently change
      # which tests run at all (an importorskip'd test flipping between
      # skipped and executed) or break the poetry install outright.
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/cvcpkg-ci.yml'
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'recipes/**'
      - 'packaging/**'
      - 'tests/**'
      - 'docker-compose.test.yml'
      - 'Dockerfile.test'
      - 'Dockerfile.playwright'
      - 'pep517-backend/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/cvcpkg-ci.yml'

concurrency:
  group: cvcpkg-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', vars.CI_ALLOWED_ACTORS), format(',{0},', github.actor))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras server

      - name: Run unit tests
        working-directory: .
        shell: bash
        run: |
          poetry run pytest tests/unit/ -v --tb=short \
            --junitxml=unit-results.xml \
            --cov=cvcpkg --cov-branch --cov-report=xml:coverage.xml

      - name: Run integration tests
        working-directory: .
        shell: bash
        run: |
          # The full non-Docker integration suite runs on every OS in the
          # matrix (including windows-latest — Phase 1.5 "Windows CI
          # integration tests").  Server-dependent modules auto-skip via
          # tests/integration/conftest.py when no live server is reachable,
          # and platform-specific modules carry their own skip markers
          # (e.g. test_work_dir is bash-only).  The Docker-backed suite
          # still runs in the dedicated `integration` job below.
          poetry run pytest tests/integration/ -v --tb=short \
            --junitxml=integration-results.xml \
            --cov=cvcpkg --cov-branch --cov-append --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: "*-results.xml"
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          retention-days: 7

  secrets-scan:
    name: Secret scan
    # Cheap, always-on, and runs for forks too: this is the control that would
    # have caught a publisher token pasted into a roadmap doc, where it sat
    # publicly readable for five weeks (audit 2026-08-03).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject committed cvcpkg tokens
        run: |
          set -uo pipefail
          # A minted token is `cvctok_` + 43 url-safe base64 chars. Match 20+ so
          # truncated pastes are caught too, while `cvctok_FILL_ME_IN` style
          # placeholders and `cvctok_<REDACTED>` stay legal.
          if git grep -nIE 'cvctok_[A-Za-z0-9_-]{20,}' -- . ':(exclude).github/workflows/cvcpkg-ci.yml'; then
            echo "::error::A cvcpkg API token appears to be committed. Revoke it, then remove it from the tree AND from history."
            exit 1
          fi
          echo "No committed cvcpkg tokens found."

  validate:
    name: Validate schemas & recipes
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', vars.CI_ALLOWED_ACTORS), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # packaging/validate.py is now a thin shim over cvcpkg.validation (the
        # validator + schemas moved into the package), so cvcpkg must be
        # importable here — install it editable alongside the runtime deps.
        run: |
          pip install pyyaml jsonschema
          pip install -e .

      - name: Run validation
        run: python packaging/validate.py

  lint:
    name: Lint & type-check
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', vars.CI_ALLOWED_ACTORS), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras server

      - name: Ruff check
        working-directory: .
        run: poetry run ruff check src/ tests/
        continue-on-error: true

      - name: Ruff format check
        working-directory: .
        run: poetry run ruff format --check src/ tests/
        continue-on-error: true

      - name: Black format check
        working-directory: .
        run: poetry run black --check --diff src/ tests/

      - name: Check license headers
        working-directory: .
        run: poetry run python scripts/apply_headers.py --check

  # ── Docker integration tests (self-hosted only) ─────────────
  #
  # Spins up a PostgreSQL + cvcpkg-server stack in Docker, then runs
  # the full end-to-end test suite: token management, package build →
  # publish → install → smoke test, audit trail verification.
  # Only runs on the self-hosted prod runner where Docker is
  # available.
  integration:
    # Serialise this job across the WHOLE repo, not per-ref.
    #
    # The workflow-level group is cvcpkg-ci-${{ github.ref }}, so every open
    # PR runs its own copy of this job at the same time -- and they all land
    # on ONE self-hosted docker daemon that is already shared with seven other
    # runner services. Three of them overlapping is what exhausted the retry
    # added in #505: contention on all 3 attempts, the last after 8 minutes of
    # building, because `--no-cache` rebuilds every layer and each layer is a
    # fresh chance to collide on the content store.
    #
    # Retrying harder does not fix a build that is structurally maximally
    # exposed. Not racing ourselves does. cancel-in-progress is false: these
    # runs should queue, never cancel each other.
    concurrency:
      group: cvcpkg-docker-integration
      cancel-in-progress: false
    name: Integration tests (Docker)
    # Self-hosted runner safety.  For `pull_request`, GitHub evaluates the
    # workflow definition from the PR's own merge ref, so a fork PR can edit
    # this gate and these steps and run arbitrary code on the runner.  This
    # runner is the PRODUCTION host: it holds the Docker socket and the
    # deploy SSH keys used by deploy-prod.yml.  Restrict it to pushes and
    # same-repository PRs -- the guard pr-recipe-build-dev.yml already uses.
    # The actor allowlist stays as a second factor, not the only one.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(format(',{0},', vars.CI_ALLOWED_ACTORS), format(',{0},', github.actor)))
    needs: [test, validate, lint]
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # This runner's Docker root is a tmpfs (/mnt/ramdisk/docker, 96 GB) that
      # also holds the 59 GB cvcpkg-prod-data production volume, leaving ~25 GB
      # for CI -- shared with txwtf's suite, which runs on the same host for
      # hours at a time.  When it runs out, the failure surfaces as a baffling
      # `dpkg: failed to write ... No space left on device` inside an apt-get
      # layer of the image build, several steps from the real cause.
      #
      # `build --no-cache` below means the build cache this job creates is pure
      # waste -- it is never reused, only accumulated (measured: 8.6 GB with
      # zero active entries).  Reclaim it up front, and say plainly how much
      # room is left so a future space failure is one line, not a dpkg trace.
      #
      # Deliberately NOT `docker system prune -a`: tagged images and volumes on
      # this host belong to production and to whatever else is mid-run.
      - name: Reclaim Docker build cache and report space
        run: |
          docker builder prune -af 2>/dev/null | tail -1 || true
          docker image prune -f 2>/dev/null | tail -1 || true
          echo "--- Docker root filesystem ---"
          df -h "$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)"
          avail_kb=$(df -Pk "$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)" | awk 'NR==2{print $4}')
          if [ "${avail_kb:-0}" -lt 10485760 ]; then
            echo "::warning::Less than 10 GiB free on the Docker root; image builds may fail with ENOSPC."
            docker system df || true
          fi

      - name: Start test stack
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true

          # Retry the image build on buildkit's transient content-store lock.
          #
          # The self-hosted runner shares ONE docker daemon (buildx on the
          # `docker` driver, so one embedded buildkit) between eight Actions
          # runners and a Kubernetes containerd. When two builds write the same
          # blob at once, the loser gets
          #
          #   failed to open writer: ref moby/1/<id> locked for 11.574479ms
          #   (since ...): unavailable
          #
          # and the whole build dies before a single test runs. It is not a
          # flake in the "rare" sense: the daemon logged 222 of these in 48
          # hours, in bursts of 20-38 within the same minute, and it took out
          # this job twice fourteen hours apart.
          #
          # The lock is held for MILLISECONDS and containerd reports it as
          # gRPC Unavailable -- the code that means "try again". So retry,
          # rather than pretending the build is deterministic. Anything that is
          # not this specific contention still fails on the first attempt.
          # pipefail, because `docker ... | tee` otherwise reports TEE's exit
          # status and every failed build would look like a success.
          set -o pipefail
          build_images() {
            docker compose -f docker-compose.test.yml build --no-cache test playwright backend
          }
          for attempt in 1 2 3; do
            if build_images 2>&1 | tee /tmp/build.log; then
              break
            fi
            if ! grep -qE 'locked for .*unavailable|failed to open writer' /tmp/build.log; then
              echo "::error::image build failed for a reason other than buildkit lock contention"
              exit 1
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "::error::buildkit lock contention persisted across 3 attempts"
              exit 1
            fi
            echo "::warning::buildkit content-store contention; retrying build (attempt $((attempt+1))/3)"
            sleep $((attempt * 20))
          done

          # `backend` is built inside the retry above, so no --build here. It was
          # the THIRD build site and the one still unprotected: the test/playwright
          # build succeeded, the loop broke, and then this line hit the same
          # content-store race with no retry around it -- which is why #508's own
          # run failed with no retry warning in the log.
          docker compose -f docker-compose.test.yml up -d postgres backend
          echo "Waiting for backend health..."
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8421/healthz; do sleep 2; done'
          echo ""
          echo "Test stack ready."

      - name: Run Docker integration tests
        working-directory: .
        env:
          CVCPKG_TEST_SERVER_URL: http://127.0.0.1:8421
        run: |
          # No --build: `test` is built inside the retry in `Start test stack`.
          docker compose -f docker-compose.test.yml run --rm test

      - name: Run Playwright browser tests
        working-directory: .
        run: |
          # NO --build. `Start test stack` above already built this image with
          # --no-cache, in this same job, from this same compose file. --build
          # rebuilt it a SECOND time: minutes of duplicated work, and a second
          # place to lose the buildkit content-store race -- which is exactly
          # where #503 died, in this step rather than the one #505 wrapped in a
          # retry. Removing the redundant build removes the collision site
          # instead of retrying it.
          docker compose -f docker-compose.test.yml run --rm playwright

      - name: Collect logs on failure
        if: failure()
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml logs --tail=200 backend || true
          docker compose -f docker-compose.test.yml logs --tail=50 postgres || true

      # `down -v` drops this run's containers and volumes, but the images and
      # build cache the --no-cache rebuild just produced survive it, and the
      # next run's rebuild orphans them.  Clean up after ourselves rather than
      # leaving it to whoever runs next -- on a shared prod runner that is
      # usually a different repo.
      - name: Tear down test stack
        if: always()
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml down -v --rmi local 2>/dev/null || true
          docker builder prune -af 2>/dev/null | tail -1 || true
          docker image prune -f 2>/dev/null | tail -1 || true
