# CI for the cvcpkg Python tool.
#
# Runs the test suite and linter on PRs/pushes that touch the
# cvcpkg source, recipes, or packaging schemas.

name: cvcpkg CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'recipes/**'
      - 'packaging/**'
      - 'tests/**'
      - 'docker-compose.test.yml'
      - 'Dockerfile.test'
      - 'Dockerfile.playwright'
      - 'cvcpkg_build_backend.py'
      # Dependency changes must run the suite: the installed set is what the
      # tests actually exercise, and adding/removing a dep can silently change
      # which tests run at all (an importorskip'd test flipping between
      # skipped and executed) or break the poetry install outright.
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/cvcpkg-ci.yml'
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'recipes/**'
      - 'packaging/**'
      - 'tests/**'
      - 'docker-compose.test.yml'
      - 'Dockerfile.test'
      - 'Dockerfile.playwright'
      - 'cvcpkg_build_backend.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/cvcpkg-ci.yml'

concurrency:
  group: cvcpkg-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras server

      - name: Run unit tests
        working-directory: .
        shell: bash
        run: |
          poetry run pytest tests/unit/ -v --tb=short \
            --junitxml=unit-results.xml \
            --cov=cvcpkg --cov-branch --cov-report=xml:coverage.xml

      - name: Run integration tests
        working-directory: .
        shell: bash
        run: |
          # The full non-Docker integration suite runs on every OS in the
          # matrix (including windows-latest — Phase 1.5 "Windows CI
          # integration tests").  Server-dependent modules auto-skip via
          # tests/integration/conftest.py when no live server is reachable,
          # and platform-specific modules carry their own skip markers
          # (e.g. test_work_dir is bash-only).  The Docker-backed suite
          # still runs in the dedicated `integration` job below.
          poetry run pytest tests/integration/ -v --tb=short \
            --junitxml=integration-results.xml \
            --cov=cvcpkg --cov-branch --cov-append --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: "*-results.xml"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml

  validate:
    name: Validate schemas & recipes
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # packaging/validate.py is now a thin shim over cvcpkg.validation (the
        # validator + schemas moved into the package), so cvcpkg must be
        # importable here — install it editable alongside the runtime deps.
        run: |
          pip install pyyaml jsonschema
          pip install -e .

      - name: Run validation
        run: python packaging/validate.py

  lint:
    name: Lint & type-check
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --extras server

      - name: Ruff check
        working-directory: .
        run: poetry run ruff check src/ tests/
        continue-on-error: true

      - name: Ruff format check
        working-directory: .
        run: poetry run ruff format --check src/ tests/
        continue-on-error: true

      - name: Black format check
        working-directory: .
        run: poetry run black --check --diff src/ tests/

      - name: Check license headers
        working-directory: .
        run: poetry run python scripts/apply_headers.py --check

  # ── Docker integration tests (self-hosted only) ─────────────
  #
  # Spins up a PostgreSQL + cvcpkg-server stack in Docker, then runs
  # the full end-to-end test suite: token management, package build →
  # publish → install → smoke test, audit trail verification.
  # Only runs on the self-hosted prod runner where Docker is
  # available.
  integration:
    name: Integration tests (Docker)
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    needs: [test, validate, lint]
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start test stack
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose -f docker-compose.test.yml build --no-cache test playwright
          docker compose -f docker-compose.test.yml up -d --build postgres backend
          echo "Waiting for backend health..."
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8421/healthz; do sleep 2; done'
          echo ""
          echo "Test stack ready."

      - name: Run Docker integration tests
        working-directory: .
        env:
          CVCPKG_TEST_SERVER_URL: http://127.0.0.1:8421
        run: |
          docker compose -f docker-compose.test.yml run --build --rm test

      - name: Run Playwright browser tests
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml run --build --rm playwright

      - name: Collect logs on failure
        if: failure()
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml logs --tail=200 backend || true
          docker compose -f docker-compose.test.yml logs --tail=50 postgres || true

      - name: Tear down test stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
