# CI for the cvcpkg Python tool.
#
# Runs the test suite and linter on PRs/pushes that touch the
# cvcpkg source, recipes, or packaging schemas.

name: cvcpkg CI

on:
  pull_request:
    paths:
      - 'tools/cvcpkg/**'
      - 'recipes/**'
      - 'packaging/**'
  push:
    branches: [master, main]
    paths:
      - 'tools/cvcpkg/**'
      - 'recipes/**'
      - 'packaging/**'

concurrency:
  group: cvcpkg-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: tools/cvcpkg
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Run unit tests
        working-directory: tools/cvcpkg
        run: poetry run pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        working-directory: tools/cvcpkg
        run: poetry run pytest tests/integration/ -v --tb=short

  validate:
    name: Validate schemas & recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run validation
        run: python packaging/validate.py

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tools/cvcpkg
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Ruff check
        working-directory: tools/cvcpkg
        run: poetry run ruff check src/ tests/
        continue-on-error: true

      - name: Ruff format check
        working-directory: tools/cvcpkg
        run: poetry run ruff format --check src/ tests/
        continue-on-error: true
