# Build and publish all Windows recipes to cvcpkg.org.
#
# Mirror of macos-build.yml for the windows-latest ephemeral runner.
# Used while the self-hosted Windows builder is offline,
# and as a permanent fallback for one-off Windows publishes.
#
# Triggered manually via workflow_dispatch or by the populate-server
# workflow when 'windows' is in the platforms list.
#
# Required repo secrets:
#   CVCPKG_PUBLISHER_TOKEN  — a publisher-role token for cvcpkg.org

name: Windows Package Build

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Build config"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      link:
        description: "Link mode"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - static
      server:
        description: "cvcpkg server URL"
        required: true
        default: "https://cvcpkg.org"
        type: string
      shards:
        description: "Number of parallel shards"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      recipes:
        description: "Space-separated recipe names to build (empty = all recipes, sharded). Set to build/publish just a few — e.g. a one-off fix or iteration."
        required: false
        default: ""
        type: string
      ref:
        description: "Branch/ref to build from (default: prod). Use a feature branch to test recipe changes before they land on prod."
        required: false
        default: "prod"
        type: string
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      link:
        required: true
        type: string
      server:
        required: true
        type: string
      shards:
        required: false
        type: string
        default: "4"
      ref:
        required: false
        type: string
        default: "prod"

permissions:
  contents: read

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        run: |
          # A targeted `recipes` build is small — one shard, no sharding math.
          if [ -n "${{ inputs.recipes }}" ]; then
            echo 'shards=[0]' >> "$GITHUB_OUTPUT"
          else
            TOTAL="${{ inputs.shards || '4' }}"
            SHARDS=$(python3 -c "import json; print(json.dumps(list(range(int('$TOTAL')))))")
            echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          fi

  build-shard:
    name: Windows shard ${{ matrix.shard }}/${{ inputs.shards || '4' }} (${{ inputs.config }}/${{ inputs.link }})
    needs: setup
    # Pin to windows-2022 (VS 2022 / toolset v143). `windows-latest` has drifted to
    # Visual Studio 18 (2026, MSVC 14.51), which CPython 3.11's PCbuild props don't
    # recognise — MSBuild falls back to requesting the v140 (VS2015) toolset and dies
    # with MSB8020. v143 is the newest toolset CPython 3.11 builds against cleanly.
    runs-on: windows-2022
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'prod' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MSVC environment must be active before any recipe build.sh/ps1
      # invokes cl.exe / link.exe.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install system build tools
        shell: powershell
        run: |
          # windows-latest pre-installs chocolatey, cmake, ninja, python3,
          # nasm, vcpkg, git bash and pwsh.  Pin cmake to 3.x to match
          # Boost 1.86 expectations.
          choco install ninja --no-progress -y 2>&1 | Out-Null
          choco install cmake --version=3.31.7 --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y 2>&1 | Out-Null
          choco install nasm --no-progress -y 2>&1 | Out-Null
          # vcpkg pre-installed at C:\vcpkg on windows-latest; bootstrap
          # only if missing.
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          echo 'C:\vcpkg' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # Refresh PATH so downstream bash steps see choco-installed tools.
          foreach ($dir in ([System.Environment]::GetEnvironmentVariable('PATH', 'Machine') -split ';')) {
            if ($dir) { echo $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
          }

      - name: Ensure pwsh is on PATH
        shell: bash
        run: |
          # Recipes with .ps1 build scripts need PowerShell Core (pwsh).
          if ! command -v pwsh >/dev/null 2>&1; then
            for d in "/c/Program Files/PowerShell/7" "/c/Program Files/PowerShell/7-preview"; do
              if [ -x "$d/pwsh.exe" ]; then
                echo "$d" >> "$GITHUB_PATH"
                echo "Added $d to PATH for pwsh"
                break
              fi
            done
          fi

      - name: Install cvcpkg
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          # [publish]: the publish step below runs `cvcpkg publish --all`, which
          # uploads over the server's HTTP API (httpx).  The pack-all step is
          # core-only work, but both run from this one install.
          python -m pip install --quiet '.[publish]'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # On Windows, pip puts scripts in the Python install Scripts dir.
          PY_SCRIPTS=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$PY_SCRIPTS" >> "$GITHUB_PATH"

      - name: Build shard ${{ matrix.shard }} (pack-all)
        shell: bash
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          SHARDS="${{ inputs.shards || '4' }}"
          mkdir -p "${{ github.workspace }}/prefix"
          mkdir -p "${{ github.workspace }}/dist"

          if [ -n "${{ inputs.recipes }}" ]; then
            # Targeted build: the named recipes, in the order given. For each:
            # install its published dep closure into the shared prefix, build+pack
            # against it, then publish immediately — so a later recipe in the same
            # run that depends on an earlier one (a chain, e.g. shiboken6 ->
            # pyside6) can install-deps it from the server.
            for r in ${{ inputs.recipes }}; do
              echo "::group::install-deps $r (windows)"
              # cvcpkg pack does NOT resolve deps — it builds against whatever is
              # already in --prefix (single-prefix model). Install the recipe's
              # build+runtime closure first, or its build.ps1 can't find python/
              # qt/llvm/etc. Host tools (cmake/ninja) come from the CI image.
              cvcpkg install-deps "recipes/$r" \
                --platform windows \
                --config "${{ inputs.config }}" \
                --link "${{ inputs.link }}" \
                --prefix "${{ github.workspace }}/prefix" \
                --recipes-dir recipes
              echo "::endgroup::"
              echo "::group::pack $r (windows)"
              cvcpkg pack "recipes/$r" \
                --platform windows \
                --config "${{ inputs.config }}" \
                --link "${{ inputs.link }}" \
                --prefix "${{ github.workspace }}/prefix" \
                --output-dir "${{ github.workspace }}/dist" \
                --recipes-dir recipes \
                --server "$CVCPKG_SERVER_URL" \
                --token "$CVCPKG_TOKEN"
              echo "::endgroup::"
              echo "::group::publish $r (windows)"
              cvcpkg publish --all \
                --server "$CVCPKG_SERVER_URL" \
                --token "$CVCPKG_TOKEN" \
                --output-dir "${{ github.workspace }}/dist" \
                --platform windows \
                --config "${{ inputs.config }}" \
                --link "${{ inputs.link }}" || true
              echo "::endgroup::"
            done
          else
            cvcpkg pack-all \
              --keep-going \
              --platform windows \
              --config "${{ inputs.config }}" \
              --link "${{ inputs.link }}" \
              --prefix "${{ github.workspace }}/prefix" \
              --output-dir "${{ github.workspace }}/dist" \
              --recipes-dir recipes \
              --shard "${{ matrix.shard }}/${SHARDS}" \
              --server-cache "$CVCPKG_SERVER_URL" \
              --server-cache-token "$CVCPKG_TOKEN" \
              --server-cache-push
          fi

      - name: List built packages
        if: always()
        shell: bash
        run: |
          echo "Built packages (shard ${{ matrix.shard }}):"
          ls -lh "${{ github.workspace }}/dist/" 2>/dev/null || echo "(no packages)"
          COUNT=$(ls "${{ github.workspace }}/dist/"*.zip 2>/dev/null | wc -l || echo 0)
          echo "Count: $COUNT archives"

      - name: Publish to cvcpkg.org
        if: always()
        shell: bash
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          DIST="${{ github.workspace }}/dist"
          # cvcpkg pack writes a .zip on Windows (create_archive: windows -> .zip,
          # unix -> .tar.gz; .tar.zst only exists in the remote-builder rewrap +
          # server storage, never the local pack output). Globbing *.tar.zst here
          # matched nothing, so this guard silently skipped publishing after a
          # successful pack (exit 0) — the reason python311/windows never landed.
          ARCHIVES=($(ls "$DIST"/*.zip 2>/dev/null || true))
          if [ ${#ARCHIVES[@]} -eq 0 ]; then
            echo "::warning::No archives found in dist/ — nothing to publish"
            exit 0
          fi
          echo "Publishing ${#ARCHIVES[@]} packages to $CVCPKG_SERVER_URL"
          cvcpkg publish --all \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --output-dir "$DIST" \
            --platform windows \
            --config "${{ inputs.config }}" \
            --link "${{ inputs.link }}"

      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-shard${{ matrix.shard }}-${{ inputs.config }}-${{ inputs.link }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
