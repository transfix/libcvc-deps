name: build-wasm-deps-catx03

# The cvcpkg populate fleet's wasm builders can not resolve CVC_EMSDK_DIR
# (their toolchain step writes '${PREFIX}' literal instead of the real path).
# catx-03 has emsdk properly set up via the cyberpcangel-cvcgl nightly, so
# route wasm dep builds here explicitly, then publish via this repo's already-
# configured CVCPKG_PUBLISHER_TOKEN. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipes to pack + publish (space-separated)"
        required: true
        default: "zlib bzip2 xz zstd libpng libjpeg-turbo tiff freetype libwebp libxml2 lerc assimp imagemagick"

concurrency:
  group: wasm-deps-catx03
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    # The cvcpkg-prod label is the catx-03 runner registered to THIS repo, the
    # only one with the emsdk bundle at /opt/cvc-wasm/emsdk + the wasm-deps
    # prefix. (cy-pca is a label on the cy-pca ORG runner, which this repo
    # cannot see: with it the job queues forever; without any pin, runs land
    # on star-01 where env-wasm.sh cannot source emsdk_env.sh and every recipe
    # is skipped, which is what happened on 2026-08-28.)
    runs-on: [self-hosted, Linux, X64, cvcpkg-prod]
    env:
      CVC_EMSDK_DIR: /opt/cvc-wasm/emsdk
      CVC_WASM_DEPS: /opt/cvc-wasm/deps-wasm-mt
      CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the runner's cvcpkg CMake
        run: echo "/opt/cvc-wasm/cmake-cvcpkg/bin" >> "$GITHUB_PATH"

      - name: Locate cvcpkg
        run: |
          if command -v cvcpkg >/dev/null 2>&1; then
            echo "cvcpkg present at $(command -v cvcpkg)"
          else
            python3 -m pip install --user --upgrade .
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          PATH="$HOME/.local/bin:$PATH" cvcpkg --version

      - name: Writable overlay of the shared wasm deps prefix
        # /opt/cvc-wasm/deps-wasm-mt belongs to github-runner and this runner
        # is tfx, so cvcpkg cannot install a freshly built package into it
        # (PermissionError on include/<pkg>, then "(skipped: <r>)" and "no
        # archives produced"). Mirror the prefix as a symlink farm under
        # $HOME: existing deps resolve through the links, new installs land in
        # tfx-owned directories, and it costs no disk. Hardlinks are not an
        # option (fs.protected_hardlinks blocks them for files tfx does not
        # own). Verified 2026-09-03 with joltphysics: pack + node smoke pass.
        run: |
          set -euo pipefail
          OV="$HOME/.cache/cvcpkg/wasm-prefix-overlay"
          rm -rf "$OV"
          mkdir -p "$OV"
          cp -as "$CVC_WASM_DEPS/." "$OV/"
          echo "overlay of $CVC_WASM_DEPS: $(find "$OV" -type l | wc -l) links"
          echo "CVC_WASM_DEPS=$OV" >> "$GITHUB_ENV"

      - name: Pack the wasm dep closure on catx-03
        run: |
          set -euo pipefail
          mkdir -p dist
          for r in ${{ inputs.recipes }}; do
            echo "=== packing $r for wasm ==="
            cvcpkg pack "$r" \
              --recipes-dir recipes --no-default-recipes \
              --prefix "$CVC_WASM_DEPS" \
              --platform wasm \
              --config release --link static \
              --output-dir dist/ || echo "  (skipped: $r)"
          done
          ls -la dist/

      - name: Publish freshly packed bundles
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            [ -e "$f" ] || { echo "no archives produced"; exit 1; }
            echo "=== publish $f ==="
            cvcpkg publish "$f" --server https://cvcpkg.org
          done
