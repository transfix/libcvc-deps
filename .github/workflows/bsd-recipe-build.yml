# BSD recipe-driven build for libcvc-deps.
#
# DISABLED — Package building has migrated to the cvcpkg remote
# builders system (pkg.tx.wtf).  This reusable workflow is retained
# for reference but is no longer called by any workflow.
#
# Previously built recipes on BSD virtual machines (FreeBSD, OpenBSD,
# NetBSD) hosted on the Incus cluster.
# SSH access to every BSD VM on the 10.66.77.0/24 LAN.
#
# Prerequisite: the runner user's SSH key must be authorized on all
# three BSD VMs (one-time setup via incus exec + authorized_keys).
#
# Reusable from release.yml and ci.yml.

name: BSD Recipe Build

on:
  workflow_call:
    inputs:
      platform:
        description: "Target BSD platform (freebsd, openbsd, netbsd)"
        required: true
        type: string
      config:
        description: "Build config (release, debug)"
        required: true
        type: string
      link:
        description: "Link mode (shared, static)"
        required: true
        type: string
      sha_suffix:
        description: "Short SHA for CI builds (empty for tag releases)"
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  SSH_OPTS: '-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes'

jobs:
  build:
    runs-on: ["self-hosted", "Linux", "X64", "cvcpkg-builder"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          BTLC=$(echo "${{ inputs.config }}" | tr '[:upper:]' '[:lower:]')
          LINKSFX=""
          [ "${{ inputs.link }}" = "static" ] && LINKSFX="-static"
          SHASFX=""
          if [ -n "${{ inputs.sha_suffix }}" ]; then
            short=$(echo "${{ inputs.sha_suffix }}" | cut -c1-7)
            SHASFX="-${short}"
          fi
          ARCH=x86_64
          STEM="libcvc-deps-${VERSION}${SHASFX}-${{ inputs.platform }}-${ARCH}-${BTLC}${LINKSFX}"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"         >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "stem=$STEM"         >> "$GITHUB_OUTPUT"

      # ── Resolve VM host IP ──
      # Each BSD platform has two builder VMs.  We hash the matrix combo
      # (config + link) to distribute jobs evenly across the pair.
      # If the chosen VM is unreachable, we fall back to the other one.
      - name: Resolve BSD VM connection
        id: vm
        shell: bash
        run: |
          resolve_vm_ip() {
            local vm_name="$1" fallback="$2"
            if command -v incus >/dev/null 2>&1; then
              local ip
              ip=$(incus list "$vm_name" --format csv -c 4 2>/dev/null \
                   | grep -oE '10\.66\.77\.[0-9]+' | head -1)
              if [ -n "$ip" ]; then
                echo "$ip"
                return
              fi
            fi
            echo "$fallback"
          }

          vm_is_reachable() {
            ssh ${SSH_OPTS} -o ConnectTimeout=5 "root@$1" true >/dev/null 2>&1
          }

          # Pick VM index (0 or 1) by hashing the matrix combo
          COMBO="${{ inputs.config }}-${{ inputs.link }}"
          HASH=$(echo -n "$COMBO" | cksum | awk '{print $1}')
          IDX=$(( HASH % 2 ))

          case "${{ inputs.platform }}" in
            freebsd)
              VMS=("freebsd-build" "freebsd-build-2")
              FALLBACKS=("10.66.77.174" "10.66.77.154")
              echo "python=python3.11" >> "$GITHUB_OUTPUT"
              ;;
            openbsd)
              VMS=("openbsd-build" "openbsd-build-2")
              FALLBACKS=("10.66.77.197" "10.66.77.235")
              echo "python=python3.12" >> "$GITHUB_OUTPUT"
              ;;
            netbsd)
              VMS=("netbsd-build" "netbsd-build-2")
              FALLBACKS=("10.66.77.214" "10.66.77.167")
              echo "python=python3.13" >> "$GITHUB_OUTPUT"
              ;;
          esac

          PRIMARY_IDX=$IDX
          FALLBACK_IDX=$(( 1 - IDX ))

          HOST=$(resolve_vm_ip "${VMS[$PRIMARY_IDX]}" "${FALLBACKS[$PRIMARY_IDX]}")
          echo "Primary VM: ${VMS[$PRIMARY_IDX]} ($HOST)"

          if ! vm_is_reachable "$HOST"; then
            echo "::warning::Primary VM ${VMS[$PRIMARY_IDX]} ($HOST) unreachable, falling back"
            HOST=$(resolve_vm_ip "${VMS[$FALLBACK_IDX]}" "${FALLBACKS[$FALLBACK_IDX]}")
            echo "Fallback VM: ${VMS[$FALLBACK_IDX]} ($HOST)"
          fi

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Selected ${{ inputs.platform }} VM: $HOST"

      - name: Verify SSH connectivity to BSD VM
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          echo "Testing SSH to ${VM} ..."
          ssh ${SSH_OPTS} "${VM}" "uname -sr"

      # ── Clean up stale build directories ──
      # Previous runs that were cancelled (e.g. by concurrency groups)
      # may leave orphaned build dirs filling up /tmp.  Remove any
      # libcvc-deps-build-* dirs older than 2 hours.
      - name: Clean up stale build directories
        shell: bash
        run: |
          VM="root@${{ steps.vm.outputs.host }}"
          case "${{ inputs.platform }}" in
            openbsd) BASE_DIR="/usr/local/tmp" ;;
            *)       BASE_DIR="/tmp" ;;
          esac
          ssh ${SSH_OPTS} "${VM}" "
            find ${BASE_DIR} -maxdepth 1 -name 'libcvc-deps-build-*' -type d -mmin +120 -exec rm -rf {} + 2>/dev/null
            find ${BASE_DIR} -maxdepth 1 -name 'cvcpkg-*' -type d -mmin +120 -exec rm -rf {} + 2>/dev/null
            echo \"Disk usage on ${BASE_DIR}:\"
            df -h ${BASE_DIR}
          " || true

      # ── Sync repository to BSD VM ──
      # OpenBSD's root partition (/) is only 1.1 GB so /tmp is unusable for
      # builds.  Use /usr/local/tmp on OpenBSD where we created a large
      # partition; /tmp is fine on FreeBSD (ZFS) and NetBSD (tmpfs backed
      # by ample swap + RAM).
      - name: Sync repository to BSD VM
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          case "${{ inputs.platform }}" in
            openbsd) BASE_DIR="/usr/local/tmp" ;;
            *)       BASE_DIR="/tmp" ;;
          esac
          REMOTE_DIR="${BASE_DIR}/libcvc-deps-build-$$"

          ssh ${SSH_OPTS} "${VM}" "mkdir -p ${REMOTE_DIR}"
          tar cf - --exclude='.git' --exclude='build' --exclude='prefix' \
            --exclude='dist' --exclude='__pycache__' --exclude='*.egg-info' . \
            | ssh ${SSH_OPTS} "${VM}" "tar xf - -C ${REMOTE_DIR}"

          echo "remote_dir=${REMOTE_DIR}" >> "$GITHUB_ENV"
          echo "BASE_DIR=${BASE_DIR}" >> "$GITHUB_ENV"

      # ── Install system packages on BSD VM ──
      # Build tools: bash (required by cvcpkg build scripts), cmake, ninja.
      # Python packages: cryptography requires Rust/maturin to build from
      # source, but maturin does not support BSD platforms ("Unsupported
      # platform" error).  Even with Rust installed, maturin segfaults on
      # OpenBSD 7.7 with rustc 1.86.  Workaround: install pre-built OS packages.
      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          case "${{ inputs.platform }}" in
            freebsd)
              ssh ${SSH_OPTS} "${VM}" "pkg install -y bash cmake ninja py311-cryptography py311-pyyaml py311-sqlite3"
              ;;
            openbsd)
              # pkg_add fails on collisions when packages are already installed;
              # check first so re-runs don't fail on .pyc checksum mismatches.
              ssh ${SSH_OPTS} "${VM}" "for p in bash cmake ninja m4 py3-cryptography py3-yaml; do pkg_info \$p >/dev/null 2>&1 || pkg_add \$p; done"
              ;;
            netbsd)
              ssh ${SSH_OPTS} "${VM}" "
                export PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/pkg/sbin:/usr/pkg/bin
                export PKG_PATH=https://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/\$(uname -m)/10.0/All
                # Use pkg_add directly — pkgin's SQLite DB is unreliable under
                # concurrent access and frequently reports 'empty available
                # packages list' even when the DB exists.
                for pkg in bash cmake ninja-build py313-pip py313-cryptography py313-yaml; do
                  pkg_info -qe \"\${pkg}\" 2>/dev/null && continue
                  echo \"Installing \${pkg} ...\"
                  pkg_add \"\${pkg}\" 2>&1 || echo \"WARNING: failed to install \${pkg}\"
                done
              "
              ;;
          esac

      # ── Install cvcpkg on BSD VM ──
      - name: Install cvcpkg on BSD VM
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          PYTHON="${{ steps.vm.outputs.python }}"
          INSTALL_CMD="TMPDIR=/usr/local/tmp ${PYTHON} -m pip install --break-system-packages . || ${PYTHON} -m pip install ."
          ssh ${SSH_OPTS} "${VM}" "mkdir -p /usr/local/tmp && cd ${remote_dir} && ${INSTALL_CMD}"

      # ── Build all recipes on BSD VM ──
      # BSD ships BSD make (/usr/bin/make) which doesn't support GNU make
      # syntax (e.g. order-only prerequisites with |).  Most autotools and
      # cmake-generated Makefiles require GNU make.  Create a PATH override
      # so that 'make' invocations in build scripts resolve to gmake.
      - name: Build and package all recipes (cvcpkg pack-all)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          PYTHON="${{ steps.vm.outputs.python }}"
          BUILD_CMD="${PYTHON} -m cvcpkg pack-all \
            --keep-going \
            --platform ${{ inputs.platform }} \
            --config ${{ inputs.config }} \
            --link ${{ inputs.link }} \
            --prefix ${remote_dir}/prefix \
            --output-dir ${remote_dir}/dist \
            --recipes-dir recipes"

          # Create tool shims so build scripts that call 'make', 'm4', or
          # 'python3' resolve to the correct binaries on BSD.
          SHIM_CMD="mkdir -p /usr/local/libexec/gnucompat && \
            ln -sf \$(which gmake) /usr/local/libexec/gnucompat/make && \
            if command -v gm4 >/dev/null; then \
              ln -sf \$(which gm4) /usr/local/libexec/gnucompat/m4; \
            fi && \
            if ! command -v python3 >/dev/null 2>&1; then \
              ln -sf \$(which ${PYTHON}) /usr/local/libexec/gnucompat/python3; \
            fi"
          ssh ${SSH_OPTS} "${VM}" "${SHIM_CMD}"

          ssh ${SSH_OPTS} "${VM}" "cd ${remote_dir} && \
            PATH=/usr/local/libexec/gnucompat:\$PATH \
            TMPDIR=${BASE_DIR} \
            ${BUILD_CMD}"

      # ── Install marker cmake config on BSD VM ──
      - name: Install libcvc-deps marker config
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          MARKER_CMD="cmake -B build -G 'Unix Makefiles' \
            -DCMAKE_BUILD_TYPE=${{ inputs.config == 'release' && 'Release' || 'Debug' }} \
            -DCMAKE_INSTALL_PREFIX=${remote_dir}/prefix && \
            cmake --install build"

          ssh ${SSH_OPTS} "${VM}" "cd ${remote_dir} && ${MARKER_CMD}"

      # ── Patch RPATH to $ORIGIN on BSD (shared builds) ──
      - name: Patch RPATH ($ORIGIN)
        if: inputs.link == 'shared'
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          RPATH_CMD="set -e && \
            PREFIX='${remote_dir}/prefix' && \
            if command -v patchelf >/dev/null 2>&1; then \
              find \"\${PREFIX}/lib\" -name '*.so*' -type f 2>/dev/null | while read -r so; do \
                patchelf --remove-rpath \"\${so}\" 2>/dev/null || true; \
                patchelf --set-rpath '\$ORIGIN' \"\${so}\" 2>/dev/null || true; \
              done; \
            else \
              echo 'patchelf not available, relying on build-time RPATH'; \
            fi"

          ssh ${SSH_OPTS} "${VM}" "${RPATH_CMD}"

      # ── Copy artifacts back from BSD VM ──
      - name: Retrieve artifacts from BSD VM
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          mkdir -p "${{ github.workspace }}/dist"

          ssh ${SSH_OPTS} "${VM}" \
            "cd ${remote_dir} && tar cf - dist" \
            | tar xf - -C "${{ github.workspace }}"

          ls -la "${{ github.workspace }}/dist/"

      # ── Clean up remote build directory ──
      - name: Clean up BSD VM
        if: always()
        shell: bash
        run: |
          VM="root@${{ steps.vm.outputs.host }}"
          case "${{ inputs.platform }}" in
            openbsd) BASE_DIR="/usr/local/tmp" ;;
            *)       BASE_DIR="/tmp" ;;
          esac
          ssh ${SSH_OPTS} "${VM}" "
            rm -rf ${remote_dir}
            find ${BASE_DIR} -maxdepth 1 -name 'cvcpkg-*' -type d -exec rm -rf {} + 2>/dev/null
          " || true

      # ── Upload per-component bundles ──
      - name: Upload per-component bundles
        uses: actions/upload-artifact@v4
        with:
          name: components-${{ inputs.platform }}-${{ steps.meta.outputs.btlc }}-${{ inputs.link }}
          path: dist/
          if-no-files-found: error
