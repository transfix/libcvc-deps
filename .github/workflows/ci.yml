name: CI

on:
  pull_request:
    branches: [ master, main, develop ]
  push:
    branches: [ master, main ]

# Cancel superseded runs on the same ref so a push during an
# in-progress build doesn't waste runners. The VTK build cache is
# saved via actions/cache@v4 inside release.yml; vcpkg likewise. Both
# tolerate cancellation because the cache save runs as a post-step
# only when the cache key is fresh.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────── cvcpkg test suite ────────────────────────
  #
  # Runs the cvcpkg unit + integration tests and schema validation
  # on every PR and merge. Fast (<10s) and catches recipe/schema
  # regressions before the heavy dep-bundle build starts.
  cvcpkg-test:
    name: cvcpkg tests
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema pytest 'black==24.10.0'
          pip install -e tools/cvcpkg

      - name: Black format check
        run: black --check --diff tools/cvcpkg/src/ tools/cvcpkg/tests/

      - name: Validate schemas & recipes
        run: python packaging/validate.py

      - name: Run cvcpkg test suite
        run: python -m pytest tools/cvcpkg/tests/unit/ -v --tb=short

  # ────────────────────── Recipe build validation ─────────────────
  #
  # Validates that every recipe can be loaded, dependencies resolve
  # without cycles, and the topological build order is sane. Also
  # verifies every recipe has a build script for at least one
  # platform. This catches recipe-graph regressions without running
  # any actual builds.
  recipe-validate:
    name: Validate recipe graph
    if: github.event_name == 'push' || contains(vars.CI_ALLOWED_ACTORS, github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg
        run: pip install -e tools/cvcpkg

      - name: Validate dependency graph & build order
        run: |
          python3 -c "
          from cvcpkg.builder import list_recipes, resolve_build_order
          from pathlib import Path

          recipes = list_recipes(Path('recipes'))
          print(f'Loaded {len(recipes)} recipes')

          ordered = resolve_build_order(recipes)
          print('Build order:')
          for i, r in enumerate(ordered, 1):
              deps = r.raw.get('depends', {}).get('build', [])
              dep_names = [d if isinstance(d, str) else d['name'] for d in deps]
              suffix = f' (depends: {', '.join(dep_names)})' if dep_names else ''
              print(f'  {i:2d}. {r.name}{suffix}')

          # Verify every recipe has at least one build matrix entry
          for r in recipes:
              assert r.build_matrix, f'{r.name}: no build matrix entries'
              for m in r.build_matrix:
                  script = r.recipe_dir / m.script
                  assert script.is_file(), f'{r.name}: missing build script {m.script}'
          print('All recipes valid.')
          "

  # ────────────────────── Per-commit dep bundle build ─────────────
  #
  # DISABLED — Package building has migrated to the cvcpkg remote
  # builders system (pkg.tx.wtf).  The build job that delegated to
  # release.yml has been removed.
  #
  # Previously this job called release.yml to build dep bundles on
  # every push/PR.  Remote builders now handle all package builds.
