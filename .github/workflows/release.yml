name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Allow manual one-off builds without tagging (for plumbing
  # verification on a feature branch).
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: true
  # Reusable from ci.yml so the per-PR build job produces the same
  # artifact set as a tagged release. ci.yml supplies the SHA-suffix
  # input; the release publishing job here is gated on a tag ref so
  # it's a no-op for PR-driven runs.
  workflow_call:
    inputs:
      sha_suffix:
        description: 'Optional short SHA inserted into archive stems for CI builds (e.g. "abc1234"). Empty for tag releases.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# ───────────────────────────────────────────────────────────────────
# libcvc-deps release artifacts
#
# Self-contained CMAKE_PREFIX_PATH bundles holding every project-level
# dependency needed to build libcvc + volrover3. Each archive is one
# install prefix:
#
#   <root>/{bin,lib,include,share,plugins,...}
#
# Build flavors per platform: (Debug|Release) × (shared|static).
#
#   libcvc-deps-<ver>-linux-<arch>-<config>[-static].tar.gz
#   libcvc-deps-<ver>-macos-<arch>-<config>[-static].zip
#   libcvc-deps-<ver>-windows-<arch>-<config>[-static].zip
#
# Contents:
#   - Boost, HDF5 (C+CXX), FFTW3, GSL, log4cplus, libtiff, libyaml,
#     protobuf, gRPC,
#     CGAL+GMP+MPFR, ImageMagick (Q16-HDRI)
#   - Qt 6.7.x (Core, Gui, Widgets, OpenGL, OpenGLWidgets)
#   - VTK 9.5.0 built against Qt 6 (no QtQuick modules)
#   - libiimod (IMOD's MRC/TIFF image-file I/O subset, built from
#     the LabShare-Archive/IMOD upstream at a pinned SHA — see
#     third-party/libiimod/CMakeLists.txt; linked against the
#     bundled libtiff so TIFF reads/writes are enabled)
#   - levmar 2.6 (Lourakis Levenberg-Marquardt nonlinear least-squares,
#     LAPACK-enabled — see third-party/levmar/CMakeLists.txt)
#   - LAPACK / BLAS (Linux: liblapack/libblas; macOS: brew lapack +
#     Accelerate; Windows: vcpkg clapack + openblas)
#   - pthreads4w on Windows (vcpkg `pthreads`) so the bundle exposes a
#     standard `find_package(Threads)` / `Threads::Threads` target
#     across all three platforms.
#
# CUDA toolkit is intentionally NOT bundled — consumers install it
# directly via Jimver/cuda-toolkit on the build host.
# System libraries (glibc, libstdc++, Windows UCRT) are left to the
# host.
# ───────────────────────────────────────────────────────────────────

env:
  VTK_VERSION: '9.5.0'
  QT_VERSION_LINUX_MACOS: '6'    # apt qt6-base-dev / brew qt@6
  QT_VERSION_WINDOWS: '6.7.*'    # install-qt-action spec
  VCGLIB_VERSION: '2025.07'
  # log4cplus is built from source on Linux so we can ship a static
  # archive (Ubuntu's liblog4cplus-dev only carries the .so).
  LOG4CPLUS_VERSION: '2.1.2'
  VCGLIB_SHA256:  'e49fc9342d5476b3e39a5e1939b965b57c91d7a17b4f97b8c5eaf01228b16cf0'

jobs:
  # ──────────────────────────── Linux ────────────────────────────
  # Build every recipe from source in dependency order.
  # Half the matrix runs on GitHub-hosted ubuntu-latest, half on
  # self-hosted cvcpkg-builder runners for maximum parallelism.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: shared
          - config: release
            link: shared
            runner: '["self-hosted","Linux","X64","cvcpkg-builder"]'
          - config: debug
            link: static
            runner: '["self-hosted","Linux","X64","cvcpkg-builder"]'
          - config: release
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: linux
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      runner: ${{ matrix.runner || '' }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  # ──────────────────────────── macOS ────────────────────────────
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: shared
          - config: release
            link: shared
          - config: debug
            link: static
          - config: release
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: macos
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  # ────────────────────────── Windows ────────────────────────────
  # Build every recipe from source (or vcpkg for port-based recipes)
  # using cvcpkg build-all, just like Linux and macOS.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: shared
          - config: release
            link: shared
          - config: debug
            link: static
          - config: release
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: windows
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  # ──────────────────────────── WASM ─────────────────────────────
  # Cross-compile wasm-platform recipes on a Linux host.
  # Only static linking — wasm does not support shared libraries.
  # Split across GitHub-hosted and self-hosted runners.
  wasm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: static
          - config: release
            link: static
            runner: '["self-hosted","Linux","X64","cvcpkg-builder"]'
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      runner: ${{ matrix.runner || '' }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  # ──────────────────────────── Release ────────────────────────────
  # ────────────────────── Publish per-component packages ──────────
  # Publish pre-built per-component archives to cvcpkg-server.
  # Each build job already ran `cvcpkg pack-all` which built each
  # recipe individually and produced per-component archives.

  publish-linux:
    needs: [linux]
    if: always() && needs.linux.result == 'success' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: shared
          - config: release
            link: shared
          - config: debug
            link: static
          - config: release
            link: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cvcpkg
        run: pip install ./tools/cvcpkg
      - name: Download per-component bundles
        uses: actions/download-artifact@v4
        with:
          name: components-linux-${{ matrix.config }}-${{ matrix.link }}
          path: dist/
      - name: Publish to cvcpkg-server
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN secret not set — skipping publish"
            exit 0
          fi
          archives=$(find dist \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No component archives to publish"
            exit 0
          fi
          count=$(echo "$archives" | wc -l)
          echo "Publishing $count archives (linux/${{ matrix.config }}/${{ matrix.link }}) to $CVCPKG_SERVER_URL ..."
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ github.ref_name }}"

  publish-macos:
    needs: [macos]
    if: always() && needs.macos.result == 'success' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: shared
          - config: release
            link: shared
          - config: debug
            link: static
          - config: release
            link: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cvcpkg
        run: pip install ./tools/cvcpkg
      - name: Download per-component bundles
        uses: actions/download-artifact@v4
        with:
          name: components-macos-${{ matrix.config }}-${{ matrix.link }}
          path: dist/
      - name: Publish to cvcpkg-server
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN secret not set — skipping publish"
            exit 0
          fi
          archives=$(find dist \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No component archives to publish"
            exit 0
          fi
          count=$(echo "$archives" | wc -l)
          echo "Publishing $count archives (macos/${{ matrix.config }}/${{ matrix.link }}) to $CVCPKG_SERVER_URL ..."
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ github.ref_name }}"

  publish-windows:
    needs: [windows]
    if: always() && needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: shared
          - config: release
            link: shared
          - config: debug
            link: static
          - config: release
            link: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cvcpkg
        run: pip install ./tools/cvcpkg
      - name: Download per-component bundles
        uses: actions/download-artifact@v4
        with:
          name: components-windows-${{ matrix.config }}-${{ matrix.link }}
          path: dist/
      - name: Publish to cvcpkg-server
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN secret not set — skipping publish"
            exit 0
          fi
          archives=$(find dist \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No component archives to publish"
            exit 0
          fi
          count=$(echo "$archives" | wc -l)
          echo "Publishing $count archives (windows/${{ matrix.config }}/${{ matrix.link }}) to $CVCPKG_SERVER_URL ..."
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ github.ref_name }}"

  publish-wasm:
    needs: [wasm]
    if: always() && needs.wasm.result == 'success' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            link: static
          - config: release
            link: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cvcpkg
        run: pip install ./tools/cvcpkg
      - name: Download per-component bundles
        uses: actions/download-artifact@v4
        with:
          name: components-wasm-${{ matrix.config }}-${{ matrix.link }}
          path: dist/
      - name: Publish to cvcpkg-server
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN secret not set — skipping publish"
            exit 0
          fi
          archives=$(find dist \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No component archives to publish"
            exit 0
          fi
          count=$(echo "$archives" | wc -l)
          echo "Publishing $count archives (wasm/${{ matrix.config }}/${{ matrix.link }}) to $CVCPKG_SERVER_URL ..."
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ github.ref_name }}"

  release:
    needs: [linux, macos, windows, wasm, publish-linux, publish-macos, publish-windows, publish-wasm]
    runs-on: ubuntu-latest
    # Skip the release step entirely for manual workflow_dispatch
    # runs unless the workflow was triggered on a tag. Run even if
    # some platforms failed, so we still publish the artifacts that
    # did build (e.g. Linux + macOS when a Windows config times out
    # on a cold cache). Require at minimum that linux + macos
    # succeeded — there's no point publishing a release with zero
    # platforms.
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.linux.result == 'success'
      && needs.macos.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        id: gh_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
          # Only upload index metadata to GitHub Releases.  Binary
          # archives are published exclusively to pkg.tx.wtf to avoid
          # hitting GitHub's abuse-detection limits on large uploads.
          files: |
            artifacts/*-index.yaml
          fail_on_unmatched_files: false

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          asset_count=$(gh release view "$tag" --json assets --jq '.assets | length')
          echo "Release $tag has $asset_count assets"
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::Release $tag has no assets — upload failed"
            exit 1
          fi
          if [ "${{ steps.gh_release.outcome }}" = "failure" ]; then
            echo "::warning::softprops/action-gh-release reported failure (likely GitHub secondary rate limit) but release has $asset_count assets — continuing"
          fi

  # ──────────────── Verify cvcpkg-server (pkg.tx.wtf) ────────────
  # Each package-* job publishes its own bundles immediately after
  # packaging.  This final job re-publishes any stragglers (e.g. if
  # a per-platform publish step was interrupted) and logs the total
  # count.  It runs regardless of the release job outcome.
  publish-to-server:
    needs: [publish-linux, publish-macos, publish-windows, publish-wasm]
    runs-on: ubuntu-latest
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && (needs.publish-linux.result == 'success'
          || needs.publish-macos.result == 'success'
          || needs.publish-windows.result == 'success'
          || needs.publish-wasm.result == 'success')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg
        run: pip install ./tools/cvcpkg

      - name: Download component bundles
        uses: actions/download-artifact@v4
        with:
          pattern: components-*
          path: dist
          merge-multiple: true

      - name: Publish stragglers to pkg.tx.wtf
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN secret not set — skipping server publish"
            exit 0
          fi

          archives=$(find dist \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No archives found in dist/"
            exit 0
          fi

          count=$(echo "$archives" | wc -l)
          echo "Re-publishing $count archives to $CVCPKG_SERVER_URL (already-published will be skipped) ..."
          # shellcheck disable=SC2086
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ github.ref_name }}"
