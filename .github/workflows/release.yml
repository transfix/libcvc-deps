name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Allow manual one-off builds without tagging (for plumbing
  # verification on a feature branch).
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: true
  # Reusable from ci.yml so the per-PR build job produces the same
  # artifact set as a tagged release. ci.yml supplies the SHA-suffix
  # input; the release publishing job here is gated on a tag ref so
  # it's a no-op for PR-driven runs.
  workflow_call:
    inputs:
      sha_suffix:
        description: 'Optional short SHA inserted into archive stems for CI builds (e.g. "abc1234"). Empty for tag releases.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# ───────────────────────────────────────────────────────────────────
# libcvc-deps release artifacts
#
# Self-contained CMAKE_PREFIX_PATH bundles holding every project-level
# dependency needed to build libcvc + volrover3. Each archive is one
# install prefix:
#
#   <root>/{bin,lib,include,share,plugins,...}
#
# Build flavors per platform: (Debug|Release) × (shared|static).
#
#   libcvc-deps-<ver>-linux-<arch>-<config>[-static].tar.gz
#   libcvc-deps-<ver>-macos-<arch>-<config>[-static].zip
#   libcvc-deps-<ver>-windows-<arch>-<config>[-static].zip
#
# Contents:
#   - Boost, HDF5 (C+CXX), FFTW3, GSL, log4cplus, libtiff, libyaml,
#     protobuf, gRPC,
#     CGAL+GMP+MPFR, ImageMagick (Q16-HDRI)
#   - Qt 6.7.x (Core, Gui, Widgets, OpenGL, OpenGLWidgets)
#   - VTK 9.5.0 built against Qt 6 (no QtQuick modules)
#   - libiimod (IMOD's MRC/TIFF image-file I/O subset, built from
#     the LabShare-Archive/IMOD upstream at a pinned SHA — see
#     third-party/libiimod/CMakeLists.txt; linked against the
#     bundled libtiff so TIFF reads/writes are enabled)
#   - levmar 2.6 (Lourakis Levenberg-Marquardt nonlinear least-squares,
#     LAPACK-enabled — see third-party/levmar/CMakeLists.txt)
#   - LAPACK / BLAS (Linux: liblapack/libblas; macOS: brew lapack +
#     Accelerate; Windows: vcpkg clapack + openblas)
#   - pthreads4w on Windows (vcpkg `pthreads`) so the bundle exposes a
#     standard `find_package(Threads)` / `Threads::Threads` target
#     across all three platforms.
#
# CUDA toolkit is intentionally NOT bundled — consumers install it
# directly via Jimver/cuda-toolkit on the build host.
# System libraries (glibc, libstdc++, Windows UCRT) are left to the
# host.
# ───────────────────────────────────────────────────────────────────

env:
  VTK_VERSION: '9.5.0'
  QT_VERSION_LINUX_MACOS: '6'    # apt qt6-base-dev / brew qt@6
  QT_VERSION_WINDOWS: '6.7.*'    # install-qt-action spec
  VCGLIB_VERSION: '2025.07'
  # log4cplus is built from source on Linux so we can ship a static
  # archive (Ubuntu's liblog4cplus-dev only carries the .so).
  LOG4CPLUS_VERSION: '2.1.2'
  VCGLIB_SHA256:  'e49fc9342d5476b3e39a5e1939b965b57c91d7a17b4f97b8c5eaf01228b16cf0'

jobs:
  # ──────────────────────────── Linux ────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            link: shared
          - build_type: Release
            link: shared
          - build_type: Debug
            link: static
          - build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          # CI builds (workflow_call from ci.yml) insert the short SHA
          # so per-PR artifacts are uniquely identifiable; tag releases
          # leave the suffix empty. Accept either a short or full SHA
          # and truncate to 7 chars.
          SHASFX=""
          if [ -n "${{ inputs.sha_suffix }}" ]; then
            short=$(echo "${{ inputs.sha_suffix }}" | cut -c1-7)
            SHASFX="-${short}"
          fi
          STEM="libcvc-deps-${VERSION}${SHASFX}-linux-${ARCH}-${BTLC}${LINKSFX}"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"        >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"        >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX"  >> "$GITHUB_OUTPUT"
          echo "stem=$STEM"        >> "$GITHUB_OUTPUT"

      - name: Install apt dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Hosted Ubuntu runners occasionally get a wedged apt mirror
          # that causes `apt-get` to block indefinitely on a download
          # or lock with no progress output. Without a timeout the
          # step burns the entire 6h job budget. Wrap each apt call
          # in a 10-min timeout and retry up to 5 times.
          apt_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "::group::apt attempt $attempt: $*"
              if timeout 600 "$@" \
                   -o Dpkg::Use-Pty=0 \
                   -o Acquire::Retries=3 \
                   -o Acquire::http::Timeout=30 \
                   -o Acquire::https::Timeout=30; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              echo "apt attempt $attempt failed, sleeping before retry…"
              sleep $((attempt * 15))
            done
            echo "apt: giving up after 5 attempts" >&2
            return 1
          }
          apt_retry sudo -E apt-get update
          apt_retry sudo -E apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build patchelf pkg-config \
            libboost-all-dev libhdf5-dev libfftw3-dev libgsl-dev \
            libmagick++-dev libtiff-dev libyaml-dev \
            libprotobuf-dev protobuf-compiler \
            libgrpc++-dev protobuf-compiler-grpc \
            libcgal-dev libgmp-dev libmpfr-dev \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev \
            libgl1-mesa-dev libxt-dev mesa-common-dev libglew-dev \
            libxrender-dev libxcursor-dev libxinerama-dev libxi-dev \
            libnfft3-dev libeigen3-dev liblapack-dev libblas-dev \
            gfortran

      # ── libiimod built from upstream LabShare-Archive/IMOD ──
      #    Curated source set; CMakeLists in third-party/libiimod/
      #    pins the upstream SHA and configures the bundle install.
      - name: Cache libiimod install
        id: libiimod-cache
        uses: actions/cache@v4
        with:
          path: ~/libiimod-prefix-${{ matrix.build_type }}
          key: libiimod-${{ hashFiles('third-party/libiimod/**') }}-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build libiimod from source
        if: steps.libiimod-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S third-party/libiimod -B libiimod-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=$HOME/libiimod-prefix-${{ matrix.build_type }} \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build libiimod-build --parallel --target install
          rm -rf libiimod-build

      # ── levmar built from upstream tarball (Lourakis) ──
      #    Pinned tarball + SHA256 in third-party/levmar/CMakeLists.txt;
      #    builds full LAPACK-enabled library, exports levmar::levmar.
      - name: Cache levmar install
        id: levmar-cache
        uses: actions/cache@v4
        with:
          path: ~/levmar-prefix-${{ matrix.build_type }}
          key: levmar-${{ hashFiles('third-party/levmar/**') }}-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build levmar from source
        if: steps.levmar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S third-party/levmar -B levmar-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=$HOME/levmar-prefix-${{ matrix.build_type }} \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build levmar-build --parallel --target install
          rm -rf levmar-build

      # ── log4cplus built from source so we ship a .a in the
      #    static bundles. Ubuntu's liblog4cplus-dev is .so-only.
      #    Built with -fPIC so the .a is also usable by downstream
      #    shared-link consumers.
      - name: Cache log4cplus install
        id: log4cplus-cache
        uses: actions/cache@v4
        with:
          path: ~/log4cplus-prefix-${{ matrix.build_type }}
          key: log4cplus-${{ env.LOG4CPLUS_VERSION }}-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build log4cplus from source
        if: steps.log4cplus-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver=${LOG4CPLUS_VERSION}
          tag="REL_${ver//./_}"
          PFX="$HOME/log4cplus-prefix-${{ matrix.build_type }}"
          curl -L -o log4cplus.tar.xz \
            "https://github.com/log4cplus/log4cplus/releases/download/${tag}/log4cplus-${ver}.tar.xz"
          tar xf log4cplus.tar.xz
          cmake -S log4cplus-${ver} -B log4cplus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$PFX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DLOG4CPLUS_BUILD_TESTING=OFF \
            -DLOG4CPLUS_BUILD_LOGGINGSERVER=OFF \
            -DWITH_UNIT_TESTS=OFF
          cmake --build log4cplus-build --parallel --target install
          # Second pass: static archive (CMakeLists doesn't emit both
          # in one configure). Reuse the same prefix so headers and
          # cmake configs from the shared pass stay; only add the .a.
          cmake -S log4cplus-${ver} -B log4cplus-build-static -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$PFX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLOG4CPLUS_BUILD_TESTING=OFF \
            -DLOG4CPLUS_BUILD_LOGGINGSERVER=OFF \
            -DWITH_UNIT_TESTS=OFF
          cmake --build log4cplus-build-static --parallel --target install
          rm -rf log4cplus-${ver} log4cplus-build log4cplus-build-static log4cplus.tar.xz

      # ── VTK 9.5 built against Qt6, cached (per build_type so the
      #    Debug bundle actually ships a debuggable VTK).
      - name: Cache VTK install tree
        id: vtk-cache
        uses: actions/cache@v4
        with:
          path: ~/vtk-qt6-${{ matrix.build_type }}
          key: vtk-${{ env.VTK_VERSION }}-qt6-${{ runner.os }}-${{ matrix.build_type }}-v4

      - name: Build VTK from source (Qt6)
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L -o vtk.tar.gz https://github.com/Kitware/VTK/archive/refs/tags/v${VTK_VERSION}.tar.gz
          tar xzf vtk.tar.gz
          cmake -S VTK-${VTK_VERSION} -B vtk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=$HOME/vtk-qt6-${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=ON \
            -DVTK_GROUP_ENABLE_Qt=YES \
            -DVTK_QT_VERSION=6 \
            -DVTK_MODULE_ENABLE_VTK_GUISupportQtQuick=NO \
            -DVTK_MODULE_ENABLE_VTK_RenderingQtQuick=NO \
            -DVTK_WRAP_PYTHON=OFF \
            -DVTK_BUILD_TESTING=OFF \
            -DVTK_BUILD_EXAMPLES=OFF \
            -DVTK_BUILD_DOCUMENTATION=OFF \
            -DVTK_LEGACY_REMOVE=ON
          cmake --build vtk-build --parallel --target install
          rm -rf vtk-build VTK-${VTK_VERSION} vtk.tar.gz

      # ── Install the marker libcvc-depsConfig.cmake ──
      - name: Configure + install marker config
        run: |
          STEM="${{ steps.meta.outputs.stem }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$DIST"
          cmake --install build
          mkdir -p "$DIST/lib" "$DIST/include" "$DIST/bin" "$DIST/share"

      # ── Stage every apt-installed dep into $DIST ──
      - name: Stage apt deps
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"

          if [ "${{ matrix.link }}" = "static" ]; then
            patterns=( '*.a' )
          else
            patterns=( '*.so' '*.so.*' )
          fi

          LIBDIRS=( /usr/lib/x86_64-linux-gnu /usr/lib )

          copy_libs() {
            local prefix="$1"
            for d in "${LIBDIRS[@]}"; do
              for pat in "${patterns[@]}"; do
                find "$d" -maxdepth 1 -name "${prefix}${pat}" -print0 2>/dev/null \
                  | xargs -0 -r cp -P -t "$DIST/lib/" 2>/dev/null || true
              done
            done
          }
          # libcvc deps
          copy_libs 'libboost_'
          copy_libs 'libhdf5'
          # Debian/Ubuntu installs HDF5 shared libraries with `_serial`
          # in the actual SONAME names (libhdf5_serial.so.103, ...).
          # Some downstream science packages look for the conventional
          # upstream names directly, including the versioned SONAME
          # aliases (libhdf5.so.103, libhdf5_cpp.so.103, ...). Provide
          # those aliases at the bundle's top-level lib dir so the
          # archive works as a general-purpose prefix, not only through
          # CMake's FindHDF5 module.
          if [ "${{ matrix.link }}" != "static" ]; then
            for lib in "$DIST"/lib/libhdf5*_serial.so*; do
              [ -e "$lib" ] || continue
              base=$(basename "$lib")
              alias=${base/_serial/}
              [ "$alias" != "$base" ] || continue
              [ -e "$DIST/lib/$alias" ] || ln -sf "$base" "$DIST/lib/$alias"
            done
          fi
          copy_libs 'libfftw3'
          copy_libs 'libgsl'
          copy_libs 'libgslcblas'
          copy_libs 'libtiff'
          copy_libs 'libyaml'
          # gRPC / protobuf transport stack. Include the usual
          # transitive C++ link dependencies too so static bundles
          # have the archives downstream linkers need.
          copy_libs 'libprotobuf'
          copy_libs 'libprotoc'
          copy_libs 'libgrpc'
          copy_libs 'libgpr'
          copy_libs 'libaddress_sorting'
          copy_libs 'libabsl_'
          copy_libs 'libupb'
          copy_libs 'libutf8_range'
          copy_libs 'libcares'
          copy_libs 'libre2'
          copy_libs 'libssl'
          copy_libs 'libcrypto'
          copy_libs 'libz'
          # log4cplus comes from our own source build (see earlier
          # 'Build log4cplus from source' step). Pick the artifact
          # flavor that matches this bundle: .a for static bundles,
          # .so / .so.* for shared bundles.
          LOG4CPLUS_PFX="$HOME/log4cplus-prefix-${{ matrix.build_type }}"
          if [ -d "$LOG4CPLUS_PFX/lib" ]; then
            if [ "${{ matrix.link }}" = "static" ]; then
              l4c_pats=('*.a')
            else
              l4c_pats=('*.so' '*.so.*')
            fi
            for pat in "${l4c_pats[@]}"; do
              find "$LOG4CPLUS_PFX/lib" -maxdepth 1 -name "$pat" -print0 \
                | xargs -0 -r cp -P -t "$DIST/lib/" 2>/dev/null || true
            done
          fi
          copy_libs 'libMagick++-'
          copy_libs 'libMagickCore-'
          copy_libs 'libMagickWand-'
          copy_libs 'libCGAL'
          copy_libs 'libgmp'
          copy_libs 'libmpfr'
          # F2Dock / F3Dock science stack
          copy_libs 'libnfft3'
          copy_libs 'liblapack'
          copy_libs 'libblas'
          copy_libs 'libgfortran'   # LAPACK NEEDED entry (Fortran runtime)
          # volrover3 GL deps that Qt6/VTK pull at runtime
          copy_libs 'libGLEW'
          copy_libs 'libQt6'
          # Qt6 cmake target imports use the Debian multiarch layout:
          # Qt6CoreTargets.cmake sets IMPORTED_LOCATION to
          # ${_IMPORT_PREFIX}/lib/x86_64-linux-gnu/libQt6<Module>.so.*.
          # Mirror the Qt6 SOs into the multiarch subdir so those
          # imported-target paths resolve to a real file inside $DIST.
          # Same applies to Boost's per-component imported targets
          # (Boost::thread etc.) which set IMPORTED_LOCATION to
          # ${_IMPORT_PREFIX}/lib/x86_64-linux-gnu/libboost_<comp>.so.<ver>.
          mkdir -p "$DIST/lib/x86_64-linux-gnu"
          for d in "${LIBDIRS[@]}"; do
            for pat in "${patterns[@]}"; do
              for stem in 'libQt6' 'libboost_'; do
                find "$d" -maxdepth 1 -name "${stem}${pat}" -print0 2>/dev/null \
                  | xargs -0 -r cp -P -t "$DIST/lib/x86_64-linux-gnu/" 2>/dev/null || true
              done
            done
          done
          # X11 client libs needed by Qt6 xcb platform plugin
          for pre in libxcb libX11 libXrender libXcursor libXinerama libXi libXext libXfixes libXrandr; do
            copy_libs "$pre"
          done

          # CMake config trees so find_package(<Pkg> CONFIG) works
          # against the staged prefix without needing the host apt
          # packages.
          mkdir -p "$DIST/lib/cmake"
          mkdir -p "$DIST/lib/x86_64-linux-gnu/cmake"
          for d in /usr/lib/x86_64-linux-gnu/cmake/*; do
            [ -d "$d" ] || continue
            base=$(basename "$d")
            case "$base" in
              # Qt6 ships configs generated against the Debian multiarch
              # layout: the per-module *Targets-none.cmake files walk
              # _IMPORT_PREFIX up 4 directories from the file location,
              # assuming the configs live at
              # <prefix>/lib/x86_64-linux-gnu/cmake/Qt6<Module>/. They
              # reference Qt6::moc as ${_IMPORT_PREFIX}/lib/qt6/libexec/moc
              # and Qt6::qmake as ${_IMPORT_PREFIX}/bin/x86_64-linux-gnu-qmake6,
              # so they MUST stay at the multiarch path inside the bundle
              # for the walks to resolve back to $DIST.
              Qt6*)
                cp -R "$d" "$DIST/lib/x86_64-linux-gnu/cmake/"
                ;;
              # Boost's per-component configs (boost_thread-config.cmake,
              # etc.) set _IMPORT_PREFIX by walking 4 dirs up from the
              # config file, assuming the Debian multiarch layout
              # <prefix>/lib/x86_64-linux-gnu/cmake/Boost-<ver>/. They
              # reference Boost::thread's INTERFACE_INCLUDE_DIRECTORIES
              # as ${_IMPORT_PREFIX}/include, so they MUST stay at the
              # multiarch path inside the bundle for the walk to resolve
              # back to the bundle root.
              Boost*|boost*)
                cp -R "$d" "$DIST/lib/x86_64-linux-gnu/cmake/"
                ;;
              # Everything else bundles cleanly under lib/cmake/.
              hdf5|HDF5|GSL|CGAL|ImageMagick|Magick*|\
              VTK|vtk*|GLEW|tiff|TIFF|yaml|YAML|\
              protobuf|Protobuf|gRPC|grpc|absl|upb|utf8_range|c-ares|c-ares*|re2|RE2|OpenSSL|\
              eigen3|Eigen3*|lapack*|LAPACK*|blas*|BLAS*)
                cp -R "$d" "$DIST/lib/cmake/"
                ;;
            esac
          done
          # Some distros ship Eigen3 cmake under /usr/lib/cmake/eigen3.
          for d in /usr/lib/cmake/eigen3 /usr/share/eigen3/cmake; do
            [ -d "$d" ] && cp -R "$d" "$DIST/lib/cmake/" || true
          done

          # Boost's per-component configs include
          # `../BoostDetectToolset-<ver>.cmake` relative to their own
          # dir, which (after the Boost*/boost* dirs are placed under
          # the multiarch cmake root above) resolves to
          # <prefix>/lib/x86_64-linux-gnu/cmake/BoostDetectToolset-<ver>.cmake.
          # That toolset detect file is a plain .cmake at the cmake
          # root, not inside a Boost* subdir, so the case statement
          # above misses it.
          find /usr/lib/x86_64-linux-gnu/cmake -maxdepth 1 -type f \
            -name 'BoostDetectToolset-*.cmake' \
            -exec cp {} "$DIST/lib/x86_64-linux-gnu/cmake/" \;

          # Headers
          for src in \
              /usr/include/boost \
              /usr/include/gsl \
              /usr/include/CGAL \
              /usr/include/Magick++ \
              /usr/include/magick \
              /usr/include/MagickCore \
              /usr/include/MagickWand \
              /usr/include/google \
              /usr/include/grpc \
              /usr/include/grpc++ \
              /usr/include/grpcpp \
              /usr/include/absl \
              /usr/include/upb \
              /usr/include/utf8_range \
              /usr/include/re2 \
              /usr/include/openssl \
              /usr/include/GL ; do
            [ -d "$src" ] && cp -R "$src" "$DIST/include/"
          done
          for f in /usr/include/ares.h /usr/include/ares_*.h \
                   /usr/include/zconf.h /usr/include/zlib.h ; do
            [ -f "$f" ] && cp "$f" "$DIST/include/"
          done
          # Qt6 headers: Qt6<Module>Targets.cmake sets
          # INTERFACE_INCLUDE_DIRECTORIES to
          # ${_IMPORT_PREFIX}/include/x86_64-linux-gnu/qt6/Qt<Module>,
          # mirroring Debian's multiarch layout. Preserve that layout in
          # the bundle so consumers don't trip CMake's "non-existent path
          # in INTERFACE_INCLUDE_DIRECTORIES" generation-time error.
          if [ -d /usr/include/x86_64-linux-gnu/qt6 ]; then
            mkdir -p "$DIST/include/x86_64-linux-gnu"
            cp -R /usr/include/x86_64-linux-gnu/qt6 \
              "$DIST/include/x86_64-linux-gnu/"
          fi
          # log4cplus headers + cmake config from our source build.
          LOG4CPLUS_PFX="$HOME/log4cplus-prefix-${{ matrix.build_type }}"
          if [ -d "$LOG4CPLUS_PFX/include/log4cplus" ]; then
            cp -R "$LOG4CPLUS_PFX/include/log4cplus" "$DIST/include/"
          fi
          if [ -d "$LOG4CPLUS_PFX/lib/cmake/log4cplus" ]; then
            mkdir -p "$DIST/lib/cmake"
            cp -R "$LOG4CPLUS_PFX/lib/cmake/log4cplus" "$DIST/lib/cmake/"
          fi
          # Eigen3 ships its headers under /usr/include/eigen3/{Eigen,unsupported};
          # Eigen3Config.cmake's INTERFACE_INCLUDE_DIRECTORIES points at
          # "include/eigen3", so preserve that nesting in the bundle.
          if [ -d /usr/include/eigen3 ]; then
            mkdir -p "$DIST/include/eigen3"
            cp -R /usr/include/eigen3/. "$DIST/include/eigen3/"
          fi
          # NFFT3 header lives at the top level.
          for f in /usr/include/nfft3.h /usr/include/nfft3mp.h \
                   /usr/include/nfft3util.h ; do
            [ -f "$f" ] && cp "$f" "$DIST/include/"
          done
          # NFFT3 has no CMake config; F2Dock discovers it via
          # pkg_check_modules(NFFT IMPORTED_TARGET nfft3). Ship the
          # .pc file (rewritten so prefix= follows the bundle root
          # rather than the build-host /usr).
          mkdir -p "$DIST/lib/pkgconfig"
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/nfft3*.pc; do
            [ -f "$pc" ] || continue
            sed -e 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
                -e 's|^libdir=.*|libdir=${prefix}/lib|' \
                -e 's|^includedir=.*|includedir=${prefix}/include|' \
                "$pc" > "$DIST/lib/pkgconfig/$(basename "$pc")"
          done
          # HDF5 headers live under /usr/include/hdf5/serial on Ubuntu.
          if [ -d /usr/include/hdf5/serial ]; then
            mkdir -p "$DIST/include/hdf5"
            cp -R /usr/include/hdf5/serial/. "$DIST/include/hdf5/"
          fi
          # HDF5 on Ubuntu has no upstream CMake config. Consumers
          # have to use CMake's bundled FindHDF5.cmake module, which
          # works by:
          #   1. Finding a versionless `libhdf5.so` / `libhdf5_cpp.so`
          #      etc. via find_library(),
          #   2. Reading `libhdf5.settings` next to that library to
          #      learn versions/build options,
          #   3. Optionally calling `pkg-config --libs hdf5` for the
          #      link line.
          # The Debian `libhdf5-dev` package installs all three of
          # those under /usr/lib/x86_64-linux-gnu/hdf5/serial/ (with
          # SONAME-suffixed `libhdf5_serial.so` files plus versionless
          # `libhdf5.so` -> ../../libhdf5_serial.so symlinks) and the
          # corresponding hdf5.pc / hdf5-serial.pc under
          # /usr/lib/x86_64-linux-gnu/pkgconfig/. The plain
          # `copy_libs 'libhdf5'` glob above only pulled in the
          # /usr/lib/x86_64-linux-gnu/libhdf5_serial*.so* SONAME
          # files — none of the versionless symlinks find_library()
          # actually looks for. Stage the serial subdir wholesale so
          # find_package(HDF5) resolves inside the bundle.
          if [ -d /usr/lib/x86_64-linux-gnu/hdf5/serial ]; then
            mkdir -p "$DIST/lib/hdf5/serial"
            # The Ubuntu hdf5-serial directory contains two recursive
            # symlinks that break recursive copies:
            #   lib     -> .                              (self-loop)
            #   include -> ../../../../include/hdf5/serial
            # We must NOT follow those, so iterate the entries and
            # skip them explicitly. Everything else is a flat symlink
            # to ../../libhdf5_serial*.{a,so,settings}; preserve those
            # symlinks so FindHDF5 sees the same layout it expects from
            # the Debian package while the real files live at $DIST/lib.
            for entry in /usr/lib/x86_64-linux-gnu/hdf5/serial/*; do
              base=$(basename "$entry")
              case "$base" in
                include|lib) continue ;;
              esac
              cp -P "$entry" "$DIST/lib/hdf5/serial/" 2>/dev/null || \
                cp    "$entry" "$DIST/lib/hdf5/serial/"
            done
            # Also drop versionless `libhdf5.so` -> libhdf5_serial.so
            # convenience symlinks into $DIST/lib so a plain
            # find_library(HDF5_LIBRARY NAMES hdf5) finds them without
            # consumers having to add lib/hdf5/serial to their search
            # paths. find_package(HDF5) appends hdf5/serial itself via
            # HDF5_ROOT, but downstream code calling find_library()
            # directly benefits from this fallback.
            for stem in hdf5 hdf5_cpp hdf5_hl hdf5_hl_cpp hdf5_fortran hdf5hl_fortran; do
              src="$DIST/lib/${stem}_serial.so"
              [ -e "$src" ] || continue
              [ -e "$DIST/lib/${stem}.so" ] || \
                ln -sf "${stem}_serial.so" "$DIST/lib/${stem}.so"
            done
          fi
          # HDF5 pkg-config files. Rewrite prefix= so they relocate
          # with the bundle. FindHDF5.cmake consults these on
          # platforms where the upstream HDF5 doesn't ship a CMake
          # config (i.e. Linux).
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/hdf5*.pc; do
            [ -f "$pc" ] || continue
            sed -e 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
                -e 's|^exec_prefix=.*|exec_prefix=${prefix}|' \
                -e 's|^libdir=.*|libdir=${prefix}/lib|' \
                -e 's|^includedir=.*|includedir=${prefix}/include/hdf5|' \
                "$pc" > "$DIST/lib/pkgconfig/$(basename "$pc")"
          done
          # libtiff development surface. libiimod only needs a couple
          # of TIFF headers, but downstream consumers such as MolSurf
          # can include any of the public libtiff headers and may use
          # pkg-config. Ubuntu splits tiffconf.h into the multiarch
          # include directory, so collect both locations.
          for f in /usr/include/tiff*.h /usr/include/tiff*.hxx \
                   /usr/include/x86_64-linux-gnu/tiff*.h \
                   /usr/include/x86_64-linux-gnu/tiff*.hxx ; do
            [ -f "$f" ] && cp "$f" "$DIST/include/"
          done
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/libtiff*.pc \
                    /usr/lib/pkgconfig/libtiff*.pc ; do
            [ -f "$pc" ] || continue
            sed -e 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
                -e 's|^exec_prefix=.*|exec_prefix=${prefix}|' \
                -e 's|^libdir=.*|libdir=${prefix}/lib|' \
                -e 's|^includedir=.*|includedir=${prefix}/include|' \
                "$pc" > "$DIST/lib/pkgconfig/$(basename "$pc")"
          done
          # libyaml: Ubuntu ships yaml.h + yaml-0.1.pc, but no CMake
          # package. Stage both the pkg-config metadata and a small
          # CMake config compatible with upstream/vcpkg's package name
          # (`find_package(yaml CONFIG REQUIRED)`) and target (`yaml`).
          [ -f /usr/include/yaml.h ] && cp /usr/include/yaml.h "$DIST/include/"
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/yaml-*.pc \
                    /usr/lib/pkgconfig/yaml-*.pc ; do
            [ -f "$pc" ] || continue
            sed -e 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
                -e 's|^exec_prefix=.*|exec_prefix=${prefix}|' \
                -e 's|^libdir=.*|libdir=${prefix}/lib|' \
                -e 's|^includedir=.*|includedir=${prefix}/include|' \
                "$pc" > "$DIST/lib/pkgconfig/$(basename "$pc")"
          done
          mkdir -p "$DIST/lib/cmake/yaml"
          {
            printf '%s\n' \
              '# Auto-generated by libcvc-deps release.yml for Ubuntu libyaml.' \
              'include(CMakeFindDependencyMacro)' \
              'get_filename_component(_yaml_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)' \
              'if(NOT TARGET yaml)' \
              '  add_library(yaml UNKNOWN IMPORTED)' \
              '  set(_yaml_lib "")' \
              '  foreach(_candidate' \
              '      "${_yaml_prefix}/lib/libyaml.so"' \
              '      "${_yaml_prefix}/lib/libyaml.a")' \
              '    if(EXISTS "${_candidate}")' \
              '      set(_yaml_lib "${_candidate}")' \
              '      break()' \
              '    endif()' \
              '  endforeach()' \
              '  if(NOT _yaml_lib)' \
              '    message(FATAL_ERROR "libcvc-deps yamlConfig.cmake could not find libyaml in ${_yaml_prefix}/lib")' \
              '  endif()' \
              '  set_target_properties(yaml PROPERTIES' \
              '    IMPORTED_LOCATION "${_yaml_lib}"' \
              '    INTERFACE_INCLUDE_DIRECTORIES "${_yaml_prefix}/include")' \
              '  if(_yaml_lib MATCHES "\\.a$")' \
              '    set_property(TARGET yaml APPEND PROPERTY' \
              '      INTERFACE_COMPILE_DEFINITIONS YAML_DECLARE_STATIC)' \
              '  endif()' \
              'endif()' \
              'if(NOT TARGET yaml::yaml)' \
              '  add_library(yaml::yaml INTERFACE IMPORTED)' \
              '  target_link_libraries(yaml::yaml INTERFACE yaml)' \
              'endif()' \
              'set(yaml_FOUND TRUE)' \
              'set(YAML_FOUND TRUE)' \
              'set(yaml_INCLUDE_DIRS "${_yaml_prefix}/include")' \
              'set(yaml_LIBRARIES yaml)' \
              'set(YAML_INCLUDE_DIRS "${yaml_INCLUDE_DIRS}")' \
              'set(YAML_LIBRARIES "${yaml_LIBRARIES}")'
          } > "$DIST/lib/cmake/yaml/yamlConfig.cmake"
          {
            printf '%s\n' \
              'set(PACKAGE_VERSION "0.2.5")' \
              'if("${PACKAGE_FIND_VERSION}" VERSION_EQUAL "${PACKAGE_VERSION}")' \
              '  set(PACKAGE_VERSION_EXACT TRUE)' \
              '  set(PACKAGE_VERSION_COMPATIBLE TRUE)' \
              'elseif("${PACKAGE_FIND_VERSION}" VERSION_LESS_EQUAL "${PACKAGE_VERSION}")' \
              '  set(PACKAGE_VERSION_COMPATIBLE TRUE)' \
              'endif()'
          } > "$DIST/lib/cmake/yaml/yamlConfigVersion.cmake"
          # Protobuf/gRPC pkg-config files for consumers that use
          # pkg_check_modules() instead of CMake package configs.
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/protobuf*.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/grpc*.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/absl*.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/upb*.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/utf8_range*.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/re2.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/libcares.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/openssl.pc \
                    /usr/lib/x86_64-linux-gnu/pkgconfig/zlib.pc \
                    /usr/lib/pkgconfig/protobuf*.pc \
                    /usr/lib/pkgconfig/grpc*.pc \
                    /usr/lib/pkgconfig/absl*.pc \
                    /usr/lib/pkgconfig/upb*.pc \
                    /usr/lib/pkgconfig/utf8_range*.pc \
                    /usr/lib/pkgconfig/re2.pc \
                    /usr/lib/pkgconfig/libcares.pc \
                    /usr/lib/pkgconfig/openssl.pc \
                    /usr/lib/pkgconfig/zlib.pc ; do
            [ -f "$pc" ] || continue
            sed -e 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
                -e 's|^exec_prefix=.*|exec_prefix=${prefix}|' \
                -e 's|^libdir=.*|libdir=${prefix}/lib|' \
                -e 's|^includedir=.*|includedir=${prefix}/include|' \
                "$pc" > "$DIST/lib/pkgconfig/$(basename "$pc")"
          done
          # Code-generation tools used by downstream builds.
          for tool in protoc grpc_cpp_plugin grpc_python_plugin grpc_node_plugin; do
            if command -v "$tool" >/dev/null 2>&1; then
              cp "$(command -v "$tool")" "$DIST/bin/"
            fi
          done
          # Top-level header files (fftw3.h, gmp.h, mpfr.h, tiff.h, …)
          for f in /usr/include/fftw3.h /usr/include/fftw3.f \
                   /usr/include/fftw3l.h /usr/include/fftw3q.h \
                   /usr/include/gmp.h /usr/include/mpfr.h /usr/include/mpf2mpfr.h \
                   /usr/include/tiff.h /usr/include/tiffio.h \
                   /usr/include/tiffvers.h /usr/include/tiffconf.h \
                   /usr/include/tiffio.hxx ; do
            [ -f "$f" ] && cp "$f" "$DIST/include/"
          done

          # Qt6 tools (qmake, moc, rcc, uic) live under /usr/lib/qt6 on
          # Ubuntu. The split between bin/ and libexec/ changed in 24.04
          # (moc/rcc/uic moved into libexec/), and Qt6CoreToolsTargets.cmake
          # resolves e.g. Qt6::moc to ${_IMPORT_PREFIX}/lib/qt6/libexec/moc.
          # Mirror the whole tree to $DIST/lib/qt6 so the imported-target
          # paths resolve, and also expose qmake et al. on $DIST/bin.
          if [ -d /usr/lib/qt6 ]; then
            mkdir -p "$DIST/lib/qt6"
            cp -R /usr/lib/qt6/. "$DIST/lib/qt6/" 2>/dev/null || true
            if [ -d /usr/lib/qt6/bin ]; then
              cp -R /usr/lib/qt6/bin/. "$DIST/bin/" 2>/dev/null || true
            fi
            if [ -d /usr/lib/qt6/libexec ]; then
              cp -R /usr/lib/qt6/libexec/. "$DIST/bin/" 2>/dev/null || true
            fi
          fi
          # Qt6CoreToolsTargets-none.cmake references Qt6::qmake as
          # ${_IMPORT_PREFIX}/bin/x86_64-linux-gnu-qmake6 (Debian's
          # multiarch-suffixed qmake wrapper, installed at /usr/bin/),
          # and Qt6 modules' own internal scripts also look for plain
          # qmake6 on PATH. Both live under /usr/bin on the host, not
          # /usr/lib/qt6/bin, so copy them explicitly into $DIST/bin.
          for f in /usr/bin/x86_64-linux-gnu-qmake6 /usr/bin/qmake6 \
                   /usr/bin/qtpaths6 /usr/bin/qtchooser; do
            [ -e "$f" ] && cp -P "$f" "$DIST/bin/" || true
          done
          # Qt6 platform/imageformat plugins
          if [ -d /usr/lib/x86_64-linux-gnu/qt6/plugins ]; then
            mkdir -p "$DIST/plugins"
            cp -R /usr/lib/x86_64-linux-gnu/qt6/plugins/. "$DIST/plugins/"
          fi
          # Qt6 mkspecs: Qt6CoreTargets.cmake appends
          #   ${_IMPORT_PREFIX}/lib/x86_64-linux-gnu/qt6/mkspecs/<spec>
          # to INTERFACE_INCLUDE_DIRECTORIES on Qt6::Core (configured via
          # qt6-base-dev's host_spec = linux-g++ on x86_64). Ship the
          # full mkspecs tree at that multiarch path so consumers don't
          # fail generate with:
          #   Imported target "Qt6::Core" includes non-existent path
          #     "<prefix>/lib/x86_64-linux-gnu/qt6/mkspecs/linux-g++"
          if [ -d /usr/lib/x86_64-linux-gnu/qt6/mkspecs ]; then
            mkdir -p "$DIST/lib/x86_64-linux-gnu/qt6"
            cp -R /usr/lib/x86_64-linux-gnu/qt6/mkspecs \
              "$DIST/lib/x86_64-linux-gnu/qt6/"
          fi

      # ── Stage VTK from the cached install ──
      - name: Stage VTK
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          VTK_PFX="$HOME/vtk-qt6-${{ matrix.build_type }}"
          if [ -d "$VTK_PFX" ]; then
            cp -R "$VTK_PFX/include/." "$DIST/include/" 2>/dev/null || true
            cp -R "$VTK_PFX/lib/."     "$DIST/lib/"     2>/dev/null || true
            [ -d "$VTK_PFX/share" ] && cp -R "$VTK_PFX/share/." "$DIST/share/" 2>/dev/null || true
            [ -d "$VTK_PFX/bin" ]   && cp -R "$VTK_PFX/bin/."   "$DIST/bin/"   2>/dev/null || true
          fi

      # ── Stage libiimod from the cached install ──
      - name: Stage libiimod
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          PFX="$HOME/libiimod-prefix-${{ matrix.build_type }}"
          if [ -d "$PFX" ]; then
            mkdir -p "$DIST/include/libiimod" "$DIST/lib/cmake/libiimod"
            cp -R "$PFX/include/libiimod/." "$DIST/include/libiimod/"
            cp -R "$PFX/lib/libiimod.a"     "$DIST/lib/" 2>/dev/null || true
            if [ -d "$PFX/lib/cmake/libiimod" ]; then
              cp -R "$PFX/lib/cmake/libiimod/." "$DIST/lib/cmake/libiimod/"
            fi
          fi

      # ── Stage levmar from the cached install ──
      - name: Stage levmar
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          PFX="$HOME/levmar-prefix-${{ matrix.build_type }}"
          if [ -d "$PFX" ]; then
            mkdir -p "$DIST/include/levmar" "$DIST/lib/cmake/levmar"
            cp -R "$PFX/include/levmar/." "$DIST/include/levmar/"
            cp -R "$PFX/lib/liblevmar.a"  "$DIST/lib/" 2>/dev/null || true
            if [ -d "$PFX/lib/cmake/levmar" ]; then
              cp -R "$PFX/lib/cmake/levmar/." "$DIST/lib/cmake/levmar/"
            fi
          fi

      # ── Pull in transitive NEEDED libraries via ldd ──
      #
      # The explicit allowlist above (libboost_*, libhdf5*, libQt6*, …)
      # covers the libraries the consumer calls directly, but their
      # own NEEDED entries pull in a second tier (libicu*, libpng16,
      # libxml2, liblzma, libz, libfreetype, libfontconfig, libssl,
      # libharfbuzz, libdouble-conversion, …) that is bound to the
      # exact SONAME shipped on the builder's Ubuntu image. Without
      # bundling those, the archive only works on a host that happens
      # to match the builder's distro version (ICU SONAME changes
      # between 22.04 → libicui18n.so.70 and 24.04 → libicui18n.so.74,
      # for example).
      #
      # Resolve every NEEDED edge transitively via ldd and copy each
      # non-system .so into $DIST/lib/, leaving only the truly
      # ABI-stable host primitives (glibc + the loader) to the
      # consumer's system.
      #
      # libstdc++.so.6 and libgcc_s.so.1 ARE bundled. The builder's
      # GCC (Ubuntu 24.04 ships GCC 13) is newer than any glibc-based
      # target we care about, and libstdc++/libgcc_s are
      # forward-compatible, so shipping the builder's copy gives a
      # consumer on an older Ubuntu/RHEL exactly the symbols our
      # binaries reference. The remaining host-supplied SONAMEs are
      # glibc/loader-internal bits that cannot be safely bundled
      # (libc.so is paired with ld-linux + libpthread + libdl at a
      # specific version on every distro).
      - name: Bundle transitive NEEDED libs (ldd sweep)
        if: matrix.link == 'shared'
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"

          # SONAMEs that stay on the host. glibc is forward-compatible
          # but cannot be relocated, and the loader (ld-linux) must
          # come from the host kernel ABI. Everything else, including
          # libstdc++ and libgcc_s, is bundled below.
          host_re='^(linux-vdso\.so|ld-linux-.*\.so|libc\.so|libpthread\.so|libdl\.so|librt\.so|libm\.so|libresolv\.so|libnsl\.so|libutil\.so|libanl\.so)'

          shopt -s globstar nullglob
          # Worklist seeded with every shipped .so. ldd's recursive
          # output already walks the full graph per file, so a single
          # pass is sufficient (we just need to dedup across files).
          declare -A seen=()
          tmp=$(mktemp)
          for so in "$DIST"/lib/**/*.so* "$DIST"/lib/*.so* "$DIST"/plugins/**/*.so* "$DIST"/bin/*; do
            [ -e "$so" ] || continue
            [ -L "$so" ] && continue
            # Probe with ldd; suppress "not a dynamic executable".
            ldd "$so" 2>/dev/null >> "$tmp" || true
          done

          # ldd lines we care about look like:
          #   <soname> => /usr/lib/x86_64-linux-gnu/<path> (0x...)
          # We want the resolved path on the right of "=>".
          awk '/ => \// { print $3 }' "$tmp" | sort -u > "${tmp}.paths"

          copied=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            [ -e "$path" ] || continue
            base=$(basename "$path")
            # Skip host-bound SONAMEs.
            if [[ "$base" =~ $host_re ]]; then
              continue
            fi
            # Already shipped (allowlist stage may have placed it).
            if [ -e "$DIST/lib/$base" ]; then
              seen["$base"]=1
              continue
            fi
            # Copy the real file plus any SONAME symlink chain
            # (libfoo.so.1 -> libfoo.so.1.2.3).
            real=$(readlink -f "$path")
            cp -P "$real" "$DIST/lib/"
            # Recreate the SONAME-level symlink under $DIST/lib so
            # the dynamic loader finds it by the name in DT_NEEDED.
            if [ "$(basename "$real")" != "$base" ]; then
              ln -sf "$(basename "$real")" "$DIST/lib/$base"
            fi
            seen["$base"]=1
            copied=$((copied + 1))
          done < "${tmp}.paths"
          rm -f "$tmp" "${tmp}.paths"
          echo "Bundled $copied additional transitive libs."

      # ── Patch RPATH to $ORIGIN so the staged libs resolve each
      #    other regardless of where the archive is extracted ──
      - name: Patch RPATH ($ORIGIN)
        if: matrix.link == 'shared'
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          shopt -s globstar nullglob
          for so in "$DIST"/lib/**/*.so* "$DIST"/lib/*.so*; do
            [ -e "$so" ] || continue
            [ -L "$so" ] && continue
            patchelf --remove-rpath "$so" 2>/dev/null || true
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

      # ── Stage vcglib (header-only) ──
      - name: Stage vcglib
        uses: ./.github/actions/stage-vcglib
        with:
          dist:    ${{ github.workspace }}/${{ steps.meta.outputs.stem }}
          version: ${{ env.VCGLIB_VERSION }}
          sha256:  ${{ env.VCGLIB_SHA256 }}

      - name: Pack tarball
        run: |
          STEM="${{ steps.meta.outputs.stem }}"
          tar czf "${STEM}.tar.gz" "$STEM"
          du -sh "$STEM" "${STEM}.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.build_type }}-${{ matrix.link }}
          path: libcvc-deps-*.tar.gz
          if-no-files-found: error

  # ──────────────────────────── macOS ────────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            link: shared
          - build_type: Release
            link: shared
          - build_type: Debug
            link: static
          - build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          ARCH=$(uname -m)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
          else
            LINKSFX=""
          fi
          SHASFX=""
          if [ -n "${{ inputs.sha_suffix }}" ]; then
            short=$(echo "${{ inputs.sha_suffix }}" | cut -c1-7)
            SHASFX="-${short}"
          fi
          STEM="libcvc-deps-${VERSION}${SHASFX}-macos-${ARCH}-${BTLC}${LINKSFX}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"       >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"       >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX" >> "$GITHUB_OUTPUT"
          echo "stem=$STEM"       >> "$GITHUB_OUTPUT"

      # ── Cache Homebrew bottle downloads ──
      # The actual `brew install` step below still runs (it has to
      # pour bottles + link symlinks into the prefix), but on a cache
      # hit it skips the network download of each ~50-200 MB bottle
      # (qt@6, vtk, boost, hdf5, imagemagick, …). Saves 1-3 min per
      # job. Key on the brew package list itself so a workflow edit
      # invalidates the cache; otherwise reuse across all matrix
      # entries.
      - name: Cache Homebrew bottle downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-bottles-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}-v1
          restore-keys: |
            brew-bottles-${{ runner.os }}-

      - name: Install brew dependencies
        env:
          # Skip the auto `brew update` that prefixes every install
          # (clones thousands of git refs — 1-2 min per job for
          # nothing). The Homebrew bottles available are already what
          # the pinned runner image ships with; we don't need newer
          # ones.
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          # Note: NFFT3 has no Homebrew formula (the old
          # homebrew-science tap was deprecated), so it is built from
          # source in a later step using the same autotools toolchain
          # the Linux package and our Windows MSYS2 build use.
          brew install cmake ninja \
            boost hdf5 fftw gsl imagemagick log4cplus libtiff libyaml \
            protobuf grpc abseil c-ares openssl@3 re2 \
            cgal gmp mpfr \
            qt@6 vtk \
            eigen lapack \
            autoconf automake libtool \
            dylibbundler

      # ── libiimod built from upstream LabShare-Archive/IMOD ──
      - name: Cache libiimod install
        id: libiimod-cache
        uses: actions/cache@v4
        with:
          path: ~/libiimod-prefix-${{ matrix.build_type }}
          key: libiimod-${{ hashFiles('third-party/libiimod/**') }}-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build libiimod from source
        if: steps.libiimod-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cmake -S third-party/libiimod -B libiimod-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$HOME/libiimod-prefix-${{ matrix.build_type }}" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build libiimod-build --parallel --target install
          rm -rf libiimod-build

      - name: Cache levmar install
        id: levmar-cache
        uses: actions/cache@v4
        with:
          path: ~/levmar-prefix-${{ matrix.build_type }}
          key: levmar-${{ hashFiles('third-party/levmar/**') }}-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build levmar from source
        if: steps.levmar-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cmake -S third-party/levmar -B levmar-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$HOME/levmar-prefix-${{ matrix.build_type }}" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build levmar-build --parallel --target install
          rm -rf levmar-build

      - name: Configure + install marker config
        run: |
          STEM="${{ steps.meta.outputs.stem }}"
          DIST="$PWD/$STEM"
          rm -rf "$DIST"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$DIST"
          cmake --install build
          mkdir -p "$DIST/lib" "$DIST/include" "$DIST/bin" "$DIST/share/cmake"

      - name: Stage brew deps
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"

          # Decide which lib pattern matters for this flavor. brew
          # bottles for boost/hdf5/fftw/gsl/log4cplus carry both .a
          # and .dylib; CGAL is header-only-ish but ships a .dylib.
          # Qt6 / VTK ship .dylib only (no static brew flavor).
          if [ "${{ matrix.link }}" = "static" ]; then
            lib_patterns=( '*.a' '*.dylib' )   # Qt/VTK have no .a; ship dylib for those
          else
            lib_patterns=( '*.dylib' )
          fi

          # Bulk-copy each brew prefix (include + lib + share +
          # bin) into the staged tree.
          for pkg in boost hdf5 fftw gsl log4cplus imagemagick \
                     cgal gmp mpfr qt@6 vtk libtiff libyaml \
                     protobuf grpc abseil c-ares openssl@3 re2 \
                     eigen lapack ; do
            P=$(brew --prefix "$pkg" 2>/dev/null || true)
            [ -n "$P" ] || continue
            [ -d "$P/include" ] && cp -R "$P/include/." "$DIST/include/" 2>/dev/null || true
            if [ -d "$P/lib" ]; then
              for pat in "${lib_patterns[@]}"; do
                find "$P/lib" -maxdepth 1 -name "$pat" -print0 2>/dev/null \
                  | xargs -0 -I {} cp -RP {} "$DIST/lib/" 2>/dev/null || true
              done
              # CMake config dirs
              if [ -d "$P/lib/cmake" ]; then
                mkdir -p "$DIST/lib/cmake"
                cp -R "$P/lib/cmake/." "$DIST/lib/cmake/" 2>/dev/null || true
              fi
            fi
            [ -d "$P/share" ] && cp -R "$P/share/." "$DIST/share/" 2>/dev/null || true
            [ -d "$P/bin" ]   && cp -R "$P/bin/."   "$DIST/bin/"   2>/dev/null || true
          done

          # Qt6 cmake configs / plugins live under qt@6/share/qt &
          # qt@6/lib/QtCore.framework etc on macOS. brew's qt@6 bottle
          # uses .framework bundles for the Qt libs themselves; the
          # blanket `cp lib/*.dylib` above missed them — sweep them in
          # explicitly.
          QT_PREFIX=$(brew --prefix qt@6 2>/dev/null || true)
          if [ -n "$QT_PREFIX" ] && [ -d "$QT_PREFIX/lib" ]; then
            find "$QT_PREFIX/lib" -maxdepth 1 -name '*.framework' \
              -exec cp -R {} "$DIST/lib/" \;
          fi
          # Qt6 plugins (platforms/, imageformats/, ...) live under
          # qt@6/share/qt/plugins on brew.
          if [ -n "$QT_PREFIX" ] && [ -d "$QT_PREFIX/share/qt/plugins" ]; then
            mkdir -p "$DIST/plugins"
            cp -R "$QT_PREFIX/share/qt/plugins/." "$DIST/plugins/"
          fi

          # brew's vtk bottle is built with Python wrapping enabled
          # (VTK_WRAP_PYTHON=ON), so the staged lib/cmake/vtk-*/ dir
          # contains VTKPython-targets.cmake referencing
          # lib/python3.X/site-packages/vtkmodules/*.cpython-*-darwin.so
          # files we do NOT copy into the bundle. vtk-config.cmake
          # unconditionally includes the targets file, so consumers
          # fail at configure time with "imported target references a
          # file that does not exist".
          #
          # libcvc / volrover3 do not consume VTK's Python bindings.
          # Replace VTKPython-targets.cmake with an empty stub so
          # vtk-config.cmake's include() succeeds but no Python
          # imported targets are defined.
          for vtk_cmake_dir in "$DIST"/lib/cmake/vtk-*; do
            [ -d "$vtk_cmake_dir" ] || continue
            for tf in "$vtk_cmake_dir"/VTKPython-targets*.cmake; do
              [ -e "$tf" ] || continue
              # brew bottle files are copied with read-only perms;
              # restore write so we can rewrite. Truncate to empty;
              # cmake's include() of an empty file is a no-op.
              chmod u+w "$tf"
              : > "$tf"
            done
          done

          # brew's boost bottle's lib/cmake/ does NOT ship a
          # per-component config for purely header-only libraries
          # whose stubs upstream Boost has dropped from b2's install
          # set (notably boost_system, which has been header-only
          # since 1.69 and which the brew formula omits as of 1.90).
          #
          # BoostConfig.cmake's per-component lookup
          #   find_package(boost_<comp> ${Boost_VERSION} EXACT CONFIG
          #                ${_BOOST_REQUIRED} ...)
          # is hard-required, so a downstream
          #   find_package(Boost COMPONENTS system ...)
          # fails inside the bundle even though the headers are
          # present and Boost::system is genuinely header-only.
          #
          # Synthesize a stub `boost_<comp>-<ver>/boost_<comp>-config
          # .cmake` for each well-known header-only component whose
          # config is missing from the staged tree. Each stub defines
          # an INTERFACE IMPORTED `Boost::<comp>` target that simply
          # forwards to `Boost::headers`, which is what an end-user's
          # `find_package(Boost COMPONENTS <comp>)` would have got
          # against a from-source Boost install anyway.
          BOOST_VER=$(ls -d "$DIST/lib/cmake/Boost-"*/ 2>/dev/null \
                      | head -1 | sed -E 's@.*/Boost-([0-9.]+)/?$@\1@')
          if [ -n "$BOOST_VER" ]; then
            for comp in system assert bind config core function \
                        lambda mpl optional preprocessor signals2 \
                        smart_ptr static_assert tuple type_traits \
                        utility variant any; do
              dest="$DIST/lib/cmake/boost_${comp}-${BOOST_VER}"
              cfg="$dest/boost_${comp}-config.cmake"
              ver="$dest/boost_${comp}-config-version.cmake"
              [ -e "$cfg" ] && continue
              mkdir -p "$dest"
              # Use printf rather than a heredoc because the YAML
              # `run: |` block scalar requires every line to be
              # indented past the block's column; heredoc body lines
              # starting at column 1 break that.
              {
                printf '%s\n' \
                  "# Auto-generated by libcvc-deps release.yml --" \
                  "# brew's boost bottle did not ship boost_${comp}-config.cmake." \
                  "# Boost::${comp} is header-only here; forward to Boost::headers." \
                  "if(TARGET Boost::${comp})" \
                  "  return()" \
                  "endif()" \
                  "if(NOT TARGET Boost::headers)" \
                  "  include(\"\${CMAKE_CURRENT_LIST_DIR}/../boost_headers-${BOOST_VER}/boost_headers-config.cmake\")" \
                  "endif()" \
                  "add_library(Boost::${comp} INTERFACE IMPORTED)" \
                  "set_target_properties(Boost::${comp} PROPERTIES" \
                  "  INTERFACE_LINK_LIBRARIES \"Boost::headers\")" \
                  "set(boost_${comp}_FOUND 1)"
              } > "$cfg"
              {
                printf '%s\n' \
                  "set(PACKAGE_VERSION \"${BOOST_VER}\")" \
                  "if(\"\${PACKAGE_FIND_VERSION}\" VERSION_EQUAL \"\${PACKAGE_VERSION}\")" \
                  "  set(PACKAGE_VERSION_EXACT TRUE)" \
                  "  set(PACKAGE_VERSION_COMPATIBLE TRUE)" \
                  "elseif(\"\${PACKAGE_FIND_VERSION}\" VERSION_LESS_EQUAL \"\${PACKAGE_VERSION}\")" \
                  "  set(PACKAGE_VERSION_COMPATIBLE TRUE)" \
                  "endif()"
              } > "$ver"
            done
          fi

      # ── Stage libiimod from the cached install ──
      - name: Stage libiimod
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          PFX="$HOME/libiimod-prefix-${{ matrix.build_type }}"
          if [ -d "$PFX" ]; then
            mkdir -p "$DIST/include/libiimod" "$DIST/lib/cmake/libiimod"
            cp -R "$PFX/include/libiimod/." "$DIST/include/libiimod/"
            cp -R "$PFX/lib/libiimod.a"     "$DIST/lib/" 2>/dev/null || true
            if [ -d "$PFX/lib/cmake/libiimod" ]; then
              cp -R "$PFX/lib/cmake/libiimod/." "$DIST/lib/cmake/libiimod/"
            fi
          fi

      # ── Stage levmar from the cached install ──
      - name: Stage levmar
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          PFX="$HOME/levmar-prefix-${{ matrix.build_type }}"
          if [ -d "$PFX" ]; then
            mkdir -p "$DIST/include/levmar" "$DIST/lib/cmake/levmar"
            cp -R "$PFX/include/levmar/." "$DIST/include/levmar/"
            cp -R "$PFX/lib/liblevmar.a"  "$DIST/lib/" 2>/dev/null || true
            if [ -d "$PFX/lib/cmake/levmar" ]; then
              cp -R "$PFX/lib/cmake/levmar/." "$DIST/lib/cmake/levmar/"
            fi
          fi

      # ── Build NFFT3 from source ──
      # No Homebrew formula exists for NFFT3, so we build it from the
      # upstream tarball using the same autotools toolchain Linux's
      # libnfft3-dev package and our Windows MSYS2 path use. The source
      # tarball is SHA256-pinned; we try the GitHub release first and
      # fall back to the TU-Chemnitz mirror.
      - name: Cache NFFT3 install prefix
        id: nfft-cache
        uses: actions/cache@v4
        with:
          path: ~/nfft-prefix
          # NFFT is build-type-independent on macOS (always built with
          # -O3 -ffast-math via the snippet below); a single cache
          # covers all 4 matrix entries.
          key: nfft-3.5.3-${{ runner.os }}-v1

      - name: Build NFFT3 from source (macOS)
        if: steps.nfft-cache.outputs.cache-hit != 'true'
        env:
          NFFT_VERSION: '3.5.3'
          NFFT_SHA256:  'caf1b3b3e5bf8c33a6bfd7eca811d954efce896605ecfd0144d47d0bebdf4371'
        run: |
          set -euxo pipefail
          NFFT_PREFIX="$HOME/nfft-prefix"
          rm -rf "$NFFT_PREFIX"

          url_gh="https://github.com/NFFT/nfft/releases/download/${NFFT_VERSION}/nfft-${NFFT_VERSION}.tar.gz"
          url_tuc="https://www-user.tu-chemnitz.de/~potts/nfft/download/nfft-${NFFT_VERSION}.tar.gz"
          curl -fsSL "$url_gh" -o nfft.tar.gz || curl -fsSL "$url_tuc" -o nfft.tar.gz
          echo "${NFFT_SHA256}  nfft.tar.gz" | shasum -a 256 -c -

          tar -xzf nfft.tar.gz
          cd "nfft-${NFFT_VERSION}"

          FFTW_PREFIX="$(brew --prefix fftw)"

          # On Apple Silicon brew lives under /opt/homebrew. Use the
          # detected brew prefix for the OpenMP-capable compiler flags;
          # NFFT does not require Clang's libomp at build time when
          # using --enable-openmp because it uses #pragma omp without
          # explicit linkage to libomp until the OS-side OpenMP runtime
          # is available. macOS Apple Clang lacks OpenMP, so build the\
          # plain (no-OpenMP) variant -- F2Dock/F3Dock will pick up the\
          # nfft3 symbols regardless. Threading on macOS uses Grand\
          # Central Dispatch through FFTW's pthreads path automatically.
          ./configure \
            --prefix="$NFFT_PREFIX" \
            --enable-shared \
            --enable-static \
            --with-pic \
            --disable-examples \
            --disable-applications \
            --with-fftw3-includedir="$FFTW_PREFIX/include" \
            --with-fftw3-libdir="$FFTW_PREFIX/lib" \
            CFLAGS="-O3 -ffast-math" \
            CC=clang
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..
          rm -rf "nfft-${NFFT_VERSION}" nfft.tar.gz

      - name: Stage NFFT3 into bundle
        run: |
          set -euxo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          NFFT_PREFIX="$HOME/nfft-prefix"

          # Stage into bundle. Use cp -R so we get headers, the dylib,
          # and pkgconfig in one go.
          mkdir -p "$DIST/lib" "$DIST/include" "$DIST/lib/pkgconfig"
          cp -R "$NFFT_PREFIX/include/." "$DIST/include/" 2>/dev/null || true
          # NFFT installs the dylib as libnfft3.<ver>.dylib + symlinks.
          for f in "$NFFT_PREFIX"/lib/libnfft3*.dylib*; do
            [ -e "$f" ] || continue
            cp -P "$f" "$DIST/lib/"
          done
          # Also stage the static archives (libnfft3.a, libnfft3_threads.a
          # if present) so the -static flavor has a true static path.
          for f in "$NFFT_PREFIX"/lib/libnfft3*.a; do
            [ -e "$f" ] || continue
            cp "$f" "$DIST/lib/"
          done
          # Rewrite the .pc file so it relocates with the bundle.
          if [ -f "$NFFT_PREFIX/lib/pkgconfig/nfft3.pc" ]; then
            sed -e 's|^prefix=.*|prefix=${pcfiledir}/../..|' \
                -e 's|^exec_prefix=.*|exec_prefix=${prefix}|' \
                -e 's|^libdir=.*|libdir=${prefix}/lib|' \
                -e 's|^includedir=.*|includedir=${prefix}/include|' \
                "$NFFT_PREFIX/lib/pkgconfig/nfft3.pc" \
              > "$DIST/lib/pkgconfig/nfft3.pc"
          fi

          echo "NFFT3 staged:"
          ls -la "$DIST/lib"/libnfft3* "$DIST/include"/nfft3* "$DIST/lib/pkgconfig/nfft3.pc" || true

      # ── Rewrite install_names to @rpath / @loader_path so the
      #    bundle is relocatable ──
      - name: Bundle dylib install names
        if: matrix.link == 'shared'
        run: |
          set -euo pipefail
          DIST="$PWD/${{ steps.meta.outputs.stem }}"
          # dylibbundler was installed alongside the other brew
          # dependencies above, so no extra install step here.
          #
          # Pass every staged dylib as a -x argument in ONE invocation.
          # dylibbundler then walks the union of their transitive dep
          # graphs a single time, rewriting install_names to
          # @rpath/<dylib> and adding @loader_path/ rpaths in a single
          # O(N) pass. The previous per-dylib loop was O(N²) because
          # each invocation re-walked overlapping subgraphs (libQt6Core
          # / libicu / libpng / … are pulled in by almost every shipped
          # dylib). On the macos-latest runner this step dropped from
          # ~20 minutes per shared job to a couple of minutes.
          #
          # -of  : overwrite files in place (dylibs are already in
          #        $DIST/lib).
          # -cd  : codesign rewritten binaries (required on Apple
          #        Silicon to keep them launchable).
          # -p   : embed @rpath/ as the lookup prefix so consumers
          #        outside the bundle (e.g. test binaries in
          #        <consumer-build>/bin) can locate the dylibs via
          #        their own rpath, which CMake auto-populates with
          #        the absolute-link-time directory of each dylib.
          #        Internal bundle-to-bundle deps still resolve
          #        because dylibbundler adds an @loader_path/ rpath
          #        to each rewritten dylib.
          # NOTE: we deliberately do NOT pass -od (overwrite output
          # DIR). dylibbundler treats -od as `rm -rf $DEST_DIR` before
          # the first copy; with -d = $DIST/lib (same directory as
          # the source files) that would delete every staged dylib
          # before processing starts.
          xargs=()
          for dy in "$DIST"/lib/*.dylib; do
            [ -e "$dy" ] || continue
            [ -L "$dy" ] && continue
            xargs+=( -x "$dy" )
          done
          if [ "${#xargs[@]}" -eq 0 ]; then
            echo "No dylibs found to bundle."
            exit 0
          fi
          echo "Bundling $(( ${#xargs[@]} / 2 )) dylibs in a single dylibbundler pass."
          dylibbundler -b -d "$DIST/lib" -p '@rpath/' -of -cd "${xargs[@]}" || true

          # ── Dedupe LC_RPATH entries ──
          # brew's vtk-9.x dylibs ship with an `@rpath/` LC_RPATH load
          # command baked in. dylibbundler unconditionally adds another
          # `@rpath/` LC_RPATH to each rewritten dylib (a side effect
          # of `-p '@rpath/'`), producing a duplicate LC_RPATH that
          # newer Apple linkers (Xcode 15+, ld-1015) reject when a
          # consumer (e.g. volrover3) links against the dylib:
          #
          #   ld: multiple errors: duplicate LC_RPATH '@rpath/' in
          #       lib/libvtk*-9.5.9.5.dylib
          #
          # Walk every shipped dylib and collapse repeated identical
          # rpath entries to one, then re-codesign so the load
          # commands match the on-disk signature.
          for dy in "$DIST"/lib/*.dylib; do
            [ -e "$dy" ] || continue
            [ -L "$dy" ] && continue
            # Collect each LC_RPATH 'path' value, count duplicates.
            rpaths=$(otool -l "$dy" \
              | awk '/cmd LC_RPATH/{getline; getline; print $2}')
            [ -z "$rpaths" ] && continue
            changed=0
            while IFS= read -r rp; do
              [ -n "$rp" ] || continue
              n=$(otool -l "$dy" \
                | awk -v r="$rp" '/cmd LC_RPATH/{getline; getline; if ($2==r) c++} END{print c+0}')
              while [ "$n" -gt 1 ]; do
                install_name_tool -delete_rpath "$rp" "$dy" 2>/dev/null || break
                n=$((n - 1))
                changed=1
              done
            done <<< "$(printf '%s\n' "$rpaths" | sort -u)"
            if [ "$changed" -eq 1 ]; then
              codesign --force --sign - "$dy" 2>/dev/null || true
            fi
          done

      # ── Stage vcglib (header-only) ──
      - name: Stage vcglib
        uses: ./.github/actions/stage-vcglib
        with:
          dist:    ${{ github.workspace }}/${{ steps.meta.outputs.stem }}
          version: ${{ env.VCGLIB_VERSION }}
          sha256:  ${{ env.VCGLIB_SHA256 }}

      - name: Pack zip
        run: |
          STEM="${{ steps.meta.outputs.stem }}"
          ditto -c -k --sequesterRsrc --keepParent "$STEM" "${STEM}.zip"
          du -sh "$STEM" "${STEM}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.build_type }}-${{ matrix.link }}
          path: libcvc-deps-*.zip
          if-no-files-found: error

  # ──────────────────── Windows: vcpkg deps prep ───────────────────
  # Stage 1 of the Windows pipeline. One job per (build_type, triplet)
  # so the per-job 6-hour limit only has to cover vcpkg install for a
  # single configuration. Output is the vcpkg installed/ tree cached
  # under a key the assemble stage restores from.
  #
  # x64-windows-static is included so the static Windows release
  # bundle can ship MSVC static .lib archives. vcpkg's `mpfr` port
  # hangs indefinitely during the autotools/libtool link step on
  # hosted GitHub Actions Windows runners when built for the
  # x64-windows-static triplet (see docs/known-issues.md, "Windows
  # static builds: mpfr hang in vcpkg"), so the static install set
  # excludes mpfr and anything that transitively depends on it
  # (gmp, cgal). The gRPC / Protobuf stack exhibits the same hang
  # pattern (see docs/known-issues.md, "Windows static builds: grpc
  # hang in vcpkg") and is also excluded. All of these ports are
  # filled in from the x64-windows (shared) cache during assembly
  # — the static Windows bundle is therefore a hybrid: static .lib
  # for everything that builds, and shared .dll + import .lib for
  # cgal/gmp/mpfr plus the gRPC / Protobuf stack and its transitive
  # support libraries.
  windows-vcpkg:
    runs-on: windows-latest
    timeout-minutes: 350
    # NOTE: no build_type matrix. vcpkg builds both Debug and Release
    # variants of each port in a single `vcpkg install` invocation (its
    # default behavior for triplets that do not set VCPKG_BUILD_TYPE).
    # A single job populates C:\vcpkg\installed/<triplet>/{,debug/}
    # and the assemble stage cherry-picks the right subtree per
    # build_type. Running this as a Debug/Release matrix would just do
    # the same work twice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x64-windows
          - triplet: x64-windows-static
    steps:
      - uses: actions/checkout@v4

      - name: 'Free disk space and route vcpkg to D: (Windows)'
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Each Remove-Item runs in a background job with a 60s
          # timeout so an occasional file-lock hang under
          # C:\Program Files\dotnet (intermittent on
          # windows-2025-vs2026 runners) can't stall the whole job.
          foreach ($dir in @(
              'C:\Android', 'C:\Program Files\dotnet',
              'C:\hostedtoolcache\windows\Ruby',
              'C:\hostedtoolcache\windows\PyPy',
              'C:\hostedtoolcache\windows\go',
              'C:\hostedtoolcache\windows\node')) {
            if (-not (Test-Path $dir)) { continue }
            Write-Host "Removing $dir ..."
            $job = Start-Job -ScriptBlock {
              param($p)
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $p
            } -ArgumentList $dir
            if (-not (Wait-Job $job -Timeout 60)) {
              Write-Host "  timed out after 60s, skipping $dir"
              Stop-Job $job -ErrorAction SilentlyContinue
            }
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path D:\vcpkg-buildtrees | Out-Null
          New-Item -ItemType Directory -Force -Path D:\vcpkg-packages   | Out-Null
          New-Item -ItemType Directory -Force -Path D:\vcpkg-downloads  | Out-Null
          "VCPKG_DOWNLOADS=D:\vcpkg-downloads"   | Out-File -Append $env:GITHUB_ENV
          "VCPKG_BUILDTREES=D:\vcpkg-buildtrees" | Out-File -Append $env:GITHUB_ENV
          "VCPKG_PACKAGES=D:\vcpkg-packages"     | Out-File -Append $env:GITHUB_ENV

      - name: Cache vcpkg installed packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          # NOTE: hardcoded C:\vcpkg — the runner-provided
          # VCPKG_INSTALLATION_ROOT env var is NOT visible to
          # ${{ env.* }} template expansion (only workflow-declared env
          # is), so using it here silently resolves to empty and the
          # cache caches/restores a bogus path. C:\vcpkg is the well-
          # known vcpkg location on windows-latest hosted runners.
          path: |
            C:\vcpkg\installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-deps-${{ matrix.triplet }}-v3-${{ hashFiles('vcpkg-overlay/**', '.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-deps-${{ matrix.triplet }}-v3-

      - name: Restore vcpkg downloads cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v4
        with:
          path: D:\vcpkg-downloads
          key: vcpkg-downloads-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-downloads-

      - name: Install vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\vcpkg-overlay\ports
        run: |
          $packages = @(
            'boost-thread','boost-date-time','boost-regex','boost-filesystem',
            'boost-system','boost-chrono','boost-program-options','boost-signals2',
            'boost-format','boost-property-tree','boost-algorithm','boost-asio',
            'boost-any','boost-array','boost-dynamic-bitset','boost-exception',
            'boost-foreach','boost-function','boost-lambda','boost-lexical-cast',
            'boost-multi-array','boost-optional','boost-smart-ptr','boost-tuple',
            'boost-utility',
            'hdf5[cpp]','fftw3','gsl','imagemagick','log4cplus','tiff','libyaml',
            'protobuf[libprotoc]','grpc',
            'cgal','glew',
            # F2Dock / F3Dock science stack.
            #   eigen3   — header-only linear algebra
            #   clapack  — LAPACK API for Windows (no MKL dep)
            #   openblas — BLAS backend for clapack
            # NFFT3 has no vcpkg port; it is staged directly from the
            # MSYS2 mingw64 build in the assemble step.
            'eigen3','clapack','openblas',
            # pthreads4w (vcpkg port name `pthreads`). TexMol and
            # F2Dock #include <pthread.h> in many modules; on
            # Windows we ship pthreads4w so consumers can link via
            # the standard CMake `find_package(Threads)` /
            # `Threads::Threads` target.
            'pthreads'
          )
          if ('${{ matrix.triplet }}' -eq 'x64-windows-static') {
            # mpfr (and therefore gmp + cgal) hangs in vcpkg under the
            # x64-windows-static triplet on hosted runners. Same
            # symptom for the gRPC / Protobuf stack (the abseil +
            # c-ares + grpc build chain stalls for hours in vcpkg
            # on x64-windows-static under hosted runners — see
            # docs/known-issues.md, "Windows static builds: grpc
            # hang in vcpkg"). Skip all of them here; the assemble
            # stage stitches the shared-triplet builds of these
            # ports into the static bundle as DLL + import-lib
            # fallbacks.
            $packages = $packages | Where-Object {
              $_ -notin @('cgal','protobuf[libprotoc]','grpc')
            }
          }
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "vcpkg install attempt $i / 5"
            vcpkg install @packages --triplet ${{ matrix.triplet }} `
              --clean-after-build `
              --x-buildtrees-root=D:\vcpkg-buildtrees `
              --x-packages-root=D:\vcpkg-packages
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { exit $LASTEXITCODE }
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue D:\vcpkg-buildtrees\*
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue D:\vcpkg-packages\*
            $sleep = [Math]::Min(60 * $i, 180)
            Start-Sleep -Seconds $sleep
          }

      - name: Save vcpkg downloads cache
        if: always() && steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\vcpkg-downloads
          key: vcpkg-downloads-${{ hashFiles('.github/workflows/release.yml') }}

  # ──────────────────── Windows: VTK build prep ────────────────────
  # Stage 2 of the Windows pipeline. One job per build_type. VTK build
  # output cached at D:\vtk-qt6 and consumed by the assemble stage.
  # Link flavor (shared/static) does not affect VTK itself — VTK is
  # always built shared (BUILD_SHARED_LIBS=ON) — so 2 jobs suffice.
  windows-vtk:
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache VTK
        id: vtk-cache
        uses: actions/cache@v4
        with:
          path: D:\vtk-qt6
          key: vtk-${{ env.VTK_VERSION }}-qt6-${{ runner.os }}-${{ matrix.build_type }}-v2

      - name: Install Qt6
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: ''
          cache: true

      - name: Build VTK from source against Qt6
        if: steps.vtk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Kitware/VTK/archive/refs/tags/v${env:VTK_VERSION}.tar.gz" -OutFile vtk.tar.gz
          tar xzf vtk.tar.gz
          cmake -S "VTK-${env:VTK_VERSION}" -B D:\vtk-build `
            -DCMAKE_INSTALL_PREFIX=D:\vtk-qt6 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_SHARED_LIBS=ON `
            -DVTK_GROUP_ENABLE_Qt=YES `
            -DVTK_QT_VERSION=6 `
            -DVTK_MODULE_ENABLE_VTK_GUISupportQtQuick=NO `
            -DVTK_MODULE_ENABLE_VTK_RenderingQtQuick=NO `
            -DVTK_BUILD_TESTING=OFF `
            -DVTK_BUILD_EXAMPLES=OFF `
            -DVTK_BUILD_DOCUMENTATION=OFF `
            -DVTK_LEGACY_REMOVE=ON
          cmake --build D:\vtk-build --config ${{ matrix.build_type }} --parallel --target install
          Remove-Item -Recurse -Force D:\vtk-build
          Remove-Item -Recurse -Force "VTK-${env:VTK_VERSION}"
          Remove-Item -Force vtk.tar.gz

      # Upload VTK install tree as a run-scoped artifact so the
      # windows assemble jobs can consume it without going through
      # the actions/cache LRU bucket. The cache step above is kept as
      # a fast-path that skips the Qt install + VTK build on hit; the
      # artifact upload always runs so the assemble jobs always have
      # a copy that is immune to mid-run cache eviction (the repo's
      # 10 GB cache quota was being hit by the two ~3.5 GB
      # vcpkg-deps-x64-windows-v3 caches plus brew bottles, evicting
      # the smaller VTK Debug cache before the assemble job could
      # read it — see commit log for run 26125864896).
      - name: Upload VTK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtk-${{ matrix.build_type }}
          path: D:\vtk-qt6
          retention-days: 1
          if-no-files-found: error

  # ────────────────────── Windows: assemble ──────────────────────
  # Stage 3 of the Windows pipeline. Restores both prep caches, then
  # stages + zips + uploads the per-config artifact. This stage is
  # fast (minutes) and should always finish well under the per-job
  # time limit.
  # NOTE: the static (link: static) Windows bundle is a hybrid \u2014 it
  # ships static .lib for everything that builds under the
  # x64-windows-static triplet, plus shared .dll + import .lib for
  # cgal/gmp/mpfr (which can't be built static on hosted runners
  # because vcpkg's mpfr port hangs there \u2014 see docs/known-issues.md,
  # "Windows static builds: mpfr hang in vcpkg") and for the gRPC /
  # Protobuf stack with its transitive support libraries (abseil,
  # c-ares, OpenSSL, re2, upb, utf8_range, zlib), which exhibit the
  # same hang pattern on x64-windows-static \u2014 see
  # docs/known-issues.md, "Windows static builds: grpc hang in
  # vcpkg". VTK and Qt6 remain shared in both link flavors (no
  # static brew/aqtinstall flavor).
  windows:
    needs: [windows-vcpkg, windows-vtk]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            link: shared
          - build_type: Release
            link: shared
          # Hybrid static bundles: x64-windows-static for everything
          # that builds, plus shared cgal/gmp/mpfr fallback (the mpfr
          # vcpkg port hangs on the static triplet, see windows-vcpkg)
          # and shared grpc / protobuf + transitive support libs
          # (same hang, see windows-vcpkg).
          - build_type: Debug
            link: static
          - build_type: Release
            link: static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          BTLC=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.link }}" = "static" ]; then
            LINKSFX="-static"
            TRIPLET="x64-windows-static"
          else
            LINKSFX=""
            TRIPLET="x64-windows"
          fi
          SHASFX=""
          if [ -n "${{ inputs.sha_suffix }}" ]; then
            short=$(echo "${{ inputs.sha_suffix }}" | cut -c1-7)
            SHASFX="-${short}"
          fi
          STEM="libcvc-deps-${VERSION}${SHASFX}-windows-x86_64-${BTLC}${LINKSFX}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=x86_64"      >> "$GITHUB_OUTPUT"
          echo "btlc=$BTLC"       >> "$GITHUB_OUTPUT"
          echo "linksfx=$LINKSFX" >> "$GITHUB_OUTPUT"
          echo "triplet=$TRIPLET" >> "$GITHUB_OUTPUT"
          echo "stem=$STEM"       >> "$GITHUB_OUTPUT"

      - name: 'Free disk space and route vcpkg to D: (Windows)'
        timeout-minutes: 10
        shell: pwsh
        run: |
          # See windows-vcpkg job for rationale on the per-dir timeout.
          foreach ($dir in @(
              'C:\Android', 'C:\Program Files\dotnet',
              'C:\hostedtoolcache\windows\Ruby',
              'C:\hostedtoolcache\windows\PyPy',
              'C:\hostedtoolcache\windows\go',
              'C:\hostedtoolcache\windows\node')) {
            if (-not (Test-Path $dir)) { continue }
            Write-Host "Removing $dir ..."
            $job = Start-Job -ScriptBlock {
              param($p)
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $p
            } -ArgumentList $dir
            if (-not (Wait-Job $job -Timeout 60)) {
              Write-Host "  timed out after 60s, skipping $dir"
              Stop-Job $job -ErrorAction SilentlyContinue
            }
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }

      - name: Restore vcpkg installed cache
        uses: actions/cache/restore@v4
        with:
          # NOTE: hardcoded C:\vcpkg — see windows-vcpkg job for why
          # ${{ env.VCPKG_INSTALLATION_ROOT }} cannot be used here.
          path: |
            C:\vcpkg\installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-deps-${{ steps.meta.outputs.triplet }}-v3-${{ hashFiles('vcpkg-overlay/**', '.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-deps-${{ steps.meta.outputs.triplet }}-v3-
          fail-on-cache-miss: true

      # For the hybrid static bundle, also restore the x64-windows
      # (shared) cache so that cgal/gmp/mpfr and the gRPC / Protobuf
      # stack (none of which can be built for x64-windows-static on
      # hosted runners) are available as DLL + import-lib fallbacks.
      # The two caches populate disjoint subdirectories of
      # C:\vcpkg\installed (per-triplet trees), so they coexist
      # without conflict.
      - name: Restore vcpkg shared cache (static-bundle fallback)
        if: matrix.link == 'static'
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-deps-x64-windows-v3-${{ hashFiles('vcpkg-overlay/**', '.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-deps-x64-windows-v3-
          fail-on-cache-miss: true

      - name: Download VTK artifact
        uses: actions/download-artifact@v4
        with:
          name: vtk-${{ matrix.build_type }}
          path: D:\vtk-qt6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: ''
          cache: true

      - name: Configure + install marker config
        shell: pwsh
        run: |
          $stem = '${{ steps.meta.outputs.stem }}'
          $dist = Join-Path $env:GITHUB_WORKSPACE $stem
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$dist"
          cmake --install build --config ${{ matrix.build_type }}
          New-Item -ItemType Directory -Force -Path "$dist/bin","$dist/lib","$dist/include","$dist/share" | Out-Null

      # ── libiimod built from upstream LabShare-Archive/IMOD ──
      - name: Cache libiimod install
        id: libiimod-cache
        uses: actions/cache@v4
        with:
          path: D:\libiimod-prefix-${{ matrix.build_type }}
          key: libiimod-${{ hashFiles('third-party/libiimod/**') }}-${{ runner.os }}-${{ matrix.build_type }}-v2

      - name: Build libiimod from source
        if: steps.libiimod-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix  = "D:\libiimod-prefix-${{ matrix.build_type }}"
          $triplet = '${{ steps.meta.outputs.triplet }}'
          # Route find_package(TIFF) through the vcpkg-installed tree
          # populated by the windows-vcpkg pre-job.
          cmake -S third-party/libiimod -B D:\libiimod-build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build D:\libiimod-build --config ${{ matrix.build_type }} --target install
          Remove-Item -Recurse -Force D:\libiimod-build

      - name: Stage libiimod
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem   = '${{ steps.meta.outputs.stem }}'
          $dist   = Join-Path $env:GITHUB_WORKSPACE $stem
          $prefix = "D:\libiimod-prefix-${{ matrix.build_type }}"
          if (Test-Path $prefix) {
            New-Item -ItemType Directory -Force -Path "$dist/include/libiimod","$dist/lib/cmake/libiimod" | Out-Null
            Copy-Item -Recurse -Force "$prefix/include/libiimod/*" "$dist/include/libiimod/"
            $libDir = Join-Path $prefix 'lib'
            if (Test-Path $libDir) {
              Get-ChildItem -Path $libDir -Filter 'iimod.lib' -File -ErrorAction SilentlyContinue `
                | Copy-Item -Destination "$dist/lib/" -Force
              if (Test-Path "$prefix/lib/cmake/libiimod") {
                Copy-Item -Recurse -Force "$prefix/lib/cmake/libiimod/*" "$dist/lib/cmake/libiimod/"
              }
            }
          }

      # ── levmar built from upstream tarball (Lourakis) ──
      - name: Cache levmar install
        id: levmar-cache
        uses: actions/cache@v4
        with:
          path: D:\levmar-prefix-${{ matrix.build_type }}
          key: levmar-${{ hashFiles('third-party/levmar/**') }}-${{ runner.os }}-${{ matrix.build_type }}-v1

      - name: Build levmar from source
        if: steps.levmar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix  = "D:\levmar-prefix-${{ matrix.build_type }}"
          $triplet = '${{ steps.meta.outputs.triplet }}'
          # LAPACK is sourced from the vcpkg-installed clapack port
          # (f2c'd reference LAPACK + libf2c, with vcpkg's openblas
          # as the BLAS backend). third-party/levmar/CMakeLists.txt
          # finds clapack via its CONFIG package directly and
          # synthesises a LAPACK::LAPACK INTERFACE target — see the
          # commentary there for why we cannot rely on
          # find_package(LAPACK) via the system FindLAPACK module
          # under MSVC.
          cmake -S third-party/levmar -B D:\levmar-build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build D:\levmar-build --config ${{ matrix.build_type }} --target install
          Remove-Item -Recurse -Force D:\levmar-build

      - name: Stage levmar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem   = '${{ steps.meta.outputs.stem }}'
          $dist   = Join-Path $env:GITHUB_WORKSPACE $stem
          $prefix = "D:\levmar-prefix-${{ matrix.build_type }}"
          if (Test-Path $prefix) {
            New-Item -ItemType Directory -Force -Path "$dist/include/levmar","$dist/lib/cmake/levmar" | Out-Null
            Copy-Item -Recurse -Force "$prefix/include/levmar/*" "$dist/include/levmar/"
            $libDir = Join-Path $prefix 'lib'
            if (Test-Path $libDir) {
              Get-ChildItem -Path $libDir -Filter 'levmar.lib' -File -ErrorAction SilentlyContinue `
                | Copy-Item -Destination "$dist/lib/" -Force
              if (Test-Path "$prefix/lib/cmake/levmar") {
                Copy-Item -Recurse -Force "$prefix/lib/cmake/levmar/*" "$dist/lib/cmake/levmar/"
              }
            }
          }

      - name: Stage vcpkg + Qt + VTK trees
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem    = '${{ steps.meta.outputs.stem }}'
          $dist    = Join-Path $env:GITHUB_WORKSPACE $stem
          $isDebug = '${{ matrix.build_type }}' -eq 'Debug'
          $triplet = '${{ steps.meta.outputs.triplet }}'

          # ── vcpkg installed tree ───────────────────────────────
          $vcRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          if (-not (Test-Path $vcRoot)) {
            throw "vcpkg installed tree not found at $vcRoot"
          }
          # Layout per triplet:
          #   <triplet>/{bin,lib,include,share}     — release
          #   <triplet>/debug/{bin,lib}             — debug
          # Headers + share/cmake/* are config-agnostic and live in
          # the release subtree only.
          $libSrc = if ($isDebug) { Join-Path $vcRoot 'debug/lib' } else { Join-Path $vcRoot 'lib' }
          $binSrc = if ($isDebug) { Join-Path $vcRoot 'debug/bin' } else { Join-Path $vcRoot 'bin' }
          $libRel = Join-Path $vcRoot 'lib'
          $libDbg = Join-Path $vcRoot 'debug/lib'
          $binRel = Join-Path $vcRoot 'bin'
          $binDbg = Join-Path $vcRoot 'debug/bin'

          if (Test-Path "$vcRoot/include") {
            Copy-Item -Recurse -Force "$vcRoot/include/*" "$dist/include/"
          }
          if (Test-Path "$vcRoot/share") {
            Copy-Item -Recurse -Force "$vcRoot/share/*" "$dist/share/"
          }
          if (Test-Path "$vcRoot/tools") {
            New-Item -ItemType Directory -Force -Path "$dist/tools" | Out-Null
            Copy-Item -Recurse -Force "$vcRoot/tools/*" "$dist/tools/"
            foreach ($tool in @('protoc.exe','grpc_cpp_plugin.exe','grpc_csharp_plugin.exe','grpc_node_plugin.exe','grpc_python_plugin.exe')) {
              Get-ChildItem -Path "$vcRoot/tools" -Recurse -Filter $tool -File -ErrorAction SilentlyContinue |
                Select-Object -First 1 |
                ForEach-Object { Copy-Item -Path $_.FullName -Destination "$dist/bin/" -Force }
            }
          }
          # On the static (hybrid) bundle, grpc / protobuf are not
          # built in the x64-windows-static tree (see windows-vcpkg).
          # Pull their tools (protoc.exe, grpc_*_plugin.exe and the
          # tools/protobuf, tools/grpc subtrees that vcpkg generates)
          # from the x64-windows (shared) tree which is restored
          # alongside the static cache. Safe to overwrite/merge
          # because tool layouts are config-agnostic.
          if ('${{ matrix.link }}' -eq 'static') {
            $shRootTools = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/tools'
            if (Test-Path $shRootTools) {
              New-Item -ItemType Directory -Force -Path "$dist/tools" | Out-Null
              foreach ($sub in @('protobuf','grpc')) {
                $src = Join-Path $shRootTools $sub
                if (Test-Path $src) {
                  Copy-Item -Recurse -Force $src "$dist/tools/"
                }
              }
              foreach ($tool in @('protoc.exe','grpc_cpp_plugin.exe','grpc_csharp_plugin.exe','grpc_node_plugin.exe','grpc_python_plugin.exe')) {
                Get-ChildItem -Path $shRootTools -Recurse -Filter $tool -File -ErrorAction SilentlyContinue |
                  Select-Object -First 1 |
                  ForEach-Object { Copy-Item -Path $_.FullName -Destination "$dist/bin/" -Force }
              }
            }
          }
          if (Test-Path $libSrc) {
            $patterns = if ($isDebug) { @('*.lib','*.pdb') } else { @('*.lib') }
            foreach ($p in $patterns) {
              Get-ChildItem -Path $libSrc -Filter $p -File `
                | Copy-Item -Destination "$dist/lib/" -Force
            }
          }
          if ('${{ matrix.link }}' -eq 'shared' -and (Test-Path $binSrc)) {
            $patterns = if ($isDebug) { @('*.dll','*.pdb') } else { @('*.dll') }
            foreach ($p in $patterns) {
              Get-ChildItem -Path $binSrc -Filter $p -File `
                | Copy-Item -Destination "$dist/bin/" -Force
            }
          }

          # ── Ship BOTH release- and debug-side vcpkg trees ──
          # vcpkg's per-port cmake target files (share/<port>/<port>-
          # targets.cmake) include BOTH a -release.cmake and a
          # -debug.cmake fragment whenever vcpkg built both variants
          # (the default for non-VCPKG_BUILD_TYPE-restricted ports).
          # The -release fragment declares
          #   IMPORTED_LOCATION_RELEASE = ${_IMPORT_PREFIX}/lib/<lib>
          # and the -debug fragment declares
          #   IMPORTED_LOCATION_DEBUG = ${_IMPORT_PREFIX}/debug/lib/<lib>
          # Both are appended to _IMPORT_CHECK_FILES_FOR_<target>, and
          # the validation foreach() at the bottom of *-targets.cmake
          # checks EVERY listed file exists — unconditional on the
          # consumer's CMAKE_BUILD_TYPE. A missing release- OR debug-
          # side file aborts find_package with e.g.
          #
          #   CMake Error at .../share/boost_atomic/boost_atomic-targets.cmake:85
          #     Boost::atomic references .../lib/boost_atomic-vc143-mt-x64-1_90.lib
          #     but this file does not exist
          #
          # So both bundles (Debug AND Release) must ship the .libs
          # for BOTH configs. vcpkg-built debug libs use a -gd name
          # suffix and release libs don't, so they coexist at lib/
          # without name collisions. Put release-side at top-level
          # lib/ (where IMPORTED_LOCATION_RELEASE points) and debug-
          # side at debug/lib/ (where IMPORTED_LOCATION_DEBUG points),
          # mirroring vcpkg's installed-tree layout exactly.
          $dbgLib = Join-Path $dist 'debug/lib'
          New-Item -ItemType Directory -Force -Path $dbgLib | Out-Null
          if (Test-Path $libRel) {
            Get-ChildItem -Path $libRel -Filter '*.lib' -File `
              | Copy-Item -Destination "$dist/lib/" -Force
          }
          if (Test-Path $libDbg) {
            Get-ChildItem -Path $libDbg -Filter '*.lib' -File `
              | Copy-Item -Destination $dbgLib -Force
          }
          if ($isDebug) {
            if (Test-Path $libRel) {
              Get-ChildItem -Path $libRel -Filter '*.pdb' -File `
                | Copy-Item -Destination "$dist/lib/" -Force
            }
            if (Test-Path $libDbg) {
              Get-ChildItem -Path $libDbg -Filter '*.pdb' -File `
                | Copy-Item -Destination $dbgLib -Force
            }
          }
          if ('${{ matrix.link }}' -eq 'shared') {
            $dbgBin = Join-Path $dist 'debug/bin'
            New-Item -ItemType Directory -Force -Path $dbgBin | Out-Null
            if (Test-Path $binRel) {
              Get-ChildItem -Path $binRel -Filter '*.dll' -File `
                | Copy-Item -Destination "$dist/bin/" -Force
            }
            if (Test-Path $binDbg) {
              Get-ChildItem -Path $binDbg -Filter '*.dll' -File `
                | Copy-Item -Destination $dbgBin -Force
            }
            if ($isDebug) {
              if (Test-Path $binRel) {
                Get-ChildItem -Path $binRel -Filter '*.pdb' -File `
                  | Copy-Item -Destination "$dist/bin/" -Force
              }
              if (Test-Path $binDbg) {
                Get-ChildItem -Path $binDbg -Filter '*.pdb' -File `
                  | Copy-Item -Destination $dbgBin -Force
              }
            }
          }

          # ── Hybrid-static fallback: mix in shared cgal/gmp/mpfr +
          #    gRPC / Protobuf stack ──
          # The x64-windows-static install set omits cgal/gmp/mpfr
          # because the static mpfr port hangs on hosted runners,
          # and omits the gRPC / Protobuf stack for the same reason
          # (the abseil + c-ares + grpc chain hangs on the static
          # triplet — see docs/known-issues.md).
          # Pull import lib + DLL (and matching share/cmake configs)
          # for these ports from the x64-windows (shared) installed
          # tree, which was restored alongside the static cache.
          if ('${{ matrix.link }}' -eq 'static') {
            $shRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
            if (-not (Test-Path $shRoot)) {
              throw "vcpkg shared (x64-windows) tree not found at $shRoot for static-bundle fallback"
            }
            $shLib = if ($isDebug) { Join-Path $shRoot 'debug/lib' } else { Join-Path $shRoot 'lib' }
            $shBin = if ($isDebug) { Join-Path $shRoot 'debug/bin' } else { Join-Path $shRoot 'bin' }
            $shLibRel = Join-Path $shRoot 'lib'
            $shLibDbg = Join-Path $shRoot 'debug/lib'
            $shBinRel = Join-Path $shRoot 'bin'
            $shBinDbg = Join-Path $shRoot 'debug/bin'
            # File-name prefixes that identify fallback ports and their
            # transitive runtime dependencies (CGAL itself is mostly
            # header-only but vcpkg ships a CGAL.dll for the small
            # number of compiled symbols). The gRPC / Protobuf stack
            # is also pulled from the shared tree here because it,
            # like mpfr, cannot be built under x64-windows-static on
            # hosted runners (see docs/known-issues.md). All of
            # gRPC's transitive deps (abseil, c-ares, OpenSSL, re2,
            # upb, utf8_range, zlib, address_sorting, gpr) are
            # included so the DLL + import-lib fallback is
            # self-consistent.
            $fbPrefixes = @(
              'cgal*','CGAL*','gmp*','mpfr*','mpir*',
              'protobuf*','libprotobuf*','libprotoc*','google*',
              'grpc*','libgrpc*','gpr*','libgpr*','address_sorting*',
              'abseil*','absl*','absl_*',
              'c-ares*','cares*','libcares*','ares*',
              'libssl*','libcrypto*','openssl*',
              're2*','RE2*',
              'upb*','libupb*',
              'utf8_range*','libutf8_range*',
              'zlib*','zlib1*'
            )
            # Same dual-config staging strategy as the primary vcpkg
            # copy above: ship both release- and debug-side .lib/.dll
            # so the vcpkg-generated cmake target files for cgal/gmp/
            # mpfr validate both IMPORTED_LOCATION_RELEASE and
            # IMPORTED_LOCATION_DEBUG paths successfully.
            $dbgLib = Join-Path $dist 'debug/lib'
            New-Item -ItemType Directory -Force -Path $dbgLib | Out-Null
            foreach ($pat in $fbPrefixes) {
              if (Test-Path $shLibRel) {
                Get-ChildItem -Path $shLibRel -Filter "$pat.lib" -File -ErrorAction SilentlyContinue `
                  | Copy-Item -Destination "$dist/lib/" -Force
              }
              if (Test-Path $shLibDbg) {
                Get-ChildItem -Path $shLibDbg -Filter "$pat.lib" -File -ErrorAction SilentlyContinue `
                  | Copy-Item -Destination $dbgLib -Force
              }
              if ($isDebug) {
                if (Test-Path $shLibRel) {
                  Get-ChildItem -Path $shLibRel -Filter "$pat.pdb" -File -ErrorAction SilentlyContinue `
                    | Copy-Item -Destination "$dist/lib/" -Force
                }
                if (Test-Path $shLibDbg) {
                  Get-ChildItem -Path $shLibDbg -Filter "$pat.pdb" -File -ErrorAction SilentlyContinue `
                    | Copy-Item -Destination $dbgLib -Force
                }
              }
            }
            $dbgBin = Join-Path $dist 'debug/bin'
            New-Item -ItemType Directory -Force -Path $dbgBin | Out-Null
            foreach ($pat in $fbPrefixes) {
              if (Test-Path $shBinRel) {
                Get-ChildItem -Path $shBinRel -Filter "$pat.dll" -File -ErrorAction SilentlyContinue `
                  | Copy-Item -Destination "$dist/bin/" -Force
              }
              if (Test-Path $shBinDbg) {
                Get-ChildItem -Path $shBinDbg -Filter "$pat.dll" -File -ErrorAction SilentlyContinue `
                  | Copy-Item -Destination $dbgBin -Force
              }
              if ($isDebug) {
                if (Test-Path $shBinRel) {
                  Get-ChildItem -Path $shBinRel -Filter "$pat.pdb" -File -ErrorAction SilentlyContinue `
                    | Copy-Item -Destination "$dist/bin/" -Force
                }
                if (Test-Path $shBinDbg) {
                  Get-ChildItem -Path $shBinDbg -Filter "$pat.pdb" -File -ErrorAction SilentlyContinue `
                    | Copy-Item -Destination $dbgBin -Force
                }
              }
            }
            # Headers + share/cmake/* for cgal/gmp/mpfr are
            # config-agnostic. Headers in $vcRoot/include are already
            # carried over via the static tree's copy above, but the
            # static tree doesn't have these ports, so pull them in
            # from the shared tree.
            if (Test-Path "$shRoot/include") {
              foreach ($pat in $fbPrefixes) {
                Get-ChildItem -Path "$shRoot/include" -Filter $pat -ErrorAction SilentlyContinue `
                  | Copy-Item -Recurse -Force -Destination "$dist/include/"
              }
            }
            if (Test-Path "$shRoot/share") {
              foreach ($pat in $fbPrefixes) {
                Get-ChildItem -Path "$shRoot/share" -Filter $pat -ErrorAction SilentlyContinue `
                  | Copy-Item -Recurse -Force -Destination "$dist/share/"
              }
            }
          }

          # ── Qt6 (aqtinstall tree) ──────────────────────────────
          if ($env:QT_ROOT_DIR -and (Test-Path $env:QT_ROOT_DIR)) {
            foreach ($sub in 'include','lib','bin','plugins','qml','mkspecs') {
              $src = Join-Path $env:QT_ROOT_DIR $sub
              if (Test-Path $src) {
                $dst = Join-Path $dist $sub
                New-Item -ItemType Directory -Force -Path $dst | Out-Null
                Copy-Item -Recurse -Force "$src/*" $dst
              }
            }
          }

          # ── VTK 9.5 install tree ───────────────────────────────
          if (Test-Path D:\vtk-qt6) {
            foreach ($sub in 'include','lib','bin','share') {
              $src = "D:\vtk-qt6\$sub"
              if (Test-Path $src) {
                $dst = Join-Path $dist $sub
                New-Item -ItemType Directory -Force -Path $dst | Out-Null
                Copy-Item -Recurse -Force "$src/*" $dst
              }
            }
          }

          # ── Keep both Qt6 release + debug variants side-by-side ──
          # Qt6's CMake config files (e.g. Qt6CoreTargets-*.cmake) are
          # MULTI-CONFIG: they declare both IMPORTED_LOCATION_DEBUG
          # (Qt6Cored.dll) AND IMPORTED_LOCATION_RELWITHDEBINFO
          # (Qt6Core.dll) for every target. On top of that,
          # Qt6*AdditionalTargetInfo.cmake maps the RELEASE and
          # MINSIZEREL configs to RELWITHDEBINFO at find_package time.
          # That means find_package(Qt6) in a consumer project resolves
          # the non-suffixed paths regardless of CMAKE_BUILD_TYPE.
          #
          # If we ship only the d-suffixed variants in the Debug
          # bundle, consumer configures fail with "file not found" for
          # Qt6Core.lib / Qt6Core.dll / qgif.dll / etc., and the user
          # is left whack-a-mole-ing missing files across lib/, bin/,
          # plugins/imageformats/, plugins/platforms/, plugins/styles/.
          #
          # install-qt-action and Qt's online installer always provide
          # both variants in $QT_ROOT_DIR; we just copy them through
          # untouched. The release bundle equivalently ships both
          # (in that case both files are the release build).
          #
          # VTK is single-config per artifact (we build one config per
          # windows-vtk job), so there are no opposite-config siblings
          # to prune there. vcpkg trees likewise carry one config per
          # triplet. Nothing else needs the prune.

      # NFFT3 has no vcpkg port. Rather than relying on an upstream
      # prebuilt zip (whose hosting and URLs we don't control), we
      # build NFFT3 from source in MSYS2/mingw64 — the same toolchain
      # upstream's `windows-build-dll.sh` uses to produce their
      # official Windows DLL release. The resulting `.dll` plus its
      # mingw runtime dependencies are staged alongside the rest of
      # the bundle, and an MSVC-friendly import library is generated
      # from the DLL via `gendef` + `lib /def:`. F2Dock's
      # pkg_check_modules(NFFT QUIET IMPORTED_TARGET nfft3) picks the
      # result up via the rewritten nfft3.pc, identical to Linux.
      #
      # Source: https://github.com/NFFT/nfft/releases/tag/3.5.3
      # (with a TU-Chemnitz mirror as a fallback). SHA256 is pinned.
      - name: Set up MSYS2 (mingw64) for NFFT3 build
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autoconf automake libtool perl make tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-tools-git
            wget

      - name: Build NFFT3 from source (MSYS2 mingw64)
        shell: 'msys2 {0}'
        env:
          NFFT_VERSION: '3.5.3'
          NFFT_SHA256:  'caf1b3b3e5bf8c33a6bfd7eca811d954efce896605ecfd0144d47d0bebdf4371'
        run: |
          set -ex
          cd "$GITHUB_WORKSPACE"

          url_gh="https://github.com/NFFT/nfft/releases/download/${NFFT_VERSION}/nfft-${NFFT_VERSION}.tar.gz"
          url_tuc="https://www-user.tu-chemnitz.de/~potts/nfft/download/nfft-${NFFT_VERSION}.tar.gz"
          echo "Fetching NFFT3 ${NFFT_VERSION} source ..."
          wget -q "$url_gh" -O nfft.tar.gz || wget -q "$url_tuc" -O nfft.tar.gz
          echo "${NFFT_SHA256}  nfft.tar.gz" | sha256sum -c -

          tar -xzf nfft.tar.gz
          cd "nfft-${NFFT_VERSION}"

          # FFTW3 ships in /mingw64 via the mingw-w64-x86_64-fftw
          # package. autoconf picks it up from PKG_CONFIG_PATH/-I/-L
          # automatically; we point it explicitly to be safe.
          # MSVC consumers cannot link a mingw-built .a (object format
          # / name-mangling mismatch), so even the -static flavor
          # ships only the NFFT DLL + import lib on Windows. The
          # static archive is omitted intentionally.
          ./configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/nfft-install" \
            --enable-openmp \
            --enable-shared \
            --disable-static \
            --disable-examples \
            --disable-applications \
            --with-fftw3-includedir=/mingw64/include \
            --with-fftw3-libdir=/mingw64/lib \
            --with-gcc-arch=haswell \
            CFLAGS="-O3 -ffast-math" \
            LDFLAGS="-static-libgcc"
          make -j$(nproc)
          make install
          ls -la "$(cygpath -u "$GITHUB_WORKSPACE")/nfft-install/bin" || true
          ls -la "$(cygpath -u "$GITHUB_WORKSPACE")/nfft-install/lib" || true
          ls -la "$(cygpath -u "$GITHUB_WORKSPACE")/nfft-install/include" || true

      - name: Set up MSVC dev environment for lib.exe
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Stage NFFT3 into bundle (DLLs + MSVC import lib)
        shell: pwsh
        env:
          NFFT_VERSION: '3.5.3'
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE '${{ steps.meta.outputs.stem }}'
          $src  = Join-Path $env:GITHUB_WORKSPACE 'nfft-install'
          if (-not (Test-Path $src)) {
            throw "NFFT3 install prefix not found at $src — did the MSYS2 build step fail?"
          }

          New-Item -ItemType Directory -Force -Path "$dist/bin","$dist/lib","$dist/include","$dist/lib/pkgconfig" | Out-Null

          # Stage NFFT's own DLLs (libnfft3-4.dll and the OpenMP
          # variant libnfft3_threads-4.dll).
          $nfftDlls = Get-ChildItem "$src/bin" -Filter '*.dll' -ErrorAction SilentlyContinue
          if (-not $nfftDlls) {
            # Some libtool flavors stash the DLL under lib/ instead.
            $nfftDlls = Get-ChildItem "$src/lib" -Filter '*.dll' -ErrorAction SilentlyContinue
          }
          if (-not $nfftDlls) { throw "No NFFT DLLs found under $src" }
          foreach ($f in $nfftDlls) { Copy-Item $f.FullName "$dist/bin/" -Force }

          # Stage mingw runtime DLLs that NFFT depends on. FFTW from
          # MSYS2 is a shared library, so we have to ship it alongside
          # — together with libgcc_s, libwinpthread, and libgomp for
          # OpenMP. Without these, loading nfft3.dll under any non-
          # MSYS2 process will fail at runtime.
          $mingwBin = 'C:\msys64\mingw64\bin'
          $runtimeDlls = @(
            'libfftw3-3.dll',
            'libfftw3_threads-3.dll',
            'libgcc_s_seh-1.dll',
            'libwinpthread-1.dll',
            'libgomp-1.dll',
            'libstdc++-6.dll'
          )
          foreach ($name in $runtimeDlls) {
            $p = Join-Path $mingwBin $name
            if (Test-Path $p) {
              Copy-Item $p "$dist/bin/" -Force
              Write-Host "Staged runtime dep: $name"
            } else {
              Write-Host "Skipping missing runtime: $name"
            }
          }

          # Headers → include/.
          if (Test-Path "$src/include") {
            Copy-Item "$src/include/*.h" "$dist/include/" -Force -ErrorAction SilentlyContinue
          }

          # Generate an MSVC-friendly import library from the OpenMP
          # NFFT DLL using mingw's `gendef` (extracts the export list
          # from the DLL) followed by MSVC's `lib /def:`. We prefer
          # the threaded/OpenMP DLL; the bundle reports it as nfft3.lib
          # so consumers' `-lnfft3` from pkg-config resolves under
          # MSVC's default lib search rules.
          $threadsDll = Get-ChildItem "$dist/bin" -Filter 'libnfft3_threads-*.dll' | Select-Object -First 1
          $plainDll   = Get-ChildItem "$dist/bin" -Filter 'libnfft3-*.dll'         | Select-Object -First 1
          $targetDll = if ($threadsDll) { $threadsDll } else { $plainDll }
          if (-not $targetDll) { throw "No NFFT DLL in $dist/bin after staging." }
          Write-Host "Generating import lib from $($targetDll.Name)"

          $work = Join-Path $env:GITHUB_WORKSPACE 'nfft-implib'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item $targetDll.FullName $work -Force
          Push-Location $work

          # `gendef` is shipped by mingw-w64-tools (mingw-w64-x86_64-tools-git
          # package in MSYS2) and is on the MSYS2 PATH.
          $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;$env:PATH"
          & gendef $targetDll.Name
          if ($LASTEXITCODE -ne 0) { throw "gendef failed ($LASTEXITCODE)" }
          $defFile = [IO.Path]::ChangeExtension($targetDll.Name, '.def')
          if (-not (Test-Path $defFile)) {
            $defFile = ($targetDll.BaseName + '.def')
          }
          if (-not (Test-Path $defFile)) { throw "gendef produced no .def file" }
          Write-Host "gendef produced: $defFile"

          & lib "/def:$defFile" "/out:nfft3.lib" /machine:x64
          if ($LASTEXITCODE -ne 0) { throw "lib /def failed ($LASTEXITCODE)" }
          Copy-Item nfft3.lib "$dist/lib/" -Force
          if (Test-Path nfft3.exp) { Copy-Item nfft3.exp "$dist/lib/" -Force }
          Pop-Location

          # pkg-config file. F2Dock discovers NFFT via
          # pkg_check_modules(NFFT QUIET IMPORTED_TARGET nfft3) and
          # this is the same staging convention Linux uses (rewritten
          # prefix relative to ${pcfiledir}).
          $pcLines = @(
            'prefix=${pcfiledir}/../..',
            'exec_prefix=${prefix}',
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: nfft3',
            'Description: Nonequispaced Fast Fourier Transform (built from source, MSYS2/mingw64)',
            'Version: 3.5.3',
            'Libs: -L${libdir} -lnfft3',
            'Cflags: -I${includedir}'
          )
          [System.IO.File]::WriteAllText(
            (Join-Path "$dist/lib/pkgconfig" 'nfft3.pc'),
            ($pcLines -join "`n") + "`n")

          Write-Host "NFFT3 staged:"
          Get-ChildItem "$dist/bin/*nfft*","$dist/bin/libfftw*","$dist/lib/nfft*","$dist/include/nfft*" -ErrorAction SilentlyContinue `
            | ForEach-Object { Write-Host "  $($_.FullName)" }

      # ── Stage vcglib (header-only) ──
      - name: Stage vcglib
        uses: ./.github/actions/stage-vcglib
        with:
          dist:    ${{ github.workspace }}\${{ steps.meta.outputs.stem }}
          version: ${{ env.VCGLIB_VERSION }}
          sha256:  ${{ env.VCGLIB_SHA256 }}

      # ── Stage MSVC CRT redistributable DLLs (Release only) ──
      # Ship the MSVC C/C++ runtime DLLs (msvcp140*.dll, vcruntime140*.dll,
      # concrt140.dll) inside bin/ so consumer machines do not need the
      # "Visual C++ Redistributable for Visual Studio 2015–2022"
      # installed separately. App-local deployment is explicitly
      # permitted by Microsoft's redistribution license for these DLLs
      # (see learn.microsoft.com — "Redistributing Visual C++ Files").
      #
      # The Universal CRT (ucrtbase.dll, api-ms-win-crt-*.dll) is part
      # of Windows 10/11 and never needs redistribution; we don't ship
      # it.
      #
      # Debug builds CANNOT ship the debug CRT — msvcp140d.dll /
      # vcruntime140d.dll / ucrtbased.dll are NOT redistributable
      # under Microsoft's license. Debug archives therefore still
      # require a developer-grade Windows install (Visual Studio
      # 2022 or the Windows SDK debug runtime). This is consistent
      # with how Debug bundles are intended to be used (linker
      # consumers, not end-user deployment).
      - name: Stage MSVC CRT redistributable
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE '${{ steps.meta.outputs.stem }}'
          $binDir = Join-Path $dist 'bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          # ilammy/msvc-dev-cmd@v1 (invoked earlier in this job for the
          # NFFT import-lib step) writes VCToolsRedistDir into GITHUB_ENV.
          # Fall back to vswhere if it isn't set for some reason.
          $redistRoot = $env:VCToolsRedistDir
          if (-not $redistRoot -or -not (Test-Path $redistRoot)) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe not found; cannot locate VC redist DLLs"
            }
            $vsRoot = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest `
              -property installationPath
            if (-not $vsRoot) { $vsRoot = & $vswhere -latest -property installationPath }
            $verFile = Join-Path $vsRoot 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
            $vcVer = (Get-Content $verFile -ErrorAction Stop).Trim()
            $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC\$vcVer"
            if (-not (Test-Path $redistRoot)) {
              # Some VS layouts drop a digit; pick the newest sibling.
              $redistRoot = Get-ChildItem (Join-Path $vsRoot 'VC\Redist\MSVC') -Directory `
                | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
            }
          }
          Write-Host "MSVC redist root: $redistRoot"

          $crtDir = Join-Path $redistRoot 'x64\Microsoft.VC143.CRT'
          if (-not (Test-Path $crtDir)) {
            # Fallback for newer toolsets that bump the VC<NNN> dir.
            $crtDir = Get-ChildItem (Join-Path $redistRoot 'x64') -Directory `
              | Where-Object { $_.Name -like 'Microsoft.VC*.CRT' } `
              | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not (Test-Path $crtDir)) {
            throw "MSVC CRT redist directory not found under $redistRoot"
          }
          Write-Host "Staging from: $crtDir"

          # Redistributable list per Microsoft docs (VS 2015–2022, v143).
          # api-ms-win-* are part of the OS UCRT and are NOT shipped.
          $crtDlls = @(
            'msvcp140.dll',
            'msvcp140_1.dll',
            'msvcp140_2.dll',
            'msvcp140_atomic_wait.dll',
            'msvcp140_codecvt_ids.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'concrt140.dll'
          )
          foreach ($name in $crtDlls) {
            $src = Join-Path $crtDir $name
            if (Test-Path $src) {
              Copy-Item -Force $src $binDir
              Write-Host "Staged MSVC CRT: $name"
            } else {
              Write-Host "Skipping missing CRT DLL: $name"
            }
          }

          # Drop a tiny manifest noting the source so consumers can
          # match against the installed redist for compliance.
          $stampLines = @(
            "Visual C++ Redistributable DLLs bundled from:",
            "  $crtDir",
            "Bundled list:",
            ($crtDlls | ForEach-Object { "  - $_" })
          ) | ForEach-Object { $_ }
          $stampPath = Join-Path $dist 'share\msvc-crt-redist.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $stampPath) | Out-Null
          Set-Content -Path $stampPath -Value $stampLines

      - name: Pack zip
        shell: pwsh
        run: |
          $stem = '${{ steps.meta.outputs.stem }}'
          $dist = Join-Path $env:GITHUB_WORKSPACE $stem
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "$stem.zip"
          # Compress-Archive uses a .NET MemoryStream and fails on
          # archives >2 GB with "Stream was too long." The Windows
          # bundle exceeds 2 GB once VTK + Qt + vcpkg trees are
          # stitched in, so use 7z (preinstalled on hosted Windows
          # runners) which has no such limit. -mx=5 is the default
          # compression level; -mmt=on enables multithreaded compress.
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          & 7z a -tzip -mx=5 -mmt=on "$zipPath" "$dist\*"
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          Get-ChildItem $zipPath | Format-List Name,Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.build_type }}-${{ matrix.link }}
          path: libcvc-deps-*.zip
          if-no-files-found: error

  # ──────────────────────────── Release ────────────────────────────
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    # Skip the release step entirely for manual workflow_dispatch
    # runs unless the workflow was triggered on a tag. Run even if
    # some platforms failed, so we still publish the artifacts that
    # did build (e.g. Linux + macOS when a Windows config times out
    # on a cold cache). Require at minimum that linux + macos
    # succeeded — there's no point publishing a release with zero
    # platforms.
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.linux.result == 'success'
      && needs.macos.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
          # Explicit prefix so stray files from third-party actions
          # can never ride along.
          files: |
            artifacts/libcvc-deps-*.tar.gz
            artifacts/libcvc-deps-*.zip
          fail_on_unmatched_files: false
