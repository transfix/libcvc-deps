# DISABLED — Package building and publishing has migrated to the
# cvcpkg remote builders system (pkg.tx.wtf).  This workflow is
# retained for reference but no longer triggered automatically.
# To re-enable, restore the original `on:` triggers below.

name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'DISABLED — use remote builders instead. Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      sha_suffix:
        description: 'Optional short SHA inserted into archive stems for CI builds (e.g. "abc1234"). Empty for tag releases.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Cancel superseded runs on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
# Recipe-driven release pipeline.
#
# Every dependency is built from recipes via `cvcpkg pack-all`
# inside the reusable recipe-build.yml workflow.  No system
# packages are used for the bundle contents — only minimal build
# tools (cmake, ninja, compilers) are installed by recipe-build.
#
# Per-component archives + index YAMLs are uploaded as artifacts.
# On a tag push the release job collects them into a GitHub Release.
# ─────────────────────────────────────────────────────────────────

jobs:
  # ─────────────────── Linux ───────────────────────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: linux
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
    secrets: inherit

  linux-selfhosted:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: linux
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      runner: '["self-hosted","Linux","X64","cvcpkg-builder"]'
    secrets: inherit

  # ─────────────────── macOS ───────────────────────────────────
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: macos
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
    secrets: inherit

  # ─────────────────── Windows ─────────────────────────────────
  # Shared builds run on self-hosted Windows runners for faster
  # turnaround; static builds run on GitHub-hosted windows-latest.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-hosted: shared builds
          - config: release
            link: shared
            runner: '["self-hosted","Windows","X64"]'
          - config: debug
            link: shared
            runner: '["self-hosted","Windows","X64"]'
          # GitHub-hosted: static builds
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: windows
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      runner: ${{ matrix.runner || '' }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
    secrets: inherit

  # ─────────────────── BSD ─────────────────────────────────────
  freebsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/bsd-recipe-build.yml
    with:
      platform: freebsd
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}

  openbsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/bsd-recipe-build.yml
    with:
      platform: openbsd
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}

  netbsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/bsd-recipe-build.yml
    with:
      platform: netbsd
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}

  # ─────────────────── Wasm ────────────────────────────────────
  wasm-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      host_platform: linux
    secrets: inherit

  wasm-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      host_platform: macos
    secrets: inherit

  wasm-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      host_platform: windows
    secrets: inherit

  # ─────────────────── GitHub Release ──────────────────────────
  release:
    needs: [linux, macos, windows, freebsd, openbsd, netbsd, wasm-linux, wasm-macos, wasm-windows]
    runs-on: ubuntu-latest
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.linux.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Build recipes tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "artifacts/cvcpkg-recipes-${VERSION}.tar.gz" \
            -C "${{ github.workspace }}" recipes/

      - name: Build Python wheel
        run: |
          pip install build
          cd .
          # Bundle recipes into the wheel
          rm -rf src/cvcpkg/recipes/*
          cp -r "${{ github.workspace }}/recipes/"* src/cvcpkg/recipes/ 2>/dev/null || true
          rm -f src/cvcpkg/recipes/.gitignore
          python -m build
          cp dist/cvcpkg-*.whl "${{ github.workspace }}/artifacts/"
          cp dist/cvcpkg-*.tar.gz "${{ github.workspace }}/artifacts/cvcpkg-sdist.tar.gz" 2>/dev/null || true

      - name: Install cvcpkg
        run: pip install .

      - name: Publish bundles to pkg.tx.wtf
        env:
          CVCPKG_SERVER_URL: ${{ vars.CVCPKG_SERVER_URL || 'https://pkg.tx.wtf' }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_PUBLISH_TOKEN not set — skipping bundle publish"
            exit 0
          fi

          archives=$(find artifacts \( -name '*.tar.gz' -o -name '*.zip' \) \
            ! -name 'cvcpkg-recipes-*' \
            ! -name 'cvcpkg-sdist*' \
            ! -name 'cvcpkg-*.whl' \
            | sort)
          if [ -z "$archives" ]; then
            echo "::warning::No bundle archives to publish"
            exit 0
          fi

          count=$(echo "$archives" | wc -l)
          echo "Publishing $count bundle archive(s) to $CVCPKG_SERVER_URL ..."
          # shellcheck disable=SC2086
          cvcpkg publish $archives \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --release-tag "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
          # Index metadata, recipes tarball, and Python wheel.
          # Binary archives are published to pkg.tx.wtf above.
          # Standalone cvcpkg binaries are attached by cvcpkg-standalone.yml.
          files: |
            artifacts/*-index.yaml
            artifacts/cvcpkg-recipes-*.tar.gz
            artifacts/cvcpkg-*.whl
            artifacts/cvcpkg-sdist.tar.gz
          fail_on_unmatched_files: false
