name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      sha_suffix:
        description: 'Optional short SHA inserted into archive stems for CI builds (e.g. "abc1234"). Empty for tag releases.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Cancel superseded runs on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
# Recipe-driven release pipeline.
#
# Every dependency is built from recipes via `cvcpkg pack-all`
# inside the reusable recipe-build.yml workflow.  No system
# packages are used for the bundle contents — only minimal build
# tools (cmake, ninja, compilers) are installed by recipe-build.
#
# Per-component archives + index YAMLs are uploaded as artifacts.
# On a tag push the release job collects them into a GitHub Release.
# ─────────────────────────────────────────────────────────────────

jobs:
  # ─────────────────── Linux ───────────────────────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: linux
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  linux-selfhosted:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: linux
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      runner: '["self-hosted","Linux","X64","cvcpkg-builder"]'

  # ─────────────────── macOS ───────────────────────────────────
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: macos
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  # ─────────────────── Windows ─────────────────────────────────
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: windows
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}

  # ─────────────────── BSD ─────────────────────────────────────
  freebsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/bsd-recipe-build.yml
    with:
      platform: freebsd
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}

  openbsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/bsd-recipe-build.yml
    with:
      platform: openbsd
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}

  netbsd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: shared
          - config: release
            link: static
          - config: debug
            link: shared
          - config: debug
            link: static
    uses: ./.github/workflows/bsd-recipe-build.yml
    with:
      platform: netbsd
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}

  # ─────────────────── Wasm ────────────────────────────────────
  wasm-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      host_platform: linux

  wasm-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      host_platform: macos

  wasm-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            link: static
          - config: debug
            link: static
    uses: ./.github/workflows/recipe-build.yml
    with:
      platform: wasm
      config: ${{ matrix.config }}
      link: ${{ matrix.link }}
      sha_suffix: ${{ inputs.sha_suffix || '' }}
      host_platform: windows

  # ─────────────────── GitHub Release ──────────────────────────
  release:
    needs: [linux, macos, windows, freebsd, openbsd, netbsd, wasm-linux, wasm-macos, wasm-windows]
    runs-on: ubuntu-latest
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.linux.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
          # Only upload index metadata — binary archives are published
          # to pkg.tx.wtf via catalog-publish.yml.  Uploading hundreds
          # of per-component archives to GitHub Releases triggers
          # abuse-detection rate limits and wastes storage quota.
          files: |
            artifacts/*-index.yaml
          fail_on_unmatched_files: false
