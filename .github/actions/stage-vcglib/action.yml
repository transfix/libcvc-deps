name: 'Stage vcglib into libcvc-deps bundle'
description: |
  Fetches a SHA256-pinned vcglib source tarball from GitHub and stages
  it into the libcvc-deps bundle layout used by all three platforms:

    <DIST>/include/vcg/                  # vcg/ headers (top-level use)
    <DIST>/include/wrap/                 # wrap/ headers (top-level use)
    <DIST>/share/vcglib/                 # full source tree (CMakeLists.txt etc.)
    <DIST>/share/cmake/vcglib/vcglib-config.cmake
    <DIST>/share/cmake/vcglib/vcglib-config-version.cmake

  Consumers can either:
    1. find_package(vcglib CONFIG REQUIRED) -> imported INTERFACE
       target `vcglib::vcglib`, which depends on Eigen3 (vcglib's
       bundled eigenlib/ is ignored in favor of the libcvc-deps Eigen3).
    2. add_subdirectory(${CMAKE_PREFIX_PATH}/share/vcglib) directly
       to consume the upstream CMakeLists.txt verbatim.
    3. Just #include <vcg/...> / #include <wrap/...> via the headers
       in include/ (no CMake integration required).

  Works on Linux, macOS, and Windows runners. Uses bash on Unix and
  Git Bash on Windows (available by default in actions/runner).

inputs:
  dist:
    description: 'Absolute path to the libcvc-deps bundle root (DIST).'
    required: true
  version:
    description: 'vcglib release tag to fetch (e.g. 2025.07).'
    required: true
  sha256:
    description: 'Expected SHA256 of the tarball.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Fetch + stage vcglib
      shell: bash
      env:
        DIST_INPUT: ${{ inputs.dist }}
        VCGLIB_VERSION: ${{ inputs.version }}
        VCGLIB_SHA256:  ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        # Normalize the dist path to a unix-style path on Windows so
        # bash builtins and tar work consistently.
        case "$(uname -s)" in
          MINGW*|MSYS*|CYGWIN*)
            DIST="$(cygpath -u "$DIST_INPUT")" ;;
          *) DIST="$DIST_INPUT" ;;
        esac

        if [ ! -d "$DIST" ]; then
          echo "::error::DIST directory $DIST does not exist"
          exit 1
        fi

        url="https://github.com/cnr-isti-vclab/vcglib/archive/refs/tags/${VCGLIB_VERSION}.tar.gz"
        echo "Fetching vcglib ${VCGLIB_VERSION} from ${url}"
        curl -fL --retry 3 -o vcglib.tar.gz "$url"

        # SHA256 verification. shasum exists on macOS; sha256sum on
        # Linux + Git Bash on Windows.
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${VCGLIB_SHA256}  vcglib.tar.gz" | sha256sum -c -
        else
          echo "${VCGLIB_SHA256}  vcglib.tar.gz" | shasum -a 256 -c -
        fi

        # Extract into a stable directory name regardless of the
        # release tag.
        rm -rf vcglib-src
        mkdir vcglib-src
        tar -xzf vcglib.tar.gz -C vcglib-src --strip-components=1

        # Stage layout.
        mkdir -p "$DIST/share/vcglib" \
                 "$DIST/share/cmake/vcglib" \
                 "$DIST/include"

        # Copy the full source tree under share/vcglib/ so consumers
        # can add_subdirectory() directly if they prefer.
        cp -R vcglib-src/. "$DIST/share/vcglib/"

        # Mirror the public header roots into include/ so plain
        # #include <vcg/...> / #include <wrap/...> works without any
        # CMake glue.
        cp -R vcglib-src/vcg  "$DIST/include/vcg"
        cp -R vcglib-src/wrap "$DIST/include/wrap"

        # Write a minimal CMake package config that exposes vcglib as
        # an INTERFACE target.  We prefer the libcvc-deps Eigen3 over
        # the bundled eigenlib/ (avoids two divergent Eigen versions in
        # the same translation unit).
        cat > "$DIST/share/cmake/vcglib/vcglib-config.cmake" <<'CMAKE'
        # vcglib-config.cmake -- generated by libcvc-deps
        #
        # Exposes vcglib as the imported INTERFACE target `vcglib::vcglib`.
        # vcglib is header-only.  Eigen3 is a required transitive
        # dependency; we resolve it via find_dependency() so the user
        # gets the libcvc-deps-bundled Eigen3 picked up from the same
        # CMAKE_PREFIX_PATH.
        include(CMakeFindDependencyMacro)

        # Eigen3 is optional only if the consumer doesn't actually use
        # the vcg headers that require it.  We still try to locate it,
        # but do not hard-fail if it is unavailable.
        find_dependency(Eigen3 QUIET)

        if(NOT TARGET vcglib::vcglib)
          add_library(vcglib::vcglib INTERFACE IMPORTED)
          # ${PACKAGE_PREFIX_DIR} is set by
          # configure_package_config_file()-style headers; we replicate
          # the same convention here with a hand-rolled prefix relative
          # to this file (share/cmake/vcglib/ -> bundle root).
          get_filename_component(_vcglib_root
            "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
          set_target_properties(vcglib::vcglib PROPERTIES
            INTERFACE_INCLUDE_DIRECTORIES "${_vcglib_root}/include"
            INTERFACE_COMPILE_FEATURES    "cxx_std_11")
          if(MSVC)
            set_property(TARGET vcglib::vcglib APPEND PROPERTY
              INTERFACE_COMPILE_OPTIONS "/bigobj")
          endif()
          if(TARGET Eigen3::Eigen)
            set_property(TARGET vcglib::vcglib APPEND PROPERTY
              INTERFACE_LINK_LIBRARIES Eigen3::Eigen)
          endif()
        endif()
        CMAKE

        # Hand-roll a version file so find_package(vcglib 2025.07 CONFIG)
        # works as a soft version check.  vcglib uses YYYY.MM tags;
        # CMake's basic_package_version_file treats those as standard
        # MAJOR.MINOR strings, which is fine for SameMajorVersion
        # semantics within a year.
        cat > "$DIST/share/cmake/vcglib/vcglib-config-version.cmake" <<CMAKE
        set(PACKAGE_VERSION "${VCGLIB_VERSION}")
        if("\${PACKAGE_FIND_VERSION}" STREQUAL "")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
        elseif("\${PACKAGE_FIND_VERSION}" VERSION_EQUAL "\${PACKAGE_VERSION}")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          set(PACKAGE_VERSION_EXACT TRUE)
        elseif("\${PACKAGE_FIND_VERSION}" VERSION_LESS "\${PACKAGE_VERSION}")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
        else()
          set(PACKAGE_VERSION_COMPATIBLE FALSE)
        endif()
        CMAKE

        echo "vcglib ${VCGLIB_VERSION} staged:"
        ls -d "$DIST/include/vcg" "$DIST/include/wrap" \
              "$DIST/share/vcglib/CMakeLists.txt" \
              "$DIST/share/cmake/vcglib/vcglib-config.cmake" \
              "$DIST/share/cmake/vcglib/vcglib-config-version.cmake"

        # Tidy.
        rm -rf vcglib-src vcglib.tar.gz
