name: 'Install libcvc-deps via cvcpkg'
description: |
  Installs libcvc-deps component bundles into a CMake-ready prefix
  using `cvcpkg install`. This is the recommended replacement for
  the monolithic `fetch` action: instead of downloading one large
  archive, it resolves and installs only the components listed in
  a `cvc-requirements.yaml` file.

  Usage in a downstream workflow:

      - uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@vX.Y.Z
        id: deps
        with:
          requirements: cvc-requirements.yaml
          build_type: Release

      - name: Configure
        run: cmake -B build -DCMAKE_PREFIX_PATH=<steps.deps.outputs.path> ...

  The action:
    1. Checks out libcvc-deps (sparse, tools/ + packaging/ only).
    2. Installs cvcpkg from the local tree.
    3. Runs `cvcpkg install --from <requirements> --prefix <prefix>`.
    4. Exports the prefix path as the `path` output.

  Falls back gracefully: if the catalog is unavailable (no release
  has published component bundles yet), `path` is set to empty so
  the caller can fall back to building from source.

inputs:
  recipe:
    description: >
      Path (in the *consumer* repo) to a recipe — a recipe.yaml, a directory
      containing one, or a recipe name — whose declared dependency closure
      (build + runtime deps) is installed via `cvcpkg install-deps`. This is the
      "just recipes" path: the recipe is the single source of truth for deps, so
      no separate cvc-requirements.yaml is needed. Takes precedence over
      `requirements` when both are set.
    required: false
    default: ''
  requirements:
    description: >
      DEPRECATED (prefer `recipe`). Path to the cvc-requirements.yaml file in the
      *consumer* repo. If empty (and `recipe` is unset), uses the default
      cvc-requirements.yaml shipped with libcvc-deps.
    required: false
    default: ''
  build_type:
    description: 'Release or Debug.'
    required: true
  include_host_tools:
    description: >
      Also install the recipe's host_tools (cmake, ninja, compilers a recipe
      pins, ...) into the prefix, rather than assuming the runner image
      provides them. Consumers that want a hermetic build -- no apt, no brew,
      no vcpkg -- need this: without it a recipe can correctly declare its
      toolchain and still not get it, and the build falls back to whatever the
      image happens to ship, or to nothing at all.
      Only meaningful with `recipe` (it maps to `cvcpkg install-deps
      --include-host-tools`); ignored on the requirements path.
    required: false
    default: 'false'
  link:
    description: 'shared or static.'
    required: false
    default: 'shared'
  prefix:
    description: 'Directory to install bundles into.'
    required: false
    default: ''
  libcvc_deps_ref:
    description: >
      Git ref of libcvc-deps to check out (for cvcpkg and default
      requirements). Usually a release tag like v1.2.0.
    required: false
    default: 'master'
  catalog_url:
    description: 'Override the catalog URL. Defaults to GitHub Pages.'
    required: false
    default: ''
  repository:
    description: 'GitHub owner/repo to checkout for cvcpkg (e.g. transfix/libcvc-deps).'
    required: false
    default: 'transfix/libcvc-deps'
  python_version:
    description: 'Python version to use for cvcpkg.'
    required: false
    default: '3.12'

outputs:
  path:
    description: >
      Absolute path to the installed prefix (contains bin/, lib/,
      include/, share/). Empty string if install failed.
    value: ${{ steps.install.outputs.path }}

runs:
  using: 'composite'
  steps:
    # Sparse-checkout libcvc-deps for the cvcpkg tool and default
    # requirements, without pulling the entire repo history.
    #
    # EVERY path pip needs to BUILD this package must be listed here, not just
    # the ones needed to run it. pep517-backend/ holds the in-tree PEP 517
    # backend named by `backend-path` in pyproject.toml; omit it and
    # `pip install ./_libcvc-deps` dies before it starts:
    #
    #     BackendUnavailable: Cannot find module 'cvcpkg_build_backend'
    #       in ['.../_libcvc-deps/pep517-backend']
    #
    # which took out every consumer of this action (all of libcvc's
    # package-linux / package-macos / package-windows jobs) the moment the
    # backend landed. A `git+https://` install is unaffected — it clones the
    # whole repo — so this only ever breaks the sparse path.
    - name: Checkout libcvc-deps (sparse)
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.libcvc_deps_ref }}
        path: _libcvc-deps
        sparse-checkout: |
          src
          pyproject.toml
          README.md
          packaging
          cvc-requirements.yaml
          pep517-backend
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install cvcpkg
      shell: bash
      run: pip install ./_libcvc-deps

    - name: 'cvcpkg: resolve & install'
      id: install
      shell: bash
      env:
        LCD_RECIPE:       ${{ inputs.recipe }}
        LCD_HOST_TOOLS:   ${{ inputs.include_host_tools }}
        LCD_REQUIREMENTS: ${{ inputs.requirements }}
        LCD_BUILD_TYPE:   ${{ inputs.build_type }}
        LCD_LINK:         ${{ inputs.link }}
        LCD_PREFIX:       ${{ inputs.prefix }}
        LCD_CATALOG_URL:  ${{ inputs.catalog_url }}
        RUNNER_OS:        ${{ runner.os }}
      run: |
        set -euo pipefail

        # --- Resolve platform ---
        case "$RUNNER_OS" in
          Linux)   platform=linux ;;
          macOS)   platform=macos ;;
          Windows) platform=windows ;;
          *)       platform=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]') ;;
        esac

        # --- Resolve arch (canonical cvcpkg vocabulary) ---
        # Normalize the raw machine name the way cvcpkg's platform.detect_arch
        # does, so an arm64 host queries the catalog for 'arm64' (not the raw
        # 'aarch64') and x86_64 hosts never split into an 'amd64' keyspace.
        if [ "$platform" = "windows" ]; then
          arch="x86_64"
        else
          case "$(uname -m)" in
            x86_64|amd64|x64)      arch="x86_64" ;;
            aarch64|arm64)         arch="arm64" ;;
            *)                     arch=$(uname -m) ;;
          esac
        fi

        # --- Resolve prefix ---
        prefix="${LCD_PREFIX}"
        if [ -z "$prefix" ]; then
          if [ "$platform" = "windows" ]; then
            prefix="D:/libcvc-deps"
          else
            prefix="$HOME/libcvc-deps"
          fi
        fi
        mkdir -p "$prefix"

        config=$(echo "${LCD_BUILD_TYPE}" | tr '[:upper:]' '[:lower:]')

        # --- Build cvcpkg arguments: recipe deps ("just recipes") or a
        #     cvc-requirements.yaml (deprecated). `recipe` wins when both set. ---
        if [ -n "${LCD_RECIPE}" ]; then
          if [ ! -e "${LCD_RECIPE}" ]; then
            # A bare name (resolved against the recipes dir) is also valid, but a
            # path input that doesn't exist is almost always a mistake — surface it.
            echo "cvcpkg-install: recipe path not found: ${LCD_RECIPE}"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cmd=(
            cvcpkg install-deps "${LCD_RECIPE}"
            --prefix "$prefix"
            --platform "$platform"
            --arch "$arch"
            --config "$config"
            --link "${LCD_LINK}"
          )
          case "$(printf '%s' "${LCD_HOST_TOOLS}" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes) cmd+=(--include-host-tools) ;;
          esac
        else
          reqs="${LCD_REQUIREMENTS}"
          if [ -z "$reqs" ]; then
            reqs="_libcvc-deps/cvc-requirements.yaml"
          fi
          if [ ! -f "$reqs" ]; then
            echo "cvcpkg-install: requirements file not found: $reqs"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cmd=(
            cvcpkg install
            --from "$reqs"
            --prefix "$prefix"
            --platform "$platform"
            --arch "$arch"
            --config "$config"
            --link "${LCD_LINK}"
          )
        fi

        if [ -n "${LCD_CATALOG_URL}" ]; then
          cmd+=(--catalog "${LCD_CATALOG_URL}")
        fi

        echo "cvcpkg-install: ${cmd[*]}"

        if "${cmd[@]}"; then
          echo "cvcpkg-install: installed to $prefix"
          ls "$prefix" | head -20 || true
          echo "path=$prefix" >> "$GITHUB_OUTPUT"
        else
          echo "cvcpkg-install: install failed; falling back."
          echo "path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
